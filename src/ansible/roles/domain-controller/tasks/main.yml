# =============================================================================
# Role: domain-controller
# =============================================================================
# Mirrors: scripts/deploy/02-azure-foundation/phase-04-azure-management-infrastructure/task-12-configure-adds/
# Tasks: Install AD DS role, promote DC (new forest or replica), DNS forwarders
# Target: domain_controllers group (management VMs provisioned by Terraform)
# Collections: ansible.windows, microsoft.ad, azure.azcollection
#
# Every value comes from inventory/group_vars/all.yml and inventory/host_vars/<host>.yml (New-IacVariableFiles.ps1):
# dc_promotion_mode, the Key Vault reference of the DSRM password and vm_deploy_target of each machine
# (landing_zone.virtual_machines[]). The role generates no password and stores none.
# =============================================================================
---
- name: Check the variables of the machine
  ansible.builtin.assert:
    that:
      - dc_promotion_mode is defined
      - dc_promotion_mode in ['new_forest', 'replica']
      - dc_dsrm_password is defined or (dc_dsrm_key_vault_name is defined and dc_dsrm_secret_name is defined)
      - dc_promotion_mode != 'replica' or domain_admin_password is defined
    fail_msg: >-
      {{ inventory_hostname }} needs landing_zone.virtual_machines[].dc_promotion (new_forest or replica) and dsrm_password, a keyvault://
      reference (for another kind of reference pass dc_dsrm_password with -e @vault.yml). A replica also needs domain_admin_password
      (-e @vault.yml).
    quiet: true

# ---------------------------------------------------------------
# Task 1 — Install AD DS Windows Feature
# ---------------------------------------------------------------
- name: Install AD-Domain-Services feature
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - RSAT-AD-Tools
      - RSAT-DNS-Server
      - RSAT-ADDS
    include_management_tools: true
    state: present
  register: adds_feature

- name: Reboot after feature installation
  ansible.windows.win_reboot:
    reboot_timeout: "{{ dc_reboot_timeout }}"
  when: adds_feature.reboot_required | default(false)

# ---------------------------------------------------------------
# Task 2 — the DSRM safe-mode password, read on the controller from the secret dsrm_password references
# ---------------------------------------------------------------
- name: Read the DSRM safe-mode password from Key Vault
  azure.azcollection.azure_rm_keyvaultsecret_info:
    vault_uri: "https://{{ dc_dsrm_key_vault_name }}.{{ azure_cloud_endpoints[azure_cloud].key_vault_dns_suffix }}"
    name: "{{ dc_dsrm_secret_name }}"
    cloud_environment: "{{ azure_cloud_endpoints[azure_cloud].arm_cloud_name }}"
  delegate_to: localhost
  register: dc_dsrm_secret
  when: dc_dsrm_password is not defined
  no_log: true

- name: Choose the DSRM safe-mode password
  ansible.builtin.set_fact:
    dc_safe_mode_password: "{{ dc_dsrm_password if dc_dsrm_password is defined else dc_dsrm_secret.secrets[0].secret }}"
  no_log: true

# ---------------------------------------------------------------
# Task 3a — Promote as New Forest (first DC only)
# ---------------------------------------------------------------
- name: Promote as new forest domain controller
  microsoft.ad.domain:
    dns_domain_name: "{{ ad_domain_fqdn }}"
    domain_netbios_name: "{{ ad_netbios_name }}"
    safe_mode_password: "{{ dc_safe_mode_password }}"
    forest_mode: "{{ dc_forest_functional_level }}"
    domain_mode: "{{ dc_domain_functional_level }}"
    install_dns: "{{ dc_install_dns }}"
    database_path: "{{ dc_database_path }}"
    log_path: "{{ dc_log_path }}"
    sysvol_path: "{{ dc_sysvol_path }}"
    reboot: true
  when: dc_promotion_mode == "new_forest"
  register: dc_new_forest_result
  no_log: true

# ---------------------------------------------------------------
# Task 3b — Promote as Replica DC (additional DCs)
# ---------------------------------------------------------------
- name: Promote as replica domain controller
  microsoft.ad.domain_controller:
    dns_domain_name: "{{ ad_domain_fqdn }}"
    domain_admin_user: "{{ domain_admin_username }}"
    domain_admin_password: "{{ domain_admin_password }}"
    safe_mode_password: "{{ dc_safe_mode_password }}"
    install_dns: "{{ dc_install_dns }}"
    database_path: "{{ dc_database_path }}"
    log_path: "{{ dc_log_path }}"
    sysvol_path: "{{ dc_sysvol_path }}"
    state: domain_controller
    reboot: true
  when: dc_promotion_mode == "replica"
  register: dc_replica_result
  no_log: true

- name: Forget the DSRM safe-mode password
  ansible.builtin.set_fact:
    dc_safe_mode_password: ""
  no_log: true

# ---------------------------------------------------------------
# Task 4 — Wait for AD DS to stabilize
# ---------------------------------------------------------------
- name: Wait for AD DS services to stabilize after promotion
  ansible.windows.win_powershell:
    script: |
      $maxRetries = 12
      $retryDelay = 10
      for ($i = 1; $i -le $maxRetries; $i++) {
          try {
              $dc = Get-ADDomainController -Identity $env:COMPUTERNAME -ErrorAction Stop
              if ($dc) {
                  Write-Output "AD DS is operational on $($dc.HostName)"
                  exit 0
              }
          } catch {
              Write-Output "Waiting for AD DS... attempt $i/$maxRetries"
              Start-Sleep -Seconds $retryDelay
          }
      }
      Write-Error "AD DS did not become operational within timeout"
      exit 1
  register: adds_health
  changed_when: false

# ---------------------------------------------------------------
# Task 5 — DNS forwarders: identity.active_directory.dns_forwarders; when it is empty, Azure DNS for a domain controller
# that runs in Azure (Azure DNS answers only inside Azure); otherwise the root hints stay.
# ---------------------------------------------------------------
- name: Configure the DNS forwarders
  ansible.windows.win_powershell:
    parameters:
      Forwarders: "{{ dc_dns_forwarders if dc_dns_forwarders | length > 0 else [azure_dns_forwarder_ip] }}"
    script: |
      [CmdletBinding()]
      param([string[]]$Forwarders)
      $ErrorActionPreference = 'Stop'
      $current = @((Get-DnsServerForwarder).IPAddress | ForEach-Object { $_.IPAddressToString })
      $Ansible.Changed = (($current | Sort-Object) -join ',') -ne (($Forwarders | Sort-Object) -join ',')
      if ($Ansible.Changed) { Set-DnsServerForwarder -IPAddress $Forwarders -UseRootHint $false }
  when:
    - dc_install_dns | bool
    - dc_dns_forwarders | length > 0 or vm_deploy_target | default('') == 'azure'
