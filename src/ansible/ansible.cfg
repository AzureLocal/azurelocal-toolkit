# =============================================================================
# Ansible Configuration — Azure Local Toolkit
# =============================================================================
# No [privilege_escalation] section: a become method set here applies to every host, and runas does not work on the
# Linux runners of playbook 00. The plays and roles that need raised rights set become themselves; the method is
# Ansible's default for the host (sudo on Linux). The Windows plays connect as an administrator and need no become.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections
remote_tmp = /tmp/.ansible/tmp
forks = 10
timeout = 30
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
callbacks_enabled = profile_tasks
# The OS configuration role passes the node credential in a task environment: never show task arguments on the console.
display_args_to_stdout = False
interpreter_python = auto_silent

[persistent_connection]
connect_timeout = 60
command_timeout = 30
