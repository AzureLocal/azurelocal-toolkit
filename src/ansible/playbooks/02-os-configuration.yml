# =============================================================================
# Playbook 02: OS Configuration
# =============================================================================
# Part 4 — Cluster Deployment, Phase 3: OS Configuration
# Run on: the controller (localhost). The nodes are not Ansible hosts here.
#
# One route only: this play runs the role azurelocal_os_configuration (src/ansible/roles), the Ansible front end of
# scripts/deploy/04-cluster-deployment/phase-03-os-configuration/Invoke-AzureLocalOsConfiguration.ps1. The wrapper reads
# infrastructure.yml itself (domain join account, local administrators, join options, the management VLAN, the transport)
# and does Plan, the approval pause and Apply. Pass the file at run time:
#   ansible-playbook playbooks/02-os-configuration.yml -e azurelocal_os_configuration_infrastructure_file=/path/infrastructure.yml
# The settings of the role (azurelocal_os_configuration_*) are documented in src/ansible/roles/azurelocal_os_configuration/README.md; vars/os-configuration.yml.example
# is a vars file for -e @file (AWX: the extra variables of the job template).
# =============================================================================
---
- name: "Part 4 | Phase 3 — OS Configuration (Invoke-AzureLocalOsConfiguration.ps1)"
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tags:
    - os-configuration
    - cluster-deployment
  pre_tasks:
    - name: Check that the infrastructure file is given
      ansible.builtin.assert:
        that:
          - azurelocal_os_configuration_infrastructure_file is defined
          - azurelocal_os_configuration_infrastructure_file | length > 0
        fail_msg: "Pass the master infrastructure.yml: -e azurelocal_os_configuration_infrastructure_file=<path on this machine>."
        quiet: true

  roles:
    - role: azurelocal_os_configuration
