# =============================================================================
# Playbook 05: Management VM Configuration
# =============================================================================
# Part 2 — Azure Foundation, Phase 4: Management Infrastructure
# Run on: domain_controllers (DC promotion). The inventory groups the management VMs by
# landing_zone.virtual_machines[].role (New-IacVariableFiles.ps1).
#
# The roles wac-server (Windows Admin Center, deferred) and syslog-receiver (syslog forwarding, parked) stay in the
# repository but no playbook runs them: their features are out of scope (registry class d).
# =============================================================================
---
- name: "Part 2 | Phase 4 — Promote Domain Controllers"
  hosts: domain_controllers
  gather_facts: true
  become: false
  serial: 1  # Promote DCs one at a time
  tags:
    - domain-controller
    - management-vms

  pre_tasks:
    - name: Validate required DC variables
      ansible.builtin.assert:
        that:
          - ad_domain_fqdn is defined
          - ad_netbios_name is defined
        fail_msg: "Missing required DC variables — check group_vars/all.yml"

  roles:
    - role: domain-controller
