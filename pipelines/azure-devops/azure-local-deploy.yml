# =============================================================================
# Azure DevOps Pipeline — Azure Local Deployment
# =============================================================================
# Mirrors the GitLab CI/CD pipeline with Azure Pipelines syntax.
#
# Requirements:
#   - Service Connection: "AzureLocal-ServiceConnection" (SPN)
#   - Agent Pool: the parameter agentPool (devops.runners[].pool of the general runner; self-hosted with on-prem access)
#   - Variable Group: "azurelocal-secrets" (ARM_CLIENT_ID, etc.)
#   - Environment: the parameter approvalEnvironment (devops.pipelines.environments.terraform_deployment; with approval checks)
#
# Why parameters: the pool and the environment of a job are not task inputs. Learn says a macro variable $(name) is expanded only in task
# inputs, and that other keywords take template expressions or runtime parameters
# (https://learn.microsoft.com/azure/devops/pipelines/process/variables#understand-variable-syntax). The template expression
# ${{ variables.name }} does not see variables stored on the pipeline or in a library
# (https://learn.microsoft.com/azure/devops/pipelines/process/template-expressions). So both are runtime parameters
# (${{ parameters.name }}) with no default, and a run that nobody started cannot supply them: this pipeline is started by hand.
# =============================================================================
# Hosted image: ubuntu-latest is the vendor's label of its hosted Linux image. The jobs that use it only validate and plan and read nothing that
# belongs to one deployment, so the label is not a setting of a deployment.
# Started by hand, like the schema 5 pipelines (arm-deployment, os-configuration, cicd-infra): a run started by a push or a pull request
# cannot supply the two parameters below, which have no default.
trigger: none
pr: none

parameters:
  - name: agentPool
    displayName: Self-hosted agent pool. Enter devops.runners[].pool of the general runner
    type: string
  - name: approvalEnvironment
    displayName: Environment of the approvals. Enter devops.pipelines.environments.terraform_deployment
    type: string

variables:
  - group: azurelocal-secrets
  - name: TF_ROOT
    value: 'src/terraform/environments/azure-local'
  - name: ANSIBLE_ROOT
    value: 'src/ansible'
  - name: CONFIG_PATH
    value: 'config/variables/variables.yml'

stages:
  # =========================================================================
  # Stage: Validate
  # =========================================================================
  - stage: Validate
    displayName: 'Validate'
    jobs:
      - job: TerraformValidate
        displayName: 'Terraform Validate'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '1.6.x'

          - script: |
              cd $(TF_ROOT)
              terraform init -backend=false
              terraform validate
              terraform fmt -check -recursive
            displayName: 'Terraform Init, Validate, Format'

      - job: AnsibleLint
        displayName: 'Ansible Lint'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - script: |
              pip install ansible ansible-lint
              cd $(ANSIBLE_ROOT)
              ansible-galaxy collection install -r collections/requirements.yml
              ansible-lint playbooks/ roles/
              ansible-playbook --syntax-check playbooks/site.yml
            displayName: 'Lint and Syntax Check'

  # =========================================================================
  # Stage: Plan
  # =========================================================================
  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: TerraformPlan
        displayName: 'Terraform Plan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '1.6.x'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(TF_ROOT)'
              backendServiceArm: 'AzureLocal-ServiceConnection'
              backendAzureRmResourceGroupName: '$(TF_BACKEND_RG)'
              backendAzureRmStorageAccountName: '$(TF_BACKEND_SA)'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'azurelocal.tfstate'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(TF_ROOT)'
              commandOptions: '-out=tfplan -input=false'
              environmentServiceNameAzureRM: 'AzureLocal-ServiceConnection'

          - publish: '$(TF_ROOT)/tfplan'
            artifact: tfplan
            displayName: 'Publish Plan Artifact'

  # =========================================================================
  # Stage: Deploy Foundation
  # =========================================================================
  - stage: DeployFoundation
    displayName: 'Deploy Azure Foundation'
    dependsOn: Plan
    jobs:
      - deployment: TerraformApply
        displayName: 'Terraform Apply'
        pool:
          vmImage: 'ubuntu-latest'
        environment: ${{ parameters.approvalEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: '1.6.x'

                - download: current
                  artifact: tfplan

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(TF_ROOT)'
                    backendServiceArm: 'AzureLocal-ServiceConnection'
                    backendAzureRmResourceGroupName: '$(TF_BACKEND_RG)'
                    backendAzureRmStorageAccountName: '$(TF_BACKEND_SA)'
                    backendAzureRmContainerName: 'tfstate'
                    backendAzureRmKey: 'azurelocal.tfstate'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(TF_ROOT)'
                    commandOptions: '-auto-approve -input=false $(Pipeline.Workspace)/tfplan/tfplan'
                    environmentServiceNameAzureRM: 'AzureLocal-ServiceConnection'

  # =========================================================================
  # Stage: Configure On-Prem (self-hosted agent)
  # =========================================================================
  - stage: ConfigureOnPrem
    displayName: 'Configure On-Premises'
    dependsOn: DeployFoundation
    jobs:
      - deployment: OnPremConfig
        displayName: 'Ansible Configuration'
        pool:
          name: ${{ parameters.agentPool }}
        environment: ${{ parameters.approvalEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    cd $(ANSIBLE_ROOT)
                    ansible-galaxy collection install -r collections/requirements.yml
                    ansible-playbook -i inventory/hosts.yml playbooks/site.yml
                  displayName: 'Run Ansible Playbooks'

  # =========================================================================
  # Stage: Configure Operations
  # =========================================================================
  - stage: ConfigureOperations
    displayName: 'Configure Operations'
    dependsOn: ConfigureOnPrem
    jobs:
      - deployment: Operations
        displayName: 'Monitoring & Management'
        pool:
          name: ${{ parameters.agentPool }}
        environment: ${{ parameters.approvalEnvironment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    cd $(ANSIBLE_ROOT)
                    ansible-playbook -i inventory/hosts.yml playbooks/04-monitoring-setup.yml
                    ansible-playbook -i inventory/hosts.yml playbooks/05-management-vms.yml
                  displayName: 'Run Operations Playbooks'
