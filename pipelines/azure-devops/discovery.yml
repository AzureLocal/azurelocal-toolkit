# Azure Local discovery, Azure DevOps.
#
# Create a pipeline from this file (Pipelines > New pipeline > Existing Azure Pipelines YAML file). It runs the command an operator runs by hand:
#   scripts/common/discovery/Invoke-AzlDiscoveryRun.ps1
# and nothing else; the logic is in the script, not here. PowerShell 7 only (AzurePowerShell@5 with pwsh: true). The script runs the discovery
# scripts of the toolkit one after the other:
#   hardware   Get-HardwareInventory.ps1: every BMC of nodes[] over the standard Redfish API (any maker; GET requests only)
#   dell       Invoke-HardwareDiscovery.ps1: the Dell iDRAC reading, with the proposal for nodes[] (Dell only; GET requests only)
#   tenant     Inventory-AzureTenant.ps1: the Azure tenant of azure.tenant_id (read only)
#   directory  Get-OnPremInventory.ps1: the computer objects of the Active Directory OU of the instance (read only)
#   all        hardware, tenant and directory
# Nothing in this run changes a BMC, a node, Azure or Active Directory, so there is no approval environment.
#
# The run fails when a step fails; the report, summary.md and what each step wrote are the build artifact discovery-report and the run summary.
# With the parameter write_back (scope dell) the run also prepares the serial numbers and MAC addresses it found in a COPY of the master file, in
# the artifact (write-back/). The file in the repository is not changed and nothing is committed: review the copy and commit it through a pull request.
#
# What to configure in the organization (names only; no value of any ID, password or key is in this file). Task 05 of the CI/CD setup lists the
# value of every setting, and Set-CicdVariables.ps1 writes them into variables/pipeline-settings.yml.
#   Agent pool      a self-hosted pool (AZL_AGENT_POOL: devops.runners[].pool of the general runner) with PowerShell 7 (pwsh), a route to the
#                   BMC addresses (HTTPS, TCP 443) and, for the directory step, the ActiveDirectory module (RSAT) on a domain-joined agent.
#   Service conn.   the Azure Resource Manager service connection of AZL_SERVICE_CONNECTION (devops.pipelines.service_connection; task 05
#                   creates it), workload identity federation, with Reader on the subscriptions of the tenant inventory and Key Vault Secrets User
#                   on the vault of the BMC login (the secret reference of hardware.bmc or nodes[].bmc in the master file).
#   Variable group  AZL_VARIABLE_GROUP (Pipelines > Library; devops.pipelines.variable_group, the repository group task 05 writes). This file reads
#                   AZL_AZ_POWERSHELL_VERSION, AZL_POWERSHELL_YAML_VERSION and AZL_AZ_KEYVAULT_VERSION from it (devops.pipelines.tool_versions.*).
#                   It holds no BMC password: the script reads it from Key Vault at run time.
#   Settings file   the deployment values are not run parameters: the pool, the service connection, the variable group and the file paths are
#                   compile-time variables of variables/pipeline-settings.yml, generated from infrastructure.yml (D126). Learn: the pool of a job
#                   and a service connection take template expressions, and ${{ variables.name }} sees the variables of the YAML files
#                   (https://learn.microsoft.com/azure/devops/pipelines/process/template-expressions). So no run form asks for them, and a
#                   scheduled run needs none.
name: discovery-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# lockBehavior does not queue runs by itself. Learn: it only says how runs behave when they meet an Exclusive lock check (sequential: every run waits its turn;
# runLatest, the default: only the latest run goes on), and a stage that sets it gets a lock of its own (https://learn.microsoft.com/azure/devops/pipelines/process/approvals#exclusive-lock).
# Here the stage Discover sets it, so two discovery runs never run together and the second waits (GitHub: concurrency group; GitLab: resource_group).
lockBehavior: sequential

parameters:
  - name: scope
    displayName: 'What to discover: all (hardware inventory, Azure tenant, Active Directory), hardware, dell, tenant or directory'
    type: string
    default: all
    values:
      - all
      - hardware
      - dell
      - tenant
      - directory
  - name: management_port
    displayName: 'Scope dell: the management port of every node, by suggested name or MAC (none: the MAC already in the file)'
    type: string
    default: none
  - name: write_back
    displayName: 'Scope dell: prepare the serial numbers and MAC addresses found in a copy of the master file (artifact); the file in the repository is not changed'
    type: boolean
    default: false
  - name: include_rbac
    displayName: 'Scope tenant: also record the role assignments'
    type: boolean
    default: false

variables:
  # AZL_AGENT_POOL, AZL_SERVICE_CONNECTION, AZL_INFRASTRUCTURE_FILE, AZL_HANDOFF_PATH and the variable group: generated from infrastructure.yml, bound at compile time.
  - template: variables/pipeline-settings.yml
  - name: DISCOVERY_SCRIPT
    value: scripts/common/discovery/Invoke-AzlDiscoveryRun.ps1

stages:
  - stage: Discover
    displayName: 'Discover (read only)'
    lockBehavior: sequential
    jobs:
      - job: Discover
        displayName: 'Discover (read only)'
        pool:
          name: ${{ variables.AZL_AGENT_POOL }}
          demands:
            - pwsh
        # A read-only run: the toolkit's limit, not a figure from Microsoft. A BMC is read for at most 900 seconds (Invoke-HardwareDiscovery.ps1, NodeBudgetSeconds), four at a time.
        timeoutInMinutes: 120
        steps:
          - checkout: self

          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
              foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
            displayName: 'Install the PowerShell modules (devops.pipelines.tool_versions)'

          - task: AzurePowerShell@5
            displayName: 'Discover'
            inputs:
              azureSubscription: ${{ variables.AZL_SERVICE_CONNECTION }}
              azurePowerShellVersion: OtherVersion
              preferredAzurePowerShellVersion: $(AZL_AZ_POWERSHELL_VERSION)
              pwsh: true
              ScriptType: InlineScript
              workingDirectory: $(Build.SourcesDirectory)
              Inline: |
                Set-StrictMode -Version Latest
                $ErrorActionPreference = 'Stop'
                $scopes = @{ all = @('HardwareInventory', 'AzureTenant', 'ActiveDirectory'); hardware = @('HardwareInventory'); dell = @('DellDiscovery'); tenant = @('AzureTenant'); directory = @('ActiveDirectory') }
                $p = @{ InfrastructureFile = $env:DISCOVERY_INFRASTRUCTURE_FILE; OutputDirectory = $env:DISCOVERY_REPORT_DIRECTORY; Scope = $scopes[$env:DISCOVERY_SCOPE] }
                if ($env:DISCOVERY_MANAGEMENT_PORT -and $env:DISCOVERY_MANAGEMENT_PORT -ne 'none') { $p.ManagementPort = $env:DISCOVERY_MANAGEMENT_PORT }
                if ($env:DISCOVERY_WRITE_BACK -eq 'true') { $p.WriteBack = $true }
                if ($env:DISCOVERY_INCLUDE_RBAC -eq 'true') { $p.IncludeRBAC = $true }
                & $env:DISCOVERY_SCRIPT @p
                if ($LASTEXITCODE -ne 0) { throw "Invoke-AzlDiscoveryRun.ps1 exited with code $LASTEXITCODE." }
            env:
              DISCOVERY_INFRASTRUCTURE_FILE: ${{ variables.AZL_INFRASTRUCTURE_FILE }}
              DISCOVERY_SCOPE: ${{ parameters.scope }}
              DISCOVERY_MANAGEMENT_PORT: ${{ parameters.management_port }}
              DISCOVERY_WRITE_BACK: ${{ parameters.write_back }}
              DISCOVERY_INCLUDE_RBAC: ${{ parameters.include_rbac }}
              DISCOVERY_REPORT_DIRECTORY: $(Build.ArtifactStagingDirectory)/discovery-report

          - pwsh: |
              $summary = "$env:DISCOVERY_REPORT_DIRECTORY/summary.md"
              if (Test-Path -LiteralPath $summary) { Write-Output "##vso[task.uploadsummary]$summary" }
            displayName: 'Run summary'
            condition: always()
            env:
              DISCOVERY_REPORT_DIRECTORY: $(Build.ArtifactStagingDirectory)/discovery-report

          # The artifact holds serial numbers and MAC addresses, and with write_back a copy of the master file (its secrets are references, never values).
          - task: PublishPipelineArtifact@1
            displayName: 'Publish the discovery report'
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/discovery-report
              artifact: discovery-report
              publishLocation: pipeline
