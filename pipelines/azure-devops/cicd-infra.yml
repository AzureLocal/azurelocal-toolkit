# =============================================================================
# Azure DevOps pipeline - CI/CD infrastructure (self-hosted agents)
# =============================================================================
# Task 06 of automation / 01-cicd-infra as a pipeline: validate, terraform plan,
# manual approval (environment check), terraform apply of the reviewed plan.
#
# Sign-in: the service connection of the parameter serviceConnection (devops.pipelines.service_connection; made by task 05 with workload
# identity federation when devops.authentication.method is oidc). The scripts follow AZL_AUTH_METHOD (devops.authentication.method) from the
# variable group: oidc takes the federated token of the service connection, client_secret its secret. The identity needs Storage Blob Data
# Contributor on the state account, and the roles in docs/cicd-infra-deployment.md.
# Environment:    the name in variables/approval-environments.yml (AZL_ENVIRONMENT_CICD_INFRA: devops.pipelines.environments.cicd_infra; task 05 lists the
#                 value to write there, once, in a pull request), with an Approvals check (the manual approval). It is bound when the pipeline is
#                 compiled and is not a run parameter: a deployment job to an environment with no approval check runs without one, so the person who
#                 queues the run must not choose it. While it is empty and apply is on, the stage ApprovalEnvironmentNotSet fails and nothing is changed.
# Variable group: the parameter variableGroup (devops.pipelines.variable_group, <name>-<environment>). Task 05 writes to it AZL_AUTH_METHOD,
#                 AZL_RUNNER_SSH_PUBLIC_KEY (devops.runners[].admin_ssh_public_key of the Linux runner, a public key), AZL_TERRAFORM_VERSION
#                 and AZL_POWERSHELL_YAML_VERSION (devops.pipelines.tool_versions.*).
# Infrastructure file: the parameter infrastructureFile (devops.pipelines.infrastructure_file). Task 05 lists every value to enter.
# Requirements: the Terraform extension from the marketplace (TerraformInstaller@1).
#
# Where it runs: the first time on Microsoft-hosted agents (there are no agents yet);
# set the agentPool parameter to the pool of the agents (devops.runners[].pool of the general runner) after the agents exist.
# Why parameters: the pool of a job is not a task input. Learn says a macro variable $(name) is expanded only in task
# inputs, and that other keywords take template expressions or runtime parameters
# (https://learn.microsoft.com/azure/devops/pipelines/process/variables#understand-variable-syntax). The template expression
# ${{ variables.name }} does not see variables stored on the pipeline or in a library, only those of the YAML files
# (https://learn.microsoft.com/azure/devops/pipelines/process/template-expressions). So the pool, the service connection and the file path are
# runtime parameters (${{ parameters.name }}). The approval environment is not one of them: a value the queuer must not choose is read from a YAML
# file of the repository.
# =============================================================================
# Hosted image: ubuntu-latest is the vendor's label of its hosted Linux image, a platform choice and not a setting of a deployment. The
# Validate stage only validates; Plan and Apply use it only for the first run (agentPool hosted), before the self-hosted agents exist.
name: cicd-infra-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# Runs queue one after the other, as GitHub's concurrency group and GitLab's resource_group. Terraform locks the state too.
lockBehavior: sequential

parameters:
  - name: infrastructureFile
    displayName: Path of infrastructure.yml in the repository. Enter devops.pipelines.infrastructure_file
    type: string
  - name: agentPool
    displayName: Agent pool. hosted for the first run (Microsoft-hosted ubuntu-latest), then devops.runners[].pool of the general runner
    type: string
    default: hosted
  - name: serviceConnection
    displayName: Azure service connection. Enter devops.pipelines.service_connection
    type: string
  - name: variableGroup
    displayName: Variable group with the sign-in method, the tool versions and the runner public key. Enter devops.pipelines.variable_group (with environments, <name>-<environment>)
    type: string
  - name: apply
    displayName: Also run the apply stage (it waits for approval)
    type: boolean
    default: false

variables:
  - group: ${{ parameters.variableGroup }}
  # AZL_ENVIRONMENT_CICD_INFRA: the approval environment of the Apply stage, bound at compile time (not a run parameter).
  - template: variables/approval-environments.yml
  - name: TF_ROOT
    value: src/terraform/environments/cicd-infra
  - name: TASK06
    value: scripts/deploy/01-cicd-infra/phase-01-cicd-setup/task-06-deploy-runners/powershell/Deploy-CicdRunners.ps1
  - name: WORK
    value: $(Pipeline.Workspace)/cicd-infra

stages:
  - stage: Validate
    displayName: Validate
    # Validates only: the hosted image is a platform choice.
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: validate
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            displayName: Install Terraform (devops.pipelines.tool_versions.terraform)
            inputs:
              terraformVersion: $(AZL_TERRAFORM_VERSION)
          - pwsh: |
              $PSNativeCommandUseErrorActionPreference = $true
              terraform fmt -check -recursive src/terraform/modules/cicd-runner $(TF_ROOT)
            displayName: Terraform format
          - pwsh: |
              $PSNativeCommandUseErrorActionPreference = $true
              terraform init -backend=false -input=false
              terraform validate
            workingDirectory: $(TF_ROOT)
            displayName: Terraform validate (environment)
          - pwsh: |
              $PSNativeCommandUseErrorActionPreference = $true
              terraform init -backend=false -input=false
              terraform test
            workingDirectory: src/terraform/modules/cicd-runner
            displayName: Terraform test (module, mocked providers)
          - pwsh: |
              Install-Module powershell-yaml -RequiredVersion $env:AZL_POWERSHELL_YAML_VERSION -Force -Scope CurrentUser -Repository PSGallery
              ./scripts/common/infrastructure/Test-InfrastructureFile.ps1 -Path $env:CICD_INFRASTRUCTURE_FILE
            displayName: Check infrastructure.yml
            env:
              CICD_INFRASTRUCTURE_FILE: ${{ parameters.infrastructureFile }}

  - stage: Plan
    displayName: Plan
    dependsOn: Validate
    # The first run has no self-hosted agent yet, so it runs on the hosted image; later runs name the pool.
    ${{ if eq(parameters.agentPool, 'hosted') }}:
      pool:
        vmImage: ubuntu-latest
    ${{ else }}:
      pool:
        name: ${{ parameters.agentPool }}
        demands:
          - terraform
    jobs:
      - job: plan
        # terraform init, validate and plan of the runner VMs and their network: the toolkit's limit, not a figure from Microsoft.
        timeoutInMinutes: 60
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            displayName: Install Terraform (devops.pipelines.tool_versions.terraform)
            inputs:
              terraformVersion: $(AZL_TERRAFORM_VERSION)
          - task: AzureCLI@2
            displayName: Plan (nothing changes in Azure)
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              addSpnToEnvironment: true # exposes $env:servicePrincipalId, $env:tenantId and $env:idToken (federation) or $env:servicePrincipalKey (secret)
              inlineScript: |
                Install-Module powershell-yaml -RequiredVersion $env:AZL_POWERSHELL_YAML_VERSION -Force -Scope CurrentUser -Repository PSGallery
                $env:ARM_CLIENT_ID = $env:servicePrincipalId
                $env:ARM_TENANT_ID = $env:tenantId
                # The sign-in method of devops.authentication.method (AZL_AUTH_METHOD from the variable group).
                if ($env:AZL_AUTH_METHOD -eq 'client_secret') { $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey } else { $env:ARM_USE_OIDC = 'true'; $env:ARM_OIDC_TOKEN = $env:idToken }
                & './$(TASK06)' -InfrastructureFile $env:CICD_INFRASTRUCTURE_FILE -WorkingDirectory '$(WORK)'
                terraform -chdir='$(TF_ROOT)' show -no-color '$(WORK)/cicd-infra.tfplan' | Tee-Object '$(WORK)/plan.txt'
            env:
              CICD_INFRASTRUCTURE_FILE: ${{ parameters.infrastructureFile }}
              # The public key of the Linux runners task 06 writes to the Terraform variables (from the variable group).
              AZL_RUNNER_SSH_PUBLIC_KEY: $(AZL_RUNNER_SSH_PUBLIC_KEY)
          - publish: $(WORK)
            artifact: cicd-infra-plan
            displayName: Keep the reviewed plan

  # apply is on, but no approval environment is set in variables/approval-environments.yml: nothing is applied, and the run says why.
  - ${{ if and(eq(parameters.apply, true), eq(variables.AZL_ENVIRONMENT_CICD_INFRA, '')) }}:
      - stage: ApprovalEnvironmentNotSet
        displayName: Apply (no approval environment is set)
        dependsOn: Plan
        # The same pool choice as the Plan stage: the first run has no self-hosted agent yet.
        ${{ if eq(parameters.agentPool, 'hosted') }}:
          pool:
            vmImage: ubuntu-latest
        ${{ else }}:
          pool:
            name: ${{ parameters.agentPool }}
            demands:
              - terraform
        jobs:
          - job: Refuse
            displayName: 'Refuse: no approval environment is set'
            # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 5
            steps:
              - pwsh: |
                  Write-Error 'The Apply stage changes a system, so it runs only behind the approval environment. Set AZL_ENVIRONMENT_CICD_INFRA (devops.pipelines.environments.cicd_infra) in pipelines/azure-devops/variables/approval-environments.yml, then run again. Nothing was changed.'
                  exit 1
                displayName: 'No approval environment is set: nothing is changed'

  - ${{ if and(eq(parameters.apply, true), ne(variables.AZL_ENVIRONMENT_CICD_INFRA, '')) }}:
      - stage: Apply
        displayName: Apply (needs approval)
        dependsOn: Plan
        # The same pool choice as the Plan stage: the first run has no self-hosted agent yet.
        ${{ if eq(parameters.agentPool, 'hosted') }}:
          pool:
            vmImage: ubuntu-latest
        ${{ else }}:
          pool:
            name: ${{ parameters.agentPool }}
            demands:
              - terraform
        jobs:
          - deployment: apply
            # terraform apply of the runner VMs, their network and role assignments: the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 120
            # The Approvals check holds the job until a reviewer approves. The name is a variable of a YAML file of the repository, so the queuer cannot choose it.
            environment: ${{ variables.AZL_ENVIRONMENT_CICD_INFRA }}
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - download: current
                      artifact: cicd-infra-plan
                    - task: TerraformInstaller@1
                      displayName: Install Terraform (devops.pipelines.tool_versions.terraform)
                      inputs:
                        terraformVersion: $(AZL_TERRAFORM_VERSION)
                    - task: AzureCLI@2
                      displayName: Apply the reviewed plan
                      inputs:
                        azureSubscription: ${{ parameters.serviceConnection }}
                        scriptType: pscore
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        inlineScript: |
                          Install-Module powershell-yaml -RequiredVersion $env:AZL_POWERSHELL_YAML_VERSION -Force -Scope CurrentUser -Repository PSGallery
                          $env:ARM_CLIENT_ID = $env:servicePrincipalId
                          $env:ARM_TENANT_ID = $env:tenantId
                          # The sign-in method of devops.authentication.method (AZL_AUTH_METHOD from the variable group).
                          if ($env:AZL_AUTH_METHOD -eq 'client_secret') { $env:ARM_CLIENT_SECRET = $env:servicePrincipalKey } else { $env:ARM_USE_OIDC = 'true'; $env:ARM_OIDC_TOKEN = $env:idToken }
                          & './$(TASK06)' -InfrastructureFile $env:CICD_INFRASTRUCTURE_FILE -PlanFile '$(Pipeline.Workspace)/cicd-infra-plan/cicd-infra.tfplan' -Apply
                      env:
                        CICD_INFRASTRUCTURE_FILE: ${{ parameters.infrastructureFile }}
