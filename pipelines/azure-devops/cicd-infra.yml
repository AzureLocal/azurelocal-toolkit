# =============================================================================
# Azure DevOps pipeline - CI/CD infrastructure (self-hosted agents)
# =============================================================================
# Task 06 of automation / 01-cicd-infra as a pipeline: validate, terraform plan,
# manual approval (environment check), terraform apply of the reviewed plan.
#
# Sign-in: the workload identity federation service connection AzureLocal-ServiceConnection
# (made by task 05). No client secret. The identity needs Storage Blob Data Contributor on
# the state account, and the roles in docs/cicd-infra-deployment.md.
# Environment:  the parameter approvalEnvironment (devops.pipelines.environments.cicd_infra), with an Approvals check (the manual approval)
# Variable:     RUNNER_SSH_PUBLIC_KEY (the public key for the Linux runners)
#
# Where it runs: the first time on Microsoft-hosted agents (there are no agents yet);
# set the agentPool parameter to the pool of the agents (devops.runners[].pool of the general runner) after the agents exist.
# Why parameters: the pool and the environment of a job are not task inputs. Learn says a macro variable $(name) is expanded only in task
# inputs, and that other keywords take template expressions or runtime parameters
# (https://learn.microsoft.com/azure/devops/pipelines/process/variables#understand-variable-syntax). The template expression
# ${{ variables.name }} does not see variables stored on the pipeline or in a library
# (https://learn.microsoft.com/azure/devops/pipelines/process/template-expressions). So both are runtime parameters (${{ parameters.name }}).
# =============================================================================
# Hosted image: ubuntu-latest is the vendor's label of its hosted Linux image. The jobs that use it only validate and plan and read nothing that
# belongs to one deployment, so the label is not a setting of a deployment.
name: cicd-infra-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
  - name: infrastructureFile
    displayName: Path of infrastructure.yml in the repository
    type: string
    default: config/infrastructure.yml
  - name: agentPool
    displayName: Agent pool. hosted for the first run (Microsoft-hosted ubuntu-latest), then devops.runners[].pool of the general runner
    type: string
    default: hosted
  - name: approvalEnvironment
    displayName: Environment of the Apply approval (only when apply is on). Enter devops.pipelines.environments.cicd_infra
    type: string
    default: ''
  - name: serviceConnection
    displayName: Azure service connection (workload identity federation)
    type: string
    default: AzureLocal-ServiceConnection
  - name: apply
    displayName: Also run the apply stage (it waits for approval)
    type: boolean
    default: false

variables:
  - name: TF_ROOT
    value: src/terraform/environments/cicd-infra
  - name: TASK06
    value: scripts/deploy/01-cicd-infra/phase-01-cicd-setup/task-06-deploy-runners/powershell/Deploy-CicdRunners.ps1
  - name: WORK
    value: $(Pipeline.Workspace)/cicd-infra

stages:
  - stage: Validate
    displayName: Validate
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: validate
        steps:
          - checkout: self
          - script: terraform fmt -check -recursive src/terraform/modules/cicd-runner $(TF_ROOT)
            displayName: Terraform format
          - script: |
              terraform init -backend=false -input=false
              terraform validate
            workingDirectory: $(TF_ROOT)
            displayName: Terraform validate (environment)
          - script: |
              terraform init -backend=false -input=false
              terraform test
            workingDirectory: src/terraform/modules/cicd-runner
            displayName: Terraform test (module, mocked providers)
          - pwsh: |
              Install-Module powershell-yaml -Force -Scope CurrentUser
              ./scripts/common/infrastructure/Test-InfrastructureFile.ps1 -Path '${{ parameters.infrastructureFile }}'
            displayName: Check infrastructure.yml

  - stage: Plan
    displayName: Plan
    dependsOn: Validate
    ${{ if eq(parameters.agentPool, 'hosted') }}:
      pool:
        vmImage: ubuntu-latest
    ${{ else }}:
      pool:
        name: ${{ parameters.agentPool }}
        demands:
          - terraform
    jobs:
      - job: plan
        # terraform init, validate and plan of the runner VMs and their network: the toolkit's limit, not a figure from Microsoft.
        timeoutInMinutes: 60
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: Plan (nothing changes in Azure)
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              addSpnToEnvironment: true # exposes $env:servicePrincipalId, $env:idToken, $env:tenantId
              inlineScript: |
                Install-Module powershell-yaml -Force -Scope CurrentUser
                $env:ARM_USE_OIDC = 'true'
                $env:ARM_CLIENT_ID = $env:servicePrincipalId
                $env:ARM_TENANT_ID = $env:tenantId
                $env:ARM_OIDC_TOKEN = $env:idToken
                $env:AZL_RUNNER_SSH_PUBLIC_KEY = '$(RUNNER_SSH_PUBLIC_KEY)'
                & './$(TASK06)' -InfrastructureFile '${{ parameters.infrastructureFile }}' -WorkingDirectory '$(WORK)'
                terraform -chdir='$(TF_ROOT)' show -no-color '$(WORK)/cicd-infra.tfplan' | Tee-Object '$(WORK)/plan.txt'
          - publish: $(WORK)
            artifact: cicd-infra-plan
            displayName: Keep the reviewed plan

  - ${{ if eq(parameters.apply, true) }}:
      - stage: Apply
        displayName: Apply (needs approval)
        dependsOn: Plan
        ${{ if eq(parameters.agentPool, 'hosted') }}:
          pool:
            vmImage: ubuntu-latest
        ${{ else }}:
          pool:
            name: ${{ parameters.agentPool }}
            demands:
              - terraform
        jobs:
          - deployment: apply
            # terraform apply of the runner VMs, their network and role assignments: the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 120
            environment: ${{ parameters.approvalEnvironment }} # the Approvals check holds the job until a reviewer approves
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - download: current
                      artifact: cicd-infra-plan
                    - task: AzureCLI@2
                      displayName: Apply the reviewed plan
                      inputs:
                        azureSubscription: ${{ parameters.serviceConnection }}
                        scriptType: pscore
                        scriptLocation: inlineScript
                        addSpnToEnvironment: true
                        inlineScript: |
                          Install-Module powershell-yaml -Force -Scope CurrentUser
                          $env:ARM_USE_OIDC = 'true'
                          $env:ARM_CLIENT_ID = $env:servicePrincipalId
                          $env:ARM_TENANT_ID = $env:tenantId
                          $env:ARM_OIDC_TOKEN = $env:idToken
                          & './$(TASK06)' -InfrastructureFile '${{ parameters.infrastructureFile }}' -PlanFile '$(Pipeline.Workspace)/cicd-infra-plan/cicd-infra.tfplan' -Apply
