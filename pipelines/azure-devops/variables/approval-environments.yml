# The approval environments an Azure DevOps pipeline of the toolkit is bound to when it is compiled, not when it is queued.
#
# Why this file exists. A deployment job that changes a system sits behind an environment with an Approvals check (and an Exclusive lock). If the
# environment is a run parameter, whoever queues the run can type the name of an environment that has no check, and the change runs without an
# approval. A template expression takes only what the YAML defines (Learn: Template expressions, "Context": the variables context holds the
# variables of the YAML files and the predefined variables, not those stored on the pipeline, in a library or given when you start a run). So a
# value the queuer must not choose is a variable defined in a YAML file of the repository, and a pipeline reads it as ${{ variables.NAME }}.
#
# What to do. Task 05 of the CI/CD setup lists the value to enter. Write the name of each environment you use here, once per repository, in a
# pull request. The names are the ones the GitHub repository variables and the GitLab project variables of the same purpose have, so the three
# platforms share them:
#   AZL_ENVIRONMENT_OS_CONFIGURATION                devops.pipelines.environments.os_configuration (an entry of devops.environments[] with approval_required true)
#   AZL_ENVIRONMENT_OS_CONFIGURATION_CLEAR_STORAGE  devops.pipelines.environments.os_configuration_clear_storage (the second approval in front of a storage wipe)
#   AZL_ENVIRONMENT_ARM_DEPLOYMENT                  devops.pipelines.environments.arm_deployment
#   AZL_ENVIRONMENT_CICD_INFRA                      devops.pipelines.environments.cicd_infra
#   AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT            devops.pipelines.environments.terraform_deployment
#   AZL_ENVIRONMENT_OPERATIONS                      devops.pipelines.environments.operations (every day 2 and validation job that changes the cluster or puts load on it)
# The toolkit ships them empty, because no value of a deployment is written in the toolkit. While one is empty, a pipeline that needs it refuses to
# run the stage that changes something (the stage ApprovalEnvironmentNotSet, or ConfirmStorageWipe for the wipe approval, fails with a message that
# names this file and changes nothing); the read-only stages run as before. A pipeline reads only the names it needs; the others stay unused.
#
# Used by:
#   AZL_ENVIRONMENT_OS_CONFIGURATION, _OS_CONFIGURATION_CLEAR_STORAGE   os-configuration.yml (the stage Apply and the stage ConfirmStorageWipe)
#   AZL_ENVIRONMENT_ARM_DEPLOYMENT                                      arm-deployment.yml (the stage Deploy), pre-cluster-verification.yml (the stage
#                                                                       that runs -Fix and -InstallEnvironmentChecker)
#   AZL_ENVIRONMENT_CICD_INFRA                                          cicd-infra.yml (the stage Apply)
#   AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT                                azure-local-deploy.yml (the stages DeployFoundation, ConfigureOnPrem and ConfigureOperations)
#   AZL_ENVIRONMENT_OPERATIONS                                          day2-update.yml, day2-node-maintenance.yml, day2-cluster-operations.yml and
#                                                                       post-deployment.yml (the stage Apply) and validation.yml (the stage StoragePerformance): one
#                                                                       environment for all of them, so that its Exclusive lock check keeps two changes from running on
#                                                                       the cluster together
variables:
  - name: AZL_ENVIRONMENT_OS_CONFIGURATION
    value: ''
  - name: AZL_ENVIRONMENT_OS_CONFIGURATION_CLEAR_STORAGE
    value: ''
  - name: AZL_ENVIRONMENT_ARM_DEPLOYMENT
    value: ''
  - name: AZL_ENVIRONMENT_CICD_INFRA
    value: ''
  - name: AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT
    value: ''
  - name: AZL_ENVIRONMENT_OPERATIONS
    value: ''
