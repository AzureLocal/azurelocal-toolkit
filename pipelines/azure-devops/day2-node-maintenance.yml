# Azure Local day 2: take one node through maintenance (drain, reboot, resume, wait for the storage), Azure DevOps.
#
# Create a pipeline from this file (Pipelines > New pipeline > Existing Azure Pipelines YAML file). It runs the command an operator runs by hand (stage 08,
# task 03) and nothing else; the logic is in the script, not here. PowerShell 7 only (AzurePowerShell@5 with pwsh: true).
#   scripts/deploy/08-day2-operations/task-03-node-maintenance/powershell/Invoke-NodeMaintenanceReboot.ps1
# The script checks that it is safe to take the node out (every other node Up, every virtual disk Healthy, no storage repair running), drains it, reboots it,
# waits for it, resumes it and waits for the storage to repair (Learn: Suspend and resume Azure Local machines for maintenance). Run it for the next node only
# after this run ended with exit code 0.
#
# Exactly one node per run. The parameter node is one node of nodes[] in the master file: the script is given -RequireNodeInFile, so a name or an address that
# the file does not list ends the run with exit code 2 before any credential is read and before anything is sent to a machine. Nodes are never handled in
# parallel: there is no loop, and the Apply stage deploys to the one environment of every change to the cluster.
#
# Stages
#   Plan   Read only, and always first. The same script with -WhatIf: it checks the node against the file, reads the credential reference and prints what
#          would happen. It sends nothing to any machine. With the parameter action Plan it is the only stage; when it fails the next stage does not start.
#   Apply  Only for the action Reboot or Resume, as a deployment job in the approval environment (add an Approvals check to it). Reboot drains, reboots and
#          resumes the node. Resume only resumes a node that a failed run left Paused (the script's -ResumeOnly): use it after you looked at the node. The
#          environment is fixed when the pipeline is compiled (the variable AZL_ENVIRONMENT_OPERATIONS of variables/approval-environments.yml), never a
#          run parameter: whoever queues the run cannot pick an environment that has no approval. While the variable is empty, the stage
#          ApprovalEnvironmentNotSet fails and nothing is changed.
#
# One change at a time. The update, the node maintenance, the changing operations and the storage performance test deploy to the same environment, and the
# Exclusive lock check of that environment keeps two of them from running on the cluster together; each Apply stage also sets lockBehavior: sequential.
#
# What to configure in the organization (names only; no value of any ID, password or key is in this file). Task 05 of the CI/CD setup lists the value of every
# run parameter to enter.
#   Agent pool      a self-hosted pool (parameter agent_pool: devops.runners[].pool of the general runner) with PowerShell 7 (pwsh) and a route to the node
#                   (WinRM, TCP 5985 or 5986, and ping).
#   Service conn.   the Azure Resource Manager service connection of the parameter service_connection (devops.pipelines.service_connection; task 05
#                   creates it), workload identity federation, with Key Vault Secrets User on the vaults of the local administrator and the LCM user (the
#                   secret references identity.local_admin and identity.active_directory.lcm_user of the master file). The node login is never in this file.
#   Variable group  parameter variable_group (Pipelines > Library; devops.pipelines.variable_group, the group task 05 writes). This file reads
#                   AZL_AZ_POWERSHELL_VERSION, AZL_POWERSHELL_YAML_VERSION and AZL_AZ_KEYVAULT_VERSION from it (devops.pipelines.tool_versions.*).
#   Environment     the name in variables/approval-environments.yml (AZL_ENVIRONMENT_OPERATIONS: devops.pipelines.environments.operations; task 05
#                   lists the value to write there): Approvals (required reviewers) and an Exclusive lock. Task 04 of the CI/CD setup creates it from
#                   devops.environments. A deployment job to an environment with no approval check runs without one, which is why the name is not a run
#                   parameter (Learn: a template expression sees only the variables of the YAML files).
#   Why parameters  the pool of a job is not a task input. Learn says a macro variable $(name) is expanded only in task inputs, and that other keywords take
#                   template expressions or runtime parameters
#                   (https://learn.microsoft.com/azure/devops/pipelines/process/variables#understand-variable-syntax). The template expression
#                   ${{ variables.name }} does not see variables stored on the pipeline or in a library, only those of the YAML files
#                   (https://learn.microsoft.com/azure/devops/pipelines/process/template-expressions). So the pool, the service connection, the variable
#                   group and the file path are runtime parameters (${{ parameters.name }}) with no default: the run form asks for them.
name: day2-node-maintenance-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# lockBehavior does not queue runs by itself. Learn: it only says how runs behave when they meet an Exclusive lock check (sequential: every run waits its turn;
# runLatest, the default: only the latest run goes on), and a stage that sets it gets a lock of its own (https://learn.microsoft.com/azure/devops/pipelines/process/approvals#exclusive-lock).
# At the pipeline level it makes the Exclusive lock check on the approval environment queue the runs instead of cancelling the older ones.
lockBehavior: sequential

parameters:
  - name: infrastructure_file
    displayName: 'Path of the master infrastructure.yml in the repository. Enter devops.pipelines.infrastructure_file'
    type: string
  - name: node
    displayName: 'The one node to take through maintenance: its name in nodes[] of the master file (a fully qualified name or a management address of that node also works)'
    type: string
  - name: action
    displayName: 'Plan: check the node against the file and show what would happen (nothing is sent to a machine). Reboot: drain, reboot, resume and wait for the storage (needs approval). Resume: only resume a node left Paused by a failed run (needs approval)'
    type: string
    default: Plan
    values:
      - Plan
      - Reboot
      - Resume
  - name: agent_pool
    displayName: 'Self-hosted agent pool (PowerShell 7, route to the node). Enter devops.runners[].pool of the general runner'
    type: string
  - name: service_connection
    displayName: 'Azure Resource Manager service connection. Enter devops.pipelines.service_connection'
    type: string
  - name: variable_group
    displayName: 'Variable group of the pipeline (Pipelines > Library). Enter devops.pipelines.variable_group (with environments, <name>-<environment>)'
    type: string

variables:
  - group: ${{ parameters.variable_group }}
  # AZL_ENVIRONMENT_OPERATIONS: the approval environment, bound at compile time (not a run parameter).
  - template: variables/approval-environments.yml
  - name: maintenanceScript
    value: scripts/deploy/08-day2-operations/task-03-node-maintenance/powershell/Invoke-NodeMaintenanceReboot.ps1

stages:
  # ---------------------------------------------------------------------------------------------------------------------------
  - stage: Plan
    displayName: 'Plan (read only)'
    jobs:
      - job: Plan
        displayName: 'Plan (read only)'
        pool:
          name: ${{ parameters.agent_pool }}
          demands:
            - pwsh
        # The check of the node and a read of the secret references: the toolkit's limit for a read-only check, not a figure from Microsoft.
        timeoutInMinutes: 30
        steps:
          - checkout: self

          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
              foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
            displayName: 'Install the PowerShell modules (devops.pipelines.tool_versions)'

          - task: AzurePowerShell@5
            displayName: 'Plan (nothing is sent to a machine)'
            inputs:
              azureSubscription: ${{ parameters.service_connection }}
              azurePowerShellVersion: OtherVersion
              preferredAzurePowerShellVersion: $(AZL_AZ_POWERSHELL_VERSION)
              pwsh: true
              ScriptType: InlineScript
              workingDirectory: $(Build.SourcesDirectory)
              Inline: |
                Set-StrictMode -Version Latest
                $ErrorActionPreference = 'Stop'
                New-Item -ItemType Directory -Path $env:MAINTENANCE_LOG_DIRECTORY -Force | Out-Null
                $p = @{ InfrastructureFile = $env:MAINTENANCE_INFRASTRUCTURE_FILE; TargetNode = $env:MAINTENANCE_NODE; RequireNodeInFile = $true; LogPath = "$env:MAINTENANCE_LOG_DIRECTORY/plan.log"; WhatIf = $true }
                if ($env:MAINTENANCE_ACTION -eq 'Resume') { $p.ResumeOnly = $true }
                & $env:MAINTENANCE_SCRIPT @p
                $code = $LASTEXITCODE
                if ($code -ne 0) { throw "Invoke-NodeMaintenanceReboot.ps1 exited with code $code." }
            env:
              MAINTENANCE_SCRIPT: $(maintenanceScript)
              MAINTENANCE_INFRASTRUCTURE_FILE: ${{ parameters.infrastructure_file }}
              MAINTENANCE_NODE: ${{ parameters.node }}
              MAINTENANCE_ACTION: ${{ parameters.action }}
              MAINTENANCE_LOG_DIRECTORY: $(Build.ArtifactStagingDirectory)/day2-node-maintenance

          - task: PublishPipelineArtifact@1
            displayName: 'Publish the plan'
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/day2-node-maintenance
              artifact: day2-node-maintenance-plan
              publishLocation: pipeline

  # ---------------------------------------------------------------------------------------------------------------------------
  # A change was asked for, but no approval environment is set in variables/approval-environments.yml: nothing is changed, and the run says why.
  - ${{ if and(ne(parameters.action, 'Plan'), eq(variables.AZL_ENVIRONMENT_OPERATIONS, '')) }}:
      - stage: ApprovalEnvironmentNotSet
        displayName: 'Apply: no approval environment is set'
        dependsOn: Plan
        jobs:
          - job: Refuse
            displayName: 'Refuse: no approval environment is set'
            pool:
              name: ${{ parameters.agent_pool }}
              demands:
                - pwsh
            # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 5
            steps:
              - pwsh: |
                  Write-Error 'Reboot and Resume change a node, so they run only behind the approval environment. Set AZL_ENVIRONMENT_OPERATIONS (devops.pipelines.environments.operations) in pipelines/azure-devops/variables/approval-environments.yml, then run again. Nothing was changed.'
                  exit 1
                displayName: 'No approval environment is set: nothing is changed'

  # ---------------------------------------------------------------------------------------------------------------------------
  - ${{ if and(ne(parameters.action, 'Plan'), ne(variables.AZL_ENVIRONMENT_OPERATIONS, '')) }}:
      - stage: Apply
        displayName: 'Apply (needs approval)'
        dependsOn: Plan
        lockBehavior: sequential
        jobs:
          - deployment: Apply
            displayName: 'Apply'
            pool:
              name: ${{ parameters.agent_pool }}
              demands:
                - pwsh
            # Required reviewers on this environment are the approval gate. The name is a variable of a YAML file of the repository, so the queuer cannot choose it.
            environment: ${{ variables.AZL_ENVIRONMENT_OPERATIONS }}
            # The drain waits for the virtual machines to move (no limit in the script), the node is awaited for 500 seconds and the storage repair for 180 minutes (the defaults of the script): the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 360
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self

                    - pwsh: |
                        $ErrorActionPreference = 'Stop'
                        $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
                        foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                      displayName: 'Install the PowerShell modules (devops.pipelines.tool_versions)'

                    - task: AzurePowerShell@5
                      displayName: 'Take the node through maintenance'
                      inputs:
                        azureSubscription: ${{ parameters.service_connection }}
                        azurePowerShellVersion: OtherVersion
                        preferredAzurePowerShellVersion: $(AZL_AZ_POWERSHELL_VERSION)
                        pwsh: true
                        ScriptType: InlineScript
                        workingDirectory: $(Build.SourcesDirectory)
                        Inline: |
                          Set-StrictMode -Version Latest
                          $ErrorActionPreference = 'Stop'
                          New-Item -ItemType Directory -Path $env:MAINTENANCE_LOG_DIRECTORY -Force | Out-Null
                          $p = @{ InfrastructureFile = $env:MAINTENANCE_INFRASTRUCTURE_FILE; TargetNode = $env:MAINTENANCE_NODE; RequireNodeInFile = $true; LogPath = "$env:MAINTENANCE_LOG_DIRECTORY/apply.log" }
                          # the one change the reviewer approved: Resume only resumes a node that a failed run left Paused, Reboot drains, reboots and resumes it
                          if ($env:MAINTENANCE_ACTION -eq 'Resume') { $p.ResumeOnly = $true }
                          & $env:MAINTENANCE_SCRIPT @p
                          $code = $LASTEXITCODE
                          if ($code -ne 0) { throw "Invoke-NodeMaintenanceReboot.ps1 exited with code $code." }
                      env:
                        MAINTENANCE_SCRIPT: $(maintenanceScript)
                        MAINTENANCE_INFRASTRUCTURE_FILE: ${{ parameters.infrastructure_file }}
                        MAINTENANCE_NODE: ${{ parameters.node }}
                        MAINTENANCE_ACTION: ${{ parameters.action }}
                        MAINTENANCE_LOG_DIRECTORY: $(Build.ArtifactStagingDirectory)/day2-node-maintenance

                    - task: PublishPipelineArtifact@1
                      displayName: 'Publish the log'
                      condition: always()
                      inputs:
                        targetPath: $(Build.ArtifactStagingDirectory)/day2-node-maintenance
                        artifact: day2-node-maintenance-log
                        publishLocation: pipeline
