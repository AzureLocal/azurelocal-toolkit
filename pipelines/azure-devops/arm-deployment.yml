# Azure Local ARM Validate and Deploy, Azure DevOps.
#
# Copy to your pipeline repository or point a pipeline at this file. It runs the command an operator runs by hand:
#   pwsh -File scripts/deploy/04-cluster-deployment/phase-05-cluster-deployment/Invoke-AzureLocalArmDeployment.ps1 ...
# and nothing else; the logic (preconditions, Validate, polling, known issues, resume) is in the script, not here.
# Design: docs/design/arm-validate-deploy.md. Guide: docs/arm-deployment-guide.md.
#
# Stages
#   Preconditions   Read only. Parameters and every precondition. Always runs.
#   Validate        Mode Validate. Runs for mode Validate and ValidateAndDeploy. A Validate that already passed with the same
#                   parameters is not submitted again.
#   Deploy          Mode Deploy (2.5 to 3 hours). A deployment job in the approval environment (the variable AZL_ENVIRONMENT_ARM_DEPLOYMENT of
#                   variables/approval-environments.yml, bound when the pipeline is compiled, never a run parameter): add an Approvals
#                   check to that environment (Pipelines > Environments > <that environment> > Approvals and checks), and an Exclusive lock
#                   so two runs never deploy at once (lockBehavior below). The approver reads the Validate stage's summary. The stage checks
#                   every precondition and that these parameters validated. `resume` resubmits a failed Deploy. While the variable is empty,
#                   the stage ApprovalEnvironmentNotSet fails instead and nothing is changed.
#
# Setup (names only, no value is in this file; task 05 of the CI/CD setup writes every value below into variables/pipeline-settings.yml and variables/approval-environments.yml (Set-CicdVariables.ps1, from infrastructure.yml; commit both in a pull request))
#   Service connection  an Azure Resource Manager service connection, named by AZL_SERVICE_CONNECTION
#                       (devops.pipelines.service_connection). Task 05 creates it with workload identity federation (no client secret)
#                       when devops.authentication.method is oidc; the AzurePowerShell task signs in with whatever scheme it has.
#   Variable group      AZL_VARIABLE_GROUP (devops.pipelines.variable_group: the group of the repository). Task 05 writes to it the tool versions
#                       this file reads: AZL_AZ_POWERSHELL_VERSION, AZL_POWERSHELL_YAML_VERSION and AZL_AZ_KEYVAULT_VERSION
#                       (devops.pipelines.tool_versions.*). The local administrator and LCM passwords are read from the Key Vaults named by
#                       the keyvault:// references in the master file; the identity needs Get on those secrets and the rights in the design (section 12).
#   Agent pool          a self-hosted pool with pwsh 7, AZL_AGENT_POOL: devops.runners[].pool of the general runner.
#   Environment         the name in variables/approval-environments.yml (AZL_ENVIRONMENT_ARM_DEPLOYMENT: devops.pipelines.environments.arm_deployment;
#                       task 05 lists the value to write there, once, in a pull request). Task 04 of the CI/CD setup creates the environment from
#                       devops.environments. A deployment job to an environment with no approval check runs without one, which is why the name
#                       is not a run parameter (Learn: a template expression sees only the variables of the YAML files).
#   Infrastructure file AZL_INFRASTRUCTURE_FILE: devops.pipelines.infrastructure_file.
#   Settings file   the deployment values are not run parameters: the pool, the service connection, the variable group and the file paths are
#                   compile-time variables of variables/pipeline-settings.yml, generated from infrastructure.yml (D126). Learn: the pool of a job
#                   and a service connection take template expressions, and ${{ variables.name }} sees the variables of the YAML files
#                   (https://learn.microsoft.com/azure/devops/pipelines/process/template-expressions). So no run form asks for them, and a
#                   scheduled run needs none.
#                       The Active Directory check needs a domain-joined agent; elsewhere it is Skipped, not failed.
# Where the files come from: the OS configuration report is the artifact os-configuration-report of an OS configuration pipeline run
# (osConfigurationPipelineId and osConfigurationRunId), as GitHub fetches it, or a repository path (osConfigurationReport).
trigger: none
pr: none

# Runs queue one after the other (with the Exclusive lock check on the environment), as GitHub's concurrency group and GitLab's resource_group.
lockBehavior: sequential

parameters:
  - name: mode
    displayName: 'Plan: preconditions only. Validate: plus Validate. ValidateAndDeploy: plus Deploy after approval. Deploy: Deploy only, after approval.'
    type: string
    default: Plan
    values: [Plan, Validate, ValidateAndDeploy, Deploy]
  - name: osConfigurationPipelineId
    displayName: 'Optional: ID of the OS configuration pipeline whose artifact os-configuration-report holds the report (with osConfigurationRunId; none to skip)'
    type: string
    default: none
  - name: osConfigurationRunId
    displayName: 'Optional: run ID of that OS configuration pipeline (none to skip)'
    type: string
    default: none
  - name: osConfigurationReport
    displayName: Repository path of the OS configuration report directory, used when no run is given (may stay empty)
    type: string
    default: ''
  - name: handoffFile
    displayName: ZTP handoff file (optional)
    type: string
    default: ''
  - name: resume
    displayName: Deploy - resubmit a failed deployment (after reading the failing step and the known issue)
    type: boolean
    default: false
  - name: acknowledgeKnownIssues
    displayName: Known issue ids to proceed past, comma-separated (for example arc-device-id-name). Leave empty normally.
    type: string
    default: ''

variables:
  # AZL_AGENT_POOL, AZL_SERVICE_CONNECTION, AZL_INFRASTRUCTURE_FILE, AZL_HANDOFF_PATH and the variable group: generated from infrastructure.yml, bound at compile time.
  - template: variables/pipeline-settings.yml
  # AZL_ENVIRONMENT_ARM_DEPLOYMENT: the approval environment of the Deploy stage, bound at compile time (not a run parameter).
  - template: variables/approval-environments.yml
  - name: armScript
    value: scripts/deploy/04-cluster-deployment/phase-05-cluster-deployment/Invoke-AzureLocalArmDeployment.ps1

stages:
  - stage: Preconditions
    displayName: Preconditions (read only)
    jobs:
      - job: Plan
        pool:
          name: ${{ variables.AZL_AGENT_POOL }}
        # Read-only checks that make no long wait: the toolkit's limit for them, not a figure from Microsoft.
        timeoutInMinutes: 30
        steps:
          - checkout: self
          - ${{ if and(ne(parameters.osConfigurationPipelineId, 'none'), ne(parameters.osConfigurationRunId, 'none')) }}:
              - task: DownloadPipelineArtifact@2
                displayName: Fetch the OS configuration report
                inputs:
                  source: specific
                  project: $(System.TeamProjectId)
                  pipeline: ${{ parameters.osConfigurationPipelineId }}
                  runVersion: specific
                  runId: ${{ parameters.osConfigurationRunId }}
                  artifact: os-configuration-report
                  path: $(Pipeline.Workspace)/os-configuration-report
          - task: AzurePowerShell@5
            displayName: Preconditions
            inputs:
              azureSubscription: ${{ variables.AZL_SERVICE_CONNECTION }}
              azurePowerShellVersion: OtherVersion
              preferredAzurePowerShellVersion: $(AZL_AZ_POWERSHELL_VERSION)
              pwsh: true
              ScriptType: InlineScript
              Inline: |
                $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
                foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                $arguments = @{ InfrastructureFile = $env:ARM_INFRASTRUCTURE_FILE; Mode = 'Plan'; ReportDirectory = "$(Agent.TempDirectory)/arm-plan" }
                if ($env:ARM_OS_REPORT) { $arguments.OsConfigurationReport = $env:ARM_OS_REPORT }
                if ($env:ARM_HANDOFF_FILE) { $arguments.HandoffFile = $env:ARM_HANDOFF_FILE }
                & '$(armScript)' @arguments
                exit $LASTEXITCODE
            env:
              ARM_INFRASTRUCTURE_FILE: ${{ variables.AZL_INFRASTRUCTURE_FILE }}
              ARM_OS_REPORT: ${{ iif(and(ne(parameters.osConfigurationPipelineId, 'none'), ne(parameters.osConfigurationRunId, 'none')), '$(Pipeline.Workspace)/os-configuration-report', parameters.osConfigurationReport) }}
              ARM_HANDOFF_FILE: ${{ parameters.handoffFile }}
          - pwsh: |
              $s = "$(Agent.TempDirectory)/arm-plan/summary.md"
              if (Test-Path $s) { Write-Host "##vso[task.uploadsummary]$s" }
            displayName: Summary
            condition: always()
          - publish: $(Agent.TempDirectory)/arm-plan
            artifact: arm-deployment-plan
            displayName: Publish the plan report and the event feed
            condition: always()

  - ${{ if or(eq(parameters.mode, 'Validate'), eq(parameters.mode, 'ValidateAndDeploy')) }}:
      - stage: Validate
        displayName: Validate
        dependsOn: Preconditions
        jobs:
          - job: Validate
            pool:
              name: ${{ variables.AZL_AGENT_POOL }}
            # Microsoft Learn: the validation takes about 10 minutes (https://learn.microsoft.com/azure/azure-local/deploy/deployment-azure-resource-manager-template-disaggregated).
            # The real limit is the script's wait, deployment.validate_timeout_minutes, read from the infrastructure file. A job timeout is read before
            # any variable exists, so this is a fixed upper bound: the registry maximum of that key (1440) plus 60 minutes, the same as GitLab.
            timeoutInMinutes: 1500
            steps:
              - checkout: self
              - ${{ if and(ne(parameters.osConfigurationPipelineId, 'none'), ne(parameters.osConfigurationRunId, 'none')) }}:
                  - task: DownloadPipelineArtifact@2
                    displayName: Fetch the OS configuration report
                    inputs:
                      source: specific
                      project: $(System.TeamProjectId)
                      pipeline: ${{ parameters.osConfigurationPipelineId }}
                      runVersion: specific
                      runId: ${{ parameters.osConfigurationRunId }}
                      artifact: os-configuration-report
                      path: $(Pipeline.Workspace)/os-configuration-report
              - task: AzurePowerShell@5
                displayName: Validate
                inputs:
                  azureSubscription: ${{ variables.AZL_SERVICE_CONNECTION }}
                  azurePowerShellVersion: OtherVersion
                  preferredAzurePowerShellVersion: $(AZL_AZ_POWERSHELL_VERSION)
                  pwsh: true
                  ScriptType: InlineScript
                  Inline: |
                    $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
                    foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                    $arguments = @{ InfrastructureFile = $env:ARM_INFRASTRUCTURE_FILE; Mode = 'Validate'; ReportDirectory = "$(Agent.TempDirectory)/arm-validate" }
                    if ($env:ARM_OS_REPORT) { $arguments.OsConfigurationReport = $env:ARM_OS_REPORT }
                    if ($env:ARM_HANDOFF_FILE) { $arguments.HandoffFile = $env:ARM_HANDOFF_FILE }
                    & '$(armScript)' @arguments
                    exit $LASTEXITCODE
                env:
                  ARM_INFRASTRUCTURE_FILE: ${{ variables.AZL_INFRASTRUCTURE_FILE }}
                  ARM_OS_REPORT: ${{ iif(and(ne(parameters.osConfigurationPipelineId, 'none'), ne(parameters.osConfigurationRunId, 'none')), '$(Pipeline.Workspace)/os-configuration-report', parameters.osConfigurationReport) }}
                  ARM_HANDOFF_FILE: ${{ parameters.handoffFile }}
              - pwsh: |
                  $s = "$(Agent.TempDirectory)/arm-validate/summary.md"
                  if (Test-Path $s) { Write-Host "##vso[task.uploadsummary]$s" }
                displayName: Summary (the approver reads this)
                condition: always()
              - publish: $(Agent.TempDirectory)/arm-validate
                artifact: arm-deployment-validate
                displayName: Publish the validate report and the event feed
                condition: always()

  # A Deploy was asked for, but no approval environment is set in variables/approval-environments.yml: nothing is deployed, and the run says why.
  - ${{ if and(or(eq(parameters.mode, 'ValidateAndDeploy'), eq(parameters.mode, 'Deploy')), eq(variables.AZL_ENVIRONMENT_ARM_DEPLOYMENT, '')) }}:
      - stage: ApprovalEnvironmentNotSet
        displayName: Deploy (no approval environment is set)
        dependsOn:
          - Preconditions
          - ${{ if eq(parameters.mode, 'ValidateAndDeploy') }}:
              - Validate
        jobs:
          - job: Refuse
            displayName: 'Refuse: no approval environment is set'
            pool:
              name: ${{ variables.AZL_AGENT_POOL }}
              demands:
                - pwsh
            # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 5
            steps:
              - pwsh: |
                  Write-Error 'The Deploy stage changes a system, so it runs only behind the approval environment. Set AZL_ENVIRONMENT_ARM_DEPLOYMENT (devops.pipelines.environments.arm_deployment) in pipelines/azure-devops/variables/approval-environments.yml, then run again. Nothing was changed.'
                  exit 1
                displayName: 'No approval environment is set: nothing is changed'

  - ${{ if and(or(eq(parameters.mode, 'ValidateAndDeploy'), eq(parameters.mode, 'Deploy')), ne(variables.AZL_ENVIRONMENT_ARM_DEPLOYMENT, '')) }}:
      - stage: Deploy
        displayName: Deploy (needs approval)
        dependsOn:
          - Preconditions
          - ${{ if eq(parameters.mode, 'ValidateAndDeploy') }}:
              - Validate
        jobs:
          # A deployment job: the environment's Approvals check is the gate.
          - deployment: Deploy
            # The name is a variable of a YAML file of the repository, so the queuer cannot choose it.
            environment: ${{ variables.AZL_ENVIRONMENT_ARM_DEPLOYMENT }}
            pool:
              name: ${{ variables.AZL_AGENT_POOL }}
            # Microsoft Learn: the deployment takes between 2.5 and 3 hours (https://learn.microsoft.com/azure/azure-local/deploy/deployment-azure-resource-manager-template).
            # The real limit is the script's wait, deployment.deploy_timeout_minutes, read from the infrastructure file. A job timeout is read before
            # any variable exists, so this is a fixed upper bound: the registry maximum of that key (1440) plus 60 minutes, the same as GitLab.
            timeoutInMinutes: 1500
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - ${{ if and(ne(parameters.osConfigurationPipelineId, 'none'), ne(parameters.osConfigurationRunId, 'none')) }}:
                        - task: DownloadPipelineArtifact@2
                          displayName: Fetch the OS configuration report
                          inputs:
                            source: specific
                            project: $(System.TeamProjectId)
                            pipeline: ${{ parameters.osConfigurationPipelineId }}
                            runVersion: specific
                            runId: ${{ parameters.osConfigurationRunId }}
                            artifact: os-configuration-report
                            path: $(Pipeline.Workspace)/os-configuration-report
                    - task: AzurePowerShell@5
                      displayName: Deploy
                      inputs:
                        azureSubscription: ${{ variables.AZL_SERVICE_CONNECTION }}
                        azurePowerShellVersion: OtherVersion
                        preferredAzurePowerShellVersion: $(AZL_AZ_POWERSHELL_VERSION)
                        pwsh: true
                        ScriptType: InlineScript
                        Inline: |
                          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
                          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                          $arguments = @{ InfrastructureFile = $env:ARM_INFRASTRUCTURE_FILE; Mode = 'Deploy'; ReportDirectory = "$(Agent.TempDirectory)/arm-deploy" }
                          if ($env:ARM_OS_REPORT) { $arguments.OsConfigurationReport = $env:ARM_OS_REPORT }
                          if ($env:ARM_HANDOFF_FILE) { $arguments.HandoffFile = $env:ARM_HANDOFF_FILE }
                          if ('${{ parameters.resume }}' -eq 'True') { $arguments.Resume = $true }
                          if ($env:ARM_ACKNOWLEDGE) { $arguments.AcknowledgeKnownIssues = $env:ARM_ACKNOWLEDGE }
                          & '$(armScript)' @arguments
                          exit $LASTEXITCODE
                      env:
                        ARM_INFRASTRUCTURE_FILE: ${{ variables.AZL_INFRASTRUCTURE_FILE }}
                        ARM_OS_REPORT: ${{ iif(and(ne(parameters.osConfigurationPipelineId, 'none'), ne(parameters.osConfigurationRunId, 'none')), '$(Pipeline.Workspace)/os-configuration-report', parameters.osConfigurationReport) }}
                        ARM_HANDOFF_FILE: ${{ parameters.handoffFile }}
                        ARM_ACKNOWLEDGE: ${{ parameters.acknowledgeKnownIssues }}
                    - pwsh: |
                        $s = "$(Agent.TempDirectory)/arm-deploy/summary.md"
                        if (Test-Path $s) { Write-Host "##vso[task.uploadsummary]$s" }
                      displayName: Summary
                      condition: always()
                    - publish: $(Agent.TempDirectory)/arm-deploy
                      artifact: arm-deployment-deploy
                      displayName: Publish the deploy report and the event feed
                      condition: always()
