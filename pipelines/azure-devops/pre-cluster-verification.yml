# Azure Local pre-cluster verification (the gate before the ARM Validate), Azure DevOps.
#
# Create a pipeline from this file (Pipelines > New pipeline > Existing Azure Pipelines YAML file). It runs the command an operator runs by hand:
#   scripts/deploy/04-cluster-deployment/phase-05-cluster-deployment/Invoke-AzureLocalPreClusterVerification.ps1
# and nothing else; the logic (the checks, the report, the verdict) is in the script, not here. Guide: docs/pre-cluster-verification.md.
# PowerShell 7 only (AzurePowerShell@5 with pwsh: true).
#
# The run FAILS when the verdict is not Pass (exit code 1: a Failed or Skipped check blocks; 3: a partial run). The ARM run (arm-deployment.yml)
# refuses to go on without a passing, current result of this gate for the same master file, so run this after the OS configuration and before the
# ARM Validate.
#
# Stages (exactly one of them runs)
#   Verify             Read only. Plan (what would be checked, offline) or Verify (every check, against Azure, Active Directory and the nodes).
#   VerifyWithChanges  Runs instead of Verify when the parameter fix or install_environment_checker is set, as a deployment job in the approval
#                      environment (add an Approvals check to it): fix registers the mandatory resource providers that are not registered (Azure
#                      side only); install_environment_checker puts the Environment Checker on the nodes for this run and removes it again at
#                      the end. The environment is fixed when the pipeline is compiled (the variable AZL_ENVIRONMENT_ARM_DEPLOYMENT of
#                      variables/approval-environments.yml), never a run parameter: whoever queues the run cannot pick an environment that has no
#                      approval. While the variable is empty, the stage ApprovalEnvironmentNotSet fails and nothing is changed.
#
# Where the result goes. The script writes report.json, summary.md and the event feed where the ARM run reads them: the folder of
# deployment.pre_cluster_verification_report_directory, else arm-report/verification/live in the environment data folder of the master file.
# This pipeline publishes a copy as the build artifact pre-cluster-verification. The ARM run reads the folder, not the artifact: run it on the same
# agent (or set the report directory of the master file to a folder both runs reach).
#
# What to configure in the organization (names only; no value of any ID, password or key is in this file). Task 05 of the CI/CD setup lists the
# value of every setting, and Set-CicdVariables.ps1 writes them into variables/pipeline-settings.yml.
#   Agent pool      a self-hosted pool (AZL_AGENT_POOL: devops.runners[].pool of the general runner) with PowerShell 7 (pwsh) and a route to the
#                   nodes (WinRM, TCP 5985 or 5986), to a domain controller (LDAP, TCP 389) and to the DNS servers of the file. A check the agent
#                   cannot ask is Skipped with its reason, and a Skipped check blocks the verdict: give its id in accept_skipped to accept it (the
#                   report records that you did), or run from an agent that can ask.
#   Service conn.   the Azure Resource Manager service connection of AZL_SERVICE_CONNECTION (devops.pipelines.service_connection; task 05
#                   creates it), workload identity federation, with Reader for the checks (Owner or Contributor for fix) and Key Vault Secrets User on
#                   the vaults of the local administrator and the LCM user.
#   Variable group  AZL_VARIABLE_GROUP (Pipelines > Library; devops.pipelines.variable_group, the repository group task 05 writes). This file reads
#                   AZL_AZ_POWERSHELL_VERSION, AZL_POWERSHELL_YAML_VERSION and AZL_AZ_KEYVAULT_VERSION from it (devops.pipelines.tool_versions.*).
#   Environment     the name in variables/approval-environments.yml (AZL_ENVIRONMENT_ARM_DEPLOYMENT: devops.pipelines.environments.arm_deployment; task 05
#                   lists the value to write there): Approvals (required reviewers) and an Exclusive lock. Task 04 of the CI/CD setup creates it from
#                   devops.environments. A deployment job to an environment with no approval check runs without one, which is why the name is not a
#                   run parameter (Learn: a template expression sees only the variables of the YAML files).
#   Settings file   the deployment values are not run parameters: the pool, the service connection, the variable group and the file paths are
#                   compile-time variables of variables/pipeline-settings.yml, generated from infrastructure.yml (D126). Learn: the pool of a job
#                   and a service connection take template expressions, and ${{ variables.name }} sees the variables of the YAML files
#                   (https://learn.microsoft.com/azure/devops/pipelines/process/template-expressions). So no run form asks for them, and a
#                   scheduled run needs none.
#
# Where the files come from: the master file is a path in this repository (AZL_INFRASTRUCTURE_FILE: devops.pipelines.infrastructure_file).
# The OS configuration report is the artifact os-configuration-report of an OS configuration pipeline run (os_configuration_pipeline_id and
# os_configuration_run_id) or a repository path (os_configuration_report). The ZTP handoff file is optional (handoff_file).
name: pre-cluster-verification-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# lockBehavior does not queue runs by itself. Learn: it only says how runs behave when they meet an Exclusive lock check (sequential: every run waits its turn;
# runLatest, the default: only the latest run goes on), and a stage that sets it gets a lock of its own (https://learn.microsoft.com/azure/devops/pipelines/process/approvals#exclusive-lock).
# Here the result of a run replaces the one before, so each stage below sets lockBehavior: sequential too: two runs of the same stage never run together, and the second waits.
# At the pipeline level it also makes the Exclusive lock check on the approval environment queue the runs instead of cancelling the older ones.
lockBehavior: sequential

parameters:
  - name: mode
    displayName: 'Plan: what would be checked (offline). Verify: run every check and write the result the ARM run reads'
    type: string
    default: Plan
    values:
      - Plan
      - Verify
  - name: os_configuration_pipeline_id
    displayName: 'Optional: ID of the OS configuration pipeline whose artifact os-configuration-report holds the report (with os_configuration_run_id; none to skip)'
    type: string
    default: none
  - name: os_configuration_run_id
    displayName: 'Optional: run ID of that OS configuration pipeline (none to skip)'
    type: string
    default: none
  - name: os_configuration_report
    displayName: 'Repository path of an OS configuration report directory or report.json, used when no run is given (none to skip)'
    type: string
    default: none
  - name: handoff_file
    displayName: 'Repository path of the ZTP handoff file (none to skip)'
    type: string
    default: none
  - name: accept_skipped
    displayName: 'Ids of checks that may stay Skipped, comma separated (for example IDN-002,IDN-003). The report records that you accepted them (none to skip)'
    type: string
    default: none
  - name: allow_revalidate
    displayName: 'Accept that the Validate runs again on an instance whose deployment failed (give the same switch to the ARM run)'
    type: boolean
    default: false
  - name: fix
    displayName: 'Verify only: register the mandatory resource providers that are not registered (Azure side only; needs the approval of the environment)'
    type: boolean
    default: false
  - name: install_environment_checker
    displayName: 'Verify only: install the Environment Checker on the nodes for this run and remove it again (needs the approval of the environment)'
    type: boolean
    default: false

variables:
  # AZL_AGENT_POOL, AZL_SERVICE_CONNECTION, AZL_INFRASTRUCTURE_FILE, AZL_HANDOFF_PATH and the variable group: generated from infrastructure.yml, bound at compile time.
  - template: variables/pipeline-settings.yml
  # AZL_ENVIRONMENT_ARM_DEPLOYMENT: the approval environment, bound at compile time (not a run parameter).
  - template: variables/approval-environments.yml
  - name: preClusterScript
    value: scripts/deploy/04-cluster-deployment/phase-05-cluster-deployment/Invoke-AzureLocalPreClusterVerification.ps1

stages:
  # ---------------------------------------------------------------------------------------------------------------------------
  - ${{ if and(not(parameters.fix), not(parameters.install_environment_checker)) }}:
      - stage: Verify
        displayName: 'Verify (read only)'
        lockBehavior: sequential
        jobs:
          - job: Verify
            displayName: 'Verify (read only)'
            pool:
              name: ${{ variables.AZL_AGENT_POOL }}
              demands:
                - pwsh
            # Read-only checks that make no long wait: the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 30
            steps:
              - checkout: self

              - ${{ if and(ne(parameters.os_configuration_pipeline_id, 'none'), ne(parameters.os_configuration_run_id, 'none')) }}:
                  - task: DownloadPipelineArtifact@2
                    displayName: 'Fetch the OS configuration report'
                    inputs:
                      source: specific
                      project: $(System.TeamProjectId)
                      pipeline: ${{ parameters.os_configuration_pipeline_id }}
                      runVersion: specific
                      runId: ${{ parameters.os_configuration_run_id }}
                      artifact: os-configuration-report
                      path: $(Pipeline.Workspace)/os-configuration-report

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
                  foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                displayName: 'Install the PowerShell modules (devops.pipelines.tool_versions)'

              - task: AzurePowerShell@5
                displayName: 'Verify'
                inputs:
                  azureSubscription: ${{ variables.AZL_SERVICE_CONNECTION }}
                  azurePowerShellVersion: OtherVersion
                  preferredAzurePowerShellVersion: $(AZL_AZ_POWERSHELL_VERSION)
                  pwsh: true
                  ScriptType: InlineScript
                  workingDirectory: $(Build.SourcesDirectory)
                  Inline: |
                    Set-StrictMode -Version Latest
                    $ErrorActionPreference = 'Stop'
                    $p = @{ InfrastructureFile = $env:GATE_INFRASTRUCTURE_FILE; Mode = $env:GATE_MODE; PassThru = $true }
                    if ($env:GATE_OS_REPORT -and $env:GATE_OS_REPORT -ne 'none') { $p.OsConfigurationReport = $env:GATE_OS_REPORT }
                    if ($env:GATE_HANDOFF_FILE -and $env:GATE_HANDOFF_FILE -ne 'none') { $p.HandoffFile = $env:GATE_HANDOFF_FILE }
                    if ($env:GATE_ACCEPT_SKIPPED -and $env:GATE_ACCEPT_SKIPPED -ne 'none') { $p.AcceptSkipped = @($env:GATE_ACCEPT_SKIPPED -split '[,;\s]+' | Where-Object { $_ }) }
                    if ($env:GATE_ALLOW_REVALIDATE -eq 'true') { $p.AllowRevalidate = $true }
                    $result = @(& $env:GATE_SCRIPT @p) | Where-Object { $_ -and $_.PSObject.Properties['ReportDirectory'] } | Select-Object -Last 1
                    $code = $LASTEXITCODE
                    # a copy of what the script wrote, where it wrote it, for the artifact and the run summary
                    New-Item -ItemType Directory -Path $env:GATE_ARTIFACT_DIRECTORY -Force | Out-Null
                    if ($result -and (Test-Path -LiteralPath $result.ReportDirectory -PathType Container)) { Get-ChildItem -LiteralPath $result.ReportDirectory -File | Copy-Item -Destination $env:GATE_ARTIFACT_DIRECTORY -Force }
                    $summary = Join-Path $env:GATE_ARTIFACT_DIRECTORY 'summary.md'
                    if (Test-Path -LiteralPath $summary) { Write-Output "##vso[task.uploadsummary]$summary" }
                    if ($code -ne 0) { throw "Invoke-AzureLocalPreClusterVerification.ps1 exited with code $code." }
                env:
                  GATE_SCRIPT: $(preClusterScript)
                  GATE_INFRASTRUCTURE_FILE: ${{ variables.AZL_INFRASTRUCTURE_FILE }}
                  GATE_MODE: ${{ parameters.mode }}
                  GATE_OS_REPORT: ${{ iif(and(ne(parameters.os_configuration_pipeline_id, 'none'), ne(parameters.os_configuration_run_id, 'none')), '$(Pipeline.Workspace)/os-configuration-report', parameters.os_configuration_report) }}
                  GATE_HANDOFF_FILE: ${{ parameters.handoff_file }}
                  GATE_ACCEPT_SKIPPED: ${{ parameters.accept_skipped }}
                  GATE_ALLOW_REVALIDATE: ${{ parameters.allow_revalidate }}
                  GATE_ARTIFACT_DIRECTORY: $(Build.ArtifactStagingDirectory)/pre-cluster-verification

              - task: PublishPipelineArtifact@1
                displayName: 'Publish the verification report and the event feed'
                condition: always()
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/pre-cluster-verification
                  artifact: pre-cluster-verification
                  publishLocation: pipeline

  # ---------------------------------------------------------------------------------------------------------------------------
  # A change was asked for, but no approval environment is set in variables/approval-environments.yml: nothing is changed, and the run says why.
  - ${{ if and(or(parameters.fix, parameters.install_environment_checker), eq(variables.AZL_ENVIRONMENT_ARM_DEPLOYMENT, '')) }}:
      - stage: ApprovalEnvironmentNotSet
        displayName: 'Verify with changes: no approval environment is set'
        jobs:
          - job: Refuse
            displayName: 'Refuse: no approval environment is set'
            pool:
              name: ${{ variables.AZL_AGENT_POOL }}
              demands:
                - pwsh
            # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 5
            steps:
              - pwsh: |
                  Write-Error 'fix and install_environment_checker change a system, so they run only behind the approval environment. Set AZL_ENVIRONMENT_ARM_DEPLOYMENT (devops.pipelines.environments.arm_deployment) in pipelines/azure-devops/variables/approval-environments.yml, then run again. Nothing was changed.'
                  exit 1
                displayName: 'No approval environment is set: nothing is changed'

  # ---------------------------------------------------------------------------------------------------------------------------
  - ${{ if and(or(parameters.fix, parameters.install_environment_checker), ne(variables.AZL_ENVIRONMENT_ARM_DEPLOYMENT, '')) }}:
      - stage: VerifyWithChanges
        displayName: 'Verify with changes (needs approval)'
        lockBehavior: sequential
        jobs:
          - deployment: VerifyWithChanges
            displayName: 'Verify with changes'
            pool:
              name: ${{ variables.AZL_AGENT_POOL }}
              demands:
                - pwsh
            # Required reviewers on this environment are the approval gate. The name is a variable of a YAML file of the repository, so the queuer cannot choose it.
            environment: ${{ variables.AZL_ENVIRONMENT_ARM_DEPLOYMENT }}
            # The checks, and a wait for the resource provider registration: the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 60
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self

                    - ${{ if and(ne(parameters.os_configuration_pipeline_id, 'none'), ne(parameters.os_configuration_run_id, 'none')) }}:
                        - task: DownloadPipelineArtifact@2
                          displayName: 'Fetch the OS configuration report'
                          inputs:
                            source: specific
                            project: $(System.TeamProjectId)
                            pipeline: ${{ parameters.os_configuration_pipeline_id }}
                            runVersion: specific
                            runId: ${{ parameters.os_configuration_run_id }}
                            artifact: os-configuration-report
                            path: $(Pipeline.Workspace)/os-configuration-report

                    - pwsh: |
                        $ErrorActionPreference = 'Stop'
                        $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
                        foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                      displayName: 'Install the PowerShell modules (devops.pipelines.tool_versions)'

                    - task: AzurePowerShell@5
                      displayName: 'Verify with changes'
                      inputs:
                        azureSubscription: ${{ variables.AZL_SERVICE_CONNECTION }}
                        azurePowerShellVersion: OtherVersion
                        preferredAzurePowerShellVersion: $(AZL_AZ_POWERSHELL_VERSION)
                        pwsh: true
                        ScriptType: InlineScript
                        workingDirectory: $(Build.SourcesDirectory)
                        Inline: |
                          Set-StrictMode -Version Latest
                          $ErrorActionPreference = 'Stop'
                          $p = @{ InfrastructureFile = $env:GATE_INFRASTRUCTURE_FILE; Mode = $env:GATE_MODE; PassThru = $true }
                          if ($env:GATE_OS_REPORT -and $env:GATE_OS_REPORT -ne 'none') { $p.OsConfigurationReport = $env:GATE_OS_REPORT }
                          if ($env:GATE_HANDOFF_FILE -and $env:GATE_HANDOFF_FILE -ne 'none') { $p.HandoffFile = $env:GATE_HANDOFF_FILE }
                          if ($env:GATE_ACCEPT_SKIPPED -and $env:GATE_ACCEPT_SKIPPED -ne 'none') { $p.AcceptSkipped = @($env:GATE_ACCEPT_SKIPPED -split '[,;\s]+' | Where-Object { $_ }) }
                          if ($env:GATE_ALLOW_REVALIDATE -eq 'true') { $p.AllowRevalidate = $true }
                          # the two changes the reviewer approved: the resource providers (Azure side), and the Environment Checker on the nodes for this run
                          if ($env:GATE_FIX -eq 'true') { $p.Fix = $true }
                          if ($env:GATE_INSTALL_ENVIRONMENT_CHECKER -eq 'true') { $p.InstallEnvironmentChecker = $true }
                          $result = @(& $env:GATE_SCRIPT @p) | Where-Object { $_ -and $_.PSObject.Properties['ReportDirectory'] } | Select-Object -Last 1
                          $code = $LASTEXITCODE
                          New-Item -ItemType Directory -Path $env:GATE_ARTIFACT_DIRECTORY -Force | Out-Null
                          if ($result -and (Test-Path -LiteralPath $result.ReportDirectory -PathType Container)) { Get-ChildItem -LiteralPath $result.ReportDirectory -File | Copy-Item -Destination $env:GATE_ARTIFACT_DIRECTORY -Force }
                          $summary = Join-Path $env:GATE_ARTIFACT_DIRECTORY 'summary.md'
                          if (Test-Path -LiteralPath $summary) { Write-Output "##vso[task.uploadsummary]$summary" }
                          if ($code -ne 0) { throw "Invoke-AzureLocalPreClusterVerification.ps1 exited with code $code." }
                      env:
                        GATE_SCRIPT: $(preClusterScript)
                        GATE_INFRASTRUCTURE_FILE: ${{ variables.AZL_INFRASTRUCTURE_FILE }}
                        GATE_MODE: ${{ parameters.mode }}
                        GATE_OS_REPORT: ${{ iif(and(ne(parameters.os_configuration_pipeline_id, 'none'), ne(parameters.os_configuration_run_id, 'none')), '$(Pipeline.Workspace)/os-configuration-report', parameters.os_configuration_report) }}
                        GATE_HANDOFF_FILE: ${{ parameters.handoff_file }}
                        GATE_ACCEPT_SKIPPED: ${{ parameters.accept_skipped }}
                        GATE_ALLOW_REVALIDATE: ${{ parameters.allow_revalidate }}
                        GATE_FIX: ${{ parameters.fix }}
                        GATE_INSTALL_ENVIRONMENT_CHECKER: ${{ parameters.install_environment_checker }}
                        GATE_ARTIFACT_DIRECTORY: $(Build.ArtifactStagingDirectory)/pre-cluster-verification

                    - task: PublishPipelineArtifact@1
                      displayName: 'Publish the verification report and the event feed'
                      condition: always()
                      inputs:
                        targetPath: $(Build.ArtifactStagingDirectory)/pre-cluster-verification
                        artifact: pre-cluster-verification
                        publishLocation: pipeline
