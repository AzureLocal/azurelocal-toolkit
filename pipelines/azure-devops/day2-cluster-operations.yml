# Azure Local day 2: cluster operations (health check, alerts, capacity, maintenance mode, live migration, volume rebalance), Azure DevOps.
#
# Create a pipeline from this file (Pipelines > New pipeline > Existing Azure Pipelines YAML file). It runs the command an operator runs by hand (stage 08,
# task 04) and nothing else; the logic is in the script, not here. PowerShell 7 only.
#   scripts/deploy/08-day2-operations/task-04-cluster-operations/powershell/Invoke-ClusterOperations.ps1
# One action per run. The script connects to the cluster over PowerShell remoting as the account the agent runs as, which must be an administrator of the
# cluster; no Azure sign-in and no password is used.
#
# Stages (exactly one path runs, chosen by the parameter action)
#   ReadOnly  HealthCheck, Alerts, Capacity. They only read, so there is no approval environment. The run FAILS when HealthCheck or Alerts finds something
#             wrong (exit code 1): that failure is the alert, and the report is published as an artifact even then.
#   Plan      MaintenanceMode, LiveMigrate, Rebalance, first. Read only: the same script with -WhatIf, which prints what would be done and changes nothing.
#             When it fails (a node that the file does not list, no node) the next stage does not start.
#   Apply     The same action for real, as a deployment job in the approval environment (add an Approvals check to it). MaintenanceMode with enable puts the
#             node into maintenance (suspend, drain, remove from the virtual machine configuration); without enable the node leaves maintenance. To reboot a
#             node in one run use day2-node-maintenance.yml. The environment is fixed when the pipeline is compiled (the variable
#             AZL_ENVIRONMENT_OPERATIONS of variables/approval-environments.yml), never a run parameter: whoever queues the run cannot pick an environment
#             that has no approval. While the variable is empty, the stage ApprovalEnvironmentNotSet fails and nothing is changed.
# The node is checked against nodes[] of the master file: with a node the script is given -RequireNodeInFile, so a name or an address that the file does not
# list ends the run with exit code 2 before anything is sent to the cluster.
#
# One change at a time. The update, the node maintenance, the changing operations and the storage performance test deploy to the same environment, and the
# Exclusive lock check of that environment keeps two of them from running on the cluster together; each Apply stage also sets lockBehavior: sequential.
#
# What to configure in the organization (names only; no value of any ID, password or key is in this file). Task 05 of the CI/CD setup writes every value below into variables/pipeline-settings.yml and variables/approval-environments.yml (Set-CicdVariables.ps1, from infrastructure.yml; commit both in a pull request).
#   Agent pool      a self-hosted pool (AZL_AGENT_POOL: devops.runners[].pool of the general runner) with PowerShell 7 (pwsh) and a route to the cluster
#                   (WinRM, TCP 5985 or 5986).
#   Variable group  AZL_VARIABLE_GROUP (Pipelines > Library; devops.pipelines.variable_group, the repository group task 05 writes). This file reads
#                   AZL_POWERSHELL_YAML_VERSION from it (devops.pipelines.tool_versions.powershell_yaml).
#   Environment     the name in variables/approval-environments.yml (AZL_ENVIRONMENT_OPERATIONS: devops.pipelines.environments.operations; task 05
#                   lists the value to write there): Approvals (required reviewers) and an Exclusive lock. Task 04 of the CI/CD setup creates it from
#                   devops.environments. A deployment job to an environment with no approval check runs without one, which is why the name is not a run
#                   parameter (Learn: a template expression sees only the variables of the YAML files).
#   Settings file   the deployment values are not run parameters: the pool, the service connection, the variable group and the file paths are
#                   compile-time variables of variables/pipeline-settings.yml, generated from infrastructure.yml (D126). Learn: the pool of a job
#                   and a service connection take template expressions, and ${{ variables.name }} sees the variables of the YAML files
#                   (https://learn.microsoft.com/azure/devops/pipelines/process/template-expressions). So no run form asks for them, and a
#                   scheduled run needs none.
#
# AZL_INFRASTRUCTURE_FILE names a file on the branch the run starts from, so -RequireNodeInFile trusts the infrastructure files of the
# branch the pipeline runs from: keep them under review (a branch policy on the protected default branch) and run changes from that branch.
name: day2-cluster-operations-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

# lockBehavior does not queue runs by itself. Learn: it only says how runs behave when they meet an Exclusive lock check (sequential: every run waits its turn;
# runLatest, the default: only the latest run goes on), and a stage that sets it gets a lock of its own (https://learn.microsoft.com/azure/devops/pipelines/process/approvals#exclusive-lock).
# At the pipeline level it makes the Exclusive lock check on the approval environment queue the runs instead of cancelling the older ones.
lockBehavior: sequential

parameters:
  - name: action
    displayName: 'HealthCheck, Alerts and Capacity only read. MaintenanceMode, LiveMigrate and Rebalance change the cluster and need approval'
    type: string
    default: HealthCheck
    values:
      - HealthCheck
      - Alerts
      - Capacity
      - MaintenanceMode
      - LiveMigrate
      - Rebalance
  - name: node
    displayName: 'MaintenanceMode and LiveMigrate: the node, by its name in nodes[] of the master file (none for the other actions)'
    type: string
    default: none
  - name: enable
    displayName: 'MaintenanceMode: put the node into maintenance (suspend, drain, remove from the virtual machine configuration). Off: the node leaves maintenance'
    type: boolean
    default: false

variables:
  # AZL_AGENT_POOL, AZL_SERVICE_CONNECTION, AZL_INFRASTRUCTURE_FILE, AZL_HANDOFF_PATH and the variable group: generated from infrastructure.yml, bound at compile time.
  - template: variables/pipeline-settings.yml
  # AZL_ENVIRONMENT_OPERATIONS: the approval environment, bound at compile time (not a run parameter).
  - template: variables/approval-environments.yml
  - name: operationsScript
    value: scripts/deploy/08-day2-operations/task-04-cluster-operations/powershell/Invoke-ClusterOperations.ps1

stages:
  # ---------------------------------------------------------------------------------------------------------------------------
  - ${{ if in(parameters.action, 'HealthCheck', 'Alerts', 'Capacity') }}:
      - stage: ReadOnly
        displayName: 'Read only (HealthCheck, Alerts, Capacity)'
        jobs:
          - job: ReadOnly
            displayName: 'Read only'
            pool:
              name: ${{ variables.AZL_AGENT_POOL }}
              demands:
                - pwsh
            # Reads of the cluster over remoting: the toolkit's limit for a read-only check, not a figure from Microsoft.
            timeoutInMinutes: 30
            steps:
              - checkout: self

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
                  foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                displayName: 'Install the PowerShell modules (devops.pipelines.tool_versions)'

              - pwsh: |
                  Set-StrictMode -Version Latest
                  $ErrorActionPreference = 'Stop'
                  New-Item -ItemType Directory -Path $env:OPERATIONS_LOG_DIRECTORY -Force | Out-Null
                  $p = @{ InfrastructureFile = $env:OPERATIONS_INFRASTRUCTURE_FILE; Action = $env:OPERATIONS_ACTION; OutputPath = "$env:OPERATIONS_LOG_DIRECTORY/result.json"; LogPath = "$env:OPERATIONS_LOG_DIRECTORY/run.log" }
                  & $env:OPERATIONS_SCRIPT @p
                  $code = $LASTEXITCODE
                  $log = "$env:OPERATIONS_LOG_DIRECTORY/run.log"
                  if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
                  if ($code -ne 0) { throw "Invoke-ClusterOperations.ps1 exited with code $code." }
                displayName: 'Run the action'
                workingDirectory: $(Build.SourcesDirectory)
                env:
                  OPERATIONS_SCRIPT: $(operationsScript)
                  OPERATIONS_INFRASTRUCTURE_FILE: ${{ variables.AZL_INFRASTRUCTURE_FILE }}
                  OPERATIONS_ACTION: ${{ parameters.action }}
                  OPERATIONS_LOG_DIRECTORY: $(Build.ArtifactStagingDirectory)/day2-cluster-operations

              - task: PublishPipelineArtifact@1
                displayName: 'Publish the result'
                condition: always()
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/day2-cluster-operations
                  artifact: day2-cluster-operations
                  publishLocation: pipeline

  # ---------------------------------------------------------------------------------------------------------------------------
  - ${{ if in(parameters.action, 'MaintenanceMode', 'LiveMigrate', 'Rebalance') }}:
      - stage: Plan
        displayName: 'Plan the change (read only)'
        jobs:
          - job: Plan
            displayName: 'Plan the change (read only)'
            pool:
              name: ${{ variables.AZL_AGENT_POOL }}
              demands:
                - pwsh
            # The script with -WhatIf reads the cluster and changes nothing: the toolkit's limit for a read-only check, not a figure from Microsoft.
            timeoutInMinutes: 30
            steps:
              - checkout: self

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
                  foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                displayName: 'Install the PowerShell modules (devops.pipelines.tool_versions)'

              - pwsh: |
                  Set-StrictMode -Version Latest
                  $ErrorActionPreference = 'Stop'
                  New-Item -ItemType Directory -Path $env:OPERATIONS_LOG_DIRECTORY -Force | Out-Null
                  $p = @{ InfrastructureFile = $env:OPERATIONS_INFRASTRUCTURE_FILE; Action = $env:OPERATIONS_ACTION; OutputPath = "$env:OPERATIONS_LOG_DIRECTORY/plan.json"; LogPath = "$env:OPERATIONS_LOG_DIRECTORY/plan.log"; WhatIf = $true }
                  if ($env:OPERATIONS_NODE -and $env:OPERATIONS_NODE -ne 'none') { $p.NodeName = $env:OPERATIONS_NODE; $p.RequireNodeInFile = $true }
                  if ($env:OPERATIONS_ENABLE -eq 'true') { $p.Enable = $true }
                  & $env:OPERATIONS_SCRIPT @p
                  $code = $LASTEXITCODE
                  $log = "$env:OPERATIONS_LOG_DIRECTORY/plan.log"
                  if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
                  if ($code -ne 0) { throw "Invoke-ClusterOperations.ps1 exited with code $code." }
                displayName: 'Plan (nothing is changed)'
                workingDirectory: $(Build.SourcesDirectory)
                env:
                  OPERATIONS_SCRIPT: $(operationsScript)
                  OPERATIONS_INFRASTRUCTURE_FILE: ${{ variables.AZL_INFRASTRUCTURE_FILE }}
                  OPERATIONS_ACTION: ${{ parameters.action }}
                  OPERATIONS_NODE: ${{ parameters.node }}
                  OPERATIONS_ENABLE: ${{ parameters.enable }}
                  OPERATIONS_LOG_DIRECTORY: $(Build.ArtifactStagingDirectory)/day2-cluster-operations

              - task: PublishPipelineArtifact@1
                displayName: 'Publish the plan'
                condition: always()
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/day2-cluster-operations
                  artifact: day2-cluster-operations-plan
                  publishLocation: pipeline

  # ---------------------------------------------------------------------------------------------------------------------------
  # A change was asked for, but no approval environment is set in variables/approval-environments.yml: nothing is changed, and the run says why.
  - ${{ if and(in(parameters.action, 'MaintenanceMode', 'LiveMigrate', 'Rebalance'), eq(variables.AZL_ENVIRONMENT_OPERATIONS, '')) }}:
      - stage: ApprovalEnvironmentNotSet
        displayName: 'Apply: no approval environment is set'
        dependsOn: Plan
        jobs:
          - job: Refuse
            displayName: 'Refuse: no approval environment is set'
            pool:
              name: ${{ variables.AZL_AGENT_POOL }}
              demands:
                - pwsh
            # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 5
            steps:
              - pwsh: |
                  Write-Error 'MaintenanceMode, LiveMigrate and Rebalance change the cluster, so they run only behind the approval environment. Set AZL_ENVIRONMENT_OPERATIONS (devops.pipelines.environments.operations) in pipelines/azure-devops/variables/approval-environments.yml, then run again. Nothing was changed.'
                  exit 1
                displayName: 'No approval environment is set: nothing is changed'

  # ---------------------------------------------------------------------------------------------------------------------------
  - ${{ if and(in(parameters.action, 'MaintenanceMode', 'LiveMigrate', 'Rebalance'), ne(variables.AZL_ENVIRONMENT_OPERATIONS, '')) }}:
      - stage: Apply
        displayName: 'Apply the change (needs approval)'
        dependsOn: Plan
        lockBehavior: sequential
        jobs:
          - deployment: Apply
            displayName: 'Apply'
            pool:
              name: ${{ variables.AZL_AGENT_POOL }}
              demands:
                - pwsh
            # Required reviewers on this environment are the approval gate. The name is a variable of a YAML file of the repository, so the queuer cannot choose it.
            environment: ${{ variables.AZL_ENVIRONMENT_OPERATIONS }}
            # A drain or a volume move waits for the cluster (no limit in the script): the toolkit's limit, not a figure from Microsoft.
            timeoutInMinutes: 240
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self

                    - pwsh: |
                        $ErrorActionPreference = 'Stop'
                        $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
                        foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                      displayName: 'Install the PowerShell modules (devops.pipelines.tool_versions)'

                    - pwsh: |
                        Set-StrictMode -Version Latest
                        $ErrorActionPreference = 'Stop'
                        New-Item -ItemType Directory -Path $env:OPERATIONS_LOG_DIRECTORY -Force | Out-Null
                        $p = @{ InfrastructureFile = $env:OPERATIONS_INFRASTRUCTURE_FILE; Action = $env:OPERATIONS_ACTION; OutputPath = "$env:OPERATIONS_LOG_DIRECTORY/result.json"; LogPath = "$env:OPERATIONS_LOG_DIRECTORY/apply.log" }
                        # the one change the reviewer approved: the action, on the node of the file
                        if ($env:OPERATIONS_NODE -and $env:OPERATIONS_NODE -ne 'none') { $p.NodeName = $env:OPERATIONS_NODE; $p.RequireNodeInFile = $true }
                        if ($env:OPERATIONS_ENABLE -eq 'true') { $p.Enable = $true }
                        & $env:OPERATIONS_SCRIPT @p
                        $code = $LASTEXITCODE
                        $log = "$env:OPERATIONS_LOG_DIRECTORY/apply.log"
                        if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
                        if ($code -ne 0) { throw "Invoke-ClusterOperations.ps1 exited with code $code." }
                      displayName: 'Change the cluster'
                      workingDirectory: $(Build.SourcesDirectory)
                      env:
                        OPERATIONS_SCRIPT: $(operationsScript)
                        OPERATIONS_INFRASTRUCTURE_FILE: ${{ variables.AZL_INFRASTRUCTURE_FILE }}
                        OPERATIONS_ACTION: ${{ parameters.action }}
                        OPERATIONS_NODE: ${{ parameters.node }}
                        OPERATIONS_ENABLE: ${{ parameters.enable }}
                        OPERATIONS_LOG_DIRECTORY: $(Build.ArtifactStagingDirectory)/day2-cluster-operations

                    - task: PublishPipelineArtifact@1
                      displayName: 'Publish the log'
                      condition: always()
                      inputs:
                        targetPath: $(Build.ArtifactStagingDirectory)/day2-cluster-operations
                        artifact: day2-cluster-operations-log
                        publishLocation: pipeline
