# Azure Local day 2: check for updates (read only), Azure DevOps.
#
# Create a pipeline from this file (Pipelines > New pipeline > Existing Azure Pipelines YAML file). It runs the command an operator runs by hand (stage 08,
# task 01) and nothing else; the logic is in the script, not here. PowerShell 7 only.
#   azure    scripts/deploy/08-day2-operations/task-01-check-for-updates/azurecli/Get-AvailableSolutionUpdate.azcli.ps1 (AzureCLI@2, pscore)
#            What Azure shows for the cluster resource (the update summary and the updates), with the Azure CLI. It needs no access to a node.
#   cluster  scripts/deploy/08-day2-operations/task-01-check-for-updates/powershell/Get-AvailableSolutionUpdate.ps1
#            What the update service on the cluster has discovered, over PowerShell remoting, as the account the agent runs as. It signs in to nothing.
# Nothing in this run changes the cluster, Azure or a node, so there is no approval environment. It starts no update: that is day2-update.yml.
#
# The run FAILS when the check says the cluster needs attention (exit code 1: an update in a failed state, a health state of Failure, Error or Warning, a
# failed update environment, or the cluster could not be read; 2: a value of the file is missing). That failure is the alert: Azure DevOps sends its build
# failure notification (Project settings > Notifications). An update that is merely offered ends with exit code 0: read the verdict in the log and the
# report (the build artifact day2-update-check).
#
# The schedule (owner directive D74: check for updates on a schedule) is NOT in this sample, and that is a limit of the platform, not an omission. Learn:
# a scheduled run cannot use pipeline variables, and it cannot be asked for a parameter. The pool, the service connection, the variable group and the file
# path are run parameters with no default here (devops.* values are never written in a pipeline file), so a scheduled run would fail at once for want of
# them. To schedule it, copy this file, give each of the four parameters of your deployment as its default, and add the block below with the value of the key
# devops.pipelines.schedules.check_for_updates of infrastructure.yml (a five-field cron expression in UTC; task 05 of the CI/CD setup prints it). Schedules
# defined in the pipeline's Triggers settings take precedence over YAML schedules
# (https://learn.microsoft.com/azure/devops/pipelines/process/scheduled-triggers).
#   schedules:
#     - cron: '17 4 * * *'
#       displayName: Check for updates
#       branches:
#         include: ['*']
#       always: true
# GitHub Actions and GitLab CI run the same check on a schedule without a copy: their pipelines read the deployment values from variables.
#
# What to configure in the organization (names only; no value of any ID, password or key is in this file). Task 05 of the CI/CD setup lists the value of every
# run parameter to enter.
#   Agent pool      a self-hosted pool (parameter agent_pool: devops.runners[].pool of the general runner) with PowerShell 7 (pwsh). Source azure also
#                   needs the Azure CLI. Source cluster needs a route to the cluster (WinRM, TCP 5985 or 5986) and an agent account that may read the update
#                   state of the cluster.
#   Service conn.   the Azure Resource Manager service connection of the parameter service_connection (devops.pipelines.service_connection; task 05
#                   creates it), workload identity federation, with Azure Stack HCI Administrator or Reader on the cluster resource. Only source azure uses it.
#   Variable group  parameter variable_group (Pipelines > Library; devops.pipelines.variable_group, the group task 05 writes). This file reads
#                   AZL_POWERSHELL_YAML_VERSION from it (devops.pipelines.tool_versions.powershell_yaml).
#   Why parameters  the pool of a job is not a task input. Learn says a macro variable $(name) is expanded only in task inputs, and that other keywords take
#                   template expressions or runtime parameters
#                   (https://learn.microsoft.com/azure/devops/pipelines/process/variables#understand-variable-syntax). So the pool, the service connection,
#                   the variable group and the file path are runtime parameters (${{ parameters.name }}) with no default: the run form asks for them.
name: day2-check-updates-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

parameters:
  - name: infrastructure_file
    displayName: 'Path of the master infrastructure.yml in the repository. Enter devops.pipelines.infrastructure_file'
    type: string
  - name: source
    displayName: 'azure: what Azure shows for the cluster resource (Azure CLI, no node access). cluster: what the update service on the cluster has discovered (PowerShell remoting)'
    type: string
    default: azure
    values:
      - azure
      - cluster
  - name: agent_pool
    displayName: 'Self-hosted agent pool (PowerShell 7). Enter devops.runners[].pool of the general runner'
    type: string
  - name: service_connection
    displayName: 'Azure Resource Manager service connection. Enter devops.pipelines.service_connection'
    type: string
  - name: variable_group
    displayName: 'Variable group of the pipeline (Pipelines > Library). Enter devops.pipelines.variable_group (with environments, <name>-<environment>)'
    type: string

variables:
  - group: ${{ parameters.variable_group }}
  - name: checkAzureScript
    value: scripts/deploy/08-day2-operations/task-01-check-for-updates/azurecli/Get-AvailableSolutionUpdate.azcli.ps1
  - name: checkClusterScript
    value: scripts/deploy/08-day2-operations/task-01-check-for-updates/powershell/Get-AvailableSolutionUpdate.ps1

stages:
  # ---------------------------------------------------------------------------------------------------------------------------
  - ${{ if ne(parameters.source, 'cluster') }}:
      - stage: CheckAzure
        displayName: 'Check for updates, Azure view (read only)'
        jobs:
          - job: CheckAzure
            displayName: 'Check for updates, Azure view (read only)'
            pool:
              name: ${{ parameters.agent_pool }}
              demands:
                - pwsh
            # Two read calls of Azure and a file: the toolkit's limit for a read-only check, not a figure from Microsoft.
            timeoutInMinutes: 15
            steps:
              - checkout: self

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
                  foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                displayName: 'Install the PowerShell modules (devops.pipelines.tool_versions)'

              - task: AzureCLI@2
                displayName: 'Check for updates (Azure)'
                inputs:
                  azureSubscription: ${{ parameters.service_connection }}
                  scriptType: pscore
                  scriptLocation: inlineScript
                  workingDirectory: $(Build.SourcesDirectory)
                  inlineScript: |
                    Set-StrictMode -Version Latest
                    $ErrorActionPreference = 'Stop'
                    $p = @{ InfrastructureFile = $env:CHECK_INFRASTRUCTURE_FILE; OutputPath = "$env:CHECK_REPORT_DIRECTORY/update-check.json" }
                    & $env:CHECK_SCRIPT @p
                    $code = $LASTEXITCODE
                    if ($code -ne 0) { throw "Get-AvailableSolutionUpdate.azcli.ps1 exited with code $code." }
                env:
                  CHECK_SCRIPT: $(checkAzureScript)
                  CHECK_INFRASTRUCTURE_FILE: ${{ parameters.infrastructure_file }}
                  CHECK_REPORT_DIRECTORY: $(Build.ArtifactStagingDirectory)/day2-update-check

              - task: PublishPipelineArtifact@1
                displayName: 'Publish the update check report'
                condition: always()
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/day2-update-check
                  artifact: day2-update-check
                  publishLocation: pipeline

  # ---------------------------------------------------------------------------------------------------------------------------
  - ${{ if eq(parameters.source, 'cluster') }}:
      - stage: CheckCluster
        displayName: 'Check for updates, cluster view (read only)'
        jobs:
          - job: CheckCluster
            displayName: 'Check for updates, cluster view (read only)'
            pool:
              name: ${{ parameters.agent_pool }}
              demands:
                - pwsh
            # One read of the update service over remoting: the toolkit's limit for a read-only check, not a figure from Microsoft.
            timeoutInMinutes: 15
            steps:
              - checkout: self

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
                  foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }
                displayName: 'Install the PowerShell modules (devops.pipelines.tool_versions)'

              - pwsh: |
                  Set-StrictMode -Version Latest
                  $ErrorActionPreference = 'Stop'
                  $p = @{ InfrastructureFile = $env:CHECK_INFRASTRUCTURE_FILE; OutputPath = "$env:CHECK_REPORT_DIRECTORY/update-check.json" }
                  & $env:CHECK_SCRIPT @p
                  $code = $LASTEXITCODE
                  if ($code -ne 0) { throw "Get-AvailableSolutionUpdate.ps1 exited with code $code." }
                displayName: 'Check for updates (cluster)'
                workingDirectory: $(Build.SourcesDirectory)
                env:
                  CHECK_SCRIPT: $(checkClusterScript)
                  CHECK_INFRASTRUCTURE_FILE: ${{ parameters.infrastructure_file }}
                  CHECK_REPORT_DIRECTORY: $(Build.ArtifactStagingDirectory)/day2-update-check

              - task: PublishPipelineArtifact@1
                displayName: 'Publish the update check report'
                condition: always()
                inputs:
                  targetPath: $(Build.ArtifactStagingDirectory)/day2-update-check
                  artifact: day2-update-check
                  publishLocation: pipeline
