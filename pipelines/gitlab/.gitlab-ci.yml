# =============================================================================
# GitLab CI/CD Pipeline — Azure Local Deployment
# =============================================================================
# Master pipeline definition for automated Azure Local deployments.
# Stages execute sequentially with manual approval gates between phases.
#
# Requirements (no value is in this file: task 05 of the CI/CD setup sets every variable below from infrastructure.yml as a project CI/CD
# variable; tags: and environment:name expand CI/CD variables, https://docs.gitlab.com/ci/variables/where_variables_can_be_used/):
#   - Self-hosted GitLab Runner with network access to on-premises nodes, with the tag AZL_RUNNER_LABEL (devops.pipelines.runner_label).
#   - ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID (azure.automation_identity, azure.tenant_id, azure.subscription_id) and
#     AZL_AUTH_METHOD (devops.authentication.method): oidc signs in with the GitLab ID token ARM_OIDC_TOKEN below (the federated credential
#     made by task 01), client_secret with the masked variable ARM_CLIENT_SECRET (task 05 reads it from Key Vault).
#   - AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT (devops.pipelines.environments.terraform_deployment), AZL_INFRASTRUCTURE_FILE
#     (devops.pipelines.infrastructure_file).
#   - Terraform state: TF_BACKEND_RG, TF_BACKEND_SA, TF_BACKEND_CONTAINER and TF_BACKEND_KEY (devops.state.resource_group, storage_account,
#     container and azure_local_key), the same four the Azure DevOps and GitHub pipelines use.
#   - Tool versions: AZL_TERRAFORM_VERSION, AZL_PYTHON_VERSION, AZL_ANSIBLE_CORE_VERSION, AZL_ANSIBLE_LINT_VERSION and
#     AZL_POWERSHELL_YAML_VERSION (devops.pipelines.tool_versions.*). Each job makes them its own with pipelines/gitlab/Use-AzlGitLabTool.ps1.
#   - PowerShell 7 on the runner. Every job script is a pwsh block.
# The Terraform variables and the Ansible inventory are written in each job by config/variables/scripts/New-IacVariableFiles.ps1 from the
# infrastructure file, into IAC_DIRECTORY outside the checkout (they hold subscription IDs and names: never an artifact, removed after the job).
# =============================================================================

stages:
  - validate
  - plan
  - deploy-foundation
  - configure-onprem
  - configure-operations
  - validate-deployment

variables:
  TF_ROOT: "${CI_PROJECT_DIR}/src/terraform/environments/azure-local"
  ANSIBLE_ROOT: "${CI_PROJECT_DIR}/src/ansible"
  ANSIBLE_HOST_KEY_CHECKING: "False"
  IAC_DIRECTORY: "${CI_BUILDS_DIR}/azl-iac-${CI_JOB_ID}"

# Global defaults
default:
  tags:
    - ${AZL_RUNNER_LABEL}
  # OIDC: GitLab issues a token the Azure app registration trusts (federated credential, audience api://AzureADTokenExchange). Terraform reads
  # ARM_OIDC_TOKEN; the jobs use it only when AZL_AUTH_METHOD is oidc.
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  after_script:
    - pwsh -NoProfile -Command 'if ($env:IAC_DIRECTORY -and (Test-Path -LiteralPath $env:IAC_DIRECTORY)) { Remove-Item -LiteralPath $env:IAC_DIRECTORY -Recurse -Force }'

include:
  - local: 'pipelines/gitlab/stages/validate.yml'
  - local: 'pipelines/gitlab/stages/deploy-foundation.yml'
  - local: 'pipelines/gitlab/stages/configure-onprem.yml'
  - local: 'pipelines/gitlab/stages/configure-operations.yml'
  - local: 'pipelines/gitlab/stages/validate-deployment.yml'
  - local: 'pipelines/gitlab/stages/deploy-cicd-infra.yml'
