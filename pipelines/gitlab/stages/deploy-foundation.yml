# =============================================================================
# Stage: Deploy Foundation — Terraform Apply (Azure resources)
# =============================================================================

terraform:apply:
  stage: deploy-foundation
  script:
    - cd "${TF_ROOT}"
    - terraform init
    - terraform apply -auto-approve -input=false tfplan
  dependencies:
    - terraform:plan
  environment:
    name: ${AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT} # a project CI/CD variable set by task 05 (devops.pipelines.environments.terraform_deployment)
    action: start
  artifacts:
    paths:
      - "${TF_ROOT}/terraform.tfstate"
    reports:
      terraform: "${TF_ROOT}/tfplan.json"
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

terraform:outputs:
  stage: deploy-foundation
  script:
    - cd "${TF_ROOT}"
    - terraform init
    - terraform output -json > terraform-outputs.json
  dependencies:
    - terraform:apply
  artifacts:
    paths:
      - "${TF_ROOT}/terraform-outputs.json"
    # The Terraform outputs of this run, kept for a week: the toolkit's retention for them, not a deployment setting.
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
