# =============================================================================
# Stage: Deploy Foundation — Terraform Apply (Azure resources)
# =============================================================================

terraform:apply:
  stage: deploy-foundation
  script:
    - cd "${TF_ROOT}"
    - terraform init -input=false
      -backend-config="resource_group_name=${TF_BACKEND_RG}"
      -backend-config="storage_account_name=${TF_BACKEND_SA}"
      -backend-config="container_name=${TF_BACKEND_CONTAINER}"
      -backend-config="key=${TF_BACKEND_KEY}"
      -backend-config="use_azuread_auth=true"
    - terraform apply -auto-approve -input=false tfplan
  dependencies:
    - terraform:plan
  environment:
    name: ${AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT} # a project CI/CD variable set by task 05 (devops.pipelines.environments.terraform_deployment)
    action: start
  # No state file as an artifact: the state is in the azurerm backend (TF_BACKEND_*), and a state file holds secrets.
  artifacts:
    reports:
      terraform: "${TF_ROOT}/tfplan.json"
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

terraform:outputs:
  stage: deploy-foundation
  script:
    - cd "${TF_ROOT}"
    - terraform init -input=false
      -backend-config="resource_group_name=${TF_BACKEND_RG}"
      -backend-config="storage_account_name=${TF_BACKEND_SA}"
      -backend-config="container_name=${TF_BACKEND_CONTAINER}"
      -backend-config="key=${TF_BACKEND_KEY}"
      -backend-config="use_azuread_auth=true"
    - terraform output -json > terraform-outputs.json
  dependencies:
    - terraform:apply
  artifacts:
    paths:
      - "${TF_ROOT}/terraform-outputs.json"
    # The Terraform outputs of this run, kept for a week: the toolkit's retention for them, not a deployment setting.
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
