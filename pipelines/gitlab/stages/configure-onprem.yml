      pwsh -NoProfile -Command '
        . ./pipelines/gitlab/Use-AzlGitLabTool.ps1 -Tool Ansible, Modules -PythonVersion $env:AZL_PYTHON_VERSION -AnsibleCoreVersion $env:AZL_ANSIBLE_CORE_VERSION -PowerShellYamlVersion $env:AZL_POWERSHELL_YAML_VERSION
        # The sign-in method of devops.authentication.method.
        if ($env:AZL_AUTH_METHOD -eq "oidc") { az login --service-principal --username $env:ARM_CLIENT_ID --tenant $env:ARM_TENANT_ID --federated-token $env:ARM_OIDC_TOKEN --output none }
        else { az login --service-principal --username $env:ARM_CLIENT_ID --tenant $env:ARM_TENANT_ID --password $env:ARM_CLIENT_SECRET --output none }
        az account set --subscription $env:ARM_SUBSCRIPTION_ID
        $env:ANSIBLE_AZURE_AUTH_SOURCE = "cli"
        ./config/variables/scripts/New-IacVariableFiles.ps1 -InfrastructureFile $env:AZL_INFRASTRUCTURE_FILE -OutputDirectory $env:IAC_DIRECTORY -Target Ansible
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Copy-Item -Path "$env:IAC_DIRECTORY/ansible/inventory/*" -Destination "$env:ANSIBLE_ROOT/inventory" -Recurse -Force
        Set-Location $env:ANSIBLE_ROOT
        ansible-galaxy collection install -r collections/requirements.yml
        ansible-playbook -i inventory/hosts.yml playbooks/03-arc-registration.yml
      '
  needs:
