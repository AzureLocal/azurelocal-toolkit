# The approval environment is not set: the jobs above are not created (their rule needs the variable named below), and this job fails and says why.
# Nothing is sent to any machine. Azure DevOps does the same with the stage ApprovalEnvironmentNotSet.
configure-onprem-approval-environment-not-set:
  tags: [$AZL_RUNNER_LABEL]
  stage: configure-onprem
  # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
  timeout: 5 minutes
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT == null || $AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT == "")'
  script:
    - pwsh -NoProfile -Command 'Write-Error "AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT (devops.pipelines.environments.terraform_deployment) is empty, and the on-premises plays change machines, so they do not run without an approval environment. Set the variable with task 05 of the CI/CD setup, then run again. Nothing was changed." -ErrorAction Continue; exit 1'
