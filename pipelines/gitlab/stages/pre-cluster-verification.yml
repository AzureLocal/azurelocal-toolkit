# Azure Local pre-cluster verification (the gate before the ARM Validate), GitLab CI.
#
# Include it from a pipeline file of its own (include: local: pipelines/gitlab/stages/pre-cluster-verification.yml) or copy it. It declares its
# own stage, so it is NOT included from pipelines/gitlab/.gitlab-ci.yml, whose stage list belongs to the Terraform and Ansible pipeline. It runs
# the command an operator runs by hand:
#   pwsh -File scripts/deploy/04-cluster-deployment/phase-05-cluster-deployment/Invoke-AzureLocalPreClusterVerification.ps1 ...
# and nothing else; the logic (the checks, the report, the verdict) is in the script, not here. Guide: docs/pre-cluster-verification.md.
#
# The job FAILS when the verdict is not Pass (exit code 1: a Failed or Skipped check blocks; 3: a partial run). The ARM run
# (stages/arm-deployment.yml) refuses to go on without a passing, current result of this gate for the same master file, so run this after the
# OS configuration and before the ARM Validate.
#
# Jobs (exactly one of them runs)
#   pre-cluster-verify          Read only. Plan (what would be checked, offline) or Verify (every check, against Azure, Active Directory and the nodes).
#   pre-cluster-verify-changes  Runs instead of the first when PRECLUSTER_FIX or PRECLUSTER_INSTALL_ENVIRONMENT_CHECKER is true. A MANUAL job: someone
#                               allowed to run jobs in the protected environment named by AZL_ENVIRONMENT_ARM_DEPLOYMENT plays it. PRECLUSTER_FIX
#                               registers the mandatory resource providers that are not registered (Azure side only);
#                               PRECLUSTER_INSTALL_ENVIRONMENT_CHECKER puts the Environment Checker on the nodes for this run and removes it again.
#
# Where the result goes. The script writes report.json, summary.md and the event feed where the ARM run reads them: the folder of
# deployment.pre_cluster_verification_report_directory, else arm-report/verification/live in the environment data folder of the master file.
# The job publishes a copy as its artifacts. The ARM run reads the folder, not the artifact: run it on the same runner (or set the report directory
# of the master file to a folder both runs reach).
#
# Project CI/CD variables: task 05 of the CI/CD setup sets each from infrastructure.yml; no value is in this file. tags: and environment:name
# expand CI/CD variables (https://docs.gitlab.com/ci/variables/where_variables_can_be_used/).
#   ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID  azure.automation_identity, azure.tenant_id, azure.subscription_id (Reader for the checks;
#                          Owner or Contributor for PRECLUSTER_FIX)
#   AZL_AUTH_METHOD        devops.authentication.method: oidc (the GitLab ID token ARM_OIDC_TOKEN and the federated credential of task 01)
#                          or client_secret (the masked variable ARM_CLIENT_SECRET, which task 05 reads from Key Vault)
#   AZL_RUNNER_LABEL       devops.pipelines.runner_label (the tag of the general runner)
#   AZL_ENVIRONMENT_ARM_DEPLOYMENT  devops.pipelines.environments.arm_deployment (the protected environment of the manual job)
#   AZL_INFRASTRUCTURE_FILE         devops.pipelines.infrastructure_file
#   AZL_POWERSHELL_YAML_VERSION, AZL_AZ_POWERSHELL_VERSION, AZL_AZ_KEYVAULT_VERSION  devops.pipelines.tool_versions.*
# Run variables (a pipeline run from the web form offers them):
#   PRECLUSTER_MODE        Plan | Verify
#   OS_CONFIGURATION_REPORT path of the OS configuration report directory. GitLab fetches the artifact of another pipeline only with
#                          `needs: [{ pipeline: ..., job: ..., artifacts: true }]` (a parent-child pipeline) or `needs: project:` (Premium),
#                          so add that to the jobs below; GitHub and Azure DevOps fetch it by a run ID.
#   HANDOFF_FILE           optional ZTP handoff file
#   PRECLUSTER_ACCEPT_SKIPPED  ids of checks that may stay Skipped, comma separated (for example IDN-002,IDN-003); the report records that you accepted them
#   PRECLUSTER_ALLOW_REVALIDATE  true: accept that the Validate runs again on an instance whose deployment failed (give the same switch to the ARM run)
#   PRECLUSTER_FIX, PRECLUSTER_INSTALL_ENVIRONMENT_CHECKER  true: Verify only, the two changes described above
# No secret is stored here. The local administrator and LCM passwords are read from the Key Vaults named by the keyvault:// references in the
# master file. Runner: the general runner with the tag AZL_RUNNER_LABEL, pwsh 7 and a route to the nodes (WinRM, TCP 5985 or 5986), to a domain
# controller (LDAP, TCP 389) and to the DNS servers of the file. A check the runner cannot ask is Skipped with its reason, and a Skipped check
# blocks the verdict: accept its id in PRECLUSTER_ACCEPT_SKIPPED, or run from a runner that can ask.
# Protected environment: task 04 creates it; Settings > CI/CD > Protected environments holds its approval rules (Premium and above).
#
# No approval environment, no change. While the project variable AZL_ENVIRONMENT_ARM_DEPLOYMENT is empty, the job that changes something is not created (its rule needs the
# variable), and the job named approval-environment-not-set fails with a message that names the variable and its key and changes nothing, the same as the stage
# ApprovalEnvironmentNotSet of Azure DevOps. A job with an empty environment name would otherwise run with no approval.

# Started by hand (D126: one design on GitHub, GitLab and Azure DevOps): GitLab creates a pipeline only from the web form or the API, never from
# a push or a merge request, as GitHub starts it with workflow_dispatch and Azure DevOps with trigger: none.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'

stages:
  - pre-cluster-verification

variables:
  PRECLUSTER_SCRIPT: scripts/deploy/04-cluster-deployment/phase-05-cluster-deployment/Invoke-AzureLocalPreClusterVerification.ps1
  PRECLUSTER_MODE:
    value: Plan
    options: [Plan, Verify]
    description: 'Plan: what would be checked (offline). Verify: run every check and write the result the ARM run reads.'
  PRECLUSTER_ACCEPT_SKIPPED: ''
  PRECLUSTER_ALLOW_REVALIDATE: 'false'
  PRECLUSTER_FIX: 'false'
  PRECLUSTER_INSTALL_ENVIRONMENT_CHECKER: 'false'
  # The directory the OS configuration pipeline's report artifact lands in when it is fetched (the toolkit's artifact name); not used when missing.
  OS_CONFIGURATION_REPORT: os-configuration-report
  HANDOFF_FILE: ''
  REPORT_DIRECTORY: pre-cluster-report

.pre-cluster-verification:
  tags: [$AZL_RUNNER_LABEL]
  stage: pre-cluster-verification
  # One gate run at a time (GitHub: concurrency group; Azure DevOps: lockBehavior): the result of a run replaces the one before.
  resource_group: azure-local-pre-cluster-verification
  # OIDC: GitLab issues a token the Azure app registration trusts (federated credential, audience api://AzureADTokenExchange).
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  before_script:
    - |
      pwsh -NoProfile -Command '
        . ./pipelines/gitlab/Use-AzlGitLabTool.ps1 -Tool Modules -PowerShellYamlVersion $env:AZL_POWERSHELL_YAML_VERSION -AzPowerShellVersion $env:AZL_AZ_POWERSHELL_VERSION -AzKeyVaultVersion $env:AZL_AZ_KEYVAULT_VERSION
        Enable-AzContextAutosave -Scope CurrentUser | Out-Null
        $connect = @{ Tenant = $env:ARM_TENANT_ID; Subscription = $env:ARM_SUBSCRIPTION_ID; ServicePrincipal = $true }
        # The sign-in method of devops.authentication.method.
        if ($env:AZL_AUTH_METHOD -eq "oidc") { Connect-AzAccount -ApplicationId $env:ARM_CLIENT_ID -FederatedToken $env:ARM_OIDC_TOKEN @connect | Out-Null }
        else { Connect-AzAccount -Credential ([pscredential]::new($env:ARM_CLIENT_ID, (ConvertTo-SecureString -String $env:ARM_CLIENT_SECRET -AsPlainText -Force))) @connect | Out-Null }
      '
  after_script:
    - pwsh -NoProfile -Command '$s = "$env:REPORT_DIRECTORY/summary.md"; if (Test-Path -LiteralPath $s) { Get-Content -LiteralPath $s }'
  artifacts:
    when: always
    # The report the ARM run read the verdict from: 30 days is the toolkit's retention for reports.
    expire_in: 30 days
    name: pre-cluster-verification
    paths:
      - $REPORT_DIRECTORY/

# The one pwsh block of both jobs: PRECLUSTER_CHANGES is set by the job. It runs the gate, then copies what the script wrote, where it wrote it,
# into REPORT_DIRECTORY for the artifacts, and ends with the gate's exit code.
.pre-cluster-script:
  run: &pre-cluster-run
    - |
      pwsh -NoProfile -Command '
        $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; Mode = $env:PRECLUSTER_MODE; PassThru = $true }
        if ($env:OS_CONFIGURATION_REPORT -and (Test-Path -LiteralPath $env:OS_CONFIGURATION_REPORT)) { $p.OsConfigurationReport = $env:OS_CONFIGURATION_REPORT }
        if ($env:HANDOFF_FILE) { $p.HandoffFile = $env:HANDOFF_FILE }
        if ($env:PRECLUSTER_ACCEPT_SKIPPED) { $p.AcceptSkipped = @($env:PRECLUSTER_ACCEPT_SKIPPED -split "[,;\s]+" | Where-Object { $_ }) }
        if ($env:PRECLUSTER_ALLOW_REVALIDATE -eq "true") { $p.AllowRevalidate = $true }
        if ($env:PRECLUSTER_CHANGES -eq "true") {
          if ($env:PRECLUSTER_FIX -eq "true") { $p.Fix = $true }
          if ($env:PRECLUSTER_INSTALL_ENVIRONMENT_CHECKER -eq "true") { $p.InstallEnvironmentChecker = $true }
        }
        $result = @(& $env:PRECLUSTER_SCRIPT @p) | Where-Object { $_ -and $_.PSObject.Properties["ReportDirectory"] } | Select-Object -Last 1
        $code = $LASTEXITCODE
        New-Item -ItemType Directory -Path $env:REPORT_DIRECTORY -Force | Out-Null
        if ($result -and (Test-Path -LiteralPath $result.ReportDirectory -PathType Container)) { Get-ChildItem -LiteralPath $result.ReportDirectory -File | Copy-Item -Destination $env:REPORT_DIRECTORY -Force }
        exit $code
      '

pre-cluster-verify:
  extends: .pre-cluster-verification
  # Read-only checks that make no long wait: the toolkit's limit, not a figure from Microsoft.
  timeout: 30 minutes
  variables:
    PRECLUSTER_CHANGES: 'false'
  rules:
    - if: '$PRECLUSTER_FIX != "true" && $PRECLUSTER_INSTALL_ENVIRONMENT_CHECKER != "true"'
  script: *pre-cluster-run

pre-cluster-verify-changes:
  extends: .pre-cluster-verification
  # The checks, and a wait for the resource provider registration: the toolkit's limit, not a figure from Microsoft.
  timeout: 1 hour
  variables:
    PRECLUSTER_CHANGES: 'true'
  # The approval gate: the job waits until someone allowed in the protected environment plays it.
  rules:
    - if: '($PRECLUSTER_FIX == "true" || $PRECLUSTER_INSTALL_ENVIRONMENT_CHECKER == "true") && $AZL_ENVIRONMENT_ARM_DEPLOYMENT != null && $AZL_ENVIRONMENT_ARM_DEPLOYMENT != ""'
      when: manual
      allow_failure: false
  environment:
    name: $AZL_ENVIRONMENT_ARM_DEPLOYMENT
  script: *pre-cluster-run

# A change was asked for, but the approval environment is not set: the job that changes something does not run (its rule needs the variable named below), and this job fails and says why.
# Nothing is sent to any machine. Azure DevOps does the same with the stage ApprovalEnvironmentNotSet.
pre-cluster-approval-environment-not-set:
  tags: [$AZL_RUNNER_LABEL]
  stage: pre-cluster-verification
  # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
  timeout: 5 minutes
  rules:
    - if: '($PRECLUSTER_FIX == "true" || $PRECLUSTER_INSTALL_ENVIRONMENT_CHECKER == "true") && ($AZL_ENVIRONMENT_ARM_DEPLOYMENT == null || $AZL_ENVIRONMENT_ARM_DEPLOYMENT == "")'
  script:
    - pwsh -NoProfile -Command 'Write-Error "AZL_ENVIRONMENT_ARM_DEPLOYMENT (devops.pipelines.environments.arm_deployment) is empty, and the pre-cluster-verify-changes job (-Fix and -InstallEnvironmentChecker) changes a system, so it does not run without an approval environment. Set the variable with task 05 of the CI/CD setup, then run again. Nothing was changed." -ErrorAction Continue; exit 1'
