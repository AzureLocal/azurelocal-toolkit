# =============================================================================
# Stage: Validate Deployment — read-only Azure summary
# =============================================================================
# One job: the Azure Policy compliance summary and the first Defender for Cloud assessments of the subscription. It changes nothing and takes
# the sign-in of devops.authentication.method (AZL_AUTH_METHOD) and the subscription of azure.subscription_id from the variables task 05 sets.
# The post-deployment checks of the cluster itself are Invoke-VerifyPostDeployment.ps1 and the scripts of scripts/deploy/06-testing-validation:
# they need a jump server that reaches the cluster, so no job here runs them. (A job that only ran the file check and printed this hint was
# removed in K7: config:validate in the validate stage already checks the file.)

validate:compliance:
  stage: validate-deployment
  script:
    - |
      pwsh -NoProfile -Command '
        $PSNativeCommandUseErrorActionPreference = $true
        # The sign-in method of devops.authentication.method: the GitLab ID token (oidc) or the masked client secret (client_secret).
        if ($env:AZL_AUTH_METHOD -eq "oidc") { az login --service-principal --username $env:ARM_CLIENT_ID --tenant $env:ARM_TENANT_ID --federated-token $env:ARM_OIDC_TOKEN --output none }
        else { az login --service-principal --username $env:ARM_CLIENT_ID --tenant $env:ARM_TENANT_ID --password $env:ARM_CLIENT_SECRET --output none }
        az account set --subscription $env:ARM_SUBSCRIPTION_ID
        Write-Output "Checking Azure Policy compliance..."
        az policy state summarize --subscription $env:ARM_SUBSCRIPTION_ID --output table
        Write-Output "Checking Defender for Cloud recommendations..."
        az security assessment list --output table | Select-Object -First 20
      '
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
