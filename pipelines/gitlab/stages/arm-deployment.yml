# Azure Local ARM Validate and Deploy, GitLab CI.
#
# Include it from a pipeline file of its own (include: local: pipelines/gitlab/stages/arm-deployment.yml) or copy it. It declares
# its own stages, so it is NOT included from pipelines/gitlab/.gitlab-ci.yml, whose stage list belongs to the Terraform and
# Ansible pipeline. It runs the command an operator runs by hand:
#   pwsh -File scripts/deploy/04-cluster-deployment/phase-05-cluster-deployment/Invoke-AzureLocalArmDeployment.ps1 ...
# and nothing else; the logic (preconditions, Validate, polling, known issues, resume) is in the script, not here.
# Design: docs/design/arm-validate-deploy.md. Guide: docs/arm-deployment-guide.md.
#
# Jobs
#   arm-preconditions  stage arm-plan      Read only. Parameters and every precondition. Always runs.
#   arm-validate       stage arm-validate  Mode Validate. Runs when ARM_MODE is Validate or ValidateAndDeploy. A Validate that
#                                          already passed with the same parameters is not submitted again.
#   arm-deploy         stage arm-deploy    Mode Deploy (2.5 to 3 hours). A MANUAL job: someone allowed to run jobs in the
#                                          protected environment named by AZL_ENVIRONMENT_ARM_DEPLOYMENT reads the arm-validate job's summary and
#                                          plays it. It checks every precondition and that these parameters validated.
#                                          ARM_RESUME=true resubmits a failed Deploy.
#
# Project CI/CD variables: task 05 of the CI/CD setup sets each from infrastructure.yml; no value is in this file. tags: and environment:name
# expand CI/CD variables (https://docs.gitlab.com/ci/variables/where_variables_can_be_used/).
#   ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID  azure.automation_identity, azure.tenant_id, azure.subscription_id
#   AZL_AUTH_METHOD        devops.authentication.method: oidc (the GitLab ID token ARM_OIDC_TOKEN and the federated credential of task 01)
#                          or client_secret (the masked variable ARM_CLIENT_SECRET, which task 05 reads from Key Vault)
#   AZL_RUNNER_LABEL       devops.pipelines.runner_label (the tag of the general runner)
#   AZL_ENVIRONMENT_ARM_DEPLOYMENT  devops.pipelines.environments.arm_deployment (the protected environment of the deploy job)
#   AZL_INFRASTRUCTURE_FILE         devops.pipelines.infrastructure_file
#   AZL_POWERSHELL_YAML_VERSION, AZL_AZ_POWERSHELL_VERSION, AZL_AZ_KEYVAULT_VERSION  devops.pipelines.tool_versions.*
# Run variables (a pipeline run from the web form offers them):
#   ARM_MODE               Plan | Validate | ValidateAndDeploy | Deploy
#   OS_CONFIGURATION_REPORT path of the OS configuration report directory. GitLab fetches the artifact of another pipeline only with
#                          `needs: [{ pipeline: ..., job: ..., artifacts: true }]` (a parent-child pipeline) or `needs: project:` (Premium),
#                          so add that to the jobs below; GitHub and Azure DevOps fetch it by a run ID.
#   HANDOFF_FILE           optional ZTP handoff file
#   ARM_ACKNOWLEDGE        optional known issue ids to proceed past, comma-separated (for example arc-device-id-name)
# No secret is stored here. The local administrator and LCM passwords are read from the Key Vaults named by the keyvault://
# references in the master file. Runner: the general runner with the tag AZL_RUNNER_LABEL and pwsh 7. The Active Directory check needs a
# domain-joined runner; elsewhere it is Skipped, not failed.
# Protected environment: task 04 creates it; Settings > CI/CD > Protected environments holds its approval rules (Premium and above).

stages:
  - arm-plan
  - arm-validate
  - arm-deploy

variables:
  ARM_SCRIPT: scripts/deploy/04-cluster-deployment/phase-05-cluster-deployment/Invoke-AzureLocalArmDeployment.ps1
  ARM_MODE:
    value: Plan
    options: [Plan, Validate, ValidateAndDeploy, Deploy]
    description: 'Plan: preconditions only. Validate: plus Validate. ValidateAndDeploy: plus a manual Deploy. Deploy: the manual Deploy only.'
  ARM_RESUME: 'false'
  ARM_ACKNOWLEDGE: ''
  # The directory the OS configuration pipeline's report artifact lands in when it is fetched (the toolkit's artifact name); not used when missing.
  OS_CONFIGURATION_REPORT: os-configuration-report
  HANDOFF_FILE: ''
  REPORT_DIRECTORY: arm-deployment-report

.arm-deployment:
  tags: [$AZL_RUNNER_LABEL]
  # OIDC: GitLab issues a token the Azure app registration trusts (federated credential, audience api://AzureADTokenExchange).
  id_tokens:
    ARM_OIDC_TOKEN:
      aud: api://AzureADTokenExchange
  before_script:
    - |
      pwsh -NoProfile -Command '
        . ./pipelines/gitlab/Use-AzlGitLabTool.ps1 -Tool Modules -PowerShellYamlVersion $env:AZL_POWERSHELL_YAML_VERSION -AzPowerShellVersion $env:AZL_AZ_POWERSHELL_VERSION -AzKeyVaultVersion $env:AZL_AZ_KEYVAULT_VERSION
        Enable-AzContextAutosave -Scope CurrentUser | Out-Null
        $connect = @{ Tenant = $env:ARM_TENANT_ID; Subscription = $env:ARM_SUBSCRIPTION_ID; ServicePrincipal = $true }
        # The sign-in method of devops.authentication.method.
        if ($env:AZL_AUTH_METHOD -eq "oidc") { Connect-AzAccount -ApplicationId $env:ARM_CLIENT_ID -FederatedToken $env:ARM_OIDC_TOKEN @connect | Out-Null }
        else { Connect-AzAccount -Credential ([pscredential]::new($env:ARM_CLIENT_ID, (ConvertTo-SecureString -String $env:ARM_CLIENT_SECRET -AsPlainText -Force))) @connect | Out-Null }
      '

# The job scripts: one pwsh block each. ARM_STEP_MODE and ARM_STEP_DIRECTORY are set by each job.
.arm-scripts:
  run: &arm-run
    - |
      pwsh -NoProfile -Command '
        $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; Mode = $env:ARM_STEP_MODE; ReportDirectory = "$env:REPORT_DIRECTORY/$env:ARM_STEP_DIRECTORY" }
        if ($env:OS_CONFIGURATION_REPORT -and (Test-Path -LiteralPath $env:OS_CONFIGURATION_REPORT)) { $p.OsConfigurationReport = $env:OS_CONFIGURATION_REPORT }
        if ($env:HANDOFF_FILE) { $p.HandoffFile = $env:HANDOFF_FILE }
        if ($env:ARM_STEP_MODE -eq "Deploy" -and $env:ARM_RESUME -eq "true") { $p.Resume = $true }
        if ($env:ARM_STEP_MODE -eq "Deploy" -and $env:ARM_ACKNOWLEDGE) { $p.AcknowledgeKnownIssues = $env:ARM_ACKNOWLEDGE }
        & $env:ARM_SCRIPT @p
        exit $LASTEXITCODE
      '
  summary: &arm-summary
    - pwsh -NoProfile -Command '$s = "$env:REPORT_DIRECTORY/$env:ARM_STEP_DIRECTORY/summary.md"; if (Test-Path -LiteralPath $s) { Get-Content -LiteralPath $s }'

arm-preconditions:
  extends: .arm-deployment
  stage: arm-plan
  resource_group: azure-local-arm-deployment
  # Read-only checks that make no long wait: the toolkit's limit for them, not a figure from Microsoft.
  timeout: 30 minutes
  variables:
    ARM_STEP_MODE: Plan
    ARM_STEP_DIRECTORY: plan
  script: *arm-run
  after_script: *arm-summary
  artifacts:
    when: always
    # The plan report: 30 days is the toolkit's retention for it.
    expire_in: 30 days
    name: arm-deployment-plan
    paths:
      - $REPORT_DIRECTORY/plan/

arm-validate:
  extends: .arm-deployment
  stage: arm-validate
  needs: [arm-preconditions]
  resource_group: azure-local-arm-deployment
  # Microsoft Learn: the validation takes about 10 minutes (https://learn.microsoft.com/azure/azure-local/deploy/deployment-azure-resource-manager-template-disaggregated).
  # The real limit is the script's wait, deployment.validate_timeout_minutes, read from the infrastructure file. GitLab reads the timeout keyword
  # before any variable exists, so this is a fixed upper bound: the registry maximum of that key (1440) plus 60 minutes, the same as Azure DevOps.
  timeout: 25 hours
  rules:
    - if: '$ARM_MODE == "Validate" || $ARM_MODE == "ValidateAndDeploy"'
  variables:
    ARM_STEP_MODE: Validate
    ARM_STEP_DIRECTORY: validate
  script: *arm-run
  after_script: *arm-summary
  artifacts:
    when: always
    # The validate and deploy reports (the approver reads the first; the second is the record of the deployment): 90 days is the toolkit's retention for them.
    expire_in: 90 days
    name: arm-deployment-validate
    paths:
      - $REPORT_DIRECTORY/validate/

arm-deploy:
  extends: .arm-deployment
  stage: arm-deploy
  needs:
    - job: arm-preconditions
    - job: arm-validate
      optional: true
  resource_group: azure-local-arm-deployment
  # Microsoft Learn: the deployment takes between 2.5 and 3 hours (https://learn.microsoft.com/azure/azure-local/deploy/deployment-azure-resource-manager-template).
  # The real limit is the script's wait, deployment.deploy_timeout_minutes, read from the infrastructure file. GitLab reads the timeout keyword
  # before any variable exists, so this is a fixed upper bound: the registry maximum of that key (1440) plus 60 minutes, the same as Azure DevOps.
  # The runner's own maximum job timeout must allow it.
  timeout: 25 hours
  environment:
    name: $AZL_ENVIRONMENT_ARM_DEPLOYMENT
  rules:
    # The approval gate: the job waits until someone plays it, after reading the arm-validate job's summary.
    - if: '$ARM_MODE == "ValidateAndDeploy" || $ARM_MODE == "Deploy"'
      when: manual
      allow_failure: false
  variables:
    ARM_STEP_MODE: Deploy
    ARM_STEP_DIRECTORY: deploy
  script: *arm-run
  after_script: *arm-summary
  artifacts:
    when: always
    # The validate and deploy reports (the approver reads the first; the second is the record of the deployment): 90 days is the toolkit's retention for them.
    expire_in: 90 days
    name: arm-deployment-deploy
    paths:
      - $REPORT_DIRECTORY/deploy/
