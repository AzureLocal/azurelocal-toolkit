# =============================================================================
# Stage: Configure Operations — Monitoring
# =============================================================================
# The job writes the Ansible inventory, group_vars and host_vars from the infrastructure file (New-IacVariableFiles.ps1, into
# IAC_DIRECTORY), copies them to src/ansible/inventory (git-ignored there), signs in to Azure by AZL_AUTH_METHOD and runs playbook 04.
# Playbook 05 (the domain controllers) runs first, in the configure-onprem stage. Use-AzlGitLabTool.ps1 makes the Python and ansible-core
# versions of devops.pipelines.tool_versions the ones the job uses.

# No approval environment, no change: the play changes Azure and the machines, so the job runs in the approval environment of terraform:apply (the
# same environment GitHub uses for this play), and its rule needs the variable. While AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT is empty the job is not
# created, and configure-operations-approval-environment-not-set (at the end of this file) fails and says why.
.configure-operations:
  stage: configure-operations
  environment:
    name: ${AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT} # a project CI/CD variable set by task 05 (devops.pipelines.environments.terraform_deployment)
  # One change at a time, with terraform:apply and the other plays.
  resource_group: azure-local-deploy
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT != null && $AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT != ""'

monitoring:setup:
  extends: .configure-operations
  script:
    - |
      pwsh -NoProfile -Command '
        . ./pipelines/gitlab/Use-AzlGitLabTool.ps1 -Tool Ansible, Modules -PythonVersion $env:AZL_PYTHON_VERSION -AnsibleCoreVersion $env:AZL_ANSIBLE_CORE_VERSION -PowerShellYamlVersion $env:AZL_POWERSHELL_YAML_VERSION
        # The sign-in method of devops.authentication.method.
        if ($env:AZL_AUTH_METHOD -eq "oidc") { az login --service-principal --username $env:ARM_CLIENT_ID --tenant $env:ARM_TENANT_ID --federated-token $env:ARM_OIDC_TOKEN --output none }
        else { az login --service-principal --username $env:ARM_CLIENT_ID --tenant $env:ARM_TENANT_ID --password $env:ARM_CLIENT_SECRET --output none }
        az account set --subscription $env:ARM_SUBSCRIPTION_ID
        $env:ANSIBLE_AZURE_AUTH_SOURCE = "cli"
        ./config/variables/scripts/New-IacVariableFiles.ps1 -InfrastructureFile $env:AZL_INFRASTRUCTURE_FILE -OutputDirectory $env:IAC_DIRECTORY -Target Ansible
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Copy-Item -Path "$env:IAC_DIRECTORY/ansible/inventory/*" -Destination "$env:ANSIBLE_ROOT/inventory" -Recurse -Force
        Set-Location $env:ANSIBLE_ROOT
        ansible-galaxy collection install -r collections/requirements.yml
        $root = @((ansible-galaxy collection list azure.azcollection --format json | ConvertFrom-Json).PSObject.Properties.Name)[0]
        python -m pip install --quiet -r (Get-ChildItem -LiteralPath (Join-Path $root "azure/azcollection") -Filter "requirements*.txt" | Select-Object -First 1).FullName
        ansible-playbook -i inventory/hosts.yml playbooks/04-monitoring-setup.yml
      '

# The approval environment is not set: the job above is not created (its rule needs the variable named below), and this job fails and says why.
# Nothing is sent to any machine. Azure DevOps does the same with the stage ApprovalEnvironmentNotSet.
configure-operations-approval-environment-not-set:
  tags: [$AZL_RUNNER_LABEL]
  stage: configure-operations
  # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
  timeout: 5 minutes
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT == null || $AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT == "")'
  script:
    - pwsh -NoProfile -Command 'Write-Error "AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT (devops.pipelines.environments.terraform_deployment) is empty, and the monitoring play changes Azure and the machines, so it does not run without an approval environment. Set the variable with task 05 of the CI/CD setup, then run again. Nothing was changed." -ErrorAction Continue; exit 1'
