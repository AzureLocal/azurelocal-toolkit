# Azure Local ARM Validate and Deploy, GitHub Actions.
#
# Copy to .github/workflows/arm-deployment.yml. It runs the command an operator runs by hand:
#   pwsh -File scripts/deploy/04-cluster-deployment/phase-05-cluster-deployment/Invoke-AzureLocalArmDeployment.ps1 ...
# and nothing else; the logic (preconditions, Validate, polling, known issues, resume) is in the script, not here.
# Design: docs/design/arm-validate-deploy.md. Guide: docs/arm-deployment-guide.md.
#
# Jobs
#   preconditions   Read-only. Generates the ARM parameters and runs every precondition (the OS configuration converged, Arc
#                   machines Connected and named after the hosts, Key Vault secrets present, resource providers, permissions,
#                   names, DNS, Active Directory, no leftover failed deployment). Always runs.
#   validate        Mode Validate. Runs for mode Validate and ValidateAndDeploy. A Validate that already passed with the same
#                   parameters is not submitted again; one that is running is attached to.
#   deploy          Mode Deploy (2.5 to 3 hours). Runs for mode ValidateAndDeploy and Deploy, and only after a reviewer of the
#                   GitHub environment named by the repository variable AZL_ENVIRONMENT_ARM_DEPLOYMENT approved it. The reviewer reads the validate job's summary. The job
#                   checks every precondition and that THESE parameters validated, so an approval cannot start a Deploy of
#                   parameters that were never validated. `resume` resubmits a failed Deploy.
#
# Settings (Settings > Secrets and variables > Actions). No value is in this file: task 05 of the CI/CD setup (Set-CicdVariables.ps1) sets
# every variable below from infrastructure.yml. GitHub reads runs-on, the environment name, a job timeout and env from the vars context
# (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
#   ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID  the app registration of azure.automation_identity, azure.tenant_id, azure.subscription_id
#   AZL_AUTH_METHOD                   devops.authentication.method: oidc (a federated credential for this repository and the approval
#                                     environment, no secret) or client_secret (the secret ARM_CLIENT_SECRET, which task 05 reads from Key Vault)
#   AZL_RUNNER_OS, AZL_RUNNER_LABEL   devops.runners[].os_type of the general runner and devops.pipelines.runner_label
#   AZL_ENVIRONMENT_ARM_DEPLOYMENT    devops.pipelines.environments.arm_deployment (the approval environment)
#   AZL_INFRASTRUCTURE_FILE           devops.pipelines.infrastructure_file (the master file in this repository)
#   AZL_VALIDATE_JOB_TIMEOUT_MINUTES  deployment.validate_timeout_minutes plus the toolkit's 60 minutes for the checks and the report
#   AZL_DEPLOY_JOB_TIMEOUT_MINUTES    deployment.deploy_timeout_minutes plus the same 60 minutes
#   AZL_POWERSHELL_YAML_VERSION, AZL_AZ_POWERSHELL_VERSION, AZL_AZ_KEYVAULT_VERSION  devops.pipelines.tool_versions.*
# The local administrator and LCM passwords are read from the Key Vaults named by the keyvault:// references in the master file; the
# identity needs Get on those secrets and the rights listed in the design (section 12).
# The approval environment: task 04 creates it with its required reviewers (Settings > Environments). That is the approval gate.
# Runner: the general self-hosted runner with pwsh 7. It needs only HTTPS to Azure. The Active Directory check needs a domain-joined runner
# with the ActiveDirectory module; on another runner that check is Skipped, not failed.
#
# Where the files come from: the master file is a path in this repository (AZL_INFRASTRUCTURE_FILE). The OS configuration report is
# the artifact `os-configuration-report` of the OS configuration workflow (os_configuration_run_id) or a repository path
# (os_configuration_report). The ZTP handoff is optional (handoff_file). Azure DevOps fetches the report the same way; GitLab takes a path.
name: Azure Local ARM deployment

on:
  workflow_dispatch:
    inputs:
      os_configuration_run_id:
        description: 'Run ID of the OS configuration workflow whose artifact os-configuration-report holds the report (leave empty to use os_configuration_report)'
        required: false
        default: ''
      os_configuration_report:
        description: 'Repository path of an OS configuration report directory or report.json (used when no run ID is given; may stay empty)'
        required: false
        default: ''
      handoff_file:
        description: 'Repository path of the ZTP handoff file (optional)'
        required: false
        default: ''
      mode:
        description: 'Plan: preconditions only. Validate: plus Validate. ValidateAndDeploy: plus Deploy after approval. Deploy: Deploy only, after approval, needs a Validate that succeeded.'
        type: choice
        options:
          - Plan
          - Validate
          - ValidateAndDeploy
          - Deploy
        default: Plan
      resume:
        description: 'Deploy: resubmit a failed deployment (after you read the failing step and the known issue)'
        type: boolean
        default: false
      acknowledge_known_issues:
        description: 'Comma-separated known issue ids to proceed past (for example arc-device-id-name). Leave empty normally.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  actions: read

# One ARM deployment at a time per repository (GitLab: resource_group; Azure DevOps: lockBehavior and the environment's Exclusive lock).
concurrency:
  group: azure-local-arm-deployment
  cancel-in-progress: false

# Every run step is PowerShell 7.
defaults:
  run:
    shell: pwsh

env:
  ARM_SCRIPT: scripts/deploy/04-cluster-deployment/phase-05-cluster-deployment/Invoke-AzureLocalArmDeployment.ps1
  AZL_INFRASTRUCTURE_FILE: ${{ vars.AZL_INFRASTRUCTURE_FILE }}
  AZL_POWERSHELL_YAML_VERSION: ${{ vars.AZL_POWERSHELL_YAML_VERSION }}
  AZL_AZ_POWERSHELL_VERSION: ${{ vars.AZL_AZ_POWERSHELL_VERSION }}
  AZL_AZ_KEYVAULT_VERSION: ${{ vars.AZL_AZ_KEYVAULT_VERSION }}
  HANDOFF_FILE: ${{ inputs.handoff_file }}
  OS_REPORT: ${{ inputs.os_configuration_report }}
  ACKNOWLEDGE: ${{ inputs.acknowledge_known_issues }}
  RESUME: ${{ inputs.resume }}

jobs:
  preconditions:
    name: Preconditions (read only)
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Read-only checks that make no long wait: the toolkit's limit for them, not a figure from Microsoft.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the OS configuration report
        if: ${{ inputs.os_configuration_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: os-configuration-report
          path: ${{ runner.temp }}/os-configuration-report
          run-id: ${{ inputs.os_configuration_run_id }}
          github-token: ${{ github.token }}

      - name: Point OS_REPORT at the downloaded artifact
        if: ${{ inputs.os_configuration_run_id != '' }}
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "OS_REPORT=$env:RUNNER_TEMP/os-configuration-report"

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az' = $env:AZL_AZ_POWERSHELL_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":"{0}","clientSecret":"{1}","subscriptionId":"{2}","tenantId":"{3}"}}', vars.ARM_CLIENT_ID, secrets.ARM_CLIENT_SECRET, vars.ARM_SUBSCRIPTION_ID, vars.ARM_TENANT_ID) }}
          enable-AzPSSession: true

      - name: Preconditions
        shell: pwsh
        run: |
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; Mode = 'Plan'; ReportDirectory = "$env:RUNNER_TEMP/arm-plan" }
          if ($env:OS_REPORT) { $p.OsConfigurationReport = $env:OS_REPORT }
          if ($env:HANDOFF_FILE) { $p.HandoffFile = $env:HANDOFF_FILE }
          & $env:ARM_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $summary = "$env:RUNNER_TEMP/arm-plan/summary.md"
          if (Test-Path -LiteralPath $summary) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (Get-Content -LiteralPath $summary) }

      - name: Publish the plan report and the event feed
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arm-deployment-plan
          path: ${{ runner.temp }}/arm-plan
          if-no-files-found: warn

  validate:
    name: Validate
    needs: preconditions
    if: ${{ inputs.mode == 'Validate' || inputs.mode == 'ValidateAndDeploy' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Microsoft Learn: the validation takes about 10 minutes (https://learn.microsoft.com/azure/azure-local/deploy/deployment-azure-resource-manager-template-disaggregated).
    # The script waits at most deployment.validate_timeout_minutes; task 05 sets this limit to that wait plus 60 minutes for the checks and the report.
    timeout-minutes: ${{ fromJSON(vars.AZL_VALIDATE_JOB_TIMEOUT_MINUTES) }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the OS configuration report
        if: ${{ inputs.os_configuration_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: os-configuration-report
          path: ${{ runner.temp }}/os-configuration-report
          run-id: ${{ inputs.os_configuration_run_id }}
          github-token: ${{ github.token }}

      - name: Point OS_REPORT at the downloaded artifact
        if: ${{ inputs.os_configuration_run_id != '' }}
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "OS_REPORT=$env:RUNNER_TEMP/os-configuration-report"

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az' = $env:AZL_AZ_POWERSHELL_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":"{0}","clientSecret":"{1}","subscriptionId":"{2}","tenantId":"{3}"}}', vars.ARM_CLIENT_ID, secrets.ARM_CLIENT_SECRET, vars.ARM_SUBSCRIPTION_ID, vars.ARM_TENANT_ID) }}
          enable-AzPSSession: true

      - name: Validate
        shell: pwsh
        run: |
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; Mode = 'Validate'; ReportDirectory = "$env:RUNNER_TEMP/arm-validate" }
          if ($env:OS_REPORT) { $p.OsConfigurationReport = $env:OS_REPORT }
          if ($env:HANDOFF_FILE) { $p.HandoffFile = $env:HANDOFF_FILE }
          & $env:ARM_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary (the reviewer reads this before approving the Deploy)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $summary = "$env:RUNNER_TEMP/arm-validate/summary.md"
          if (Test-Path -LiteralPath $summary) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (Get-Content -LiteralPath $summary) }

      - name: Publish the validate report and the event feed
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arm-deployment-validate
          path: ${{ runner.temp }}/arm-validate
          if-no-files-found: warn

  deploy:
    name: Deploy (needs approval)
    needs: [preconditions, validate]
    # validate is skipped for mode Deploy; always() lets the job run then, but only when nothing before it failed.
    if: ${{ always() && !cancelled() && needs.preconditions.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') && (inputs.mode == 'ValidateAndDeploy' || inputs.mode == 'Deploy') }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Required reviewers on this environment are the approval gate.
    environment: ${{ vars.AZL_ENVIRONMENT_ARM_DEPLOYMENT }}
    # Microsoft Learn: the deployment takes between 2.5 and 3 hours (https://learn.microsoft.com/azure/azure-local/deploy/deployment-azure-resource-manager-template).
    # The script waits at most deployment.deploy_timeout_minutes; task 05 sets this limit to that wait plus 60 minutes for the checks and the report.
    timeout-minutes: ${{ fromJSON(vars.AZL_DEPLOY_JOB_TIMEOUT_MINUTES) }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the OS configuration report
        if: ${{ inputs.os_configuration_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: os-configuration-report
          path: ${{ runner.temp }}/os-configuration-report
          run-id: ${{ inputs.os_configuration_run_id }}
          github-token: ${{ github.token }}

      - name: Point OS_REPORT at the downloaded artifact
        if: ${{ inputs.os_configuration_run_id != '' }}
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "OS_REPORT=$env:RUNNER_TEMP/os-configuration-report"

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az' = $env:AZL_AZ_POWERSHELL_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":"{0}","clientSecret":"{1}","subscriptionId":"{2}","tenantId":"{3}"}}', vars.ARM_CLIENT_ID, secrets.ARM_CLIENT_SECRET, vars.ARM_SUBSCRIPTION_ID, vars.ARM_TENANT_ID) }}
          enable-AzPSSession: true

      - name: Deploy
        shell: pwsh
        run: |
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; Mode = 'Deploy'; ReportDirectory = "$env:RUNNER_TEMP/arm-deploy" }
          if ($env:OS_REPORT) { $p.OsConfigurationReport = $env:OS_REPORT }
          if ($env:HANDOFF_FILE) { $p.HandoffFile = $env:HANDOFF_FILE }
          if ($env:RESUME -eq 'true') { $p.Resume = $true }
          if ($env:ACKNOWLEDGE) { $p.AcknowledgeKnownIssues = $env:ACKNOWLEDGE }
          & $env:ARM_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary (result)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $summary = "$env:RUNNER_TEMP/arm-deploy/summary.md"
          if (Test-Path -LiteralPath $summary) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (Get-Content -LiteralPath $summary) }

      - name: Publish the deploy report and the event feed
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arm-deployment-deploy
          path: ${{ runner.temp }}/arm-deploy
          if-no-files-found: warn
