# Azure Local day 2: check for updates (read only, on a schedule), GitHub Actions.
#
# Copy to .github/workflows/day2-check-updates.yml. It runs the command an operator runs by hand (stage 08, task 01) and nothing else; the logic is in the
# script, not here:
#   azure    pwsh -File scripts/deploy/08-day2-operations/task-01-check-for-updates/azurecli/Get-AvailableSolutionUpdate.azcli.ps1 ...
#            What Azure shows for the cluster resource (the update summary and the updates), with the Azure CLI. It needs no access to a node.
#   cluster  pwsh -File scripts/deploy/08-day2-operations/task-01-check-for-updates/powershell/Get-AvailableSolutionUpdate.ps1 ...
#            What the update service on the cluster has discovered, over PowerShell remoting, as the account that runs the runner. It signs in to nothing.
# Nothing in this run changes the cluster, Azure or a node, so there is no approval gate. It starts no update: that is the day2-update workflow.
#
# The run FAILS when the check says the cluster needs attention (exit code 1: an update in a failed state, a health state of Failure, Error or Warning, a
# failed update environment, or the cluster could not be read; 2: a value of the file is missing). That failure is the alert: GitHub tells the person who
# created or last changed the schedule, and your own notification rules (Settings > Notifications, a workflow failure webhook) can tell more people. An
# update that is merely offered ends with exit code 0: read the verdict in the job summary and the report.
#
# The schedule (owner directive D74: check for updates on a schedule). It is the key devops.pipelines.schedules.check_for_updates of infrastructure.yml,
# a five-field cron expression in UTC. GitHub reads a cron expression only from this file (no variable or expression can be used there), so this sample carries
# the default of the key, and tests/pipelines/Day2Pipelines.Tests.ps1 keeps the two equal. When your file sets another value, change the cron line of your
# copy to it; task 05 of the CI/CD setup prints the value to use. A scheduled run has no inputs, so it takes the source azure.
#
# Settings (Settings > Secrets and variables > Actions). No value is in this file: task 05 of the CI/CD setup (Set-CicdVariables.ps1) sets every variable below
# from infrastructure.yml. GitHub reads runs-on and env from the vars context
# (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
#   ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID  source azure: the app registration of azure.automation_identity, azure.tenant_id, azure.subscription_id
#                                     (Azure Stack HCI Administrator or Reader on the cluster resource)
#   AZL_AUTH_METHOD                   devops.authentication.method: oidc (a federated credential, no secret) or client_secret (the secret
#                                     ARM_CLIENT_SECRET, which task 05 reads from Key Vault)
#   AZL_RUNNER_OS, AZL_RUNNER_LABEL   devops.runners[].os_type of the general runner and devops.pipelines.runner_label
#   AZL_INFRASTRUCTURE_FILE           devops.pipelines.infrastructure_file (the master file in this repository)
#   AZL_POWERSHELL_YAML_VERSION       devops.pipelines.tool_versions.powershell_yaml
# Runner: the general self-hosted runner with pwsh 7. Source azure also needs the Azure CLI (the runner role installs it on Linux). Source cluster needs a
# route to the cluster (WinRM, TCP 5985 or 5986) and a runner service account that may read the update state of the cluster; no password is stored here.
name: Azure Local day 2 check for updates

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'azure: what Azure shows for the cluster resource (Azure CLI, no node access). cluster: what the update service on the cluster has discovered (PowerShell remoting)'
        type: choice
        options:
          - azure
          - cluster

permissions:
  contents: read
  id-token: write
  actions: read

# Every run step is PowerShell 7.
defaults:
  run:
    shell: pwsh

env:
  CHECK_AZURE_SCRIPT: scripts/deploy/08-day2-operations/task-01-check-for-updates/azurecli/Get-AvailableSolutionUpdate.azcli.ps1
  CHECK_CLUSTER_SCRIPT: scripts/deploy/08-day2-operations/task-01-check-for-updates/powershell/Get-AvailableSolutionUpdate.ps1
  AZL_INFRASTRUCTURE_FILE: ${{ vars.AZL_INFRASTRUCTURE_FILE }}
  AZL_POWERSHELL_YAML_VERSION: ${{ vars.AZL_POWERSHELL_YAML_VERSION }}

jobs:
  check-azure:
    name: Check for updates, Azure view (read only)
    # A schedule has no inputs: it runs this job. The job is skipped only when a person chose the source cluster.
    if: ${{ inputs.source != 'cluster' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Two read calls of Azure and a file: the toolkit's limit for a read-only check, not a figure from Microsoft.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":{0},"clientSecret":{1},"subscriptionId":{2},"tenantId":{3}}}', toJSON(vars.ARM_CLIENT_ID), toJSON(secrets.ARM_CLIENT_SECRET), toJSON(vars.ARM_SUBSCRIPTION_ID), toJSON(vars.ARM_TENANT_ID)) }}

      - name: Check for updates (Azure)
        shell: pwsh
        run: |
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; OutputPath = "$env:RUNNER_TEMP/update-check/update-check.json" }
          & $env:CHECK_AZURE_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $json = "$env:RUNNER_TEMP/update-check/update-check.json"
          if (Test-Path -LiteralPath $json) { $r = Get-Content -LiteralPath $json -Raw | ConvertFrom-Json; if ($r.PSObject.Properties['Verdict']) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Update check (Azure): $($r.Verdict)" } }

      - name: Publish the update check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: day2-update-check
          path: ${{ runner.temp }}/update-check
          # The report of a check: 30 days is the toolkit's retention for reports, long enough to compare with the next monthly update.
          retention-days: 30
          if-no-files-found: warn

  check-cluster:
    name: Check for updates, cluster view (read only)
    if: ${{ inputs.source == 'cluster' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # One read of the update service over remoting: the toolkit's limit for a read-only check, not a figure from Microsoft.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Check for updates (cluster)
        shell: pwsh
        run: |
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; OutputPath = "$env:RUNNER_TEMP/update-check/update-check.json" }
          & $env:CHECK_CLUSTER_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $json = "$env:RUNNER_TEMP/update-check/update-check.json"
          if (Test-Path -LiteralPath $json) { $r = Get-Content -LiteralPath $json -Raw | ConvertFrom-Json; if ($r.PSObject.Properties['Verdict']) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Update check (cluster): $($r.Verdict)" } }

      - name: Publish the update check report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: day2-update-check
          path: ${{ runner.temp }}/update-check
          # The report of a check: 30 days is the toolkit's retention for reports, long enough to compare with the next monthly update.
          retention-days: 30
          if-no-files-found: warn
