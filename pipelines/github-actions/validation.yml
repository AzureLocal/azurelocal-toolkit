# Azure Local validation (stage 07, before the handover; run it again after a change), GitHub Actions.
#
# Copy to .github/workflows/validation.yml. It runs the four validation scripts an operator runs by hand, one after the other, and nothing else; the checks and
# the reports are in the scripts, not here:
#   cluster health   scripts/deploy/07-validation-handover/task-01-cluster-health-validation/powershell/Test-AzureLocalClusterHealth.ps1
#   Arc connection   scripts/deploy/07-validation-handover/task-02-arc-connectivity-validation/powershell/Test-ArcConnectivity.ps1
#   network          scripts/deploy/07-validation-handover/task-03-network-configuration-validation/powershell/Test-NetworkConfiguration.ps1
#   storage          scripts/deploy/07-validation-handover/task-04-storage-performance-validation/powershell/Test-StoragePerformance.ps1
# Every script connects to the cluster over PowerShell remoting as the service account of the runner, which must be an administrator of the cluster; no Azure
# sign-in and no password is used.
#
# Jobs
#   validate             Read only, no approval. The four scripts run even when an earlier one fails, so one run shows every problem, and the run FAILS when any of
#                        them ended with a non-zero exit code (1: a check failed or the cluster could not be read; 2: a value of the file is missing). The storage
#                        script runs WITHOUT its performance test here: it then only reads the pools, the virtual disks, the physical disks and the cluster
#                        shared volumes.
#   storage-performance  Runs after validate, only when the input run_performance_test is set, and only after a reviewer of the GitHub environment named by the
#                        repository variable AZL_ENVIRONMENT_OPERATIONS approved it. Test-StoragePerformance.ps1 -RunPerformanceTest is NOT read only: its own
#                        help says "This will generate I/O on the cluster". It creates a scratch folder and file on each cluster shared volume, writes and reads
#                        it for DurationSeconds (default 60) seconds, and removes it again. That load is why it is behind the approval and the lock of the other
#                        changes to the cluster, and why it is not part of the read-only job: run it in a maintenance window, never during an update.
#
# One change at a time. The storage-performance job, the update, the node maintenance and the changing operations of this repository share the concurrency group
# azure-local-day2-changes (with the infrastructure file as part of its name, so another instance in the same repository has its own): the load test never runs
# beside an update or a node reboot. GitHub keeps at most one waiting run per group: a third one cancels the waiting second.
#
# Settings (Settings > Secrets and variables > Actions). No value is in this file: task 05 of the CI/CD setup (Set-CicdVariables.ps1) sets every variable below
# from infrastructure.yml. GitHub reads runs-on, the environment name and env from the vars context
# (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
#   AZL_RUNNER_OS, AZL_RUNNER_LABEL   devops.runners[].os_type of the general runner and devops.pipelines.runner_label
#   AZL_ENVIRONMENT_OPERATIONS   devops.pipelines.environments.operations (the approval environment of storage-performance)
#   AZL_INFRASTRUCTURE_FILE           devops.pipelines.infrastructure_file (the master file in this repository)
#   AZL_POWERSHELL_YAML_VERSION       devops.pipelines.tool_versions.powershell_yaml
# Runner: the general self-hosted runner with pwsh 7, a route to the cluster (WinRM, TCP 5985 or 5986) and the Failover Clustering PowerShell module (the RSAT
# feature Failover Clustering Tools), which the health, network and storage scripts use (Get-Cluster, Get-ClusterNode and others).
#
# No approval environment, no change. While the repository variable AZL_ENVIRONMENT_OPERATIONS is empty, the job that changes something does not run (its if needs the
# variable), and the job approval-environment-not-set fails with a message that names the variable and its key and changes nothing, the same as the stage
# ApprovalEnvironmentNotSet of Azure DevOps. A job with an empty environment name would otherwise run with no approval.
name: Azure Local validation

on:
  workflow_dispatch:
    inputs:
      run_performance_test:
        description: 'After the read-only validation: also run the storage performance test, which writes and reads a scratch file on every cluster shared volume (needs approval)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Every run step is PowerShell 7.
defaults:
  run:
    shell: pwsh

env:
  HEALTH_SCRIPT: scripts/deploy/07-validation-handover/task-01-cluster-health-validation/powershell/Test-AzureLocalClusterHealth.ps1
  ARC_SCRIPT: scripts/deploy/07-validation-handover/task-02-arc-connectivity-validation/powershell/Test-ArcConnectivity.ps1
  NETWORK_SCRIPT: scripts/deploy/07-validation-handover/task-03-network-configuration-validation/powershell/Test-NetworkConfiguration.ps1
  STORAGE_SCRIPT: scripts/deploy/07-validation-handover/task-04-storage-performance-validation/powershell/Test-StoragePerformance.ps1
  AZL_INFRASTRUCTURE_FILE: ${{ vars.AZL_INFRASTRUCTURE_FILE }}
  AZL_POWERSHELL_YAML_VERSION: ${{ vars.AZL_POWERSHELL_YAML_VERSION }}

jobs:
  validate:
    name: Validate (read only)
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Reads of the cluster over remoting by four scripts: the toolkit's limit for read-only checks, not a figure from Microsoft.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Run the four read-only validation scripts
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/validation"
          $checks = [ordered]@{
            ClusterHealth = @{ Script = $env:HEALTH_SCRIPT; Parameters = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; OutputFormat = 'JSON'; OutputPath = "$dir/cluster-health" } }
            ArcConnectivity = @{ Script = $env:ARC_SCRIPT; Parameters = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; OutputPath = "$dir/arc-connectivity" } }
            Network = @{ Script = $env:NETWORK_SCRIPT; Parameters = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; OutputPath = "$dir/network" } }
            Storage = @{ Script = $env:STORAGE_SCRIPT; Parameters = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; OutputPath = "$dir/storage" } }
          }
          $failed = @()
          foreach ($name in $checks.Keys) {
            $p = $checks[$name].Parameters
            New-Item -ItemType Directory -Path $p.OutputPath -Force | Out-Null
            & $checks[$name].Script @p
            if ($LASTEXITCODE -ne 0) { $failed += "$name (exit code $LASTEXITCODE)" }
          }
          if ($failed.Count -gt 0) { Write-Error "Validation failed: $($failed -join ', ')." -ErrorAction Continue; exit 1 }
          exit 0

      - name: Publish the validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: ${{ runner.temp }}/validation
          # The reports of a validation: 90 days is the toolkit's retention for the record that goes into a handover.
          retention-days: 90
          if-no-files-found: warn

  storage-performance:
    name: Storage performance test (puts load on the cluster, needs approval)
    needs: validate
    if: ${{ inputs.run_performance_test && vars.AZL_ENVIRONMENT_OPERATIONS != '' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Required reviewers on this environment are the approval gate.
    environment: ${{ vars.AZL_ENVIRONMENT_OPERATIONS }}
    # One change at a time on the cluster: the update, the node maintenance, the changing operations and the storage performance test share this group.
    concurrency:
      group: azure-local-day2-changes-${{ vars.AZL_INFRASTRUCTURE_FILE }}
      cancel-in-progress: false
    # One test per cluster shared volume of 60 seconds (the default of the script) plus its reads: the toolkit's limit, not a figure from Microsoft.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Run the storage performance test
        shell: pwsh
        run: |
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; OutputPath = "$env:RUNNER_TEMP/storage-performance" }
          # the one change the reviewer approved: the load test, which writes a scratch file on every cluster shared volume and removes it again
          $p.RunPerformanceTest = $true
          & $env:STORAGE_SCRIPT @p
          exit $LASTEXITCODE

      - name: Publish the storage performance report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-performance-report
          path: ${{ runner.temp }}/storage-performance
          # The result of the load test: 90 days is the toolkit's retention for the record that goes into a handover.
          retention-days: 90
          if-no-files-found: warn

  # A change was asked for, but the approval environment is not set: the job that changes something does not run (it needs the variable named below), and this job fails and says why.
  # Nothing is sent to any machine. Azure DevOps does the same with the stage ApprovalEnvironmentNotSet.
  approval-environment-not-set:
    name: Refuse, no approval environment is set
    needs: validate
    if: ${{ inputs.run_performance_test && vars.AZL_ENVIRONMENT_OPERATIONS == '' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
    timeout-minutes: 5
    steps:
      - name: No approval environment is set, so nothing is changed
        shell: pwsh
        run: |
          Write-Error 'AZL_ENVIRONMENT_OPERATIONS (devops.pipelines.environments.operations) is empty, and the storage performance test (it puts load on the cluster) changes a system, so it does not run without an approval environment. Set the variable with task 05 of the CI/CD setup, then run again. Nothing was changed.' -ErrorAction Continue
          exit 1
