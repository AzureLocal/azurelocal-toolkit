# Azure Local day 2: start the solution update (the monthly update, or the first one after a deployment), GitHub Actions.
#
# Copy to .github/workflows/day2-update.yml. It runs the command an operator runs by hand (stage 08, task 02) and nothing else; the logic is in the script,
# not here:
#   pwsh -File scripts/deploy/08-day2-operations/task-02-start-solution-update/powershell/Start-AzureLocalSolutionUpdate.ps1 ...
# The script reads the update state of the cluster over PowerShell remoting, chooses the update (operations.updates.target_version), checks that the update
# environment is healthy and starts it with Start-SolutionUpdate. It does not wait: an update takes hours and the machines restart. Follow the run with the
# day2-check-updates workflow, Azure Update Manager in the portal, or Sonar.
#
# Jobs
#   plan   Read only, and always first. The same script with -WhatIf: it reads the cluster and prints which update it would start. It starts nothing. The run
#          stops here when the input action is Plan, and when this job fails (an update that is running, a health state of Failure, Error or Warning ...).
#   apply  Runs after the plan, and only for the action PrepareOnly or Install, after a reviewer of the GitHub environment named by the repository variable
#          AZL_ENVIRONMENT_OPERATIONS approved it. PrepareOnly downloads the update and runs the readiness checks (Learn recommends this before the
#          maintenance window; an update that was prepared this way must be installed with PowerShell, not from the portal). Install starts the update.
#
# One change at a time. The apply job, the node maintenance, the changing operations and the storage performance test of this repository share the concurrency
# group azure-local-day2-changes (with the infrastructure file as part of its name, so another instance in the same repository has its own): a second
# change waits for the first, it never runs beside it. GitHub keeps at most one waiting run per group: a third one cancels the waiting second.
#
# Settings (Settings > Secrets and variables > Actions). No value is in this file: task 05 of the CI/CD setup (Set-CicdVariables.ps1) sets every variable below
# from infrastructure.yml. GitHub reads runs-on, the environment name and env from the vars context
# (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
#   AZL_RUNNER_OS, AZL_RUNNER_LABEL   devops.runners[].os_type of the general runner and devops.pipelines.runner_label
#   AZL_ENVIRONMENT_OPERATIONS   devops.pipelines.environments.operations (the approval environment of the apply job)
#   AZL_INFRASTRUCTURE_FILE           devops.pipelines.infrastructure_file (the master file in this repository)
#   AZL_POWERSHELL_YAML_VERSION       devops.pipelines.tool_versions.powershell_yaml
# The values the script reads from the master file: cluster.name, operations.updates.install_after_deployment (mode AfterDeployment only) and
# operations.updates.target_version. No password and no Azure sign-in is used: the script connects to the cluster as the service account of the runner, which
# must be an administrator of the cluster (Learn: Update Azure Local by using PowerShell uses the deployment user account).
# Runner: the general self-hosted runner with pwsh 7 and a route to the cluster (WinRM, TCP 5985 or 5986).
name: Azure Local day 2 update

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Plan: read the cluster and show which update would be started (nothing is started). PrepareOnly: download the update and run the readiness checks (needs approval). Install: start the update (needs approval)'
        type: choice
        options:
          - Plan
          - PrepareOnly
          - Install
      update_mode:
        description: 'AfterDeployment: start only when operations.updates.install_after_deployment is true in the master file. OnDemand: the monthly update; the person who approves is the decision'
        type: choice
        options:
          - AfterDeployment
          - OnDemand

permissions:
  contents: read
  actions: read

# Every run step is PowerShell 7.
defaults:
  run:
    shell: pwsh

env:
  UPDATE_SCRIPT: scripts/deploy/08-day2-operations/task-02-start-solution-update/powershell/Start-AzureLocalSolutionUpdate.ps1
  AZL_INFRASTRUCTURE_FILE: ${{ vars.AZL_INFRASTRUCTURE_FILE }}
  AZL_POWERSHELL_YAML_VERSION: ${{ vars.AZL_POWERSHELL_YAML_VERSION }}
  UPDATE_ACTION: ${{ inputs.action }}
  UPDATE_MODE: ${{ inputs.update_mode }}

jobs:
  plan:
    name: Plan (read only)
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # One read of the update state over remoting: the toolkit's limit for a read-only check, not a figure from Microsoft.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Plan (nothing is started)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/day2-update" -Force | Out-Null
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; Mode = $env:UPDATE_MODE; LogPath = "$env:RUNNER_TEMP/day2-update/plan.log"; WhatIf = $true }
          if ($env:UPDATE_ACTION -eq 'PrepareOnly') { $p.PrepareOnly = $true }
          & $env:UPDATE_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/day2-update/plan.log"
          if (Test-Path -LiteralPath $log) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('Plan of the update (nothing was started):', '') + @(Get-Content -LiteralPath $log)) }

      - name: Publish the plan
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: day2-update-plan
          path: ${{ runner.temp }}/day2-update
          # The log of a plan: 30 days is the toolkit's retention for reports, long enough to compare with the run that followed it.
          retention-days: 30
          if-no-files-found: warn

  apply:
    name: Apply (needs approval)
    needs: plan
    if: ${{ inputs.action == 'PrepareOnly' || inputs.action == 'Install' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Required reviewers on this environment are the approval gate.
    environment: ${{ vars.AZL_ENVIRONMENT_OPERATIONS }}
    # One change at a time on the cluster: the update, the node maintenance, the changing operations and the storage performance test share this group.
    concurrency:
      group: azure-local-day2-changes-${{ vars.AZL_INFRASTRUCTURE_FILE }}
      cancel-in-progress: false
    # The script starts the update and returns without waiting: the toolkit's limit, not a figure from Microsoft.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Start the update
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/day2-update" -Force | Out-Null
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; Mode = $env:UPDATE_MODE; LogPath = "$env:RUNNER_TEMP/day2-update/apply.log" }
          # the one change the reviewer approved: with PrepareOnly the update is downloaded and checked, never installed
          if ($env:UPDATE_ACTION -eq 'PrepareOnly') { $p.PrepareOnly = $true }
          & $env:UPDATE_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/day2-update/apply.log"
          if (Test-Path -LiteralPath $log) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('What the script did:', '') + @(Get-Content -LiteralPath $log)) }

      - name: Publish the log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: day2-update-log
          path: ${{ runner.temp }}/day2-update
          # The log of a change: 90 days is the toolkit's retention for the record of a change to the cluster.
          retention-days: 90
          if-no-files-found: warn
