# Azure Local day 2: take one node through maintenance (drain, reboot, resume, wait for the storage), GitHub Actions.
#
# Copy to .github/workflows/day2-node-maintenance.yml. It runs the command an operator runs by hand (stage 08, task 03) and nothing else; the logic is in the
# script, not here:
#   pwsh -File scripts/deploy/08-day2-operations/task-03-node-maintenance/powershell/Invoke-NodeMaintenanceReboot.ps1 ...
# The script checks that it is safe to take the node out (every other node Up, every virtual disk Healthy, no storage repair running), drains it, reboots it,
# waits for it, resumes it and waits for the storage to repair (Learn: Suspend and resume Azure Local machines for maintenance). Run it for the next node only
# after this run ended with exit code 0.
#
# Exactly one node per run. The input node is one node of nodes[] in the master file: the script is given -RequireNodeInFile, so a name or an address that the
# file does not list ends the run with exit code 2 before any credential is read and before anything is sent to a machine. Nodes are never handled in parallel:
# there is no matrix, no loop, and the apply job shares one concurrency group with every other change to the cluster.
#
# Jobs
#   plan   Read only, and always first. The same script with -WhatIf: it checks the node against the file, reads the credential reference and prints what would
#          happen. It sends nothing to any machine. The run stops here when the input action is Plan, and when this job fails (a node that the file does not
#          list, no credential).
#   apply  Runs after the plan, and only for the action Reboot or Resume, after a reviewer of the GitHub environment named by the repository variable
#          AZL_ENVIRONMENT_OPERATIONS approved it. Reboot drains, reboots and resumes the node. Resume only resumes a node that a failed run left Paused
#          (the script's -ResumeOnly): use it after you looked at the node.
#
# One change at a time. The apply job, the update, the changing operations and the storage performance test of this repository share the concurrency group
# azure-local-day2-changes (with the infrastructure file as part of its name, so another instance in the same repository has its own): a second change waits
# for the first, it never runs beside it. GitHub keeps at most one waiting run per group: a third one cancels the waiting second.
#
# Settings (Settings > Secrets and variables > Actions). No value is in this file: task 05 of the CI/CD setup (Set-CicdVariables.ps1) sets every variable below
# from infrastructure.yml. GitHub reads runs-on, the environment name and env from the vars context
# (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
#   ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID  the app registration of azure.automation_identity, azure.tenant_id, azure.subscription_id (Get on the
#                                     Key Vault secrets of the local administrator and the LCM user)
#   AZL_AUTH_METHOD                   devops.authentication.method: oidc (a federated credential, no secret) or client_secret (the secret
#                                     ARM_CLIENT_SECRET, which task 05 reads from Key Vault)
#   AZL_RUNNER_OS, AZL_RUNNER_LABEL   devops.runners[].os_type of the general runner and devops.pipelines.runner_label
#   AZL_ENVIRONMENT_OPERATIONS   devops.pipelines.environments.operations (the approval environment of the apply job)
#   AZL_INFRASTRUCTURE_FILE           devops.pipelines.infrastructure_file (the master file in this repository)
#   AZL_POWERSHELL_YAML_VERSION, AZL_AZ_POWERSHELL_VERSION, AZL_AZ_KEYVAULT_VERSION  devops.pipelines.tool_versions.*
# The node login is never in this file or in a variable of this repository: it is the secret reference of the master file (identity.local_admin, with
# identity.active_directory.lcm_user as the fallback), and the toolkit secret resolver reads it from Key Vault at run time with the Azure sign-in of the job.
# Runner: the general self-hosted runner with pwsh 7 and a route to the node (WinRM, TCP 5985 or 5986, and ping).
name: Azure Local day 2 node maintenance

on:
  workflow_dispatch:
    inputs:
      node:
        description: 'The one node to take through maintenance: its name in nodes[] of the master file (a fully qualified name or a management address of that node also works)'
        required: true
        type: string
      action:
        description: 'Plan: check the node against the file and show what would happen (nothing is sent to a machine). Reboot: drain, reboot, resume and wait for the storage (needs approval). Resume: only resume a node left Paused by a failed run (needs approval)'
        type: choice
        options:
          - Plan
          - Reboot
          - Resume

permissions:
  contents: read
  id-token: write
  actions: read

# Every run step is PowerShell 7.
defaults:
  run:
    shell: pwsh

env:
  MAINTENANCE_SCRIPT: scripts/deploy/08-day2-operations/task-03-node-maintenance/powershell/Invoke-NodeMaintenanceReboot.ps1
  AZL_INFRASTRUCTURE_FILE: ${{ vars.AZL_INFRASTRUCTURE_FILE }}
  AZL_POWERSHELL_YAML_VERSION: ${{ vars.AZL_POWERSHELL_YAML_VERSION }}
  AZL_AZ_POWERSHELL_VERSION: ${{ vars.AZL_AZ_POWERSHELL_VERSION }}
  AZL_AZ_KEYVAULT_VERSION: ${{ vars.AZL_AZ_KEYVAULT_VERSION }}
  MAINTENANCE_NODE: ${{ inputs.node }}
  MAINTENANCE_ACTION: ${{ inputs.action }}

jobs:
  plan:
    name: Plan (read only)
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # The check of the node and a read of the secret references: the toolkit's limit for a read-only check, not a figure from Microsoft.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az' = $env:AZL_AZ_POWERSHELL_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":{0},"clientSecret":{1},"subscriptionId":{2},"tenantId":{3}}}', toJSON(vars.ARM_CLIENT_ID), toJSON(secrets.ARM_CLIENT_SECRET), toJSON(vars.ARM_SUBSCRIPTION_ID), toJSON(vars.ARM_TENANT_ID)) }}
          enable-AzPSSession: true

      - name: Plan (nothing is sent to a machine)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/day2-node-maintenance" -Force | Out-Null
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; TargetNode = $env:MAINTENANCE_NODE; RequireNodeInFile = $true; LogPath = "$env:RUNNER_TEMP/day2-node-maintenance/plan.log"; WhatIf = $true }
          if ($env:MAINTENANCE_ACTION -eq 'Resume') { $p.ResumeOnly = $true }
          & $env:MAINTENANCE_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/day2-node-maintenance/plan.log"
          if (Test-Path -LiteralPath $log) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('Plan of the node maintenance (nothing was sent to a machine):', '') + @(Get-Content -LiteralPath $log)) }

      - name: Publish the plan
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: day2-node-maintenance-plan
          path: ${{ runner.temp }}/day2-node-maintenance
          # The log of a plan: 30 days is the toolkit's retention for reports, long enough to compare with the run that followed it.
          retention-days: 30
          if-no-files-found: warn

  apply:
    name: Apply (needs approval)
    needs: plan
    if: ${{ inputs.action == 'Reboot' || inputs.action == 'Resume' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Required reviewers on this environment are the approval gate.
    environment: ${{ vars.AZL_ENVIRONMENT_OPERATIONS }}
    # One change at a time on the cluster, and one node at a time: the update, the node maintenance, the changing operations and the storage performance test share this group.
    concurrency:
      group: azure-local-day2-changes-${{ vars.AZL_INFRASTRUCTURE_FILE }}
      cancel-in-progress: false
    # The drain waits for the virtual machines to move (no limit in the script), the node is awaited for 500 seconds and the storage repair for 180 minutes (the defaults of the script): the toolkit's limit, not a figure from Microsoft.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az' = $env:AZL_AZ_POWERSHELL_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":{0},"clientSecret":{1},"subscriptionId":{2},"tenantId":{3}}}', toJSON(vars.ARM_CLIENT_ID), toJSON(secrets.ARM_CLIENT_SECRET), toJSON(vars.ARM_SUBSCRIPTION_ID), toJSON(vars.ARM_TENANT_ID)) }}
          enable-AzPSSession: true

      - name: Take the node through maintenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/day2-node-maintenance" -Force | Out-Null
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; TargetNode = $env:MAINTENANCE_NODE; RequireNodeInFile = $true; LogPath = "$env:RUNNER_TEMP/day2-node-maintenance/apply.log" }
          # the one change the reviewer approved: Resume only resumes a node that a failed run left Paused, Reboot drains, reboots and resumes it
          if ($env:MAINTENANCE_ACTION -eq 'Resume') { $p.ResumeOnly = $true }
          & $env:MAINTENANCE_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/day2-node-maintenance/apply.log"
          if (Test-Path -LiteralPath $log) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('What the script did:', '') + @(Get-Content -LiteralPath $log)) }

      - name: Publish the log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: day2-node-maintenance-log
          path: ${{ runner.temp }}/day2-node-maintenance
          # The log of a change: 90 days is the toolkit's retention for the record of a change to the cluster.
          retention-days: 90
          if-no-files-found: warn
