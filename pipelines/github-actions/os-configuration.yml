# Azure Local OS configuration, GitHub Actions.
#
# Copy to .github/workflows/os-configuration.yml. It runs the same command an operator runs by hand:
#   pwsh -File scripts/deploy/04-cluster-deployment/phase-03-os-configuration/Invoke-AzureLocalOsConfiguration.ps1 ...
# and nothing else; the logic is in the script, not here.
#
# Job 1 `plan` is read only. It publishes the plan report and the wipe list (which disks on which node would be wiped, when
# os_configuration.clear_storage is true) as an artifact and in the job summary.
# Job 2 `apply` runs only for mode Apply, and only after a reviewer of the GitHub environment named by the repository variable
# AZL_ENVIRONMENT_OS_CONFIGURATION approved it. The reviewer reads the plan job's summary, the wipe list included.
#
# Settings (Settings > Secrets and variables > Actions). No value is in this file: task 05 of the CI/CD setup (Set-CicdVariables.ps1) sets
# every variable below from infrastructure.yml, for the repository (and the sign-in values also per environment). GitHub reads runs-on, the
# environment name and env from the vars context (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
#   ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID  the app registration of azure.automation_identity, azure.tenant_id, azure.subscription_id
#   AZL_AUTH_METHOD                   devops.authentication.method: oidc (a federated credential, no secret) or client_secret (the secret
#                                     ARM_CLIENT_SECRET, which task 05 reads from Key Vault)
#   AZL_RUNNER_OS, AZL_RUNNER_LABEL   devops.runners[].os_type of the general runner and devops.pipelines.runner_label
#   AZL_ENVIRONMENT_OS_CONFIGURATION  devops.pipelines.environments.os_configuration (the approval environment)
#   AZL_INFRASTRUCTURE_FILE           devops.pipelines.infrastructure_file (the master file in this repository)
#   AZL_HANDOFF_PATH                  devops.pipelines.handoff_path (a handoff file or a directory of *.ztp-handoff.json; not used when missing)
#   AZL_POWERSHELL_YAML_VERSION, AZL_AZ_POWERSHELL_VERSION, AZL_AZ_KEYVAULT_VERSION  devops.pipelines.tool_versions.*
# The transport, the storage wipe and the bootstrap route are read by the script from the master file (os_configuration.remoting.transport,
# os_configuration.clear_storage, os_configuration.remoting.bootstrap_transport); the workflow overrides none of them.
# No secret is stored here: the nodes' local administrator password is read from the Key Vault named by identity.local_admin.password.
# The approval environment: task 04 creates it with its required reviewers (Settings > Environments). That is the approval gate.
# Runner: PowerShell remoting (WinRM) is the transport, so the runner needs a ROUTE to the nodes' management network: the general self-hosted
# runner with pwsh 7 and the PSWSMan module (Negotiate/Kerberos), or WinRM over HTTPS (5986, a certificate on the nodes). A node whose
# firewall still limits WinRM to its own subnet needs os_configuration.remoting.bootstrap_transport arc once, or WinRM-In opened for the
# runner's CIDR. The pre-check fails fast with one table of unreachable nodes.
#
# Where the files come from: the master file is a path in this repository (AZL_INFRASTRUCTURE_FILE). The handoff files are either a
# repository path (AZL_HANDOFF_PATH) or the artifact `ztp-handoff` of the ZTP run (input handoff_run_id). See docs/os-configuration-and-arm-deployment.md.
#
# No approval environment, no change. While the repository variable AZL_ENVIRONMENT_OS_CONFIGURATION is empty, the job that changes something does not run (its if needs the
# variable), and the job approval-environment-not-set fails with a message that names the variable and its key and changes nothing, the same as the stage
# ApprovalEnvironmentNotSet of Azure DevOps. A job with an empty environment name would otherwise run with no approval.
name: Azure Local OS configuration

on:
  workflow_dispatch:
    inputs:
      handoff_run_id:
        description: 'Optional: run ID of the ZTP workflow whose artifact ztp-handoff holds the handoff files (replaces AZL_HANDOFF_PATH)'
        required: false
        default: ''
      approved_bootstrap:
        description: 'Approve the one-time WinRM bootstrap (os_configuration.remoting.bootstrap_transport arc, smb or auto) for this run. Production and dmz do not bootstrap without it; an smb bootstrap needs a Windows runner'
        type: boolean
        default: false
      mode:
        description: 'Plan only, or Plan then Apply after approval'
        type: choice
        options:
          - Plan
          - Apply
        default: Plan

permissions:
  contents: read
  id-token: write
  actions: read

# One OS configuration at a time per repository (GitLab: resource_group; Azure DevOps: lockBehavior and the environment's Exclusive lock).
concurrency:
  group: azure-local-os-configuration
  cancel-in-progress: false

# Every run step is PowerShell 7.
defaults:
  run:
    shell: pwsh

env:
  OSCONFIG_SCRIPT: scripts/deploy/04-cluster-deployment/phase-03-os-configuration/Invoke-AzureLocalOsConfiguration.ps1
  AZL_INFRASTRUCTURE_FILE: ${{ vars.AZL_INFRASTRUCTURE_FILE }}
  HANDOFF_PATH: ${{ vars.AZL_HANDOFF_PATH }}
  AZL_POWERSHELL_YAML_VERSION: ${{ vars.AZL_POWERSHELL_YAML_VERSION }}
  AZL_AZ_POWERSHELL_VERSION: ${{ vars.AZL_AZ_POWERSHELL_VERSION }}
  AZL_AZ_KEYVAULT_VERSION: ${{ vars.AZL_AZ_KEYVAULT_VERSION }}

jobs:
  plan:
    name: Plan (read only)
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the ZTP handoff artifact
        if: ${{ inputs.handoff_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ztp-handoff
          path: ${{ runner.temp }}/ztp-handoff
          run-id: ${{ inputs.handoff_run_id }}
          github-token: ${{ github.token }}

      - name: Point HANDOFF_PATH at the downloaded artifact
        if: ${{ inputs.handoff_run_id != '' }}
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "HANDOFF_PATH=$env:RUNNER_TEMP/ztp-handoff"

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az' = $env:AZL_AZ_POWERSHELL_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":{0},"clientSecret":{1},"subscriptionId":{2},"tenantId":{3}}}', toJSON(vars.ARM_CLIENT_ID), toJSON(secrets.ARM_CLIENT_SECRET), toJSON(vars.ARM_SUBSCRIPTION_ID), toJSON(vars.ARM_TENANT_ID)) }}
          enable-AzPSSession: true

      - name: Plan
        shell: pwsh
        run: |
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; Mode = 'Plan'; ReportDirectory = "$env:RUNNER_TEMP/osconfig-plan" }
          if ($env:HANDOFF_PATH -and (Test-Path -LiteralPath $env:HANDOFF_PATH)) { $p.HandoffPath = $env:HANDOFF_PATH }
          & $env:OSCONFIG_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary (plan and wipe list)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $summary = "$env:RUNNER_TEMP/osconfig-plan/summary.md"
          if (Test-Path -LiteralPath $summary) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('## Azure Local OS configuration: plan') + (Get-Content -LiteralPath $summary)) }

      - name: Publish the plan report and the wipe list
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: os-configuration-plan
          path: ${{ runner.temp }}/osconfig-plan
          if-no-files-found: warn

  apply:
    name: Apply (needs approval)
    needs: plan
    if: ${{ inputs.mode == 'Apply' && vars.AZL_ENVIRONMENT_OS_CONFIGURATION != '' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Required reviewers on this environment are the approval gate.
    environment: ${{ vars.AZL_ENVIRONMENT_OS_CONFIGURATION }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the ZTP handoff artifact
        if: ${{ inputs.handoff_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ztp-handoff
          path: ${{ runner.temp }}/ztp-handoff
          run-id: ${{ inputs.handoff_run_id }}
          github-token: ${{ github.token }}

      - name: Point HANDOFF_PATH at the downloaded artifact
        if: ${{ inputs.handoff_run_id != '' }}
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_ENV -Value "HANDOFF_PATH=$env:RUNNER_TEMP/ztp-handoff"

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        shell: pwsh
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az' = $env:AZL_AZ_POWERSHELL_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":{0},"clientSecret":{1},"subscriptionId":{2},"tenantId":{3}}}', toJSON(vars.ARM_CLIENT_ID), toJSON(secrets.ARM_CLIENT_SECRET), toJSON(vars.ARM_SUBSCRIPTION_ID), toJSON(vars.ARM_TENANT_ID)) }}
          enable-AzPSSession: true

      # The wipe list the reviewer approved is the one the Plan job published. Apply is bound to it: it stops (exit 2) before changing anything when its own list holds a disk that is not in it.
      - name: Fetch the approved wipe list (the Plan job's artifact)
        uses: actions/download-artifact@v4
        with:
          name: os-configuration-plan
          path: ${{ runner.temp }}/osconfig-plan

      - name: Apply
        shell: pwsh
        env:
          APPROVED_BOOTSTRAP: ${{ inputs.approved_bootstrap }}
        run: |
          $p = @{ InfrastructureFile = $env:AZL_INFRASTRUCTURE_FILE; Mode = 'Apply'; ReportDirectory = "$env:RUNNER_TEMP/osconfig-apply"; ApprovedWipeList = "$env:RUNNER_TEMP/osconfig-plan/wipe-list.json" }
          if ($env:HANDOFF_PATH -and (Test-Path -LiteralPath $env:HANDOFF_PATH)) { $p.HandoffPath = $env:HANDOFF_PATH }
          # -ApprovedBootstrap is the pipeline approval of the one-time bootstrap: the reviewer of this job gave it by running it with the input set.
          if ($env:APPROVED_BOOTSTRAP -eq 'true') { $p.ApprovedBootstrap = $true }
          & $env:OSCONFIG_SCRIPT @p
          exit $LASTEXITCODE

      - name: Job summary (result)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $summary = "$env:RUNNER_TEMP/osconfig-apply/summary.md"
          if (Test-Path -LiteralPath $summary) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('## Azure Local OS configuration: apply') + (Get-Content -LiteralPath $summary)) }

      - name: Publish the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: os-configuration-report
          path: ${{ runner.temp }}/osconfig-apply
          if-no-files-found: warn

  # A change was asked for, but the approval environment is not set: the job that changes something does not run (it needs the variable named below), and this job fails and says why.
  # Nothing is sent to any machine. Azure DevOps does the same with the stage ApprovalEnvironmentNotSet.
  approval-environment-not-set:
    name: Refuse, no approval environment is set
    needs: plan
    if: ${{ inputs.mode == 'Apply' && vars.AZL_ENVIRONMENT_OS_CONFIGURATION == '' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
    timeout-minutes: 5
    steps:
      - name: No approval environment is set, so nothing is changed
        shell: pwsh
        run: |
          Write-Error 'AZL_ENVIRONMENT_OS_CONFIGURATION (devops.pipelines.environments.os_configuration) is empty, and the Apply job changes a system, so it does not run without an approval environment. Set the variable with task 05 of the CI/CD setup, then run again. Nothing was changed.' -ErrorAction Continue
          exit 1
