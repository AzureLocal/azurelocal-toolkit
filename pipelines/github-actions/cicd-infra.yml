# =============================================================================
# GitHub Actions workflow - CI/CD infrastructure (self-hosted runners)
# =============================================================================
# Task 06 of automation / 01-cicd-infra as a pipeline: validate, terraform plan,
# manual approval, terraform apply of the plan that was reviewed.
#
# Copy to: .github/workflows/cicd-infra.yml
#
# Settings (Settings > Secrets and variables > Actions). No value is in this file: task 05 of the CI/CD setup (Set-CicdVariables.ps1) sets
# every variable below from infrastructure.yml. The vars context is read by runs-on, the environment name and env
# (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
#   ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID  the app registration of azure.automation_identity, azure.tenant_id, azure.subscription_id
#   AZL_AUTH_METHOD             devops.authentication.method: oidc (the federated credential made by task 01, no secret) or client_secret
#                               (the secret ARM_CLIENT_SECRET, which task 05 reads from Key Vault)
#   AZL_RUNNER_OS, AZL_RUNNER_LABEL  devops.runners[].os_type of the general runner and devops.pipelines.runner_label
#   AZL_ENVIRONMENT_CICD_INFRA  devops.pipelines.environments.cicd_infra (the approval environment with required reviewers)
#   AZL_INFRASTRUCTURE_FILE     devops.pipelines.infrastructure_file
#   AZL_RUNNER_SSH_PUBLIC_KEY   devops.runners[].admin_ssh_public_key of the Linux runner (a public key)
#   AZL_TERRAFORM_VERSION, AZL_POWERSHELL_YAML_VERSION  devops.pipelines.tool_versions.terraform and .powershell_yaml
#
# Where it runs: the first time, on GitHub-hosted runners, because there are no self-hosted runners yet (input runner, github-hosted).
# After the runners exist, choose "self-hosted" to run on [self-hosted, <AZL_RUNNER_OS>, <AZL_RUNNER_LABEL>].
# The runners read their own registration credential from Key Vault at boot; this
# workflow never sees it.
# =============================================================================
# Hosted image: ubuntu-latest is the vendor's label of its hosted Linux image, a platform choice and not a setting of a deployment. The
# validate job only validates; plan and apply use it only for the first run, before the self-hosted runners exist.
name: CI/CD infrastructure

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the plan and apply jobs run: github-hosted for the first run, self-hosted after the runners exist"
        required: true
        type: choice
        default: github-hosted
        options:
          - github-hosted
          - self-hosted
      apply:
        description: "Also run the apply job (it still waits for approval)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC

# One CI/CD infrastructure run at a time per repository (GitLab: resource_group; Azure DevOps: lockBehavior). Terraform locks the state too.
concurrency:
  group: azure-local-cicd-infra
  cancel-in-progress: false

# Every run step is PowerShell 7.
defaults:
  run:
    shell: pwsh

env:
  TF_ROOT: src/terraform/environments/cicd-infra
  TASK06: scripts/deploy/01-cicd-infra/phase-01-cicd-setup/task-06-deploy-runners/powershell/Deploy-CicdRunners.ps1
  AZL_INFRASTRUCTURE_FILE: ${{ vars.AZL_INFRASTRUCTURE_FILE }}
  AZL_POWERSHELL_YAML_VERSION: ${{ vars.AZL_POWERSHELL_YAML_VERSION }}
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  # The sign-in method of devops.authentication.method: OIDC, or the client secret task 05 stored.
  ARM_USE_OIDC: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
  ARM_CLIENT_SECRET: ${{ vars.AZL_AUTH_METHOD == 'client_secret' && secrets.ARM_CLIENT_SECRET || '' }}
  AZL_RUNNER_SSH_PUBLIC_KEY: ${{ vars.AZL_RUNNER_SSH_PUBLIC_KEY }}

jobs:
  validate:
    name: Validate
    # Validates only: the hosted image is a platform choice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.AZL_TERRAFORM_VERSION }}

      - name: Terraform format
        run: terraform fmt -check -recursive src/terraform/modules/cicd-runner ${{ env.TF_ROOT }}

      - name: Terraform validate (environment)
        working-directory: ${{ env.TF_ROOT }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          terraform init -backend=false -input=false
          terraform validate

      - name: Terraform test (module, mocked providers)
        working-directory: src/terraform/modules/cicd-runner
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          terraform init -backend=false -input=false
          terraform test

      - name: Check infrastructure.yml
        shell: pwsh
        run: |
          Install-Module powershell-yaml -RequiredVersion $env:AZL_POWERSHELL_YAML_VERSION -Force -Scope CurrentUser -Repository PSGallery
          ./scripts/common/infrastructure/Test-InfrastructureFile.ps1 -Path $env:AZL_INFRASTRUCTURE_FILE

  plan:
    name: Plan
    needs: validate
    # The first run has no self-hosted runner yet, so it runs on the hosted image; later runs choose self-hosted.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON(format('["self-hosted","{0}","{1}"]', vars.AZL_RUNNER_OS, vars.AZL_RUNNER_LABEL)) || 'ubuntu-latest' }}
    # terraform init, validate and plan of the runner VMs and their network: the toolkit's limit, not a figure from Microsoft.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.AZL_TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":{0},"clientSecret":{1},"subscriptionId":{2},"tenantId":{3}}}', toJSON(vars.ARM_CLIENT_ID), toJSON(secrets.ARM_CLIENT_SECRET), toJSON(vars.ARM_SUBSCRIPTION_ID), toJSON(vars.ARM_TENANT_ID)) }}

      - name: Plan (nothing changes in Azure)
        shell: pwsh
        run: |
          Install-Module powershell-yaml -RequiredVersion $env:AZL_POWERSHELL_YAML_VERSION -Force -Scope CurrentUser -Repository PSGallery
          & $env:TASK06 -InfrastructureFile $env:AZL_INFRASTRUCTURE_FILE -WorkingDirectory "$env:RUNNER_TEMP/cicd-infra"
          exit $LASTEXITCODE

      - name: Show the plan for the approver
        working-directory: ${{ env.TF_ROOT }}
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP/cicd-infra"
          terraform show -no-color "$work/cicd-infra.tfplan" | Set-Content -LiteralPath "$work/plan.txt"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value (@('## Terraform plan: CI/CD runners', '```') + (Get-Content -LiteralPath "$work/plan.txt") + @('```'))

      - name: Keep the reviewed plan
        uses: actions/upload-artifact@v4
        with:
          name: cicd-infra-plan
          path: |
            ${{ runner.temp }}/cicd-infra/cicd-infra.tfplan
            ${{ runner.temp }}/cicd-infra/.terraform.lock.hcl
            ${{ runner.temp }}/cicd-infra/plan.txt
          include-hidden-files: true
          # The plan is read by the apply job of this run and is stale after a day: the toolkit's limit.
          retention-days: 1

  apply:
    name: Apply (needs approval)
    needs: plan
    if: ${{ inputs.apply }}
    # The same runner choice as the plan: the first run has no self-hosted runner yet.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON(format('["self-hosted","{0}","{1}"]', vars.AZL_RUNNER_OS, vars.AZL_RUNNER_LABEL)) || 'ubuntu-latest' }}
    environment: ${{ vars.AZL_ENVIRONMENT_CICD_INFRA }} # required reviewers: the manual approval
    # terraform apply of the runner VMs, their network and role assignments: the toolkit's limit, not a figure from Microsoft.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.AZL_TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":{0},"clientSecret":{1},"subscriptionId":{2},"tenantId":{3}}}', toJSON(vars.ARM_CLIENT_ID), toJSON(secrets.ARM_CLIENT_SECRET), toJSON(vars.ARM_SUBSCRIPTION_ID), toJSON(vars.ARM_TENANT_ID)) }}

      - name: Fetch the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: cicd-infra-plan
          path: ${{ runner.temp }}/cicd-infra

      - name: Apply the reviewed plan
        shell: pwsh
        run: |
          Install-Module powershell-yaml -RequiredVersion $env:AZL_POWERSHELL_YAML_VERSION -Force -Scope CurrentUser -Repository PSGallery
          & $env:TASK06 -InfrastructureFile $env:AZL_INFRASTRUCTURE_FILE -PlanFile "$env:RUNNER_TEMP/cicd-infra/cicd-infra.tfplan" -Apply
          exit $LASTEXITCODE
