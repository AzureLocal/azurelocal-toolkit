# =============================================================================
# GitHub Actions Workflow — Azure Local Deployment
# =============================================================================
# Mirrors the GitLab CI/CD pipeline with GitHub Actions syntax.
#
# Settings (Settings > Secrets and variables > Actions). No value is in this file: task 05 of the CI/CD setup (Set-CicdVariables.ps1) sets
# every variable below from infrastructure.yml (runs-on, the environment name and env read the vars context,
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability):
#   ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID  the app registration of azure.automation_identity, azure.tenant_id, azure.subscription_id
#   AZL_AUTH_METHOD                       devops.authentication.method: oidc (no secret) or client_secret (the secret ARM_CLIENT_SECRET,
#                                         which task 05 reads from Key Vault)
#   AZL_RUNNER_OS, AZL_RUNNER_LABEL       devops.runners[].os_type of the general runner and devops.pipelines.runner_label
#   AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT  the approval environment, with required reviewers (devops.pipelines.environments.terraform_deployment)
#   AZL_INFRASTRUCTURE_FILE               devops.pipelines.infrastructure_file
#   TF_BACKEND_RG, TF_BACKEND_SA          the resource group and storage account of the Terraform state (devops.state.resource_group,
#                                         devops.state.storage_account)
#   TF_BACKEND_CONTAINER, TF_BACKEND_KEY  the blob container (devops.state.container) and the state file of this environment
#                                         (devops.state.azure_local_key)
#   AZL_TERRAFORM_VERSION, AZL_PYTHON_VERSION, AZL_ANSIBLE_CORE_VERSION, AZL_ANSIBLE_LINT_VERSION, AZL_POWERSHELL_YAML_VERSION
#                                         devops.pipelines.tool_versions.*
# The Terraform variables and the Ansible inventory are written in each job by config/variables/scripts/New-IacVariableFiles.ps1 from the
# infrastructure file: the Terraform variables into the job's temporary directory, the Ansible inventory, group_vars and host_vars into
# src/ansible/inventory (git-ignored there). They hold subscription IDs and names, so they are never committed or uploaded.
#   AZL_AZ_POWERSHELL_VERSION, AZL_AZ_KEYVAULT_VERSION  devops.pipelines.tool_versions.* (playbook 02 runs PowerShell 7 with Az on the runner)
# =============================================================================
# Hosted image: ubuntu-latest is the vendor's label of its hosted Linux image, a platform choice and not a setting of a deployment. Only the
# jobs that validate and plan use it; the apply and the on-premises jobs run on the self-hosted runner.
# Trigger: every push and pull request that touches the code validates it. Plan, apply and the configuration run only on the default branch
# of the repository (github.event.repository.default_branch): the branch filter of a trigger cannot read a variable.
#
# No approval environment, no change. While the repository variable AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT is empty, the job that changes something does not run (its if needs the
# variable), and the job approval-environment-not-set fails with a message that names the variable and its key and changes nothing, the same as the stage
# ApprovalEnvironmentNotSet of Azure DevOps. A job with an empty environment name would otherwise run with no approval.
name: Azure Local Deployment

on:
  push:
    paths:
      - 'src/terraform/**'
      - 'src/ansible/**'
      - 'config/variables/**'
  pull_request:
    paths:
      - 'src/terraform/**'
      - 'src/ansible/**'
  workflow_dispatch:

# Every run step is PowerShell 7.
defaults:
  run:
    shell: pwsh

env:
  TF_ROOT: src/terraform/environments/azure-local
  ANSIBLE_ROOT: src/ansible
  AZL_INFRASTRUCTURE_FILE: ${{ vars.AZL_INFRASTRUCTURE_FILE }}
  AZL_POWERSHELL_YAML_VERSION: ${{ vars.AZL_POWERSHELL_YAML_VERSION }}
  AZL_ANSIBLE_CORE_VERSION: ${{ vars.AZL_ANSIBLE_CORE_VERSION }}
  AZL_ANSIBLE_LINT_VERSION: ${{ vars.AZL_ANSIBLE_LINT_VERSION }}
  AZL_AZ_POWERSHELL_VERSION: ${{ vars.AZL_AZ_POWERSHELL_VERSION }}
  AZL_AZ_KEYVAULT_VERSION: ${{ vars.AZL_AZ_KEYVAULT_VERSION }}

permissions:
  contents: read
  id-token: write  # For OIDC authentication

# One deployment at a time per repository (GitLab: resource_group; Azure DevOps: the environment's Exclusive lock). Terraform locks the state too.
concurrency:
  group: azure-local-deploy
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Validate
  # =========================================================================
  terraform-validate:
    name: Terraform Validate
    # Validates only: the hosted image is a platform choice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.AZL_TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive

  ansible-lint:
    name: Ansible Lint
    # Validates only: the hosted image is a platform choice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.AZL_PYTHON_VERSION }}

      - name: Install Ansible and lint tools
        run: pip install "ansible-core==$env:AZL_ANSIBLE_CORE_VERSION" "ansible-lint==$env:AZL_ANSIBLE_LINT_VERSION"

      - name: Install collections
        working-directory: ${{ env.ANSIBLE_ROOT }}
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Lint playbooks and roles
        working-directory: ${{ env.ANSIBLE_ROOT }}
        run: ansible-lint playbooks/ roles/

      - name: Syntax check
        working-directory: ${{ env.ANSIBLE_ROOT }}
        run: ansible-playbook --syntax-check playbooks/site.yml

  # =========================================================================
  # Plan
  # =========================================================================
  terraform-plan:
    name: Terraform Plan
    needs: [terraform-validate]
    # Plans only: the hosted image is a platform choice.
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      # The sign-in method of devops.authentication.method: OIDC, or the client secret task 05 stored.
      ARM_USE_OIDC: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
      ARM_CLIENT_SECRET: ${{ vars.AZL_AUTH_METHOD == 'client_secret' && secrets.ARM_CLIENT_SECRET || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.AZL_TERRAFORM_VERSION }}

      - name: Write the Terraform variables from the infrastructure file
        run: |
          Install-Module powershell-yaml -RequiredVersion $env:AZL_POWERSHELL_YAML_VERSION -Force -Scope CurrentUser -Repository PSGallery
          ./config/variables/scripts/New-IacVariableFiles.ps1 -InfrastructureFile $env:AZL_INFRASTRUCTURE_FILE -OutputDirectory "$env:RUNNER_TEMP/iac" -Target AzureLocal
          exit $LASTEXITCODE

      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        # The backend settings task 05 sets from devops.state; the same four the Azure DevOps and GitLab pipelines pass.
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TF_BACKEND_RG }}"
          -backend-config="storage_account_name=${{ vars.TF_BACKEND_SA }}"
          -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}"
          -backend-config="key=${{ vars.TF_BACKEND_KEY }}"
          -backend-config="use_azuread_auth=true"

      - name: Terraform Plan
        working-directory: ${{ env.TF_ROOT }}
        run: terraform plan -out=tfplan -input=false -var-file="$env:RUNNER_TEMP/iac/terraform/azure-local/terraform.tfvars.json"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_ROOT }}/tfplan
          # The plan is read by the apply job of this run and is stale after a day: the toolkit's limit.
          retention-days: 1

  # =========================================================================
  # Deploy Foundation (requires approval, self-hosted runner)
  # =========================================================================
  terraform-apply:
    name: Terraform Apply
    needs: [terraform-plan]
    if: ${{ vars.AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT != '' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    environment: ${{ vars.AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT }}
    env:
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      # The sign-in method of devops.authentication.method: OIDC, or the client secret task 05 stored.
      ARM_USE_OIDC: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
      ARM_CLIENT_SECRET: ${{ vars.AZL_AUTH_METHOD == 'client_secret' && secrets.ARM_CLIENT_SECRET || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.AZL_TERRAFORM_VERSION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_ROOT }}

      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        # The backend settings task 05 sets from devops.state; the same four the Azure DevOps and GitLab pipelines pass.
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TF_BACKEND_RG }}"
          -backend-config="storage_account_name=${{ vars.TF_BACKEND_SA }}"
          -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}"
          -backend-config="key=${{ vars.TF_BACKEND_KEY }}"
          -backend-config="use_azuread_auth=true"

      - name: Terraform Apply
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Export Terraform outputs
        working-directory: ${{ env.TF_ROOT }}
        run: terraform output -json | Set-Content -LiteralPath terraform-outputs.json

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: ${{ env.TF_ROOT }}/terraform-outputs.json
          # The Terraform outputs of this run, kept for a week: the toolkit's retention for them, not a deployment setting.
          retention-days: 7

  # =========================================================================
  # Configure On-Prem (self-hosted runner required)
  # =========================================================================
  # Playbook 05 builds the domain controllers first: the AD preparation (01) runs on the first of them. Playbook 02 runs the OS
  # configuration (Invoke-AzureLocalOsConfiguration.ps1) on this runner, so the job needs PowerShell 7 with powershell-yaml and Az, and an
  # Azure sign-in; the roles read the LCM and DSRM passwords from Key Vault on the controller (azure.azcollection, through the Azure CLI).
  configure-onprem:
    name: Configure On-Premises
    needs: [terraform-apply]
    if: ${{ vars.AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT != '' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    environment: ${{ vars.AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT }}
    env:
      ANSIBLE_AZURE_AUTH_SOURCE: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.AZL_PYTHON_VERSION }}

      - name: Install the PowerShell modules (devops.pipelines.tool_versions)
        run: |
          $modules = [ordered]@{ 'powershell-yaml' = $env:AZL_POWERSHELL_YAML_VERSION; 'Az' = $env:AZL_AZ_POWERSHELL_VERSION; 'Az.KeyVault' = $env:AZL_AZ_KEYVAULT_VERSION }
          foreach ($m in $modules.GetEnumerator()) { if (-not (Get-Module -ListAvailable $m.Key | Where-Object Version -EQ $m.Value)) { Install-Module $m.Key -RequiredVersion $m.Value -Scope CurrentUser -Force -Repository PSGallery } }

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":{0},"clientSecret":{1},"subscriptionId":{2},"tenantId":{3}}}', toJSON(vars.ARM_CLIENT_ID), toJSON(secrets.ARM_CLIENT_SECRET), toJSON(vars.ARM_SUBSCRIPTION_ID), toJSON(vars.ARM_TENANT_ID)) }}
          enable-AzPSSession: true

      - name: Install Ansible
        run: pip install "ansible-core==$env:AZL_ANSIBLE_CORE_VERSION"

      - name: Install collections (and the Python packages azure.azcollection pins)
        working-directory: ${{ env.ANSIBLE_ROOT }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ansible-galaxy collection install -r collections/requirements.yml
          $root = @((ansible-galaxy collection list azure.azcollection --format json | ConvertFrom-Json).PSObject.Properties.Name)[0]
          $requirements = Get-ChildItem -LiteralPath (Join-Path $root 'azure/azcollection') -Filter 'requirements*.txt' | Select-Object -First 1
          pip install -r $requirements.FullName

      - name: Write the Ansible inventory and variable files from the infrastructure file
        run: |
          ./config/variables/scripts/New-IacVariableFiles.ps1 -InfrastructureFile $env:AZL_INFRASTRUCTURE_FILE -OutputDirectory "$env:RUNNER_TEMP/iac" -Target Ansible
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -Path "$env:RUNNER_TEMP/iac/ansible/inventory/*" -Destination "$env:ANSIBLE_ROOT/inventory" -Recurse -Force

      - name: Run Management VM Configuration (domain controllers)
        working-directory: ${{ env.ANSIBLE_ROOT }}
        run: ansible-playbook -i inventory/hosts.yml playbooks/05-management-vms.yml

      - name: Run AD Preparation
        working-directory: ${{ env.ANSIBLE_ROOT }}
        run: ansible-playbook -i inventory/hosts.yml playbooks/01-ad-preparation.yml

      - name: Run OS Configuration
        working-directory: ${{ env.ANSIBLE_ROOT }}
        run: ansible-playbook -i inventory/hosts.yml playbooks/02-os-configuration.yml -e "azurelocal_os_configuration_infrastructure_file=$env:GITHUB_WORKSPACE/$env:AZL_INFRASTRUCTURE_FILE"

      - name: Run Arc Registration
        working-directory: ${{ env.ANSIBLE_ROOT }}
        run: ansible-playbook -i inventory/hosts.yml playbooks/03-arc-registration.yml

  # =========================================================================
  # Configure Operations (self-hosted runner required)
  # =========================================================================
  configure-operations:
    name: Configure Operations
    needs: [configure-onprem]
    if: ${{ vars.AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT != '' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    environment: ${{ vars.AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT }}
    env:
      ANSIBLE_AZURE_AUTH_SOURCE: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.AZL_PYTHON_VERSION }}

      - name: Azure login (OIDC)
        if: ${{ vars.AZL_AUTH_METHOD == 'oidc' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Azure login (client secret)
        if: ${{ vars.AZL_AUTH_METHOD == 'client_secret' }}
        uses: azure/login@v2
        with:
          creds: ${{ format('{{"clientId":{0},"clientSecret":{1},"subscriptionId":{2},"tenantId":{3}}}', toJSON(vars.ARM_CLIENT_ID), toJSON(secrets.ARM_CLIENT_SECRET), toJSON(vars.ARM_SUBSCRIPTION_ID), toJSON(vars.ARM_TENANT_ID)) }}

      - name: Install Ansible
        run: pip install "ansible-core==$env:AZL_ANSIBLE_CORE_VERSION"

      - name: Install collections (and the Python packages azure.azcollection pins)
        working-directory: ${{ env.ANSIBLE_ROOT }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ansible-galaxy collection install -r collections/requirements.yml
          $root = @((ansible-galaxy collection list azure.azcollection --format json | ConvertFrom-Json).PSObject.Properties.Name)[0]
          $requirements = Get-ChildItem -LiteralPath (Join-Path $root 'azure/azcollection') -Filter 'requirements*.txt' | Select-Object -First 1
          pip install -r $requirements.FullName

      - name: Write the Ansible inventory and variable files from the infrastructure file
        run: |
          Install-Module powershell-yaml -RequiredVersion $env:AZL_POWERSHELL_YAML_VERSION -Force -Scope CurrentUser -Repository PSGallery
          ./config/variables/scripts/New-IacVariableFiles.ps1 -InfrastructureFile $env:AZL_INFRASTRUCTURE_FILE -OutputDirectory "$env:RUNNER_TEMP/iac" -Target Ansible
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -Path "$env:RUNNER_TEMP/iac/ansible/inventory/*" -Destination "$env:ANSIBLE_ROOT/inventory" -Recurse -Force

      - name: Run Monitoring Setup
        working-directory: ${{ env.ANSIBLE_ROOT }}
        run: ansible-playbook -i inventory/hosts.yml playbooks/04-monitoring-setup.yml

  # A change was asked for, but the approval environment is not set: the job that changes something does not run (it needs the variable named below), and this job fails and says why.
  # Nothing is sent to any machine. Azure DevOps does the same with the stage ApprovalEnvironmentNotSet.
  approval-environment-not-set:
    name: Refuse, no approval environment is set
    needs: [terraform-plan]
    if: ${{ vars.AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT == '' }}
    runs-on: [self-hosted, "${{ vars.AZL_RUNNER_OS }}", "${{ vars.AZL_RUNNER_LABEL }}"]
    # Prints one message and stops: the toolkit's limit, not a figure from Microsoft.
    timeout-minutes: 5
    steps:
      - name: No approval environment is set, so nothing is changed
        shell: pwsh
        run: |
          Write-Error 'AZL_ENVIRONMENT_TERRAFORM_DEPLOYMENT (devops.pipelines.environments.terraform_deployment) is empty, and the jobs that apply the reviewed plan and run the on-premises Ansible plays change a system, so they do not run without an approval environment. Set the variable with task 05 of the CI/CD setup, then run again. Nothing was changed.' -ErrorAction Continue
          exit 1
