# =============================================================================
# Ansible group variables, written by config/variables/scripts/New-IacVariableFiles.ps1 from
# infrastructure.yml. Do not edit: change the file and write this one again.
# No secret is in this file. The variables named at the end are passed at run time.
# =============================================================================

azure_tenant_id: 00000000-0000-0000-0000-000000000000
azure_location: eastus
azure_cloud: public
azure_cloud_endpoints:
  public:
    arm_cloud_name: AzureCloud
    login_endpoint: https://login.microsoftonline.com
    resource_manager_endpoint: https://management.azure.com
    arc_his_dns_suffix: his.arc.azure.com
    arc_guest_notification_endpoint: https://guestnotificationservice.azure.com
    key_vault_dns_suffix: vault.azure.net
    arc_dns_zones:
    - his.arc.azure.com
    - guestconfiguration.azure.com
    - guestnotificationservice.azure.com
    - dp.kubernetesconfiguration.azure.com
    - servicebus.windows.net
  government:
    arm_cloud_name: AzureUSGovernment
    login_endpoint: https://login.microsoftonline.us
    resource_manager_endpoint: https://management.usgovcloudapi.net
    arc_his_dns_suffix: his.arc.azure.us
    arc_guest_notification_endpoint: https://guestnotificationservice.azure.us
    key_vault_dns_suffix: vault.usgovcloudapi.net
    arc_dns_zones:
    - his.arc.azure.us
    - guestconfiguration.azure.us
    - guestnotificationservice.azure.us
    - dp.kubernetesconfiguration.azure.us
    - servicebus.usgovcloudapi.net
azure_subscription_azure_local: 00000000-0000-0000-0000-000000000000
cluster_name: iic-azl-01
cluster_resource_group: rg-iic-azl-01
ad_domain_fqdn: improbability.cloud
ad_netbios_name: IIC
lcm_username: lcm-iic-azl-01
lcm_password_key_vault_name: kv-iic-mgmt-01
lcm_password_secret_name: lcm-password
domain_admin_username: IIC\lcm-iic-azl-01
onprem_domain_join_ou: OU=iic-azl-01,OU=AzureLocal,DC=improbability,DC=cloud
security_groups:
- name: sg-iic-azl-01-admins
  purpose: Administrators of the instance
  local_groups:
  - Administrators
hci_insights_enabled: true
azure_dns_forwarder_ip: 168.63.129.16
cicd_runner_platform: github
ad_precreate_computer_objects: false
arc_proxy: ""
arc_gateway_id: ""
cicd_runner_scm_url: https://github.com/improbability-cloud

# lcm_password: not written. The file holds the reference at identity.active_directory.lcm_user.password. The AD preparation role reads it from Key Vault (lcm_password_key_vault_name, lcm_password_secret_name). Pass it with -e @vault.yml (Ansible Vault) only when the file holds another kind of reference than a Key Vault one.
# domain_admin_password: not written. The file holds the reference at identity.active_directory.domain_join_account.password or identity.active_directory.lcm_user.password. Pass it with -e @vault.yml (Ansible Vault) at run time.
# spn_client_secret: not written. The file holds the reference at devops.authentication.client_secret. Pass it with -e @vault.yml (Ansible Vault) at run time.
