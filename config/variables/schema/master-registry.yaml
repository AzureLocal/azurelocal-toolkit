    azl_rbac_validate_before_deployment:
      category: "identity"
      subcategory: "rbac"
      type: boolean
      description: "Validate RBAC assignments before starting Azure Local deployment"
      required: false
      default: true
      note: "Recommended to prevent deployment failures due to missing permissions"

    # Hardware Management Interfaces (iDRAC/BMC)
    account_idrac_username:
      type: string
      description: "iDRAC/BMC username (stored in Key Vault)"
      required: false
      sensitive: true
      example: "root"
      note: "Typically 'root' for Dell iDRAC, 'Administrator' for HPE iLO"

    account_idrac_password:
      type: string
      description: "iDRAC/BMC password (Key Vault reference)"
      required: false
      sensitive: true
      pattern: "^keyvault://[a-z0-9-]+/.+$"
      example: "keyvault://kv-azlc-mgmt/idrac-password"

    # iDRAC VNC Remote Console Settings
    idrac_vnc_enabled:
      type: boolean
      description: "Enable VNC on iDRAC for remote console access"
      required: false
      default: true
      example: true
      note: "Enables third-party VNC client access to iDRAC virtual console"

    idrac_vnc_port:
      type: integer
      description: "VNC port number for iDRAC virtual console"
      required: false
      default: 5901
      example: 5901
      note: "Standard VNC port offset from 5900"

    idrac_vnc_timeout:
      type: integer
      description: "VNC session timeout in seconds"
      required: false
      default: 1800
      example: 1800
      note: "30 minutes default timeout for VNC sessions"

    idrac_vnc_password:
      type: string
      description: "VNC password for third-party VNC clients (8 character max)"
      required: false
      sensitive: true
      maxLength: 8
      example: "keyvault://kv-iic-mgmt/idrac-vnc-password"
      note: "Dell iDRAC VNC passwords are limited to 8 characters — store in Key Vault, never plaintext"

    idrac_vnc_password_secret:
      type: string
      description: "VNC password Key Vault reference"
      required: false
      sensitive: true
      pattern: "^keyvault://[a-z0-9-]+/.+$"
      example: "keyvault://kv-azlc-mgmt/idrac-vnc-password"

    # Cloud Witness Storage Account Key
    cloud_witness_storage_key:
      type: string
      description: "Cloud witness storage account access key (Key Vault reference)"
      required: false
      sensitive: true
      pattern: "^keyvault://[a-z0-9-]+/.+$"
      example: "keyvault://kv-azlc-mgmt/cloud-witness-storage-key"
  # ─── active_directory ───
  active_directory:
    _meta:
      solutions: ["all"]
      tier: required
      description: "AD DS domain integration — included in all solutions"
    ad_enabled:
      category: "identity"
      subcategory: "active-directory"
      type: boolean
      description: "Active Directory enabled"
      required: false
      default: true

    ad_domain:
      category: "identity"
      subcategory: "active-directory"
      type: string
      description: "Active Directory domain (short name)"
      required: false
      example: "azlocal"

    ad_domain_fqdn:
      category: "identity"
      subcategory: "active-directory"
      type: string
      description: "Active Directory domain FQDN"
      required: false
      example: "azlocal.mgmt"

    ad_netbios_name:
      category: "identity"
      subcategory: "active-directory"
      type: string
      description: "Active Directory NetBIOS name"
      required: false
      maxLength: 15
      pattern: "^[A-Z][A-Z0-9-]*$"
      example: "MGMT"

    ad_ou_path:
      category: "identity"
      subcategory: "active-directory"
      type: string
      description: "Active Directory OU path"
      required: false
      example: "OU=MGMT,DC=azlocal,DC=mgmt"

    ad_computers_ou_path:
      category: "identity"
      subcategory: "active-directory"
      type: string
      description: "Active Directory computers OU path"
      required: false
      example: "OU=Computers,OU=MGMT,DC=azlocal,DC=mgmt"

    ad_servers_ou_path:
      type: string
      description: "Active Directory servers OU path"
      required: false
      example: "OU=Servers,OU=MGMT,DC=azlocal,DC=mgmt"

    ad_clusters_ou_path:
      type: string
      description: "Active Directory OU path for Azure Local cluster instance"
      required: false
      example: "OU=AzureLocal-Cluster01,OU=AzureLocal,OU=Clusters,OU=Clusters,OU=MGMT,DC=azlocal,DC=mgmt"

    ad_service_accounts_ou_path:
      type: string
      description: "Active Directory service accounts OU path"
      required: false
      example: "OU=ServiceAccounts,OU=MGMT,DC=azlocal,DC=mgmt"

    # ─── Nested structural aliases ───
    domain:
      type: object
      description: "Domain configuration (nested alias for ad_domain_fqdn, ad_netbios_name)"
      fqdn:
        type: string
        description: "Domain FQDN (alias for ad_domain_fqdn)"
        alias_for: ad_domain_fqdn
      netbios:
        type: string
        description: "Domain NetBIOS name (alias for ad_netbios_name)"
        alias_for: ad_netbios_name

    fqdn:
      type: string
      description: "Domain FQDN shorthand (alias for ad_domain_fqdn)"
      alias_for: ad_domain_fqdn

    organizational_units:
      type: object
      description: "Organizational unit paths"
      servers:
        type: string
        description: "Servers OU path (alias for ad_servers_ou_path)"
        alias_for: ad_servers_ou_path

    ad_dns_servers:
      type: array
      description: "Active Directory DNS server IP addresses"
      required: true
      items:
        type: string
      format: ipv4
      example:
      - "10.100.1.36"
      - "10.100.1.37"

    ad_dns_server_fqdns:
      type: array
      description: "Active Directory DNS server FQDNs (for NTP, replication, etc.)"
      required: false
      items:
        type: string
      example:
      - "azlc-dc01.azlocal.cloud"
      - "azlc-dc02.azlocal.cloud"

    # ─── Security Groups ─────────────────────────────────────────────────────
    # Naming convention: SG-{org_prefix}-{cluster_id}-AZL-{role}
    # Example: SG-IIC-clus01-AZL-Administrators
    # WAC groups (wac_admins, wac_users) are assigned on the WAC server ONLY
    # — they are NOT applied to cluster nodes.
    security_groups_by_role:
      deprecated: true
      replaced_by: "identity.active_directory.security_groups"
      alias_for: "identity.active_directory.security_groups"
      expires_on: "2027-05-07"
      org_prefix:
        type: string
        description: "Organisation abbreviation used in AD group names"
        required: true
        example: "IIC"
        note: "Group names follow: SG-{org_prefix}-{cluster_id}-AZL-{role}"
      cluster_id:
        type: string
        description: "Cluster short name — makes security groups unique per cluster in the domain"
        required: true
        example: "clus01"
      azure_local_admins:
        type: object
        description: "Full administrative access to cluster nodes"
        required: true
        properties:
          name:         { type: string, example: "SG-IIC-clus01-AZL-Administrators" }
          local_groups: { type: array,  example: ["Administrators"] }
          members:      { type: string }
      operations:
        type: object
        description: "RDP and PSRemoting — manage services and monitor nodes; no full admin"
        required: false
        properties:
          name:         { type: string, example: "SG-IIC-clus01-AZL-Operations" }
          local_groups: { type: array,  example: ["Remote Management Users", "Remote Desktop Users"] }
          members:      { type: string }
      read_only:
        type: object
        description: "RDP view, perf counters, event logs — cannot PSRemote or change config"
        required: false
        properties:
          name:         { type: string, example: "SG-IIC-clus01-AZL-ReadOnly" }
          local_groups: { type: array,  example: ["Remote Desktop Users", "Performance Monitor Users", "Event Log Readers"] }
          members:      { type: string }
      wac_admins:
        type: object
        description: "WAC full admin — assigned on WAC server only, NOT on cluster nodes"
        required: false
        properties:
          name:         { type: string, example: "SG-IIC-clus01-AZL-WAC-Administrators" }
          local_groups: { type: array,  example: [], note: "Assigned on WAC server — not applied to cluster nodes" }
          members:      { type: string }
      wac_users:
        type: object
        description: "WAC standard users — assigned on WAC server only, NOT on cluster nodes"
        required: false
        properties:
          name:         { type: string, example: "SG-IIC-clus01-AZL-WAC-Users" }
          local_groups: { type: array,  example: [], note: "Assigned on WAC server — not applied to cluster nodes" }
          members:      { type: string }
      hyperv_admins:
        type: object
        description: "Hyper-V VM management via PSRemoting — no node-level admin rights"
        required: false
        properties:
          name:         { type: string, example: "SG-IIC-clus01-AZL-HyperV-Administrators" }
          local_groups: { type: array,  example: ["Hyper-V Administrators", "Remote Management Users"] }
          members:      { type: string }
      storage_admins:
        type: object
        description: "CSV and Storage Spaces Direct management — requires local admin"
        required: false
        properties:
          name:         { type: string, example: "SG-IIC-clus01-AZL-Storage-Administrators" }
          local_groups: { type: array,  example: ["Administrators"] }
          members:      { type: string }

    ad_domain_controller_01_name:
      type: string
      description: "Active Directory Domain Controller 01 hostname"
      required: false
      maxLength: 15
      example: "AZLC-DC01"

    ad_domain_controller_02_name:
      type: string
      description: "Active Directory Domain Controller 02 hostname"
      required: false
      maxLength: 15
      example: "AZLC-DC02"
    # --- infrastructure.yml schema 5.x variables (registry 4.1.0) ---
    properties:
      domain_fqdn:
        description: "ARM domainFqdn."
        type: string
        required: true
        pattern: "^[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)+$"
        example: "improbability.cloud"
        used_by: [os_configuration, deployment]
      netbios_name:
        description: "Up to 15 letters, digits and hyphens."
        type: string
        format: netbios_name
        required: false
        pattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,14}$"
        example: "IIC"
        used_by: [deployment]
      ou_path:
        description: "Distinguished name of the dedicated OU. ARM adouPath. https://learn.microsoft.com/azure/azure-local/deploy/deployment-prep-active-directory"
        type: string
        required: true
        pattern: "^[Oo][Uu]=.+,[Dd][Cc]=.+$"
        example: "OU=iic-azl-01,OU=AzureLocal,DC=improbability,DC=cloud"
        used_by: [os_configuration, deployment]
      lcm_user:
        description: "The LCM deployment user, created in the OU by the AD preparation module. ARM AzureStackLCMAdminUsername and AzureStackLCMAdminPassword."
        type: object
        required: true
        used_by: [deployment]
        additionalProperties: false
        properties:
          username:
            description: "Name only, no domain. Up to 20 characters."
            type: string
            required: true
            pattern: "^[^@\\\\]+$"
            minLength: 1
            maxLength: 20
            example: "lcm-iic-azl-01"
          password:
            description: "At least 14 characters with lowercase, uppercase, a digit and a special character."
            type: string
            format: kv_ref
            sensitive: true
            required: true
            pattern: "^keyvault://[A-Za-z][A-Za-z0-9-]{1,22}[A-Za-z0-9]/[A-Za-z0-9-]{1,127}$"
            example: "keyvault://kv-iic-mgmt-01/lcm-password"
      domain_join_account:
        description: "Optional override. The OS configuration run joins each machine to the domain (Add-Computer) before the cluster validation and deployment with the LCM user (lcm_user), which Microsoft's Active Directory preparation gives the right to create and delete computer objects in the dedicated OU and which is the account used for domain-join actions. Set this only when your site joins machines with another account; it needs the same rights on ou_path. (since 5.5)"
        type: object
        required: false
        used_by: [os_configuration]
        additionalProperties: false
        properties:
          username:
            description: "The join account: a name (svc-azl-join, qualified with netbios_name), NETBIOS\\name or name@domain. (since 5.5)"
            type: string
            required: true
            minLength: 1
            used_by: [os_configuration]
          password:
            description: "A Key Vault secret reference. The toolkit reads it on the machine that runs the OS configuration, passes it to the node as a secret and never writes it to disk, a log, the event feed or the report. (since 5.5)"
            type: string
            format: kv_ref
            sensitive: true
            required: true
            pattern: "^keyvault://[A-Za-z][A-Za-z0-9-]{1,22}[A-Za-z0-9]/[A-Za-z0-9-]{1,127}$"
            used_by: [os_configuration]
      local_admin_members:
        description: "Domain principals the OS configuration adds to the local Administrators group of every machine after the join and the restart, so a domain account can be used for remoting and log access (a domain account is not a local administrator by default; the deployment adds the LCM user itself later). Names without the domain; users and groups. Default: the security_groups entries whose purpose says they administer the instance, and the LCM user. (since 5.5)"
        type: array
        required: false
        used_by: [os_configuration]
        items:
          {"type":"string","minLength":1}
      join_options:
        description: "How the OS configuration run joins the machines to the domain. Optional. (since 5.5)"
        type: object
        required: false
        used_by: [os_configuration]
        additionalProperties: false
        properties:
          rename_after_join:
            description: "Fixed to false: the machine gets its final name before it joins (the Hostname step runs first) and is never renamed after. (since 5.5)"
            type: boolean
            required: false
            default: false
            const: false
            example: false
            used_by: [os_configuration]
          allow_ou_move:
            description: "true: before the deployment, a machine already joined to this domain but sitting in another OU is moved into ou_path. false (default): it is reported as blocked and left where it is. Microsoft does not support moving the computer objects to another OU after the deployment, so a machine that is already part of a cluster is never moved, whatever this says. (since 5.5)"
            type: boolean
            required: false
            default: false
            example: false
            used_by: [os_configuration]
      domain_controllers:
        description: "Addresses of domain controllers, for pre-checks and for the domain join. They must be the DNS servers of the management port (rule AZL-052): the machines find the domain through them."
        type: array
        required: false
        example: [["192.0.2.4", "192.0.2.5"]]
        used_by: [os_configuration]
        items:
          {"format":"ipv4","type":"string","pattern":"^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$"}
      security_groups:
        description: "Groups created in the OU for administration of the instance."
        type: array
        required: false
        items:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              required: true
              example: "sg-iic-azl-01-admins"
            purpose:
              type: string
              required: false
              example: "Administrators of the instance"
            members:
              type: array
              required: false
              items:
                {"type":"string"}
            local_groups:
              description: "Schema 5.6.1. The local groups of every machine this AD group is added to after the deployment (for example Administrators, Remote Management Users). Empty or missing: the group is not added to any local group (WAC groups are applied on the WAC server only). Read by the post-deployment task that applies the security groups and by the Ansible AD preparation role."
              type: array
              since: "5.6.1"
              required: false
              used_by: [os_configuration]
              items:
                {"type":"string","minLength":1}
      service_accounts:
        description: "Service and administration accounts, apart from the LCM user."
        type: array
        required: false
        items:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              required: true
              example: "svc-iic-azl-backup"
            purpose:
              type: string
              required: false
              example: "Backup agent"
            password:
              description: "A Key Vault secret reference: keyvault://<vault>/<secret>. The vault must be listed in key_vaults."
              type: string
              format: kv_ref
              sensitive: true
              required: false
              pattern: "^keyvault://[A-Za-z][A-Za-z0-9-]{1,22}[A-Za-z0-9]/[A-Za-z0-9-]{1,127}$"
              example: "keyvault://kv-iic-mgmt-01/svc-backup-password"
  # ─── managed_identities ───
  managed_identities:
    _meta:
      solutions: ["azure-local", "avd-azure-local"]
      tier: optional
      description: "User/system-assigned managed identities for RBAC"
    mi_user_assigned:
      description: "User-assigned managed identities"
      type: array
      required: false
      items:
        type: object
        properties:
          name: { type: string }
          resource_group: { type: string }
          subscription: { type: string }
          client_id: { type: string }
          principal_id: { type: string }
    mi_system_assigned:
      description: "System-assigned managed identities tracked for RBAC"
      type: array
      required: false
      items:
        type: object
        properties:
          resource_name: { type: string }
          principal_id: { type: string }
          role_assignments: { type: array }

  # ─── service_principal ───
  service_principal:
    _meta:
      solutions: ["azure-local", "avd-azure-local"]
      tier: optional
      description: "Service principal for deployment automation"
    name:
      type: string
      description: "Service principal display name"
      required: false
      example: "spn-azlc-deployment"
    client_id:
      type: string
      description: "Service principal client/application ID"
      required: false
      format: uuid
    app_id:
      type: string
      description: "Service principal application ID (alias for client_id)"
      required: false
      format: uuid
      alias_for: client_id
    object_id:
      type: string
      description: "Service principal object ID"
      required: false
      format: uuid
    secret:
      type: string
      description: "Service principal secret (Key Vault reference)"
      required: false
      sensitive: true
    roles:
      type: object
      description: "Role assignments for service principal"
      subscription:
        type: string
        description: "Subscription-level role assignment"
        required: false
        example: "Contributor"
      resource_group:
        type: string
        description: "Resource group-level role assignment"
        required: false
        example: "Contributor"

  # ─── break_glass_account_ids ───
  break_glass_account_ids:
    type: array
    description: "Emergency break-glass account object IDs"
    required: false
    items:
      type: string
      format: uuid

  # ─── b2b_configuration ───
  b2b_configuration:
    # ---------------------------------------------------------------------------
    # Azure Local Cloud MANAGEMENT TENANT (Source Tenant)
    # ---------------------------------------------------------------------------
    Azure Local Cloud_mgmt:
      b2b_Azure Local Cloud_mgmt_tenant_id:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Azure Local Cloud MGMT tenant ID (source tenant for cross-tenant sync)"
        required: true
        format: uuid
        example: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    
      b2b_Azure Local Cloud_mgmt_display_name:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Azure Local Cloud MGMT tenant display name"
        required: true
        example: "Azure Local Cloud MGMT"
    
      b2b_Azure Local Cloud_mgmt_primary_domain:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Azure Local Cloud MGMT tenant primary domain"
        required: true
        pattern: "^[a-z0-9-]+\\.onmicrosoft\\.com$"
        example: "Azure Local Cloud.onmicrosoft.com"

    # ---------------------------------------------------------------------------
    # TARGET TENANT (Customer/Destination Tenant)
    # ---------------------------------------------------------------------------
    target_tenant:
      b2b_target_tenant_id:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Target (customer) tenant ID for cross-tenant sync"
        required: true
        format: uuid
        example: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    
      b2b_target_display_name:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Target tenant display name"
        required: true
        example: "Customer Production"
    
      b2b_target_primary_domain:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Target tenant primary domain"
        required: true
        pattern: "^[a-z0-9-]+\\.onmicrosoft\\.com$"
        example: "customer.onmicrosoft.com"

    # ---------------------------------------------------------------------------
    # SERVICE TIER CONFIGURATION
    # ---------------------------------------------------------------------------
    service_configuration:
      b2b_service_tier:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Service tier purchased by customer (determines which groups are synced)"
        required: true
        allowedValues:
          - Professional
          - Premium
        default: "Professional"
        example: "Professional"
    
      b2b_additional_services:
        category: "identity"
        subcategory: "b2b-configuration"
        type: array
        description: "Additional services purchased beyond base tier"
        required: false
        items:
          type: string
        allowedValues:
          - SOC
          - AES
        example: ["SOC"]

    # ---------------------------------------------------------------------------
    # CROSS-TENANT SYNC TEMPLATE
    # ---------------------------------------------------------------------------
    cts_configuration:
      b2b_cts_template_id:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Cross-tenant synchronization template ID (Azure2Azure template)"
        required: true
        format: uuid
        default: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
        example: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
        note: "Default Azure2Azure CTS template ID from Microsoft"

    # ---------------------------------------------------------------------------
    # SERVICE TIER GROUPS (Source Groups in Azure Local Cloud MGMT)
    # ---------------------------------------------------------------------------
    service_tier_groups:
      b2b_source_groups_professional:
        category: "identity"
        subcategory: "b2b-configuration"
        type: array
        description: "Azure Local Cloud MGMT groups synced for Professional tier"
        required: false
        items:
          type: string
        example:
          - "Public Cloud Services"
          - "Public Cloud Support"
          - "Public Cloud Implementation Engineering"
    
      b2b_source_groups_premium:
        category: "identity"
        subcategory: "b2b-configuration"
        type: array
        description: "Azure Local Cloud MGMT groups synced for Premium tier (includes Professional + Premium)"
        required: false
        items:
          type: string
        example:
          - "Public Cloud Services"
          - "Public Cloud Support"
          - "Public Cloud Implementation Engineering"
          - "Public Cloud Premium"
    
      b2b_source_groups_admins:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Azure Local Cloud tenant group for admin-level sync (highest access)"
        required: false
        example: "TRP-ENG-HCS-L3"
    
      b2b_source_groups_contributors:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Azure Local Cloud tenant group for contributor-level sync"
        required: false
        example: "TRP-ENG-HCS-L2"
    
      b2b_source_groups_readers:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Azure Local Cloud tenant group for reader-level sync"
        required: false
        example: "TRP-ENG-HCS"
    
      b2b_source_groups_premium_team:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Azure Local Cloud tenant group for premium services team sync"
        required: false
        example: "TRP-ENG-HCS-PREMIUM"
        note: "Single group reference - see b2b_source_groups_premium for array of Premium tier groups"

    # ---------------------------------------------------------------------------
    # ADDITIONAL SERVICE GROUPS
    # ---------------------------------------------------------------------------
    additional_service_groups:
      b2b_additional_service_groups_soc:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Azure Local Cloud group for SOC services"
        required: false
        example: "SOC"
    
      b2b_additional_service_groups_aes:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Azure Local Cloud group for Advanced Engineering Services"
        required: false
        example: "SEC-SD Advanced Services"

    # ---------------------------------------------------------------------------
    # CUSTOMER TENANT GROUPS (Target Groups)
    # ---------------------------------------------------------------------------
    customer_groups:
      b2b_bootstrap_group_name:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Customer tenant bootstrap group (standard security group)"
        required: false
        default: "Azure Local Cloud"
        example: "Azure Local Cloud"
        note: "Initial group for Azure Local Cloud access before tiered groups are created"
    
      b2b_tiered_groups_admins:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Customer tenant admin group (role-assignable)"
        required: false
        example: "azl-b2b-env-admins"
        note: "Created with IsAssignableToRole:true for Entra directory role assignment"
    
      b2b_tiered_groups_contributors:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Customer tenant contributor group (role-assignable)"
        required: false
        example: "azl-b2b-env-contributors"
    
      b2b_tiered_groups_readers:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Customer tenant reader group (role-assignable)"
        required: false
        example: "azl-b2b-env-readers"

    # ---------------------------------------------------------------------------
    # SERVICE PRINCIPAL CONFIGURATION
    # ---------------------------------------------------------------------------
    service_principal:
      b2b_service_principal_name:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Service principal name for CI/CD automation in customer tenant"
        required: false
        example: "Azure Local Cloud-cicd"
    
      b2b_source_domain:
        category: "identity"
        subcategory: "b2b-configuration"
        type: string
        description: "Domain pattern for synced users (appears in UPN suffix)"
        required: false
        example: "azurelocalcloud.com"

    # ---------------------------------------------------------------------------
    # TRUST SETTINGS
    # ---------------------------------------------------------------------------
    trust_settings:
      b2b_trust_accept_mfa:
        category: "identity"
        subcategory: "b2b-configuration"
        type: boolean
        description: "Accept MFA claims from source tenant"
        required: false
        default: true
    
      b2b_trust_accept_compliant_devices:
        category: "identity"
        subcategory: "b2b-configuration"
        type: boolean
        description: "Accept compliant device claims from source tenant"
        required: false
        default: true
    
      b2b_trust_accept_hybrid_joined_devices:
        category: "identity"
        subcategory: "b2b-configuration"
        type: boolean
        description: "Accept hybrid Azure AD joined device claims from source tenant"
        required: false
        default: true
    
      b2b_trust_auto_redeem_invitations:
        category: "identity"
        subcategory: "b2b-configuration"
        type: boolean
        description: "Automatically redeem invitations for seamless access"
        required: false
        default: true
  # --- infrastructure.yml schema 5.x variables (registry 4.1.0) ---
  properties:
    local_admin:
      description: "The deployment's local administrator on every machine. Not the built-in Administrator: the deployment renames it. ARM localAdminUserName and localAdminPassword."
      type: object
      required: true
      used_by: [ztp, os_configuration, deployment]
      additionalProperties: false
      properties:
        username:
          type: string
          required: true
          minLength: 1
          example: "azl-admin"
          used_by: [ztp, os_configuration]
          schema_extra: {"not":{"type":"string","pattern":"^([Aa][Dd][Mm][Ii][Nn][Ii][Ss][Tt][Rr][Aa][Tt][Oo][Rr]|[Gg][Uu][Ee][Ss][Tt])$"}}
        password:
          description: "At least 14 characters with lowercase, uppercase, a digit and a special character."
          type: string
          format: kv_ref
          sensitive: true
          required: true
          pattern: "^keyvault://[A-Za-z][A-Za-z0-9-]{1,22}[A-Za-z0-9]/[A-Za-z0-9-]{1,127}$"
          example: "keyvault://kv-iic-mgmt-01/local-admin-password"
          used_by: [ztp, os_configuration]
    local_identity:
      description: "Local identity with Key Vault. The instance's secrets go to cluster.key_vault."
      type: object
      required: false
      applies_when: "scenario.identity is local_identity"
      additionalProperties: false
      properties:
        dns_server_config:
          description: "ARM dnsServerConfig: use_dns_server (UseDnsServer) or use_forwarder (UseForwarder)."
          required: true
          enum: ["use_dns_server", "use_forwarder"]
          used_by: [deployment]
        dns_zone:
          type: string
          required: false
        dns_forwarders:
          type: array
          required: false
          items:
            {"format":"ipv4","type":"string","pattern":"^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$"}
    entra:
      description: "Entra ID groups, role assignments and PIM."
      type: object
      required: false
      additionalProperties: false
      properties:
        groups:
          type: array
          required: false
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                required: true
                example: "grp-iic-azl-operators"
              purpose:
                type: string
                required: false
                example: "Operate the instance"
              roles:
                description: "Azure role names assigned to the group."
                type: array
                required: false
                example: [["Azure Stack HCI Administrator"]]
                items:
                  {"type":"string"}
              scope:
                description: "Scope of the role assignments."
                type: string
                required: false
                example: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-iic-azl-01"
        break_glass_accounts:
          description: "User principal names of emergency access accounts, excluded from Conditional Access."
          type: array
          required: false
          example: [["breakglass01@improbability.cloud"]]
          items:
            {"type":"string"}

  # =============================================================================
  # GITLAB CI/CD CONFIGURATION
  # =============================================================================
  # GitLab CI/CD configuration for automated deployments.
  #
  # RELATED SECTIONS:
  #   - service_principals: Azure service principal for GitLab runners
  #   - keyvault: Secret storage for GitLab variables

# =============================================================================
# 8. NETWORKING
# =============================================================================
networking:
  # ═══════════════════════════════════════
  # AZURE NETWORKING
  # ═══════════════════════════════════════
  azure:
    _meta:
      solutions: ["all"]
      tier: required
      description: "Azure cloud networking (hub-spoke, VNets, subnets, NSGs) — included in all solutions"
    # ─── hub_spoke ───
    hub_spoke:
      hub_vnet_name:
        category: "networking"
        subcategory: "hub-spoke"
        type: string
        description: "Hub virtual network name"
        required: false
        pattern: "^vnet-[a-z0-9-]+$"
        example: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"

      vnet_name:
        type: string
        description: "VNet name shorthand (alias for hub_vnet_name)"
        required: false
        alias_for: hub_vnet_name

      hub_vnet_address_space:
        category: "networking"
        subcategory: "hub-spoke"
        type: array
        description: "Hub VNet address space (CIDR)"
        required: false
        items:
          type: string
        format: cidr
        example:
          - "192.168.0.0/16"

      hub_resource_group:
        category: "networking"
        subcategory: "hub-spoke"
        type: string
        description: "Hub resource group name"
        required: false
        pattern: "^rg-[a-z0-9-]+$"
        example: "rg-azlc-AzureLocalCloud-eus-connectivity-hub"

      hub_subscription:
        category: "networking"
        subcategory: "hub-spoke"
        type: string
        description: "Hub VNet subscription ID"
        required: false
        format: uuid
        example: "00000000-1111-2222-3333-444444444444"

      hub_location:
        type: string
        description: "Hub VNet location"
        required: false
        example: "East US"

      hub_enable_ddos_protection:
        type: boolean
        description: "Enable DDoS protection on hub VNet"
        required: false
        default: false

      hub_ddos_protection_plan_id:
        type: string
        description: "DDoS protection plan resource ID for hub"
        required: false
        depends_on:
        - variable: "hub_enable_ddos_protection"
          condition: "equals: true"
          message: "DDoS protection plan ID required when DDoS protection is enabled"
        format: azure_resource_id
        example: "/subscriptions/00000000-1111-2222-3333-444444444444/resourceGroups/rg-azlc-AzureLocalCloud-eus-connectivity-hub/providers/Microsoft.Network/ddosProtectionPlans/ddos-plan-azlc"

      hub_tags:
        type: object
        description: "Tags for hub VNet resources"
        required: false
        example:
          environment: "prod"
          function: "connectivity-hub"
          cost_center: "IT-Infrastructure"

      hub_gateway_subnet_name:
        type: string
        description: "Gateway subnet name"
        required: false
        default: "GatewaySubnet"

      hub_gateway_subnet_address:
        type: string
        description: "Gateway subnet address prefix (CIDR)"
        required: false
        format: cidr
        example: "192.168.0.0/24"

      hub_bastion_subnet_name:
        type: string
        description: "Bastion subnet name"
        required: false
        default: "AzureBastionSubnet"

      hub_bastion_subnet_address:
        type: string
        description: "Bastion subnet address prefix (CIDR)"
        required: false
        format: cidr
        example: "192.168.1.0/26"

      hub_firewall_subnet_name:
        type: string
        description: "Firewall subnet name"
        required: false
        default: "AzureFirewallSubnet"

      hub_firewall_subnet_address:
        type: string
        description: "Firewall subnet address prefix (CIDR)"
        required: false
        format: cidr
        example: "192.168.2.0/26"

      hub_management_subnet_name:
        type: string
        description: "Management subnet name"
        required: false
        pattern: "^snet-[a-z0-9-]+$"
        example: "snet-azlc-AzureLocalCloud-eus-connectivity-mgmt"

      hub_privateendpoint_subnet_name:
        type: string
        description: "Private endpoint subnet name"
        required: false
        pattern: "^snet-[a-z0-9-]+$"
        example: "snet-azlc-AzureLocalCloud-eus-connectivity-pep"

      hub_privateendpoint_subnet_address:
        type: string
        description: "Private endpoint subnet address prefix (CIDR)"
        required: false
        format: cidr
        example: "192.168.3.0/24"

      hub_monitoring_subnet_name:
        type: string
        description: "Monitoring subnet name"
        required: false
        pattern: "^snet-[a-z0-9-]+$"
        example: "snet-azlc-AzureLocalCloud-eus-connectivity-monitoring"

      hub_monitoring_subnet_address:
        type: string
        description: "Monitoring subnet address prefix (CIDR)"
        required: false
        format: cidr
        example: "192.168.4.0/24"

      hub_route_server_subnet_name:
        type: string
        description: "Azure Route Server subnet name (must be RouteServerSubnet)"
        required: false
        default: "RouteServerSubnet"

      hub_route_server_subnet_address:
        type: string
        description: "Route Server subnet address prefix (CIDR, minimum /27)"
        required: false
        format: cidr
        example: "192.168.5.0/27"

      hub_enable_route_server:
        type: boolean
        description: "Enable Azure Route Server in hub for BGP route propagation"
        required: false
        default: false

      hub_route_server_name:
        type: string
        description: "Azure Route Server name"
        required: false
        depends_on:
        - variable: "hub_enable_route_server"
          condition: "equals: true"
          message: "Route Server name required when Route Server is enabled"
        pattern: "^routeserver-[a-z0-9-]+$"
        example: "routeserver-azlc-AzureLocalCloud-eus"

      hub_route_server_allow_branch_to_branch:
        type: boolean
        description: "Allow branch-to-branch traffic through Route Server"
        required: false
        depends_on:
        - variable: "hub_enable_route_server"
          condition: "equals: true"
          message: "Branch-to-branch setting only applies when Route Server is enabled"
        default: true

      hub_nva_subnet_name:
        type: string
        description: "Network Virtual Appliance subnet name"
        required: false
        pattern: "^snet-[a-z0-9-]+$"
        example: "snet-azlc-AzureLocalCloud-eus-connectivity-nva"

      hub_nva_subnet_address:
        type: string
        description: "NVA subnet address prefix (CIDR)"
        required: false
        format: cidr
        example: "192.168.6.0/24"

      hub_subnets:
        type: array
        description: "Complete array of hub subnets with configurations"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
          address_prefix:
            type: string
            format: cidr
          nsg:
            type: string
          route_table:
            type: string
          service_endpoints:
            type: array
          delegation:
            type: string
        example:
          minimal:
          # Simplest configuration - gateway and bastion only
          - name: "GatewaySubnet"
            address_prefix: "192.168.0.0/24"
          - name: "AzureBastionSubnet"
            address_prefix: "192.168.1.0/26"
      
        standard:
        # Production hub with firewall and management subnet
        - name: "GatewaySubnet"
          address_prefix: "192.168.0.0/24"
        - name: "AzureBastionSubnet"
          address_prefix: "192.168.1.0/26"
        - name: "AzureFirewallSubnet"
          address_prefix: "192.168.2.0/26"
        - name: "snet-azlc-AzureLocalCloud-eus-connectivity-mgmt"
          address_prefix: "192.168.3.0/24"
          nsg: "nsg-azlc-AzureLocalCloud-eus-connectivity-mgmt"
          route_table: "rt-azlc-AzureLocalCloud-eus-mgmt"
      
        complete:
        # Enterprise hub with all services and delegations
        - name: "GatewaySubnet"
          address_prefix: "192.168.0.0/24"
        - name: "AzureBastionSubnet"
          address_prefix: "192.168.1.0/26"
        - name: "AzureFirewallSubnet"
          address_prefix: "192.168.2.0/26"
        - name: "snet-azlc-AzureLocalCloud-eus-connectivity-mgmt"
          address_prefix: "192.168.3.0/24"
          nsg: "nsg-azlc-AzureLocalCloud-eus-connectivity-mgmt"
          route_table: "rt-azlc-AzureLocalCloud-eus-mgmt"
          service_endpoints:
            - "Microsoft.Storage"
            - "Microsoft.KeyVault"
        - name: "snet-azlc-AzureLocalCloud-eus-connectivity-pep"
          address_prefix: "192.168.4.0/24"
          nsg: "nsg-azlc-AzureLocalCloud-eus-connectivity-pep"
        - name: "snet-azlc-AzureLocalCloud-eus-connectivity-apim"
          address_prefix: "192.168.5.0/24"
          delegation: "Microsoft.ApiManagement/service"

      hub_vnet_additional_subnets:
        type: array
        description: "Additional hub subnets"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
            description: "Subnet name"
          address_prefix:
            type: string
            format: cidr
            description: "Subnet address prefix"
        example:
        - name: "snet-custom"
          address_prefix: "192.168.5.0/24"

      hub_enable_virtual_wan:
        type: boolean
        description: "Use Azure Virtual WAN instead of traditional hub-spoke"
        required: false
        default: false

      hub_virtual_wan_name:
        type: string
        description: "Azure Virtual WAN name"
        required: false
        pattern: "^vwan-[a-z0-9-]+$"
        example: "vwan-azlc-AzureLocalCloud"

      hub_virtual_wan_type:
        type: string
        description: "Virtual WAN type"
        required: false
        allowedValues:
        - Basic
        - Standard
        default: "Standard"

      hub_virtual_hub_name:
        type: string
        description: "Virtual WAN hub name"
        required: false
        pattern: "^vhub-[a-z0-9-]+$"
        example: "vhub-azlc-AzureLocalCloud-eus"

      hub_virtual_hub_address_prefix:
        type: string
        description: "Virtual hub address prefix (CIDR, minimum /24)"
        required: false
        format: cidr
        example: "192.168.255.0/24"

      hub_virtual_hub_sku:
        type: string
        description: "Virtual hub SKU"
        required: false
        allowedValues:
        - Basic
        - Standard
        default: "Standard"

      hub_enable_routing_intent:
        type: boolean
        description: "Enable routing intent for Virtual WAN hub"
        required: false
        default: false

      hub_routing_preference:
        type: string
        description: "Hub routing preference"
        required: false
        allowedValues:
        - ExpressRoute
        - VpnGateway
        - ASPath
        default: "ExpressRoute"

      hub_spoke_vnets:
        type: array
        description: "Spoke virtual networks"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
            pattern: "^vnet-[a-z0-9-]+$"
          address_space:
            type: string
            format: cidr
          subscription:
            type: string
            format: uuid
          resource_group:
            type: string
            pattern: "^rg-[a-z0-9-]+$"
        example:
        - name: "vnet-spoke1"
          address_space: "10.1.0.0/16"
          subscription: "sub-id"
          resource_group: "rg-spoke1"

      hub_spoke_vnet_address_range_base:
        type: string
        description: "Base address range for spoke VNets (CIDR)"
        required: false
        format: cidr
        example: "10.0.0.0/8"

      hub_spoke_subnet_address_range_base:
        type: string
        description: "Base address range for spoke subnets (CIDR)"
        required: false
        format: cidr
        example: "10.0.0.0/24"

      hub_spoke_enable_vpn_gateway:
        type: boolean
        description: "Enable VPN gateway in spoke VNets (branch connectivity)"
        required: false
        default: false

      hub_spoke_use_hub_gateway:
        type: boolean
        description: "Spoke VNets use hub gateway for external connectivity"
        required: false
        default: true

      hub_spoke_route_table_name:
        type: string
        description: "Default route table name for spoke subnets"
        required: false
        pattern: "^rt-[a-z0-9-]+$"
        example: "rt-azlc-AzureLocalCloud-eus-spoke-default"

      hub_spoke_nsg_name_prefix:
        type: string
        description: "NSG name prefix for spoke subnets"
        required: false
        pattern: "^nsg-[a-z0-9-]+$"
        example: "nsg-azlc-AzureLocalCloud-eus-spoke"

      hub_spoke_to_spoke_connectivity:
        type: string
        description: "Spoke-to-spoke connectivity method"
        required: false
        allowedValues:
        - None
        - HubFirewall
        - HubNVA
        - RouteServer
        - VirtualWAN
        default: "HubFirewall"

      hub_spoke_default_route_next_hop:
        type: string
        description: "Next hop for default route (0.0.0.0/0) from spokes"
        required: false
        example: "192.168.2.4"

      hub_spoke_default_route_next_hop_type:
        type: string
        description: "Next hop type for spoke default route"
        required: false
        allowedValues:
        - VirtualAppliance
        - VirtualNetworkGateway
        - Internet
        - None
        default: "VirtualAppliance"

      vnet_peering_configurations:
        type: array
        description: "VNet peering configurations"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
          remote_vnet:
            type: string
          allow_forwarded_traffic:
            type: boolean
          allow_gateway_transit:
            type: boolean
          use_remote_gateways:
            type: boolean
        example:
        - name: "peer-hub-to-spoke1"
          remote_vnet: "vnet-spoke1"
          allow_forwarded_traffic: true
          allow_gateway_transit: true
          use_remote_gateways: false

      enable_transit_connectivity:
        type: boolean
        description: "Enable transit connectivity between spokes through hub"
        required: false
        default: true

      transit_nva_name:
        type: string
        description: "Network Virtual Appliance name for transit"
        required: false
        pattern: "^vm-[a-z0-9-]+$"
        example: "vm-azlc-AzureLocalCloud-eus-nva001"

      transit_nva_private_ip:
        type: string
        description: "NVA private IP for routing"
        required: false
        format: ipv4
        example: "192.168.6.4"

      transit_nva_bgp_asn:
        type: integer
        description: "NVA BGP ASN for route propagation"
        required: false
        minimum: 64512
        maximum: 65534
        example: 65001

      enable_forced_tunneling:
        type: boolean
        description: "Force all internet traffic through hub (0.0.0.0/0 to hub)"
        required: false
        default: true

      hub_internet_egress_type:
        type: string
        description: "Method for internet egress from hub"
        required: false
        allowedValues:
        - AzureFirewall
        - NVA
        - NATGateway
        - Direct
        default: "AzureFirewall"

      enable_vnet_injection:
        type: boolean
        description: "Enable VNet injection for Azure services (PaaS integration)"
        required: false
        default: true

      vnet_injection_subnets:
        type: array
        description: "Subnets configured for VNet injection"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
          service:
            type: string
          delegation:
            type: string
        example:
        - name: "snet-azlc-AzureLocalCloud-eus-connectivity-apim"
          service: "API Management"
          delegation: "Microsoft.ApiManagement/service"

      nsg_management_name:
        category: "networking"
        subcategory: "security"
        type: string
        description: "Management NSG name"
        required: false
        pattern: "^nsg-[a-z0-9-]+$"
        example: "nsg-azlc-AzureLocalCloud-eus-connectivity-mgmt"

      nsg_privateendpoint_name:
        category: "networking"
        subcategory: "security"
        type: string
        description: "Private endpoint NSG name"
        required: false
        pattern: "^nsg-[a-z0-9-]+$"
        example: "nsg-azlc-AzureLocalCloud-eus-connectivity-pep"

      dns_zone_resource_group:
        category: "networking"
        subcategory: "dns"
        type: string
        description: "DNS zone resource group"
        required: false
        pattern: "^rg-[a-z0-9-]+$"
        example: "rg-azlc-AzureLocalCloud-eus-connectivity-dns"

      route_tables:
        type: array
        description: "Route tables for UDRs"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
          routes:
            type: array
          disable_bgp_route_propagation:
            type: boolean
          associated_subnets:
            type: array
        example:
          minimal:
          # Simplest - single default route
          - name: "rt-hub"
            routes:
              - name: "default-route"
                address_prefix: "0.0.0.0/0"
                next_hop_type: "Internet"
      
        standard:
        # Production route table with firewall next hop
        - name: "rt-hub"
          disable_bgp_route_propagation: false
          routes:
            - name: "to-firewall"
              address_prefix: "0.0.0.0/0"
              next_hop_type: "VirtualAppliance"
              next_hop_ip: "192.168.2.4"
          associated_subnets:
            - "snet-azlc-AzureLocalCloud-eus-connectivity-mgmt"
      
        complete:
        # Enterprise with multiple routes and subnet associations
        - name: "rt-hub"
          disable_bgp_route_propagation: false
          routes:
            - name: "default-route"
              address_prefix: "0.0.0.0/0"
              next_hop_type: "VirtualAppliance"
              next_hop_ip: "192.168.2.4"
            - name: "to-spoke1"
              address_prefix: "10.1.0.0/16"
              next_hop_type: "VirtualNetworkGateway"
            - name: "to-onprem"
              address_prefix: "10.0.0.0/8"
              next_hop_type: "VirtualAppliance"
              next_hop_ip: "192.168.2.4"
          associated_subnets:
            - "snet-azlc-AzureLocalCloud-eus-connectivity-mgmt"
            - "snet-azlc-AzureLocalCloud-eus-connectivity-pep"

      default_route_table_name:
        type: string
        description: "Default route table for hub-spoke topology"
        required: false
        pattern: "^rt-[a-z0-9-]+$"
        example: "rt-azlc-AzureLocalCloud-eus-default"

      disable_bgp_route_propagation:
        type: boolean
        description: "Disable BGP route propagation on route tables"
        required: false
        default: false

      network_security_groups:
        type: array
        description: "Network security groups for subnets"
        required: false
        items:
          type: object
        properties:
        name:
          type: string
        rules:
          type: array
        example:
        - name: "nsg-web"
          rules:
          - name: "allow-http"
            priority: 100
            direction: "Inbound"
            access: "Allow"

      private_dns_zones:
        type: array
        description: "Private DNS zones"
        required: false
        items:
          type: string
        example:
          - "privatelink.blob.core.windows.net"
          - "privatelink.vaultcore.azure.net"

      private_dns_zone_links:
        type: array
        description: "VNet links for private DNS zones"
        required: false
        items:
          type: object
        properties:
        zone_name:
          type: string
        vnet_name:
          type: string
        registration_enabled:
          type: boolean
        example:
          minimal:
          # Single zone link to hub VNet
          - zone_name: "privatelink.vaultcore.azure.net"
            vnet_name: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"
            registration_enabled: false
      
        standard:
        # Multiple service zones linked to hub
        - zone_name: "privatelink.blob.core.windows.net"
          vnet_name: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"
          registration_enabled: false
        - zone_name: "privatelink.vaultcore.azure.net"
          vnet_name: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"
          registration_enabled: false
        - zone_name: "privatelink.database.windows.net"
          vnet_name: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"
          registration_enabled: false
      
        complete:
        # All Azure service zones with hub and spoke links
        - zone_name: "privatelink.blob.core.windows.net"
          vnet_name: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"
          registration_enabled: false
        - zone_name: "privatelink.vaultcore.azure.net"
          vnet_name: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"
          registration_enabled: false
        - zone_name: "privatelink.database.windows.net"
          vnet_name: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"
          registration_enabled: false
        - zone_name: "privatelink.azurecr.io"
          vnet_name: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"
          registration_enabled: false
        # Spoke VNet link
        - zone_name: "privatelink.blob.core.windows.net"
          vnet_name: "vnet-spoke1"
          registration_enabled: false
        - zone_name: "privatelink.blob.core.windows.net"
          vnet_name: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"
          registration_enabled: false

      enable_private_dns_resolver:
        type: boolean
        description: "Enable Azure DNS Private Resolver in hub"
        required: false
        default: false

      private_dns_resolver_name:
        type: string
        description: "DNS Private Resolver name"
        required: false
        pattern: "^dnspr-[a-z0-9-]+$"
        example: "dnspr-azlc-AzureLocalCloud-eus"

      private_dns_resolver_inbound_endpoint:
        type: string
        description: "Inbound endpoint IP for DNS Private Resolver"
        required: false
        format: ipv4
        example: "192.168.7.4"

      private_dns_resolver_outbound_endpoint:
        type: string
        description: "Outbound endpoint for DNS Private Resolver forwarding rules"
        required: false
        pattern: "^dnspr-[a-z0-9-]+-out$"
        example: "dnspr-azlc-AzureLocalCloud-eus-out"

      nat_gateways:
        type: array
        description: "NAT gateways for outbound connectivity"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
        public_ip_prefixes:
          type: array
        example:
        - name: "nat-gw-spoke1"
          public_ip_prefixes:
          - "pip-prefix1"

      public_ip_prefixes:
        type: array
        description: "Public IP prefixes for scalable IPs"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
        prefix_length:
          type: integer
        example:
        - name: "pip-prefix-bastion"
          prefix_length: 28

      ddos_protection_plans:
        type: array
        description: "DDoS protection plans per VNet"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
        enabled:
          type: boolean
        example:
        - name: "ddos-plan-hub"
          enabled: true

      network_watchers:
        type: array
        description: "Network watchers per region"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
        location:
          type: string
        example:
        - name: "nw-eastus"
          location: "East US"

      enable_network_watcher_flow_logs:
        type: boolean
        description: "Enable NSG flow logs through Network Watcher"
        required: false
        default: false

      enable_connection_monitor:
        type: boolean
        description: "Enable Network Watcher connection monitoring"
        required: false
        default: false

      connection_monitor_workspace:
        type: string
        description: "Log Analytics workspace for connection monitoring"
        required: false
        format: uuid
        example: "12345678-1234-1234-1234-123456789012"

      enable_network_topology_view:
        type: boolean
        description: "Enable Network Watcher topology visualization"
        required: false
        default: true

      hub_spoke_topology_name:
        type: string
        description: "Name/identifier for hub-spoke topology"
        required: false
        example: "azlc-AzureLocalCloud-hub-spoke-topology"
    # ─── vnets ───
    vnets:
      vnet_name:
        type: string
        description: "Virtual network name"
        required: true
        pattern: "^vnet-[a-z0-9-]+$"
        example: "vnet-azlc-AzureLocalCloud-eus-landingzone-prod"

      vnet_address_space:
        type: array
        description: "VNet address space (CIDR)"
        required: true
        items:
          type: string
        format: cidr
        example:
          - "10.0.0.0/16"

      vnet_resource_group:
        type: string
        description: "VNet resource group"
        required: true
        pattern: "^rg-[a-z0-9-]+$"
        example: "rg-azlc-AzureLocalCloud-eus-landingzone-prod"

      vnet_subscription:
        type: string
        description: "VNet subscription ID"
        required: true
        format: uuid
        example: "00000000-1111-2222-3333-444444444444"

      vnet_location:
        type: string
        description: "VNet location"
        required: true
        example: "East US"

      vnet_enable_ddos_protection:
        type: boolean
        description: "Enable DDoS protection plan (requires DDoS protection plan resource)"
        required: false
        default: false

      vnet_ddos_protection_plan_id:
        type: string
        description: "Resource ID of DDoS protection plan (required if enable_ddos_protection is true)"
        required: false
        example: "/subscriptions/00000000-1111-2222-3333-444444444444/resourceGroups/rg-azlc-AzureLocalCloud-eus-connectivity-hub/providers/Microsoft.Network/ddosProtectionPlans/ddos-plan-azlc"

      vnet_enable_vm_protection:
        type: boolean
        description: "Enable VM protection (DDoS standard)"
        required: false
        default: false

      vnet_bgp_community:
        type: string
        description: "BGP community value for advertising routes from this VNet"
        required: false
        pattern: "^[0-9]+:[0-9]+$"
        example: "12076:20001"

      vnet_cidr:
        type: string
        description: "VNet CIDR block"
        required: true
        format: cidr
        example: "10.0.0.0/16"

      subnet_name:
        category: "networking"
        subcategory: "subnet"
        type: string
        description: "Subnet name"
        required: true
        pattern: "^snet-[a-z0-9-]+$"
        example: "snet-azlc-AzureLocalCloud-eus-landingzone-prod-web"

      subnet_cidr:
        type: string
        description: "Subnet CIDR"
        required: true
        format: cidr
        example: "10.0.1.0/24"

      subnet_address_prefix:
        category: "networking"
        subcategory: "subnet"
        type: string
        description: "Subnet address prefix"
        required: true
        format: cidr
        example: "10.0.1.0/24"

      subnets:
        type: array
        description: "Array of subnets in the VNet"
        required: false
        items:
          type: object
        properties:
          name:
          type: string
        address_prefix:
          type: string
          format: cidr
        nsg:
          type: string
        route_table:
          type: string
        service_endpoints:
          type: array
        delegations:
          type: array
        private_endpoint_network_policies:
          type: string
        private_link_service_network_policies:
          type: string
        nat_gateway:
          type: string
        example:
        - name: "snet-azlc-AzureLocalCloud-eus-landingzone-web"
          address_prefix: "10.0.1.0/24"
          nsg: "nsg-azlc-AzureLocalCloud-eus-web"
          route_table: "rt-azlc-AzureLocalCloud-eus-web"
          service_endpoints:
          - "Microsoft.Storage"
          - "Microsoft.KeyVault"
          private_endpoint_network_policies: "Disabled"
          nat_gateway: "nat-azlc-AzureLocalCloud-eus-web"

      subnet_delegation_name:
        type: string
        description: "Subnet delegation name for Azure services"
        required: false
        example: "Microsoft.Web/serverFarms"

      subnet_delegation_service_name:
        type: string
        description: "Service name for subnet delegation"
        required: false
        allowedValues:
        - Microsoft.Web/serverFarms
        - Microsoft.ContainerInstance/containerGroups
        - Microsoft.Netapp/volumes
        - Microsoft.HardwareSecurityModules/dedicatedHSMs
        - Microsoft.ServiceFabricMesh/networks
        - Microsoft.Logic/integrationServiceEnvironments
        - Microsoft.Batch/batchAccounts
        - Microsoft.Sql/managedInstances
        - Microsoft.DBforPostgreSQL/serversv2
        - Microsoft.DBforPostgreSQL/flexibleServers
        - Microsoft.DBforMySQL/flexibleServers
        - Microsoft.ApiManagement/service
        - Microsoft.Synapse/workspaces
        example: "Microsoft.Web/serverFarms"

      subnet_private_endpoint_network_policies:
        type: string
        description: "Enable or disable private endpoint network policies on subnet"
        required: false
        allowedValues:
        - Enabled
        - Disabled
        default: "Disabled"

      subnet_private_link_service_network_policies:
        type: string
        description: "Enable or disable private link service network policies on subnet"
        required: false
        allowedValues:
        - Enabled
        - Disabled
        default: "Enabled"

      vnet_peering_name:
        type: string
        description: "VNet peering name"
        required: false
        example: "peer-azlc-to-hub"

      vnet_peering_remote_vnet:
        type: string
        description: "Remote VNet for peering"
        required: false
        pattern: "^vnet-[a-z0-9-]+$"
        example: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"

      allow_forwarded_traffic:
        type: boolean
        description: "Allow forwarded traffic"
        required: false
        default: true

      allow_gateway_transit:
        type: boolean
        description: "Allow gateway transit"
        required: false
        default: false

      allow_virtual_network_access:
        type: boolean
        description: "Allow virtual network access"
        required: false
        default: true

      use_remote_gateways:
        type: boolean
        description: "Use remote VNet's gateway (requires allow_gateway_transit on remote VNet)"
        required: false
        default: false

      peer_complete_virtual_network:
        type: boolean
        description: "Peer the complete virtual network address space"
        required: false
        default: true

      vnet_peering_remote_vnet_id:
        type: string
        description: "Full resource ID of remote VNet for peering"
        required: false
        example: "/subscriptions/00000000-1111-2222-3333-444444444444/resourceGroups/rg-azlc-AzureLocalCloud-eus-connectivity-hub/providers/Microsoft.Network/virtualNetworks/vnet-azlc-AzureLocalCloud-eus-connectivity-hub"

      vnet_additional_subnets:
        type: array
        description: "Additional subnets in the VNet"
        required: false
        items:
          type: object
        properties:
          name:
          type: string
        address_prefix:
          type: string
          format: cidr
        nsg:
          type: string
        example:
        - name: "snet-app"
          address_prefix: "10.0.2.0/24"
          nsg: "nsg-app"

      vnet_service_endpoints:
        type: array
        description: "Service endpoints for the VNet"
        required: false
        items:
          type: string
        example:
          - "Microsoft.Storage"
          - "Microsoft.Sql"

      vnet_service_endpoint_policies:
        type: array
        description: "Service endpoint policies for VNet subnets"
        required: false
        items:
          type: object
        properties:
          name:
          type: string
        service:
          type: string
        service_resources:
          type: array
        example:
        - name: "sep-storage-policy"
          service: "Microsoft.Storage"
          service_resources:
          - "/subscriptions/00000000-1111-2222-3333-444444444444/resourceGroups/rg-azlc-AzureLocalCloud-eus-workload-storage/providers/Microsoft.Storage/storageAccounts/stazlcAzureLocalCloudeus001"

      vnet_encryption_enabled:
        type: boolean
        description: "Enable VNet encryption (requires supported VM SKUs)"
        required: false
        default: false

      vnet_encryption_enforcement:
        type: string
        description: "VNet encryption enforcement mode"
        required: false
        allowedValues:
        - AllowUnencrypted
        - DropUnencrypted
        default: "AllowUnencrypted"

      vnet_flow_timeout_minutes:
        type: integer
        description: "Flow timeout in minutes for VNet traffic"
        required: false
        minimum: 4
        maximum: 30
        default: 4

      vnet_enable_flow_logs:
        type: boolean
        description: "Enable NSG flow logs for VNet subnets"
        required: false
        default: false

      vnet_flow_logs_retention_days:
        type: integer
        description: "Retention days for flow logs"
        required: false
        minimum: 0
        maximum: 365
        default: 30

      vnet_flow_logs_traffic_analytics_enabled:
        type: boolean
        description: "Enable traffic analytics for flow logs"
        required: false
        default: false

      vnet_flow_logs_workspace_id:
        type: string
        description: "Log Analytics workspace ID for traffic analytics"
        required: false
        format: uuid
        example: "12345678-1234-1234-1234-123456789012"

      vnet_dns_servers:
        type: array
        description: "Custom DNS servers for the VNet"
        required: false
        items:
          type: string
        format: ipv4
        example:
        - "10.100.1.36"
        - "10.100.1.37"

      vnet_enable_private_dns_resolver:
        type: boolean
        description: "Enable Azure DNS Private Resolver for VNet"
        required: false
        default: false

      vnet_private_dns_resolver_inbound_subnet:
        type: string
        description: "Subnet for DNS Private Resolver inbound endpoints"
        required: false
        pattern: "^snet-[a-z0-9-]+$"
        example: "snet-azlc-AzureLocalCloud-eus-connectivity-dns-inbound"

      vnet_private_dns_resolver_outbound_subnet:
        type: string
        description: "Subnet for DNS Private Resolver outbound endpoints"
        required: false
        pattern: "^snet-[a-z0-9-]+$"
        example: "snet-azlc-AzureLocalCloud-eus-connectivity-dns-outbound"

      vnet_tags:
        type: object
        description: "Tags for the VNet"
        required: false
        example:
          environment: "prod"
          project: "azlc"
          cost_center: "IT-Infrastructure"
          workload: "landingzone"
    # ─── bastion ───
    bastion:
      bastion_hosts:
        type: array
        description: "Bastion hosts per tenant"
        required: false
        items:
          type: object
        properties:
          name:
            type: string
          sku:
            type: string
          public_ip:
            type: string
          vnet:
            type: string
        example:
        - name: "bastion-tenant1"
          sku: "Standard"
          public_ip: "pip-bastion-tenant1"
          vnet: "vnet-tenant1"

      bastion_name:
        type: string
        description: "Bastion name"
        required: false
        example: "bastion-azlc-AzureLocalCloud-eus"

      bastion_sku:
        type: string
        description: "Bastion SKU"
        required: false
        allowedValues:
        - Basic
        - Standard
        default: "Standard"

      bastion_public_ip_name:
        type: string
        description: "Bastion public IP name"
        required: false
        pattern: "^pip-[a-z0-9-]+$"
        example: "pip-bastion-azlc-AzureLocalCloud-eus"

      bastion_resource_group:
        type: string
        description: "Bastion resource group"
        required: false
        pattern: "^rg-[a-z0-9-]+$"
        example: "rg-azlc-AzureLocalCloud-eus-connectivity-hub"

      bastion_subscription:
        type: string
        description: "Bastion subscription"
        required: false
        format: uuid
        example: "00000000-1111-2222-3333-444444444444"

      bastion_location:
        type: string
        description: "Bastion deployment location"
        required: false
        example: "East US"

      bastion_vnet:
        type: string
        description: "Bastion virtual network"
        required: false
        pattern: "^vnet-[a-z0-9-]+$"
        example: "vnet-azlc-AzureLocalCloud-eus-connectivity-hub"

      bastion_subnet:
        type: string
        description: "Bastion subnet"
        required: false
        default: "AzureBastionSubnet"

      bastion_scale_units:
        type: integer
        description: "Bastion scale units (2-50, Standard SKU only)"
        required: false
        minimum: 2
        maximum: 50
        default: 2

      bastion_enable_copy_paste:
        type: boolean
        description: "Enable copy/paste functionality (Standard SKU only)"
        required: false
        default: true

      bastion_enable_file_copy:
        type: boolean
        description: "Enable file copy upload/download (Standard SKU only)"
        required: false
        default: true

      bastion_enable_tunneling:
        type: boolean
        description: "Enable native client tunneling support (Standard SKU only)"
        required: false
