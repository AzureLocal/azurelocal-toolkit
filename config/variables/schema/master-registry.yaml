        type: integer
      minimum: 0
      maximum: 4
      example:
      - 0
      - 1
      - 2

    monitoring_resource_group:
      type: string
      description: "Monitoring resource group"
      required: false
      pattern: "^rg-[a-z0-9-]+$"
      example: "rg-azlc-AzureLocalCloud-eus-management-monitoring"

