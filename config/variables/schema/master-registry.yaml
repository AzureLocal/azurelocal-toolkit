      bastion_enable_ip_connect:
        type: boolean
        description: "Enable IP connect (connect by IP address, Standard SKU only)"
        required: false
        default: true

      bastion_enable_shareable_link:
        type: boolean
        description: "Enable shareable link (Standard SKU only)"
        required: false
        default: true

      bastion_enable_kerberos:
        type: boolean
        description: "Enable Kerberos authentication for Windows VMs"
        required: false
        default: false

      bastion_enable_session_recording:
        type: boolean
        description: "Enable session recording for audit/compliance"
        required: false
        default: false

      bastion_tags:
        type: object
        description: "Tags for Bastion"
        required: false
        example:
          environment: "AzureLocalCloud"
