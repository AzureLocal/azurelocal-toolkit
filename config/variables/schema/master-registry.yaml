      bastion_enable_diagnostics:
        type: boolean
        description: "Enable diagnostic settings for Bastion"
        required: false
        default: true

      bastion_diagnostics_workspace_id:
        type: string
        description: "Log Analytics workspace ID for Bastion diagnostics"
        required: false
        format: uuid
