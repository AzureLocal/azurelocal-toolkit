      kv_platform_enable_rbac:
        type: boolean
        description: "Enable RBAC authorization"
        required: false
        default: true

      kv_platform_enable_soft_delete:
        type: boolean
        description: "Enable soft delete"
        required: false
        default: true

      kv_platform_soft_delete_retention_days:
        type: integer
        description: "Soft delete retention days"
        required: false
        minimum: 7
        maximum: 90
        default: 90

      kv_platform_enable_purge_protection:
        type: boolean
