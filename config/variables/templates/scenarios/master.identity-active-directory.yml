      # (since 5.6.28) Name of the public IP address of the VPN gateway (of its first instance in active-active mode).
      # used by: terraform
      public_ip_name: "pip-iic-vpng-hub-01"
      # (since 5.6.28) Name of the public IP address of the second instance; needed when active_active is true (Microsoft Learn: About active-active mode VPN gate...
      # used by: terraform
      secondary_public_ip_name: "pip-iic-vpng-hub-02"
      # (since 5.6.28) Active-active mode: both gateway instances carry tunnels; it needs a route-based VPN, a SKU other than Basic and two Standard static public...
      # default: false; used by: terraform
      active_active: false
      # BGP autonomous system number of the gateway.
      # used by: terraform
      bgp_asn: 65515
      # Site-to-site connections to other sites.
      site_to_site:
        # Name of the connection.
        # required; used by: terraform
        - connection_name: "cn-iic-dal-01"
