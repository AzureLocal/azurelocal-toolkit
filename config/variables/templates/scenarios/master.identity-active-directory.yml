      sku: "Standard"
      # (since 5.6.19) Name of the virtual network the Bastion host is in: an entry of landing_zone.networks with a subnet named AzureBastionSubnet of /26 or larg...
      # used by: terraform
      network: "vnet-iic-hub-01"
      # (since 5.6.28) Name of the public IP address of the Bastion host (Standard SKU, static: Microsoft Learn, About Azure Bastion configuration settings).
      # used by: terraform
      public_ip_name: "pip-iic-bas-hub-01"
    # (since 5.6.19) An Azure NAT gateway for the outbound traffic of subnets of a landing zone network.
    # used by: terraform
    nat_gateway:
      # Name of the NAT gateway.
      # required; used by: terraform
      name: "ng-iic-hub-01"
      # Resource group of the NAT gateway and its public IP address; default: the resource group of the network.
      # used by: terraform
      resource_group: "rg-iic-conn-01"
      # Name of the virtual network (an entry of landing_zone.networks) whose subnets the gateway serves.
      # used by: terraform
      network: "vnet-iic-mgmt-01"
      # Names of the subnets of that network that use the NAT gateway for outbound traffic.
