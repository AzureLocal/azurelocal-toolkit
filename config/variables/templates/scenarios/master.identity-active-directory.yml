    # (since 5.4) Create the site's network, time, connectivity and security settings (Microsoft.Edge/configurations child resources).
    # default: true; used by: ztp
    apply_site_settings: true
    # (since 5.4) Reference the Key Vault in the site's security settings, which the provisioning administrator secret needs.
    # default: true; used by: ztp
    use_key_vault_configuration: true
    # (since 5.4) Give each edge machine its constrained role delegations on the resource group and on the Key Vault.
    # default: true; used by: ztp
