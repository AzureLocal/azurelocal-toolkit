        - name: "allow-rdp-from-hub"
          # (since 5.6.21) Priority of the rule, 100 to 4096.
          # required; used by: terraform
          priority: 100
          # (since 5.6.21) Whether the rule applies to incoming (Inbound) or outgoing (Outbound) traffic.
          # required; one of: Inbound | Outbound; used by: terraform
          direction: "Inbound"
          # (since 5.6.21) Allow or Deny the traffic the rule matches.
          # required; one of: Allow | Deny; used by: terraform
          access: "Allow"
          # (since 5.6.21) Protocol the rule matches: * (any, the default), Tcp, Udp, Icmp, Esp or Ah (New-AzNetworkSecurityRuleConfig -Protocol).
          # one of: * | Tcp | Udp | Icmp | Esp | Ah; default: "*"; used by: terraform
          protocol: "*"
          # (since 5.6.21) Source the rule matches: * (any, the default), IPv4 addresses or ranges in CIDR form, or one service tag such as VirtualNetwork or Internet...
          # used by: terraform
