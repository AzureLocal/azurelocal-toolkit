      username: "lcm-iic-azl-01"
      # At least 14 characters with lowercase, uppercase, a digit and a special character.
      # required; used by: os_configuration, deployment, trailwright, ansible, s2d_cartographer
      password: "keyvault://kv-iic-mgmt-01/lcm-password"
    # Optional override.
    # used by: os_configuration
    domain_join_account:
      # The join account: a name (svc-azl-join, qualified with netbios_name), NETBIOS\name or name@domain.
      # required; used by: os_configuration, monitoring, ansible
      username: "example"
      # A Key Vault secret reference.
      # required; used by: os_configuration, monitoring, ansible
      password: "keyvault://kv-example-01/password"
    # Domain principals the OS configuration adds to the local Administrators group of every machine after the join and the restart, so a domain...
    # used by: os_configuration
    local_admin_members: []
    # How the OS configuration run joins the machines to the domain.
    # used by: os_configuration
    join_options:
      # true: before the deployment, a machine already joined to this domain but sitting in another OU is moved into ou_path. false (default): it i...
      # default: false; used by: os_configuration
      allow_ou_move: false
    # Addresses of domain controllers, for pre-checks and for the domain join.
    # used by: os_configuration, trailwright, beacon
    domain_controllers: ["192.0.2.4", "192.0.2.5"]
    # Whether the instance uses group managed service accounts.
    # default: false; used by: deployment
    use_gmsa: false
    # Whether the DNS servers of the management network support secure dynamic updates (Microsoft DNS integrated with Active Directory). true: th...
    # used by: deployment
    dns_secure_dynamic_updates: false
    # (since 5.6.23) Whether Set-ADConfiguration.ps1 creates the computer objects of the machines (nodes[].name) and of the cluster (cluster.name) in the OU bef...
    # default: false; used by: deployment, ansible
    precreate_computer_objects: false
    # (since 5.6.28) Whether Set-ADConfiguration.ps1 creates the parent OUs of ou_path that are missing, from the domain down, before it runs New-HciAdObjectsPr...
    # default: false; used by: deployment
    create_parent_ous: false
    # (since 5.6.28) Forest functional level of a new forest that the toolkit's Ansible domain controller role creates (a landing_zone.virtual_machines[] entry...
    # one of: WinThreshold | Win2025; default: "WinThreshold"; used by: ansible
    forest_functional_level: "WinThreshold"
    # (since 5.6.28) Domain functional level of that new forest's domain.
    # one of: WinThreshold | Win2025; default: "WinThreshold"; used by: ansible
    domain_functional_level: "WinThreshold"
    # (since 5.6.28) The DNS forwarders of the domain controllers that the toolkit's Ansible domain controller role promotes: the servers they ask for names out...
    # used by: ansible
    dns_forwarders: ["192.0.2.53"]
    # Groups created in the OU for administration of the instance.
    # used by: ansible
    security_groups:
      # Name of the security group in Active Directory.
      # required; used by: os_configuration, trailwright
      - name: "sg-iic-azl-01-admins"
        # What the group is for, in words.
        # used by: os_configuration, trailwright
        purpose: "Administrators of the instance"
        # Members of the group, as account names (sAMAccountName or user principal name).
        members: []
        # The local groups of every machine this AD group is added to after the deployment (for example Administrators, Remote Management Users).
        # used by: os_configuration
        local_groups: []

# Storage of the instance: the deployment's storage mode, the volumes, and the SAN of a disaggregated or hybrid deployment (the san block app...
storage:
  # ARM configurationMode: express (Express), infra_only (InfraOnly) or keep_storage (KeepStorage).
  # one of: express | infra_only | keep_storage; default: "express"; used by: deployment, trailwright
  configuration_mode: "express"
  # (since 5.6.9) The Storage Spaces Direct pool of the instance.
  # used by: deployment
  pool:
    # Name of the storage pool the volumes are created in.
    # used by: deployment
    name: "SU1_Pool"
    # Share of the pool, in percent, at which Azure Local raises the thin provisioning alert (Set-StoragePool -ThinProvisioningAlertThresholds).
    # used by: deployment
    thin_provisioning_alert_threshold_percent: 70
  # (since 5.6.9) Cluster shared volume settings of the instance.
  # used by: deployment
  csv:
    # Memory per machine, in MiB, for the CSV in-memory read cache (the cluster property BlockCacheSize).
    # used by: deployment
    read_cache_size_mib: 1024
  # The Storage Spaces Direct volumes to create after deployment, in addition to what the deployment itself creates (storage.configuration_mode...
  # used by: deployment
  volumes:
    # Name of the volume, for example vol-workloads-01.
    # required; used by: deployment, trailwright, ranger, loadtools
    - name: "vol-workloads-01"
      # Size of the volume in GiB (binary units, as Windows counts).
      # required; used by: deployment, trailwright, ranger
      size_gib: 4096
      # Resiliency of the volume. two_way, three_way and parity (dual parity, 4 or more machines) are the usual ones; four_way is for a rack aware...
      # one of: two_way | three_way | four_way | parity | nested_two_way | mirror_accelerated_parity | nested_mirror_accelerated_parity; used by: deployment, trailwright, ranger
      resiliency: "two_way"
      # (since 5.6.9) thin (space is taken from the pool as data is written) or fixed (all space is taken when the volume is created).
      # one of: thin | fixed; used by: deployment, trailwright
      provisioning_type: "thin"
      # (since 5.6.9) refs (the default; Microsoft recommends it for all volumes, and mirror-accelerated parity and ReFS deduplication need it) or ntfs.
      # one of: refs | ntfs; default: "refs"; used by: deployment
      file_system: "refs"
      # (since 5.6.9) Only for mirror_accelerated_parity and nested_mirror_accelerated_parity: the share of the volume, in percent, that is parity; the rest is m...
      # default: 80; used by: deployment
      parity_percent: 80
      # (since 5.6.9) ssd or hdd: the capacity drives the volume goes on, when the machines have both kinds.
      # one of: ssd | hdd; used by: deployment
      media_type: "ssd"
      # (since 5.6.9) ReFS deduplication and compression of the volume.
      # used by: deployment
      deduplication:
        # none (the default: the script does not touch deduplication), dedup, compress or dedup_and_compress (Enable-ReFSDedup -Type).
        # one of: none | dedup | compress | dedup_and_compress; default: "none"; used by: deployment
        type: "none"
        # When the deduplication job runs (Set-ReFSDedupSchedule).
        # used by: deployment
        schedule:
          # Time of day the job starts, as HH:mm in the time of the machines, for example 22:00.
          # used by: deployment
          start_time: "22:00"
          # The days the job runs: Sunday to Saturday, or EveryDay.
          # used by: deployment
          days: ["Friday", "Saturday"]
          # The longest one run may take, in hours.
          # used by: deployment
          duration_hours: 4
  # (since 5.6.9) The Azure Local storage paths to create after deployment: the Azure resources that say where on a cluster shared volume the virtual machine...
  # used by: deployment
  paths:
    # Name of the storage path resource: 3 to 64 letters, digits or hyphens.
    # required; used by: deployment, loadtools
    - name: "sp-workloads-01"
      # The folder on a cluster shared volume, for example C:\ClusterStorage\vol-workloads-01\vms for a volume of storage.volumes, or the folder of...
      # required; used by: deployment, loadtools
      path: "C:\\ClusterStorage\\vol-workloads-01\\vms"
  # (since 5.6.11) The Azure Marketplace images to download to the instance as Azure Local VM images (Learn: Create Azure Local VM image using Azure Marketpla...
  # used by: deployment
  vm_images:
    # Name of the VM image resource, 1 to 80 characters: letters, digits, hyphen, period and underscore; it starts and ends with a letter or digi...
    # required; used by: deployment
    - name: "img-ws2025-azure-edition"
      # Operating system of the image, Windows or Linux (az stack-hci-vm image create --os-type).
      # required; one of: Windows | Linux; used by: deployment
      os_type: "Windows"
      # Publisher of the Marketplace image, as Learn's table gives it (lowercase).
      # required; used by: deployment
      publisher: "microsoftwindowsserver"
      # Offer of the Marketplace image, lowercase.
      # required; used by: deployment
      offer: "windowsserver"
      # SKU of the Marketplace image.
      # required; used by: deployment
      sku: "2025-datacenter-azure-edition"
      # Version of the Marketplace image, for example 26100.4652.250808, or latest (the default: Azure picks the newest version when the image is c...
      # default: "latest"; used by: deployment
      version: "latest"
      # Name of the storage path the image is kept on, one of storage.paths[].name; create it first (New-StoragePath.ps1).
      # used by: deployment
      storage_path: "sp-workloads-01"
  # The external SAN of a disaggregated (san) or hybrid deployment.
  # when scenario.storage_architecture is san or hybrid; used by: os_configuration, deployment
  san:
    # Whether the SAN is fibre_channel or iscsi.
    # required; one of: fibre_channel | iscsi; used by: os_configuration, deployment, trailwright
    type: "fibre_channel"
    # (since 5.3) The storage array that presents the LUNs.
    # used by: os_configuration, deployment
    array:
      # The array's name, for example its hostname in the array manager.
      # required
      name: "example"
      # Vendor of the storage array, for example Dell or Pure Storage.
      # required; used by: os_configuration, deployment
      vendor: "example"
      # Model of the storage array, for example PowerStore 1200T.
      # required; used by: os_configuration, deployment
      model: "example"
      # The array's management address.
      management_address: "192.0.2.10"
    # (since 5.3) Used when type is fibre_channel: the fabrics and the array's target ports, for zoning.
    # used by: deployment
    fibre_channel:
      # The Fibre Channel fabrics, for example A and B.
      # used by: deployment
      fabrics:
        # For example A or B.
        # required; used by: deployment
        - name: "example"
          # The fabric's switch, for example a network_devices[].hostname.
          switch: ""
          # The active zone set on this fabric.
          zone_set: ""
      # The array's target ports (WWPNs) and the fabric each is cabled to.
      # used by: deployment
      target_wwpns:
        # A Fibre Channel World Wide Port Name: 16 hexadecimal digits, as 8 colon-separated pairs (50:00:09:72:08:12:34:56) or without colons.
        # required; used by: deployment
        - wwpn: ""
          # A name in fabrics.
          # required; used by: deployment
          fabric: "example"
    # (since 5.3) Used when type is iscsi: the array's targets and CHAP.
    # used by: os_configuration, deployment
    iscsi:
      # The array's iSCSI targets.
      # used by: os_configuration, deployment
      targets:
        # An iSCSI qualified name (iqn.yyyy-mm.reversed.domain[:identifier]), or an eui. or naa. name.
        # required; used by: os_configuration, deployment
        - iqn: ""
          # The target portals: an IPv4 address, optionally with a port (default 3260), for example 198.51.100.10 or 198.51.100.10:3260.
          # required; used by: os_configuration, deployment
          portals: []
          # The storage network this target serves, matching the iSCSI port role: A for iscsi:a, B for iscsi:b.
          # used by: os_configuration, deployment
          fabric: "example"
      # CHAP authentication of the sessions.
      # used by: os_configuration, deployment
      chap:
        # true when the iSCSI targets require CHAP.
        # required; default: false; used by: os_configuration, deployment
        enabled: false
        # CHAP user name for the iSCSI targets.
        # used by: deployment
        username: "example"
        # A secret reference, for example keyvault://<vault>/<secret> (a keyvault:// vault must be listed in key_vaults).
        # used by: deployment
        secret: "keyvault://kv-example-01/secret"
        # (since 5.6.10) true: the initiators also authenticate the targets (ARM chapType Mutual); false: one-way CHAP (OneWay).
        # default: false; used by: deployment
        mutual: false
      # (since 5.6.10) Value of the JumboPacket property of the iSCSI ports, in bytes: 1514 (standard frame), 4088 or 9014 (jumbo).
      # default: 1514; used by: os_configuration, deployment
      jumbo_packet: 9014
      # (since 5.6.38) Optional QoS for the iSCSI traffic of a hybrid attachment (Microsoft Learn, Connect an external storage array to Azure Local, step 3.5: onl...
      # used by: os_configuration
      qos:
        # (since 5.6.38) true to make the QoS policies of Learn step 3.5.
        # default: false; used by: os_configuration
        enabled: false
        # (since 5.6.38) The 802.1p priority of the iSCSI policy (Learn: 4), 0 to 7.
        # default: 4; used by: os_configuration
        priority: 4
      # (since 5.6.10) The iSCSI networks, one per path.
      # used by: os_configuration, deployment
      networks:
        # The path: A for the ports with the role iscsi:a, B for iscsi:b.
        # required; one of: A | B; used by: os_configuration, deployment
        - fabric: "A"
          # VLAN of this iSCSI network, 0 to 4094. 0 means untagged (the switch port is an access port).
          # default: 0; used by: os_configuration, deployment
          vlan_id: 0
          # Subnet of this iSCSI network in CIDR form.
          # required; used by: os_configuration, deployment
          subnet: "198.51.100.0/24"
          # Only when the target portals of this path are in another subnet: the router address on this network.
          # used by: os_configuration, deployment
          next_hop: "198.51.100.1"
    # LUN of the infrastructure volume (250 GB minimum).
    # used by: os_configuration, deployment, trailwright
    infra_volume_lun_id: ""
    # LUN of the performance history volume (20 GB minimum).
    # used by: os_configuration, deployment, trailwright
    performance_history_lun_id: ""
    # The LUNs the array presents to the cluster for workload volumes, after the deployment.
    # used by: deployment
    luns:
      # Name of the LUN.
      # required; used by: deployment, trailwright
      - name: "iic-san-vol-01"
        # (since 5.6.16) The UniqueId of the disk this LUN shows on the machines, as Get-Disk reports it (Learn: Connect an external storage array to Azure Local, s...
        # used by: deployment
        unique_id: "60000000000000000000000000000001"
        # Size of the LUN in GiB (binary units, as Windows counts).
        # required; used by: deployment, trailwright
        size_gib: 1024
        # The logical unit number the array presents the LUN as, for example 2.
        # used by: deployment
        lun_id: "2"

# Security settings of the deployment.
security:
  # ARM securityLevel: recommended (Recommended) or customized (Customized).
  # one of: recommended | customized; default: "recommended"; used by: deployment, trailwright
  level: "recommended"
  # true turns drift control on: Azure Local resets the security settings to the baseline after drift.
  # default: true; used by: deployment, trailwright
  drift_control: true
  # true turns Credential Guard on in the security settings of the deployment.
  # default: true; used by: deployment, trailwright
  credential_guard: true
  # true turns SMB signing on in the security settings of the deployment.
  # default: true; used by: deployment, trailwright
  smb_signing: true
  # true encrypts SMB traffic between the cluster nodes (not the storage traffic).
  # default: false; used by: deployment, trailwright
  smb_cluster_encryption: false
  # true turns BitLocker on for the boot volume.
  # default: true; used by: deployment, trailwright
  bitlocker_boot_volume: true
  # true turns BitLocker on for the data volumes.
  # default: true; used by: deployment, trailwright
  bitlocker_data_volumes: true
  # true turns Windows Defender Application Control on.
  # default: true; used by: deployment, trailwright
  wdac: true
  # (since 5.6.21) Individual security baseline settings to change after the deployment, by Set-AzsSecurity (Azure Local 2610 or later).
  baseline_settings:
    # (since 5.6.21) The policy type that owns the setting (the -Type parameter of Set-AzsSecurity): SecuritySettings (the OS security baseline: registry, secur...
    # required; one of: SecuritySettings | SecuredCore | DefenderAntivirus
    - type: "SecuritySettings"
      # (since 5.6.21) The name of the setting exactly as the Name column of the security baseline CSV writes it (-SettingName); the cmdlet does not complete or c...
      # required
      name: "LanmanWorkstationEnableInsecureGuestLogons"
      # (since 5.6.21) The value to set: a string, an integer (sent as a string) or a list of strings.
      # required
      value: "1"
      # (since 5.6.21) true confirms that you understand a change that weakens the security posture, for the few settings where Set-AzsSecurity shows a warning an...
      # default: false
      acknowledge_weaker_security: false
  # The free level of Microsoft Defender for Cloud that Azure Local needs to show its security settings in the Azure portal.
  defender_for_cloud:
    # true (default) registers the Microsoft.Security resource provider on the subscription of the cluster, which turns on Foundational CSPM, the...
    # default: true
    enabled: true
    # true (default) assigns the Microsoft cloud security benchmark initiative to the subscription of the cluster when it is not assigned yet.
    # default: true
    apply_cloud_security_benchmark: true
    # Address that Microsoft Defender for Cloud sends its security notifications to (a team mailbox; several addresses are separated by semicolon...
    # used by: terraform
    security_contact_email: "security@improbability.cloud"
    # (since 5.6.28) Defender for Cloud sends security_contact_email the security alerts.
    # default: true; used by: terraform
    alert_notifications: true
    # (since 5.6.28) Defender for Cloud sends the security alerts to the subscription owners too.
    # default: true; used by: terraform
    alerts_to_admins: true
  # What the cluster sends to Microsoft as diagnostic data. streaming_data, episodic_data_upload and eu_location are deployment settings (the A...
  # used by: deployment
  telemetry:
    # true sends the streaming diagnostic data.
    # default: true; used by: deployment, trailwright
    streaming_data: true
    # true sends the episodic diagnostic data.
    # default: true; used by: deployment, trailwright
    episodic_data_upload: true
    # true keeps the diagnostic data in the EU data boundary.
    # default: false; used by: deployment, trailwright
    eu_location: false
    # (since 5.6.32) The desired level of diagnostic data the Azure Local instance sends to Microsoft: Off, Basic or Enhanced (the desiredProperties.diagnosticL...
    # one of: Off | Basic | Enhanced
    diagnostic_level: "Enhanced"

# SDN enabled by Azure Arc (Network Controller as a Failover Cluster service; Azure Local 2506 or later, OS build 26100 or later).
sdn:
  # true to turn SDN enabled by Azure Arc on, which CANNOT BE UNDONE.
  # required; used by: deployment, trailwright, ranger
  enabled: false
  # OPTIONAL.
  # used by: deployment, trailwright, ranger
  prefix: "iic01"
  # How the A record <prefix>-NC of the Network Controller REST URL comes about. dynamic: Active Directory integrated dynamic DNS creates it wh...
  # one of: dynamic | static; used by: deployment, trailwright
  dns_records: "dynamic"
  # true when you accept that enabling SDN interrupts the network of running workloads for a short time and that a maintenance window is arrang...
  # default: false; used by: deployment
  acknowledge_maintenance_window: false
  # true when the static DNS record <prefix>-NC exists and points at the fifth address of networking.management.infrastructure_pool (Add-EceFea...
