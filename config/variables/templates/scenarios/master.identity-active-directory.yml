# Part 1 of the implementation steps: the pipeline platform, the project and its settings, the environments, the sign-in to Azure and the sel...
# used by: cicd_infra
devops:
  # The CI/CD platform: github, gitlab or azure_devops.
  # required; one of: github | gitlab | azure_devops; used by: cicd_infra, ansible, terraform, trailwright
  platform: "github"
  # URL of the CI/CD platform (an organization or instance URL).
  # used by: cicd_infra, ansible, terraform
  url: "https://github.com"
  # Organization, group or project collection.
  # used by: cicd_infra, ansible, terraform, trailwright
  organization: "improbability-cloud"
  # Name of the project or organization on the platform.
  # used by: cicd_infra
  project: "iic-azure-local"
  # (since 5.5) Key Vault reference to a token with administrator rights on the organization or project.
  # used by: cicd_infra
  api_token: "keyvault://kv-iic-mgmt-01/devops-admin-token"
  # (since 5.5) Name of the subscription in landing_zone.subscriptions that holds the runners (role devops).
  # used by: cicd_infra, terraform
  subscription: "sub-iic-devops"
  # (since 5.5) Resource group of the runners, their identity and their network.
  # used by: cicd_infra, terraform
  resource_group: "rg-iic-runners-01"
  # (since 5.5) Create devops.resource_group.
  # default: false; used by: cicd_infra, terraform
  create_resource_group: false
  # (since 5.5) The deployment repository or project that task 02 creates.
  # used by: cicd_infra
  repository:
    # Repository name.
    # used by: cicd_infra
    name: "iic-azurelocal"
    # GitHub: owner/repo of a template repository.
    # used by: cicd_infra
    template: "AzureLocal/azurelocal-template"
    # Repository visibility.
    # one of: private | internal; default: "private"; used by: cicd_infra
    visibility: "private"
    # The protected default branch.
    # default: "main"; used by: cicd_infra
    default_branch: "main"
  # (since 5.5) What task 03 sets on the repository: branch protection, approvals and security.
  # used by: cicd_infra
  settings:
    # Approvals a pull request needs before it merges. 0 for a sandbox.
    # default: 2; used by: cicd_infra
    required_approvals: 2
    # The team or group whose members review: a GitHub team slug (org/team), a GitLab group path or an Azure DevOps group name.
    # used by: cicd_infra
    reviewers: "improbability-cloud/platform-team"
    # Allow squash merges only.
    # default: true; used by: cicd_infra
    squash_only: true
    # Turn on secret scanning and push protection (GitHub), secret push rules (GitLab) or the secret file check (Azure DevOps).
    # default: true; used by: cicd_infra
    secret_scanning: true
    # All conversations must be resolved before a merge.
    # default: true; used by: cicd_infra
    resolve_conversations: true
    # Pipeline checks that must pass before a merge.
    # used by: cicd_infra
    required_status_checks: []
  # (since 5.5) The deployment environments that task 04 creates, with their approval gate.
  # used by: cicd_infra
  environments:
    # Environment name, for example azr-prod-us, or ztp-reinstall for the approval in front of the ZTP Boot stage.
    # required; used by: cicd_infra
    - name: "azr-prod-us"
      # A named reviewer must approve each deployment.
      # default: false; used by: cicd_infra
      approval_required: true
      # GitHub user names or org/team slugs, GitLab user names or group paths, Azure DevOps e-mail addresses.
      # used by: cicd_infra
      approvers: ["platform-lead"]
      # Delay before a deployment starts (GitHub).
      # default: 0; used by: cicd_infra
      wait_minutes: 0
      # The only branch that may deploy to the environment.
      # default: "main"; used by: cicd_infra
      deployment_branch: "main"
  # (since 5.6.25) What the toolkit's own pipelines (the files under pipelines/) select: the runner label and the approval environment of each pipeline.
  # used by: cicd_infra
  pipelines:
    # (since 5.6.25) The one label by which the pipelines choose the general runner: runs-on on GitHub (after self-hosted and linux) and tags on GitLab.
    # used by: cicd_infra
    runner_label: "azure-local"
    # (since 5.6.25) The approval environment of each pipeline.
    # used by: cicd_infra
    environments:
      # (since 5.6.25) The environment that gates the Apply job of the OS configuration pipelines (pipelines/github-actions/os-configuration.yml, pipelines/gitlab...
      # used by: cicd_infra
      os_configuration: "azr-prod-us"
      # (since 5.6.25) The environment of the second approval in front of a storage wipe (stage ConfirmStorageWipe of pipelines/azure-devops/os-configuration.yml).
      # used by: cicd_infra
      os_configuration_clear_storage: "azr-prod-us"
      # (since 5.6.25) The environment that gates the Deploy job of the ARM deployment pipelines (pipelines/github-actions/arm-deployment.yml, pipelines/gitlab/st...
      # used by: cicd_infra
      arm_deployment: "azr-prod-us"
      # (since 5.6.25) The environment that gates the Apply job of the CI/CD infrastructure pipelines (the runners; pipelines/github-actions/cicd-infra.yml, pipel...
      # used by: cicd_infra
      cicd_infra: "azr-prod-us"
      # (since 5.6.25) The environment that gates the Terraform apply and the on-premises Ansible jobs of the Terraform and Ansible sample pipelines (pipelines/gi...
      # used by: cicd_infra
      terraform_deployment: "azr-prod-us"
      # (since 5.6.28) The environment that gates every day 2 job that changes the cluster: the update (pipelines/github-actions/day2-update.yml, pipelines/gitlab...
      # used by: cicd_infra
      operations: "azr-prod-us"
    # (since 5.6.28) When the toolkit's scheduled pipelines run.
    # used by: cicd_infra
    schedules:
      # (since 5.6.28) When the day 2 check for updates runs (pipelines/github-actions/day2-check-updates.yml, pipelines/gitlab/stages/day2-check-updates.yml, pip...
      # default: "17 4 * * *"; used by: cicd_infra
      check_for_updates: "17 4 * * *"
    # (since 5.6.27) Azure DevOps only.
    # used by: cicd_infra
    service_connection: "iic-azure-local"
    # (since 5.6.27) Azure DevOps only.
    # used by: cicd_infra
    variable_group: "iic-azure-credentials"
    # (since 5.6.28) The path, in the deployment repository, of the infrastructure file the toolkit's pipelines pass to the scripts (-InfrastructureFile).
    # default: "config/infrastructure.yml"; used by: cicd_infra
    infrastructure_file: "config/infrastructure.yml"
    # (since 5.6.28) The repository path of the ZTP handoff files (a handoff file or a directory of *.ztp-handoff.json) the OS configuration pipelines pass to t...
    # default: "ztp-state"; used by: cicd_infra
    handoff_path: "ztp-state"
    # (since 5.6.28) The tool versions every toolkit pipeline installs, the same on GitHub, GitLab and Azure DevOps.
    # used by: cicd_infra
    tool_versions:
      # (since 5.6.28) The Terraform release the pipelines install (AZL_TERRAFORM_VERSION): hashicorp/setup-terraform, TerraformInstaller, or pipelines/gitlab/Use...
      # default: "1.16.3"; used by: cicd_infra
      terraform: "1.16.3"
      # (since 5.6.28) The Python minor version of the Ansible jobs (AZL_PYTHON_VERSION): actions/setup-python, UsePythonVersion, or the python<version> virtual e...
      # default: "3.12"; used by: cicd_infra
      python: "3.12"
      # (since 5.6.28) The ansible-core release the Ansible jobs install with pip (AZL_ANSIBLE_CORE_VERSION).
      # default: "2.21.5"; used by: cicd_infra
      ansible_core: "2.21.5"
      # (since 5.6.28) The ansible-lint release the lint jobs install with pip (AZL_ANSIBLE_LINT_VERSION).
      # default: "26.10.1"; used by: cicd_infra
      ansible_lint: "26.10.1"
      # (since 5.6.28) The Az PowerShell module version (AZL_AZ_POWERSHELL_VERSION): preferredAzurePowerShellVersion of AzurePowerShell@5 on Azure DevOps, Install...
      # default: "16.3.0"; used by: cicd_infra
      az_powershell: "16.3.0"
      # (since 5.6.28) The powershell-yaml module version the pipelines install to read infrastructure.yml (AZL_POWERSHELL_YAML_VERSION).
      # default: "0.4.12"; used by: cicd_infra
      powershell_yaml: "0.4.12"
      # (since 5.6.28) The Az.KeyVault module version the pipelines install to read keyvault:// secrets (AZL_AZ_KEYVAULT_VERSION).
      # default: "6.6.1"; used by: cicd_infra
      az_keyvault: "6.6.1"
  # (since 5.5) How the pipelines sign in to Azure (tasks 01 and 05).
  # used by: cicd_infra
  authentication:
    # oidc: a federated credential per repository and environment, no secret. client_secret: a secret, stored only in Key Vault (devops.authentic...
    # one of: oidc | client_secret; default: "oidc"; used by: cicd_infra
    method: "oidc"
    # Key Vault reference where task 01 stores the generated client secret (method client_secret).
    # used by: cicd_infra, ansible
    client_secret: "keyvault://kv-example-01/client-secret"
    # Roles the service principal gets on each subscription.
    # used by: cicd_infra, terraform
    roles: ["Contributor", "User Access Administrator"]
    # Also add the Microsoft Graph application permission RoleManagement.ReadWrite.Directory and grant admin consent.
    # default: false; used by: cicd_infra
    grant_graph_role_management: false
    # Register Microsoft.Compute and the EncryptionAtHost feature on each subscription.
    # default: true; used by: cicd_infra
    register_encryption_at_host: true
  # (since 5.5) The self-hosted runners that task 06 deploys with Terraform.
  # used by: cicd_infra, terraform
  runners:
    # Name prefix of the VM or VMs, for example vm-contoso-runner-lnx.
    # required; used by: cicd_infra, terraform, ansible
    - name: "vm-iic-runner-lnx"
      # Operating system.
      # required; one of: linux | windows; used by: cicd_infra, terraform, ansible
      os_type: "linux"
      # general: ARM, Arc, Terraform, Ansible and OS configuration. ztp: the azurelocal-ztp Boot, Bootstrap and Vouchers stages (Windows only).
      # one of: general | ztp; default: "general"; used by: deployment, cicd_infra, ansible, terraform
      purpose: "general"
      # Number of VMs.
      # default: 1; used by: cicd_infra, terraform, ansible
      count: 1
      # vm or vmss.
      # one of: vm | vmss; default: "vm"; used by: cicd_infra, terraform
      compute_type: "vm"
      # VM size.
      # used by: cicd_infra, terraform
      size: "Standard_D2s_v5"
      # Labels added to the defaults (azure, the OS, terraform, ansible, ztp).
      # used by: cicd_infra, ansible, terraform
      labels: []
      # Key Vault reference to the secret the runner reads at boot: a PAT or App token (GitHub), the runner authentication token (GitLab), a PAT wi...
      # used by: cicd_infra, ansible, terraform
      registration_secret: "keyvault://kv-iic-mgmt-01/github-runner-token"
      # The Azure Pipelines agent pool, or the GitHub runner group.
      # used by: cicd_infra, ansible, terraform
      pool: "azurelocal-ztp"
      # Static private addresses, one per VM.
      # used by: cicd_infra, terraform, ansible
      private_ips: ["10.20.10.4"]
      # The runner subnet inside runner_network.address_space.
      # used by: cicd_infra, terraform
      subnet:
        # Name of the subnet the runner machines are placed in.
        # required; used by: cicd_infra, terraform
        name: "snet-iic-runner-lnx-01"
        # Address range of that subnet, in CIDR form.
        # required; used by: cicd_infra, terraform
        prefix: "10.20.10.0/26"
      # Data disk for the ZTP media, images and vouchers. 512 or more for ztp.
      # default: 0; used by: cicd_infra, terraform, ansible
      data_disk_gb: 512
      # (since 5.6.28) The SSH public key of the administrator of a Linux runner (a public key, not a secret): the key itself (ssh-ed25519, ssh-rsa or ecdsa-sha2-...
      # used by: cicd_infra
      admin_ssh_public_key: "file://runner-admin.pub"
      # (since 5.6.28) Local administrator user name of the runner machines: the admin_username Terraform gives the VMs, and the account the Ansible cicd_runner p...
      # default: "runneradmin"; used by: cicd_infra, terraform, ansible
      admin_username: "runneradmin"
      # (since 5.6.28) Client (application) ID of the runner's user-assigned managed identity (GUID), once it exists.
      # used by: cicd_infra, ansible
      identity_client_id: "00000000-0000-0000-0000-000000000000"
      # (since 5.6.28) Name of the network security group of the runner subnet.
      # used by: cicd_infra, terraform
      nsg_name: "nsg-iic-runner-lnx-01"
      # (since 5.6.28) Name of the user-assigned managed identity the runner signs in to Azure as.
      # used by: cicd_infra, terraform
      managed_identity_name: "id-iic-runner-lnx-01"
      # (since 5.6.28) Windows runners only: Key Vault reference to the secret task 06 writes the generated administrator password to.
      # used by: cicd_infra, terraform
      windows_admin_password_secret: "keyvault://kv-iic-mgmt-01/runner-ztp-local-admin"
      # (since 5.6.28) Availability zones the runner machines are spread over (the VM scale set spans them).
      # used by: cicd_infra, terraform
      zones: ["1", "2"]
      # (since 5.6.28) Size of the OS disk in GB.
      # used by: cicd_infra, terraform
      os_disk_size_gb: 128
      # (since 5.6.28) Storage type of the OS disk and of the data disk.
      # one of: Standard_LRS | StandardSSD_LRS | StandardSSD_ZRS | Premium_LRS | Premium_ZRS; default: "Premium_LRS"; used by: cicd_infra, terraform
      os_disk_type: "Premium_LRS"
      # (since 5.6.28) Caching of the OS disk.
      # one of: None | ReadOnly | ReadWrite; default: "ReadWrite"; used by: cicd_infra, terraform
      os_disk_caching: "ReadWrite"
      # (since 5.6.28) Caching of the data disk (data_disk_gb).
      # one of: None | ReadOnly | ReadWrite; default: "ReadWrite"; used by: cicd_infra, terraform
      data_disk_caching: "ReadWrite"
      # (since 5.6.28) Encryption at host of the runner machines.
      # default: false; used by: cicd_infra, terraform
      encryption_at_host: false
      # (since 5.6.28) Marketplace image of the runner machines.
      # used by: cicd_infra, terraform
      image:
        # Image publisher.
        # required; used by: cicd_infra, terraform
        publisher: "Canonical"
        # Image offer.
        # required; used by: cicd_infra, terraform
        offer: "ubuntu-24_04-lts"
        # Image SKU.
        # required; used by: cicd_infra, terraform
        sku: "server"
        # Image version.
        # default: "latest"; used by: cicd_infra, terraform
        version: "latest"
  # (since 5.5) The VNet of the runners, the peering with the hub and the lab ranges they reach.
  # used by: cicd_infra
  runner_network:
    # Name of the virtual network the runners are placed in.
    # used by: cicd_infra, terraform
    vnet_name: "vnet-iic-devops-01"
    # Address ranges of that virtual network, in CIDR form.
    # used by: cicd_infra, terraform
    address_space: ["10.20.10.0/24"]
    # DNS servers of that virtual network.
    # used by: cicd_infra, terraform
    dns_servers: []
    # Peering with the hub VNet.
    # used by: cicd_infra, terraform
    hub_peering:
      # Peer the runner VNet with the hub.
      # default: false; used by: cicd_infra, terraform
      enabled: true
      # Name of the hub in landing_zone.networks (its subscription and resource group give the VNet ID).
      # used by: cicd_infra, terraform
      hub_network: "vnet-iic-hub-01"
      # Resource ID of the hub VNet.
      # used by: cicd_infra, terraform
      hub_vnet_id: ""
      # Use the hub VPN or ExpressRoute gateway to reach the lab.
      # default: true; used by: cicd_infra, terraform
      use_remote_gateways: true
      # Create the hub half of the peering.
      # default: true; used by: cicd_infra, terraform
      create_hub_side: true
      # (since 5.6.28) Name of the spoke half of the peering (on the runner VNet).
      # used by: cicd_infra, terraform
      spoke_name: "peer-vnet-iic-devops-01-to-hub"
      # (since 5.6.28) Name of the hub half of the peering (on the hub VNet).
      # used by: cicd_infra, terraform
      hub_name: "peer-hub-to-vnet-iic-devops-01"
    # Lab networks the runners reach: management, storage, BMC.
    # used by: cicd_infra, terraform
    reachable_cidrs: ["192.0.2.0/24", "198.51.100.0/24"]
    # TCP ports allowed outbound to the lab networks.
    # default: ["22", "443", "445", "3389", "5985", "5986"]; used by: cicd_infra, terraform
    reachable_tcp_ports: ["22", "443", "445", "3389", "5985", "5986"]
    # The BMC networks.
    # used by: cicd_infra, terraform
    bmc_cidrs: ["198.51.100.0/24"]
    # Ranges that may reach SSH or RDP on the runners.
    # used by: cicd_infra, terraform
    admin_source_cidrs: []
    # (since 5.6.28) The runner NSG allows HTTPS (443) outbound to the internet: GitHub, GitLab, Azure DevOps, package repositories and runner downloads.
    # default: true; used by: cicd_infra, terraform
    allow_internet_https: true
    # (since 5.6.28) The runner NSG allows HTTP (80) outbound to the internet: package mirrors with signed metadata.
    # default: true; used by: cicd_infra, terraform
    allow_internet_http: true
    # (since 5.6.28) The runner NSG allows ICMP outbound to reachable_cidrs and bmc_cidrs, for reachability checks.
    # default: true; used by: cicd_infra, terraform
    allow_icmp: true
  # (since 5.5) What the runners may do in Azure (least privilege).
  # used by: cicd_infra
  runner_access:
    # Resource groups where the runners are Contributor.
    # used by: cicd_infra, terraform
    resource_groups: ["rg-iic-azl-01"]
    # Role Based Access Control Administrator on those resource groups, which the Azure Local deployment and ZTP need.
    # default: true; used by: cicd_infra, terraform
    rbac_administrator: true
    # Limit the roles the runners may assign to these role definition GUIDs.
    # used by: cicd_infra, terraform
    rbac_delegable_role_ids: []
    # Azure Connected Machine Resource Administrator on those resource groups, so jobs can run Arc Run Command on the machines.
    # default: true; used by: cicd_infra, terraform
    arc_run_command: true
    # Vaults the runners read secrets from.
    # used by: cicd_infra, terraform
    key_vaults: ["kv-iic-mgmt-01"]
    # (since 5.6.28) Other role assignments of the runner identities, each with a short name, a scope (a resource ID) and a role name.
    # used by: cicd_infra, terraform
    additional_role_assignments:
      # Short name of the assignment (unique in the list).
      # required; used by: cicd_infra, terraform
      - name: "monitoring"
        # Resource ID of the scope: a subscription, a resource group or a resource.
        # required; used by: cicd_infra, terraform
        scope: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-iic-mgmt-01"
        # Name of the role, for example Reader.
        # required; used by: cicd_infra, terraform
        role_definition_name: "Reader"
  # One runner (the form before devops.runners[]).
  # used by: cicd_infra
  runner:
    # Name of the runner.
    # required; used by: cicd_infra, trailwright
    name: ""
    # Kind of runner: vm, container_app or existing.
    # required; one of: vm | container_app | existing; used by: cicd_infra, trailwright
    type: "vm"
    # Subscription of the runner.
    # used by: cicd_infra
    subscription: ""
    # Resource group of the runner.
    # used by: cicd_infra
    resource_group: ""
    # Virtual network of the runner.
    # used by: cicd_infra
    network: ""
    # Subnet of the runner.
    # used by: cicd_infra
    subnet: ""
    # Private address of the runner.
    # used by: cicd_infra
    private_ip: "192.0.2.10"
    # VM size of the runner.
    # used by: cicd_infra
    size: ""
    # Runner tags or labels that jobs select.
    # used by: cicd_infra
    labels: []
    # A Key Vault secret reference: keyvault://<vault>/<secret>.
    # used by: cicd_infra
    registration_token: "keyvault://kv-example-01/registration-token"
  # Where the Terraform state is kept.
  # used by: cicd_infra
  state:
    # (since 5.5) Subscription of the state storage account.
    # used by: cicd_infra, terraform
    subscription_id: "00000000-0000-0000-0000-000000000000"
    # (since 5.5) Blob name of the CI/CD runners state.
    # default: "cicd-infra.tfstate"; used by: cicd_infra, terraform
    key: "cicd-infra.tfstate"
    # Storage account that holds the state.
    # used by: cicd_infra, terraform
    storage_account: "stiictfstate01"
    # Blob container that holds the state.
    # default: "tfstate"; used by: cicd_infra, terraform
    container: "tfstate"
    # Resource group of the state storage account.
    # used by: cicd_infra, terraform
    resource_group: "rg-iic-mgmt-01"
    # (since 5.6.28) Blob name of the state of the azure-local Terraform environment (src/terraform/environments/azure-local).
    # default: "azure-local.tfstate"; used by: cicd_infra, terraform
    azure_local_key: "azure-local.tfstate"
    # (since 5.6.28) Redundancy of the state storage account (Microsoft Learn: Azure Storage redundancy).
    # one of: LRS | ZRS | GRS | RAGRS | GZRS | RAGZRS; default: "GRS"; used by: terraform
    replication_type: "GRS"
    # (since 5.6.28) Public network access of the state storage account. false (default): private endpoints only. allowed_ip_ranges needs true.
    # default: false; used by: terraform
    public_network_access: false
    # (since 5.6.28) Public IP addresses or CIDR ranges that may reach the state storage account (its IP network rules).
    # used by: terraform
    allowed_ip_ranges: ["203.0.113.0/24"]
    # (since 5.6.28) Blob versioning of the state storage account: every overwrite of a state file keeps the earlier version.
    # default: true; used by: terraform
    versioning: true
    # (since 5.6.28) Days a deleted state blob stays recoverable, 1 to 365 (Microsoft Learn: Soft delete for blobs).
    # default: 30; used by: terraform
    blob_soft_delete_days: 30
    # (since 5.6.28) Days a deleted state container stays recoverable, 1 to 365 (Microsoft Learn: Soft delete for containers).
    # default: 30; used by: terraform
    container_soft_delete_days: 30
    # (since 5.6.28) Traffic that passes the network rules of the state storage account: AzureServices (trusted Microsoft services), Logging, Metrics, or None.
    # default: ["AzureServices", "Logging", "Metrics"]; used by: terraform
    network_bypass: ["AzureServices", "Logging", "Metrics"]

# Anything this schema doesn't define: settings for one environment or one tool, each under its own key (for example extensions.devops_runner...
extensions: {}
