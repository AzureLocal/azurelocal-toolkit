      public_ip_name: "pip-iic-ng-hub-01"
      # (since 5.6.28) SKU of the NAT gateway and of its public IP: Standard or StandardV2 (zone redundant; it takes StandardV2 public IPs only).
      # one of: Standard | StandardV2; default: "Standard"; used by: terraform
      sku: "Standard"
    # Azure Firewall of the hub.
