    # (since 5.4) While the OS installs, turn off the PCIe slots that hold the SAN adapters listed in nodes[].san.hbas[], so the maintenance environment can'...
    # used by: ztp
    isolate_san_adapters: true
    # (since 5.4) When a node's management or provisioning port has slot Embedded (an onboard LOM), make sure the embedded NICs are enabled in the BIOS (Dell...
