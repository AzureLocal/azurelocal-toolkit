      # default: true; used by: cicd_infra, terraform
      allow_forwarded_traffic: true
      # (since 5.6.23) Whether the peerings that start in this network let the peer use the VPN or ExpressRoute gateway of this network (Microsoft Learn: Virtual...
      # default: false; used by: cicd_infra, terraform
      allow_gateway_transit: false
      # (since 5.6.23) Whether the peerings that start in this network use the gateway of the peer (Microsoft Learn: Virtual network peering, Use remote gateways).
      # default: false; used by: cicd_infra
      use_remote_gateways: false
  # (since 5.6.21) Network security groups (NSG) of the Azure landing zone networks, with their rules.
