      # one of: new_forest | replica; used by: ansible
      dc_promotion: "new_forest"
      # (since 5.6.28) For a machine with role domain_controller: a Key Vault secret reference (keyvault://<vault>/<secret>) to the Directory Services Restore Mod...
      # used by: ansible
      dsrm_password: "keyvault://kv-iic-mgmt-01/dsrm-password"
      # (since 5.6.28) Size of the OS disk in GB (VMs in Azure).
