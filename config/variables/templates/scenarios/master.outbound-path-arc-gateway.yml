    # Name of the Azure Monitor action group that tells the operations team about alerts.
    action_group: "ag-iic-azl-01"
    # true when health alerts are created.
    health_alerts: true
    # Address that receives the alerts (a team mailbox).
    alert_email: ""

# How the OS gets onto the machines (scenario.os_install), and the OS version.
