    # used by: cicd_infra
    name: "iic-azurelocal"
    # GitHub: owner/repo of a template repository.
    # used by: cicd_infra
    template: "AzureLocal/azurelocal-template"
    # Repository visibility.
    # one of: private | internal; default: "private"; used by: cicd_infra
    visibility: "private"
    # The protected default branch.
    # default: "main"; used by: cicd_infra
    default_branch: "main"
  # (since 5.5) 
  # used by: cicd_infra
  settings:
    # Approvals a pull request needs before it merges. 0 for a sandbox.
    # default: 2; used by: cicd_infra
    required_approvals: 2
    # The team or group whose members review: a GitHub team slug (org/team), a GitLab group path or an Azure DevOps group name.
    # used by: cicd_infra
    reviewers: "improbability-cloud/platform-team"
    # Allow squash merges only.
    # default: true; used by: cicd_infra
    squash_only: true
    # Turn on secret scanning and push protection (GitHub), secret push rules (GitLab) or the secret file check (Azure DevOps).
    # default: true; used by: cicd_infra
    secret_scanning: true
    # All conversations must be resolved before a merge.
    # default: true; used by: cicd_infra
    resolve_conversations: true
    # Pipeline checks that must pass before a merge.
    # used by: cicd_infra
    required_status_checks: []
  # (since 5.5) 
  # used by: cicd_infra
  environments:
    # Environment name, for example azr-prod-us, or ztp-reinstall for the approval in front of the ZTP Boot stage.
    # required; used by: cicd_infra
    - name: "azr-prod-us"
      # A named reviewer must approve each deployment.
      # default: false; used by: cicd_infra
      approval_required: true
      # GitHub user names or org/team slugs, GitLab user names or group paths, Azure DevOps e-mail addresses.
      # used by: cicd_infra
      approvers: ["platform-lead"]
      # Delay before a deployment starts (GitHub).
      # default: 0; used by: cicd_infra
      wait_minutes: 0
      # The only branch that may deploy to the environment.
      # default: "main"; used by: cicd_infra
      deployment_branch: "main"
  # (since 5.5) 
  # used by: cicd_infra
  authentication:
    # oidc: a federated credential per repository and environment, no secret. client_secret: a secret, stored only in Key Vault (devops.authentic...
    # one of: oidc | client_secret; default: "oidc"; used by: cicd_infra
    method: "oidc"
    # Key Vault reference where task 01 stores the generated client secret (method client_secret).
    # used by: cicd_infra
    client_secret: "keyvault://kv-example-01/client-secret"
    # Roles the service principal gets on each subscription.
    # used by: cicd_infra
    roles: ["Contributor", "User Access Administrator"]
    # Also add the Microsoft Graph application permission RoleManagement.ReadWrite.Directory and grant admin consent.
    # default: false; used by: cicd_infra
    grant_graph_role_management: false
    # Register Microsoft.Compute and the EncryptionAtHost feature on each subscription.
    # default: true; used by: cicd_infra
    register_encryption_at_host: true
  # (since 5.5) 
  # used by: cicd_infra
  runners:
    # Name prefix of the VM or VMs, for example vm-contoso-runner-lnx.
    # required; used by: cicd_infra
    - name: "vm-iic-runner-lnx"
      # Operating system.
      # required; one of: linux | windows; used by: cicd_infra
      os_type: "linux"
      # general: ARM, Arc, Terraform, Ansible and OS configuration. ztp: the azurelocal-ztp Boot, Bootstrap and Vouchers stages (Windows only).
      # one of: general | ztp; default: "general"; used by: deployment, cicd_infra
      purpose: "general"
      # Number of VMs.
      # default: 1; used by: cicd_infra
      count: 1
      # vm or vmss.
      # one of: vm | vmss; default: "vm"; used by: cicd_infra
      compute_type: "vm"
      # VM size.
      # used by: cicd_infra
      size: "Standard_D2s_v5"
      # Labels added to the defaults (azure, the OS, terraform, ansible, ztp).
      # used by: cicd_infra
      labels: []
      # Key Vault reference to the secret the runner reads at boot: a PAT or App token (GitHub), the runner authentication token (GitLab), a PAT wi...
      # used by: cicd_infra
      registration_secret: "keyvault://kv-iic-mgmt-01/github-runner-token"
      # The Azure Pipelines agent pool, or the GitHub runner group.
      # used by: cicd_infra
      pool: "azurelocal-ztp"
      # Static private addresses, one per VM.
      # used by: cicd_infra
      private_ips: ["10.20.10.4"]
      # The runner subnet inside runner_network.address_space.
      # used by: cicd_infra
      subnet:
        # Name of the subnet the runner machines are placed in.
        # required; used by: cicd_infra
        name: "snet-iic-runner-lnx-01"
        # Address range of that subnet, in CIDR form.
        # required; used by: cicd_infra
        prefix: "10.20.10.0/26"
      # Data disk for the ZTP media, images and vouchers. 512 or more for ztp.
      # default: 0; used by: cicd_infra
      data_disk_gb: 512
  # (since 5.5) 
  # used by: cicd_infra
  runner_network:
    # Name of the virtual network the runners are placed in.
    # used by: cicd_infra
    vnet_name: "vnet-iic-devops-01"
    # Address ranges of that virtual network, in CIDR form.
    # used by: cicd_infra
    address_space: ["10.20.10.0/24"]
    # DNS servers of that virtual network.
    # used by: cicd_infra
    dns_servers: []
    # Peering with the hub VNet.
    # used by: cicd_infra
    hub_peering:
      # Peer the runner VNet with the hub.
      # default: false; used by: cicd_infra
      enabled: true
      # Name of the hub in landing_zone.networks (its subscription and resource group give the VNet ID).
      # used by: cicd_infra
      hub_network: "vnet-iic-hub-01"
      # Resource ID of the hub VNet.
      # used by: cicd_infra
      hub_vnet_id: ""
      # Use the hub VPN or ExpressRoute gateway to reach the lab.
      # default: true; used by: cicd_infra
      use_remote_gateways: true
      # Create the hub half of the peering.
      # default: true; used by: cicd_infra
      create_hub_side: true
    # Lab networks the runners reach: management, storage, BMC.
    # used by: cicd_infra
    reachable_cidrs: ["192.0.2.0/24", "198.51.100.0/24"]
    # TCP ports allowed outbound to the lab networks.
    # used by: cicd_infra
    reachable_tcp_ports: []
    # The BMC networks.
    # used by: cicd_infra
    bmc_cidrs: ["198.51.100.0/24"]
    # Ranges that may reach SSH or RDP on the runners.
    # used by: cicd_infra
    admin_source_cidrs: []
  # (since 5.5) 
  # used by: cicd_infra
  runner_access:
    # Resource groups where the runners are Contributor.
    # used by: cicd_infra
    resource_groups: ["rg-iic-azl-01"]
    # Role Based Access Control Administrator on those resource groups, which the Azure Local deployment and ZTP need.
    # default: true; used by: cicd_infra
    rbac_administrator: true
    # Limit the roles the runners may assign to these role definition GUIDs.
    # used by: cicd_infra
    rbac_delegable_role_ids: []
    # Azure Connected Machine Resource Administrator on those resource groups, so jobs can run Arc Run Command on the machines.
    # default: true; used by: cicd_infra
    arc_run_command: true
    # Vaults the runners read secrets from.
    # used by: cicd_infra
    key_vaults: ["kv-iic-mgmt-01"]
  # One runner (the form before devops.runners[]).
  # used by: cicd_infra
  runner:
    # Name of the runner.
    # required; used by: cicd_infra
    name: ""
    # Kind of runner: vm, container_app or existing.
    # required; one of: vm | container_app | existing; used by: cicd_infra
    type: "vm"
    # Subscription of the runner.
    # used by: cicd_infra
    subscription: ""
    # Resource group of the runner.
    # used by: cicd_infra
    resource_group: ""
    # Virtual network of the runner.
    # used by: cicd_infra
    network: ""
    # Subnet of the runner.
    # used by: cicd_infra
    subnet: ""
    # Private address of the runner.
    # used by: cicd_infra
    private_ip: "192.0.2.10"
    # VM size of the runner.
    # used by: cicd_infra
    size: ""
    # Runner tags or labels that jobs select.
    # used by: cicd_infra
    labels: []
    # A Key Vault secret reference: keyvault://<vault>/<secret>.
    # used by: cicd_infra
    registration_token: "keyvault://kv-example-01/registration-token"
  # Where the Terraform state is kept.
  # used by: cicd_infra
  state:
    # (since 5.5) 
    # used by: cicd_infra
    subscription_id: "00000000-0000-0000-0000-000000000000"
    # (since 5.5) 
    # default: "cicd-infra.tfstate"; used by: cicd_infra
    key: "cicd-infra.tfstate"
    # Storage account that holds the state.
    # used by: cicd_infra
    storage_account: "stiictfstate01"
    # Blob container that holds the state.
    # used by: cicd_infra
    container: "tfstate"
    # Resource group of the state storage account.
    # used by: cicd_infra
    resource_group: "rg-iic-mgmt-01"

# Anything this schema doesn't define: settings for one environment or one tool, each under its own key (for example extensions.devops_runner...
extensions: {}
