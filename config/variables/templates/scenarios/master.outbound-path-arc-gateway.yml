    model: "S5248F-ON"
    # Serial number of the device.
    serial_number: ""
    # Firmware or OS version of the device.
    firmware_version: ""
    # How the device is managed.
    management:
      # An IPv4 address, or dhcp.
      ip_address: "198.51.100.6"
      # VLAN of the management interface of the device.
      vlan_id: 0
      # Protocol used to manage the device: ssh, https, telnet or snmp.
      # one of: ssh | https | telnet | snmp
      protocol: "ssh"
    # The login of the device.
    credentials:
