provisioning:
  # The solution version the machines run: latest, latest-preview, or a version such as 12.2610.1004.50.
  # required; used by: ztp, os_configuration
  os_version: "12.2610.1004.50"
  # OS installed from an ISO.
  iso:
    # microsoft (the Azure portal download) or oem (the OEM's image).
    # one of: microsoft | oem
    image_source: "microsoft"
    # Build of the Azure Local OS image the ISO holds.
    image_version: ""
  # Simplified machine provisioning from Azure, as azurelocal-ztp runs it. https://learn.microsoft.com/azure/azure-local/deploy/simplified-mach...
  # when scenario.os_install is simplified; used by: ztp
  simplified:
    # Resource name of the Microsoft.Edge site.
    # required; used by: ztp, monitoring
    site_name: "iic-site-01"
    # Subscription of the site and edge machines, when it isn't azure.subscription_id.
    # used by: ztp
    subscription_id: "00000000-0000-0000-0000-000000000000"
    # Resource group of the site and edge machines, when it isn't azure.resource_group.
    # used by: ztp
    resource_group: ""
    # The provisioning (maintenance environment) ISO: latest, a train such as 2610, a build such as 10.2610.0.3063, or a Microsoft download URL.
    # required; used by: ztp
    maintenance_iso: "latest"
    # The local administrator that the provisioned OS gets.
    # required; used by: ztp
    admin:
      # Name of the local administrator the OS install creates on each machine (Learn: step 3, provision machines from Azure).
      # required; used by: ztp
      username: "administrator"
      # At least 12 characters with lowercase, uppercase, a digit and a special character.
      # required; used by: ztp
