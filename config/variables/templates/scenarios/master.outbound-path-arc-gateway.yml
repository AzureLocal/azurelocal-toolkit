    target_rto_minutes: 0
    # Recovery point objective in minutes.
    target_rpo_minutes: 0
  # Who hears about alerts.
  notifications:
    # Addresses (team mailboxes) that receive the notifications of the operations tools.
    emails: ["noc@improbability.cloud"]
    # A Key Vault secret reference: keyvault://<vault>/<secret>.
    teams_webhook: "keyvault://kv-iic-mgmt-01/teams-webhook-url"
  # Licensing benefits the instance uses.
  licensing:
    # Azure Hybrid Benefit for the host fee and Windows Server guests.
