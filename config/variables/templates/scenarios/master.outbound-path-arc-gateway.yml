      password: "keyvault://kv-iic-mgmt-01/switch-admin-password"
    # High availability of the device.
    ha:
      # true when the device is one half of a high availability pair.
      enabled: false
      # The high availability mode, as the vendor names it.
      mode: ""

# Part 2 of the implementation steps: the Azure foundation the instance depends on.
landing_zone:
  # Azure management groups of the landing zone.
  management_groups:
    # Name (id) of the management group.
    # required
    - name: "mg-iic"
      # Display name of the management group.
      display_name: "IIC"
      # Parent management group name; empty for the tenant root.
      parent: "mg-iic"
  # Subscriptions by role. azure.subscription_id is the one the instance uses.
  # used by: cicd_infra
  subscriptions:
    # Name of the subscription; the other landing_zone entries refer to it.
    # required; used by: cicd_infra
    - name: "sub-iic-connectivity"
      # Subscription id (a GUID).
      # used by: cicd_infra
      id: "00000000-0000-0000-0000-000000000000"
      # What the subscription is for.
      # required; one of: connectivity | identity | management | security | devops | workload | azure_local; used by: cicd_infra
      role: "connectivity"
      # Management group the subscription is under.
      # used by: cicd_infra
      management_group: "mg-iic-platform"
  # Resource groups of the landing zone.
  # used by: cicd_infra
  resource_groups:
    # Name of the resource group.
    # required; used by: cicd_infra
    - name: "rg-iic-conn-01"
      # Name of a subscription in landing_zone.subscriptions.
      # used by: cicd_infra
      subscription: "sub-iic-connectivity"
      # Azure region of the resource group.
      # used by: cicd_infra
      location: "eastus"
      # What the resource group is for, in words.
      # used by: cicd_infra
      purpose: "hub network"
  # Resource provider namespaces to register, for example Microsoft.AzureStackHCI.
  resource_providers: ["Microsoft.AzureStackHCI", "Microsoft.HybridCompute", "Microsoft.Edge", "Microsoft.KeyVault"]
  # Azure Policy of the landing zone.
  policy:
    # Tag names that every resource should carry, one audit assignment of the built-in policy 'Require a tag on resources' for each.
    required_tags: ["environment", "owner", "cost_center", "workload"]
    # Name (id) of the management group the tag policy is assigned at; the assignment cascades to everything under it.
    management_group: "mg-iic"
  # Azure virtual networks.
  # used by: cicd_infra
  networks:
    # Name of the virtual network.
    # required; used by: cicd_infra
    - name: "vnet-iic-hub-01"
      # Name of the subscription (landing_zone.subscriptions[].name) that holds the network.
      # used by: cicd_infra
      subscription: "sub-iic-connectivity"
      # Resource group of the network.
      # used by: cicd_infra
      resource_group: "rg-iic-conn-01"
      # Azure region of the network.
      # used by: cicd_infra
      location: "eastus"
      # hub or spoke.
      # one of: hub | spoke; used by: cicd_infra
      role: "hub"
      # Address ranges of the virtual network, in CIDR form.
      # required; used by: cicd_infra
      address_space: ["10.20.0.0/22"]
      # DNS servers of the virtual network.
      # used by: cicd_infra
      dns_servers: ["192.0.2.4", "192.0.2.5"]
      # Subnets of the virtual network.
      # used by: cicd_infra
      subnets:
        # Name of the subnet, for example GatewaySubnet.
        # required; used by: cicd_infra
        - name: "GatewaySubnet"
          # Address range of the subnet in CIDR form.
          # required; used by: cicd_infra
          prefix: "10.20.0.0/27"
          # Name of the network security group on the subnet.
          # used by: cicd_infra
          network_security_group: ""
          # Name of the route table on the subnet.
          # used by: cicd_infra
          route_table: ""
      # Names of networks this one peers with.
      peer_with: ["vnet-iic-hub-01"]
  # Gateways, bastion and firewall of the connectivity hub.
  connectivity:
    # The VPN gateway of the hub.
    vpn_gateway:
      # Name of the VPN gateway.
      # required
      name: "vpng-iic-hub-01"
      # Resource group of the VPN gateway.
      resource_group: "rg-iic-conn-01"
      # Name of the virtual network the gateway sits in.
      network: "vnet-iic-hub-01"
      # SKU of the VPN gateway, for example VpnGw1AZ.
      sku: "VpnGw1AZ"
      # BGP autonomous system number of the gateway.
      bgp_asn: 65515
      # Site-to-site connections to other sites.
      site_to_site:
        # Name of the connection.
        # required
        - connection_name: "cn-iic-dal-01"
          # Name of the local network gateway resource.
          local_gateway_name: "lgw-iic-dal-01"
          # Public IPv4 address of the peer VPN device.
          peer_public_ip: "203.0.113.1"
          # Address ranges behind the peer, in CIDR form.
          peer_address_prefixes: ["192.0.2.0/24", "198.51.100.0/24"]
          # BGP peer address of the peer device.
          peer_bgp_address: "192.0.2.10"
          # BGP autonomous system number of the peer.
          peer_asn: 1
          # A Key Vault secret reference: keyvault://<vault>/<secret>.
          # required
          shared_key: "keyvault://kv-iic-mgmt-01/vpn-shared-key"
      # Point-to-site VPN for individual users.
      point_to_site:
        # Address pool handed to point-to-site clients, in CIDR form.
        # required
        address_pool: "192.0.2.0/24"
        # How clients sign in: entra_id, certificate or radius.
        # one of: entra_id | certificate | radius
        authentication: "entra_id"
    # Azure Bastion of the hub.
    bastion:
      # Name of the Bastion host.
      # required
      name: "bas-iic-hub-01"
      # Resource group of the Bastion host.
      resource_group: "rg-iic-conn-01"
      # SKU of the Bastion host, for example Standard.
      sku: "Standard"
    # Azure Firewall of the hub.
    firewall:
      # Name of the firewall.
      # required
      name: ""
      # Resource group of the firewall.
      resource_group: ""
      # SKU of the firewall.
      sku: ""
      # Private address of the firewall.
      private_ip: "192.0.2.10"
  # Management VMs: domain controllers, jump box, Windows Admin Center, syslog.
  virtual_machines:
    # Name of the virtual machine.
    # required
    - name: "vm-iic-dc-01"
      # Up to 15 letters, digits and hyphens.
      hostname: "iic-dc01"
      # What the machine is: domain_controller, jumpbox, windows_admin_center, syslog, management or other.
      # required; one of: domain_controller | jumpbox | windows_admin_center | syslog | management | other
      role: "domain_controller"
      # Where the VM runs.
      # one of: azure | azure_local | onprem
      deploy_target: "azure"
      # Name of the subscription that holds the machine.
      subscription: "sub-iic-management"
      # Resource group of the machine.
      resource_group: "rg-iic-mgmt-01"
      # Name of the virtual network the machine is in.
      network: "vnet-iic-mgmt-01"
      # Name of the subnet the machine is in.
      subnet: "snet-iic-mgmt-01"
      # Private IPv4 address of the machine.
      private_ip: "10.20.4.10"
      # Azure VM size, for example Standard_D2s_v5.
      size: "Standard_D2s_v5"
      # Operating system image of the machine.
      os: ""
      # Local administrator user name of the machine.
      admin_username: "iic-vmadmin"
      # A Key Vault secret reference: keyvault://<vault>/<secret>.
      admin_password: "keyvault://kv-iic-mgmt-01/vm-admin-password"
  # The Log Analytics workspace of the landing zone.
  log_analytics:
    # Name of the workspace.
    # required
    name: "log-iic-azl-01"
    # Resource group of the workspace.
    resource_group: "rg-iic-mgmt-01"
    # Days the workspace keeps data.
    retention_days: 90
  # Storage accounts of the landing zone.
  storage_accounts:
    # Name of the storage account (3 to 24 lowercase letters and digits).
    # required
    - name: "stiicazl01wit"
      # Resource group of the storage account.
      resource_group: "rg-iic-azl-01"
      # SKU of the storage account, for example Standard_LRS.
      sku: "Standard_LRS"
      # What the account is for, for example cloud witness.
      purpose: "cloud witness"

