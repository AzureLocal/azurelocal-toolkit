    # used by: os_configuration, deployment
    package_size_bytes: 1048576
    # Opt-in (schema 5.4.2): the toolkit side-loads an SBE only when you set winrm_copy or node_pull here; no value means no delivery, and a hard...
    # one of: winrm_copy | node_pull | skip; default: "skip"; used by: os_configuration
    delivery: "skip"
    # The folder the nodes pull the SBE files from (delivery node_pull).
    # used by: os_configuration
    node_pull_url: "https://sbe.iic.example/sbe/dell"
    # Test only.
    # used by: ztp
    allow_unvalidated: false
  # The physical network cards in every machine, and what each port is for.
  # used by: os_configuration
  network_cards:
    # Where the card sits, as the chassis labels it, for example Slot 6 or Embedded.
    # used by: os_configuration
    - label: "Onboard"
      # Manufacturer of the card.
      # used by: os_configuration
      make: ""
      # Model of the card, as the machine reports it.
      # used by: os_configuration
      model: ""
      # The ports of this network card, in the order the vendor numbers them.
      # used by: os_configuration
      ports:
        # Adapter name in the OS, as the intents use it.
        # required; used by: os_configuration
        - name: "Port1"
          # Port speed in Gbit/s.
          # used by: os_configuration
          speed_gbps: 25
          # RDMA technology the port supports: none, iwarp, roce (RoCE) or roce_v2 (RoCEv2).
          # one of: none | iwarp | roce | roce_v2; used by: os_configuration
          rdma: "none"
          # unused, intent:<intent name>, cluster:a, cluster:b, iscsi:a or iscsi:b.
          # used by: os_configuration
          role: "intent:management"
  # Drives per machine.
  drives:
    # The capacity drives in each machine (Storage Spaces Direct).
    capacity:
      # Media type of the capacity drives: nvme, ssd or hdd.
      # one of: nvme | ssd | hdd
      media: "nvme"
      # Number of capacity drives in each machine.
      count: 8
      # Size of one capacity drive in TB.
      size_tb: 3.84
    # The cache drives in each machine (Storage Spaces Direct).
    cache:
      # Media type of the cache drives: nvme, ssd or hdd.
      # one of: nvme | ssd | hdd
      media: "nvme"
      # Number of cache drives in each machine.
      count: 0
      # Size of one cache drive in TB.
      size_tb: 0

# The on-premises networks.
networking:
  # The management network and the infrastructure IP pool.
  # required; used by: os_configuration
  management:
    # CIDR.
    # required; used by: ztp, os_configuration, deployment
    subnet: "192.0.2.0/24"
    # The one default gateway.
    # required; used by: ztp, os_configuration, deployment
    gateway: "192.0.2.1"
    # 0 means untagged.
    # used by: ztp, os_configuration
    vlan_id: 0
    # ARM dnsServers.
    # required; used by: ztp, os_configuration, deployment
    dns_servers: ["192.0.2.4", "192.0.2.5"]
    # Deprecated in 5.2: set each port's ip_assignment in nodes[].network_adapters.
    # one of: static | dhcp | preconfigured; default: "static"; used by: ztp, os_configuration, deployment
    ip_assignment: "static"
    # ARM useDhcp: the deployment takes the host and cluster addresses from DHCP instead of static addresses and the infrastructure_pool.
    # used by: os_configuration, deployment
    use_dhcp: false
    # Simplified provisioning: the address range of the site's network setting (Microsoft.Edge/configurations/networkConfigurations ipv4.addressR...
    # used by: ztp, os_configuration
    site_ip_range:
      # First address of the range the site hands out when networking.management.static_method is site (the site network setting Manual).
      # required; used by: ztp, os_configuration
      start: "192.0.2.10"
      # Last address of the range the site hands out when networking.management.static_method is site.
      # required; used by: ztp, os_configuration
      end: "192.0.2.10"
    # Simplified provisioning: how the maintenance environment gets the address it reaches Azure with, on the ports with role provisioning, befor...
    # one of: dhcp | static; default: "dhcp"; used by: ztp, os_configuration
    provisioning_network: "dhcp"
    # (since 5.3) 
    # one of: device | site; default: "device"; used by: ztp, os_configuration
    static_method: "device"
    # (since 5.3) 
    # used by: ztp, os_configuration
    provisioning_dhcp_range:
      # First address of the DHCP pool of the provisioning network.
      # required; used by: ztp, os_configuration
      start: "192.0.2.100"
      # Last address of the DHCP pool of the provisioning network (at most 4096 addresses from the start).
      # required; used by: ztp, os_configuration
      end: "192.0.2.199"
    # At least six contiguous addresses in the management subnet, outside the machines' addresses.
    # used by: os_configuration, deployment
    infrastructure_pool:
      # First address of the pool the Azure Local infrastructure services use (ARM startingIPAddress): inside the management subnet, outside every...
      # required; used by: os_configuration, deployment
      start: "192.0.2.20"
      # Last address of the infrastructure pool (ARM endingIPAddress).
      # required; used by: os_configuration, deployment
      end: "192.0.2.29"
  # The out-of-band network of the BMCs.
  # used by: os_configuration
  oob:
    # Subnet of the out-of-band (BMC) network in CIDR form.
    # used by: os_configuration
    subnet: "198.51.100.0/24"
    # Default gateway of the out-of-band network.
    gateway: "198.51.100.1"
    # VLAN ID of the out-of-band network; 0 for an untagged port.
    vlan_id: 0
  # Time sources, as host names or addresses.
  # used by: ztp, os_configuration, deployment
  ntp_servers: ["192.0.2.4", "192.0.2.5"]
  # Network ATC intents.
  # used by: os_configuration, deployment
  intents:
    # Name of the Network ATC intent, for example management_compute or storage.
    # required; used by: os_configuration, deployment
    - name: "management"
      # Traffic types the intent carries: management, compute and storage (ARM trafficType).
      # required; used by: os_configuration, deployment
      traffic: ["management"]
      # Adapters of the intent, by the key nodes[].network_adapters[].name (the port's name in this file, the same on every machine; the file finds...
      # required; used by: os_configuration, deployment
      adapters: ["Port1", "Port2"]
      # Network ATC overrides.
      # used by: os_configuration
      overrides:
        # Data Center Bridging (DCB) quality of service overrides for the storage traffic (ARM qosPolicyOverrides).
        # used by: os_configuration, deployment
        qos:
          # 802.1p priority value of the cluster heartbeat traffic, 0 to 7 (ARM priorityValue8021Action_Cluster).
          # used by: os_configuration, deployment
          cluster_priority: 0
          # 802.1p priority value of the SMB Direct (RDMA storage) traffic, 0 to 7 (ARM priorityValue8021Action_SMB).
          # used by: os_configuration, deployment
          smb_priority: 0
          # Share of the link reserved for SMB Direct storage traffic, 1 to 100 percent (ARM bandwidthPercentage_SMB).
          # used by: os_configuration, deployment
          smb_bandwidth_percent: 1
        # Physical adapter property overrides (ARM adapterPropertyOverrides: jumboPacket, networkDirect, networkDirectTechnology).
        # used by: os_configuration, deployment
        adapter:
          # Value of the adapter's JumboPacket property in bytes: 1514 (standard frame), 4088 or 9014 (jumbo).
          # one of: 1514 | 4088 | 9014; used by: os_configuration, deployment
          jumbo_packet: 1514
          # RDMA (Network Direct) on the adapters of this intent. true is sent to ARM as networkDirect 'Enabled', false as 'Disabled'.
          # used by: os_configuration, deployment
          network_direct: false
          # RDMA technology of the adapters: iwarp, roce_v2 (RoCEv2) or roce (RoCE, version 1).
          # one of: iwarp | roce | roce_v2; used by: os_configuration, deployment
          network_direct_technology: "iwarp"
        # Virtual switch overrides of the intent's switch-embedded team (ARM virtualSwitchConfigurationOverrides).
        # used by: os_configuration, deployment
        virtual_switch:
          # SR-IOV on the intent's virtual switch (ARM enableIov).
          # used by: os_configuration, deployment
          enable_iov: false
          # Load balancing of the switch-embedded team: dynamic or hyper_v_port (ARM loadBalancingAlgorithm 'Dynamic' or 'HyperVPort').
          # one of: dynamic | hyper_v_port; used by: os_configuration, deployment
          load_balancing_algorithm: "dynamic"
  # Storage networks (Storage Spaces Direct).
  # when scenario.storage_connectivity is switchless; used by: os_configuration, deployment
  storage:
    # Network ATC assigns the storage addresses.
    # used by: os_configuration, deployment
    auto_ip: true
    # Switchless only: one or two links between each pair of machines.
    # when scenario.storage_connectivity is switchless; one of: single | dual
    switchless_links: "single"
    # Top-of-rack switches.
    tor_switches: 2
    # dedicated: storage on its own ports. converged: storage shares ports with other traffic.
    # one of: dedicated | converged; used by: os_configuration
    layout: "converged"
    # The storage networks (SMB), one per storage adapter.
    # used by: os_configuration
    networks:
      # For example StorageNetwork1.
      # required; used by: os_configuration, deployment
      - name: "StorageNetwork1"
        # The adapter of this storage network, by the key nodes[].network_adapters[].name (the same on every machine).
        # required; used by: os_configuration, deployment
        adapter: "Port3"
        # Network ATC defaults are 711 and 712.
        # required; used by: os_configuration, deployment
        vlan_id: 711
        # Needed when auto_ip is false.
        # used by: os_configuration, deployment
        subnet: "192.0.2.0/24"
  # Disaggregated (SAN) only: the cluster networks on standalone ports, fabric A and B.
  # when scenario.storage_architecture is san or hybrid; used by: os_configuration, deployment
  cluster_networks:
    # Name of the cluster network on a standalone port (fabric A or B of a SAN design), for example clusterNetwork-A.
    # required; used by: os_configuration, deployment
    - name: ""
      # The port of this cluster network, by the key nodes[].network_adapters[].name (the same on every machine).
      # required; used by: os_configuration, deployment
      adapter: ""
      # VLAN of this cluster network, 0 to 4094. 0 means untagged.
      # required; used by: os_configuration, deployment
      vlan_id: 1
      # Subnet of this cluster network in CIDR form.
      # required; used by: os_configuration, deployment
      subnet: "192.0.2.0/24"
      # What the network is for (since 5.6). management and oob mark a network the machines' remote management may be reached from: the remote mana...
      # one of: management | oob | automation | compute | storage | other; used by: os_configuration
      purpose: "management"
  # Every VLAN in the design, by name.
  # used by: os_configuration
  vlans:
    # Name of the VLAN, for example storage-1.
    # required; used by: os_configuration
    - name: "storage-1"
      # The VLAN number, 1 to 4094.
      # required; used by: os_configuration
      id: 711
      # Subnet that runs in this VLAN, in CIDR form.
      # used by: os_configuration
      subnet: "203.0.113.0/24"
      # Free text.
      # used by: os_configuration
      purpose: ""
  # Arc VM logical networks created after deployment (task phase-06 task-08, Invoke-LogicalNetworks-Orchestrated.ps1: az stack-hci-vm network l...
  # used by: os_configuration, deployment
  logical_networks:
    # Name of the Azure Local logical network resource.
    # required; used by: deployment
    - name: "lnet-workloads"
      # false skips this logical network when the logical networks are created, without removing it from the file.
      # default: true; used by: deployment
      enabled: true
      # How machines on this logical network get addresses: Static (the ip_pool is used; address_prefix is needed) or Dynamic (DHCP).
      # one of: Static | Dynamic; default: "Static"; used by: deployment
      ip_allocation_method: "Static"
      # Name of the network security group to associate with the logical network.
      # used by: deployment
      nsg_name: "nsg-workloads"
      # What the network is for (since 5.6). management and oob mark a network the machines' remote management may be reached from: the remote mana...
      # one of: management | oob | automation | compute | storage | other; used by: os_configuration, deployment
      purpose: "compute"
      # VLAN ID of the logical network; 0 for untagged.
      # used by: deployment
      vlan_id: 2204
      # Address prefix of the logical network in CIDR form.
      # used by: os_configuration, deployment
      address_prefix: "203.0.113.0/24"
      # Default gateway of the logical network.
      # used by: deployment
      gateway: "203.0.113.1"
      # DNS servers handed to machines on this logical network (ARM and az stack-hci-vm: dnsServers).
      # used by: deployment
      dns_servers: ["192.0.2.4", "192.0.2.5"]
      # The one address range Azure Local hands to virtual machines on this logical network (first and last address, both inside address_prefix); a...
      # used by: deployment
      ip_pool:
        # First address of the pool that virtual machines on this logical network draw from.
        # required; used by: deployment
        start: "203.0.113.100"
        # Last address of that pool.
        # required; used by: deployment
        end: "203.0.113.200"

# Accounts and the identity provider (scenario.identity).
identity:
  # The deployment's local administrator on every machine.
  # required; used by: ztp, os_configuration, deployment
  local_admin:
    # User name of the deployment local administrator on every machine (ARM localAdminUserName).
    # required; used by: ztp, os_configuration, deployment, monitoring
    username: "azl-admin"
    # Optional.
    # used by: deployment
    username_secret: "keyvault://kv-iic-mgmt-01/local-admin-username"
    # At least 14 characters with lowercase, uppercase, a digit and a special character.
    # required; used by: ztp, os_configuration, deployment
    password: "keyvault://kv-iic-mgmt-01/local-admin-password"
  # Local identity with Key Vault.
  # when scenario.identity is local_identity
  local_identity:
    # ARM dnsServerConfig: use_dns_server (UseDnsServer) or use_forwarder (UseForwarder).
    # required; one of: use_dns_server | use_forwarder; used by: deployment
    dns_server_config: "use_dns_server"
    # DNS zone of the local identity instance, for example the zone the identity endpoints are published in.
    # used by: deployment
    dns_zone: ""
    # DNS servers the identity instance forwards to.
    # used by: deployment
    dns_forwarders: []
  # Entra ID groups, role assignments and PIM.
  entra:
    # Entra ID groups the instance expects.
    groups:
      # Display name of the Entra ID group.
      # required
      - name: "grp-iic-azl-operators"
        # What the group is for, in words.
        purpose: "Operate the instance"
        # Azure role names assigned to the group.
        roles: ["Azure Stack HCI Administrator"]
        # Scope of the role assignments.
        scope: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-iic-azl-01"
    # User principal names of emergency access accounts, excluded from Conditional Access.
    break_glass_accounts: ["breakglass01@improbability.cloud"]
  # The Active Directory the instance joins and its accounts.
  # when scenario.identity is active_directory
  active_directory:
    # ARM domainFqdn.
    # required; used by: os_configuration, deployment
    domain_fqdn: "improbability.cloud"
    # Up to 15 letters, digits and hyphens.
    # used by: os_configuration, deployment, monitoring
    netbios_name: "IIC"
    # Distinguished name of the dedicated OU.
    # required; used by: os_configuration, deployment
    ou_path: "OU=iic-azl-01,OU=AzureLocal,DC=improbability,DC=cloud"
    # The LCM deployment user, created in the OU by the AD preparation module.
    # required; used by: deployment, monitoring
    lcm_user:
      # Name only, no domain.
      # required; used by: os_configuration, deployment, monitoring
      username: "lcm-iic-azl-01"
      # At least 14 characters with lowercase, uppercase, a digit and a special character.
      # required; used by: os_configuration, deployment, monitoring
      password: "keyvault://kv-iic-mgmt-01/lcm-password"
    # Optional override.
    # used by: os_configuration
    domain_join_account:
      # The join account: a name (svc-azl-join, qualified with netbios_name), NETBIOS\name or name@domain.
      # required; used by: os_configuration, monitoring
      username: "example"
      # A Key Vault secret reference.
      # required; used by: os_configuration, monitoring
      password: "keyvault://kv-example-01/password"
    # Domain principals the OS configuration adds to the local Administrators group of every machine after the join and the restart, so a domain...
    # used by: os_configuration
    local_admin_members: []
    # How the OS configuration run joins the machines to the domain.
    # used by: os_configuration
    join_options:
      # Fixed to false: the machine gets its final name before it joins (the Hostname step runs first) and is never renamed after.
      # default: false; used by: os_configuration
      rename_after_join: false
      # true: before the deployment, a machine already joined to this domain but sitting in another OU is moved into ou_path. false (default): it i...
      # default: false; used by: os_configuration
      allow_ou_move: false
    # Addresses of domain controllers, for pre-checks and for the domain join.
    # used by: os_configuration
    domain_controllers: ["192.0.2.4", "192.0.2.5"]
    # Whether the instance uses group managed service accounts.
    # default: false; used by: deployment
    use_gmsa: false
    # Whether the DNS servers of the management network support secure dynamic updates (Microsoft DNS integrated with Active Directory). true: th...
    # used by: deployment
    dns_secure_dynamic_updates: false
    # Groups created in the OU for administration of the instance.
    security_groups:
      # Name of the security group in Active Directory.
      # required; used by: os_configuration
      - name: "sg-iic-azl-01-admins"
        # What the group is for, in words.
        # used by: os_configuration
        purpose: "Administrators of the instance"
        # Members of the group, as account names (sAMAccountName or user principal name).
        members: []
        # The local groups of every machine this AD group is added to after the deployment (for example Administrators, Remote Management Users).
        # used by: os_configuration
        local_groups: []
    # Service and administration accounts, apart from the LCM user.
    service_accounts:
      # Name of the service account.
      # required
      - name: "svc-iic-azl-backup"
        # What the account is for, in words.
        purpose: "Backup agent"
        # A Key Vault secret reference: keyvault://<vault>/<secret>.
        password: "keyvault://kv-iic-mgmt-01/svc-backup-password"

# Storage of the instance: the deployment's storage mode, the volumes, and the SAN of a disaggregated or hybrid deployment (the san block app...
storage:
  # ARM configurationMode: express (Express), infra_only (InfraOnly) or keep_storage (KeepStorage).
  # one of: express | infra_only | keep_storage; used by: deployment
  configuration_mode: "express"
  # The cluster shared volumes to create after deployment.
  volumes:
    # Name of the volume, for example vol-workloads-01.
    # required
    - name: "vol-workloads-01"
      # Size of the volume in GiB.
      # required
      size_gib: 4096
      # Resiliency of the volume: two_way, three_way, four_way, parity or nested_two_way.
      # one of: two_way | three_way | four_way | parity | nested_two_way
      resiliency: "two_way"
  # The external SAN of a disaggregated (san) or hybrid deployment.
  # when scenario.storage_architecture is san or hybrid; used by: os_configuration, deployment
  san:
    # Whether the SAN is fibre_channel or iscsi.
    # required; one of: fibre_channel | iscsi; used by: os_configuration, deployment
    type: "fibre_channel"
    # (since 5.3) 
    # used by: os_configuration, deployment
    array:
      # The array's name, for example its hostname in the array manager.
      # required; used by: deployment
      name: "example"
      # Vendor of the storage array, for example Dell or Pure Storage.
      # required; used by: os_configuration, deployment
      vendor: "example"
      # Model of the storage array, for example PowerStore 1200T.
      # required; used by: os_configuration, deployment
      model: "example"
      # The array's management address, when the SAN deployment drives it.
      management_address: "192.0.2.10"
    # (since 5.3) 
    # used by: deployment
    fibre_channel:
      # The Fibre Channel fabrics, for example A and B.
      # used by: deployment
      fabrics:
        # For example A or B.
        # required; used by: deployment
        - name: "example"
          # The fabric's switch, for example a network_devices[].hostname.
          # used by: deployment
          switch: ""
          # The active zone set on this fabric.
          zone_set: ""
      # The array's target ports (WWPNs) and the fabric each is cabled to.
      # used by: deployment
      target_wwpns:
        # A Fibre Channel World Wide Port Name: 16 hexadecimal digits, as 8 colon-separated pairs (50:00:09:72:08:12:34:56) or without colons.
        # required; used by: deployment
        - wwpn: ""
          # A name in fabrics.
          # required; used by: deployment
          fabric: "example"
    # (since 5.3) 
    # used by: os_configuration, deployment
    iscsi:
      # The array's iSCSI targets.
      # used by: os_configuration, deployment
      targets:
        # An iSCSI qualified name (iqn.yyyy-mm.reversed.domain[:identifier]), or an eui. or naa. name.
        # required; used by: os_configuration, deployment
        - iqn: ""
          # The target portals: an IPv4 address, optionally with a port (default 3260), for example 198.51.100.10 or 198.51.100.10:3260.
          # required; used by: os_configuration, deployment
          portals: []
          # The storage network this target serves, matching the iSCSI port role: A for iscsi:a, B for iscsi:b.
          # used by: os_configuration, deployment
          fabric: "example"
      # CHAP authentication of the sessions.
      # used by: os_configuration, deployment
      chap:
        # true when the iSCSI targets require CHAP.
        # required; used by: os_configuration, deployment
        enabled: false
        # CHAP user name for the iSCSI targets.
        username: "example"
        # A Key Vault secret reference: keyvault://<vault>/<secret>.
        secret: "keyvault://kv-example-01/secret"
    # LUN of the infrastructure volume (250 GB minimum).
    # used by: os_configuration, deployment
    infra_volume_lun_id: ""
    # LUN of the performance history volume (20 GB minimum).
    # used by: os_configuration, deployment
    performance_history_lun_id: ""
    # The LUNs the array presents to the cluster.
    luns:
      # Name of the LUN as it is on the array.
      # required
      - name: ""
        # Size of the LUN in GiB.
        # required
        size_gib: 0
        # The logical unit number the array presents the LUN as, for example 2.
        lun_id: ""

# Security settings of the deployment.
security:
  # ARM securityLevel: recommended (Recommended) or customized (Customized).
  # one of: recommended | customized; used by: deployment
  level: "recommended"
  # true turns drift control on: Azure Local resets the security settings to the baseline after drift.
  # used by: deployment
  drift_control: true
  # true turns Credential Guard on in the security settings of the deployment.
  # used by: deployment
  credential_guard: true
  # true turns SMB signing on in the security settings of the deployment.
  # used by: deployment
  smb_signing: true
  # true encrypts SMB traffic between the cluster nodes (not the storage traffic).
  # used by: deployment
  smb_cluster_encryption: false
  # true turns BitLocker on for the boot volume.
  # used by: deployment
  bitlocker_boot_volume: true
  # true turns BitLocker on for the data volumes.
  # used by: deployment
  bitlocker_data_volumes: true
  # true turns Windows Defender Application Control on.
  # used by: deployment
  wdac: true
  # Name of the Key Vault that keeps the BitLocker recovery keys.
  backup_key_vault: ""
  # The free level of Microsoft Defender for Cloud that Azure Local needs to show its security settings in the Azure portal.
  defender_for_cloud:
    # true (default) registers the Microsoft.Security resource provider on the subscription of the cluster, which turns on Foundational CSPM, the...
    # default: true
    enabled: true
    # true (default) assigns the Microsoft cloud security benchmark initiative to the subscription of the cluster when it is not assigned yet.
    # default: true
    apply_cloud_security_benchmark: true
  # What the cluster sends to Microsoft as telemetry.
  # used by: deployment
  telemetry:
    # true sends the streaming diagnostic data.
    # used by: deployment
    streaming_data: true
    # true sends the episodic diagnostic data.
    # used by: deployment
    episodic_data_upload: true
    # true keeps the diagnostic data in the EU data boundary.
    # used by: deployment
    eu_location: false

# SDN enabled by Azure Arc.
sdn:
  # true when Software Defined Networking is turned on for the instance.
  # required
  enabled: false
  # Prefix of the names of the SDN resources.
  prefix: ""
  # How the SDN DNS records are created: dynamic or static.
  # one of: dynamic | static
  dns_records: "dynamic"
  # true when the default network access policy of the SDN allows traffic that no rule denies.
  default_access_policy: false

# Day-2 choices: updates, backup, disaster recovery, notifications, licensing and monitoring.
operations:
  # How updates are applied: portal or powershell.
  # one of: portal | powershell
  update_method: "portal"
  # Backup of the instance and its workloads.
  backup:
    # true when backup is part of the design.
    # required
    enabled: false
    # What is backed up: host, guest or both.
    # one of: host | guest | both
    approach: "host"
    # Name of the backup solution, for example Azure Backup.
    solution: ""
    # Name of the Recovery Services vault.
    recovery_vault: ""
    # Resource group of the Recovery Services vault.
    resource_group: ""
    # Name of the backup policy.
    policy: ""
  # Disaster recovery of the workloads.
  disaster_recovery:
    # none, asr (Azure Site Recovery) or hyper_v_replica.
    # one of: none | asr | hyper_v_replica
    method: "none"
    # Name of the Recovery Services vault used for replication.
    recovery_vault: ""
    # Resource group of the Recovery Services vault.
    resource_group: ""
    # Name of the replication policy.
    replication_policy: ""
    # Name of the recovery plan.
    recovery_plan: ""
    # Network the VMs fail over to.
    network: ""
    # Isolated network for test failovers.
    test_network: ""
    # Storage account that holds replication data.
    storage_account: ""
