    maintenance_password: "keyvault://kv-example-01/maintenance-password"
    # The SMB share the BMCs mount the images from.
    # required; used by: ztp
    media_share:
      # required; used by: ztp
      name: "ztp-virtual-usb"
      # The management host's address as the BMCs reach it.
      # used by: ztp
      host: "198.51.100.5"
      # Instead of host: the local adapter whose IPv4 address the BMCs reach.
      # used by: ztp
      host_adapter: ""
      # (since 5.4) 
      # default: "svc-ztp-media"; used by: ztp
      account_name: "svc-ztp-media"
      # (since 5.4) 
      # default: false; used by: ztp
      keep: false
    # (since 5.2) 
    # used by: ztp
    media_path: "D:\\Data\\azl-ztp\\iic-azl-01\\media"
    # (since 5.2) 
    # used by: ztp, monitoring
    evidence_path: "D:\\Data\\azl-ztp\\iic-azl-01\\evidence"
    # (since 5.4) 
    # used by: ztp
    isolate_san_adapters: true
    # (since 5.4) 
    # default: true; used by: ztp
    enable_embedded_nics: true
    # (since 5.4) 
    # default: true; used by: ztp
    create_resource_group: true
    # (since 5.4) 
    # default: "default"; used by: ztp
    configuration_name: "default"
    # (since 5.4) 
    # used by: ztp
    managed_resource_group_name: ""
    # (since 5.4) 
    # default: true; used by: ztp
    apply_site_settings: true
    # (since 5.4) 
    # default: true; used by: ztp
    use_key_vault_configuration: true
    # (since 5.4) 
    # default: true; used by: ztp
    assign_provisioning_roles: true
    # (since 5.4) 
    # default: true; used by: ztp
    assign_hci_rp_role: true
    # (since 5.4) 
    # one of: LAN | WLAN; default: "LAN"; used by: ztp
    network_kind: "LAN"
    # (since 5.4) 
    # used by: ztp
    ntp:
      # Automatic or Manual.
      # one of: Automatic | Manual; default: "Automatic"; used by: ztp
      configuration: "Automatic"
      # The NTP server (address or name) when configuration is Manual.
      # used by: ztp
      server: "example"
      # The alternate NTP server when configuration is Manual.
      # used by: ztp
      alternate_server: "example"
    # (since 5.4) 
    # one of: Auto | Create | Reuse; default: "Auto"; used by: ztp
    site_mode: "Auto"
    # (since 5.4) 
    # used by: ztp, deployment
    deployment_name: ""
    # (since 5.4) 
    # default: false; used by: ztp
    skip_azure_check: false
    # (since 5.4) 
    # default: false; used by: ztp
    include_preview: false
    # (since 5.4) 
    # used by: ztp
    max_train: ""
    # (since 5.4) 
    # default: true; used by: ztp
    retry_provision_os: true
    # (since 5.4) 
    # used by: ztp
    usb_image:
      # Image size in GiB.
      # default: 4; used by: ztp
      size_gb: 4
      # File-name prefix of the images (<prefix><node>.img).
      # default: "ztp-usb-"; used by: ztp
      name_prefix: "ztp-usb-"
    # (since 5.4) 
    # used by: ztp
    maintenance_environment:
      # TCP port of the service (https://<address>:<port>/BootstrapOobeService).
      # default: 20001; used by: ztp
      port: 20001
      # The service's local user.
      # default: "edgeuser"; used by: ztp
      username: "edgeuser"
    # (since 5.4) 
    # used by: ztp
    timeouts:
      # Bootstrap stage: overall budget until the maintenance environment is up and every node is ready for the portal.
      # default: 120; used by: ztp
      bootstrap_minutes: 120
      # Bootstrap stage: budget until a valid voucher appears.
      # default: 90; used by: ztp
      bootstrap_voucher_minutes: 90
      # Bootstrap stage: how long the BMC may show no change before the stage reports a stall.
      # default: 20; used by: ztp
      bootstrap_stall_minutes: 20
      # Vouchers stage: how long to wait for each node's voucher in its image.
      # default: 120; used by: ztp
      voucher_wait_minutes: 120
      # Device stage: how long the maintenance environment may take to report the static address (and to be found by the scan).
      # default: 30; used by: ztp
      device_minutes: 30
      # Ready stage: polling budget until every machine is ready to cluster.
      # default: 180; used by: ztp
      ready_minutes: 180
      # Network stage: how long each Azure configuration job may take.
      # default: 60; used by: ztp
      network_minutes: 60
      # Restore stage: how long to wait after the BIOS restart before checking that the Arc machines are Connected again.
      # default: 5; used by: ztp
      restore_settle_minutes: 5
      # Boot and Restore stages: how long to wait for a node's BIOS to report the new values after the restart.
      # default: 30; used by: ztp
      bios_minutes: 30
      # (since 5.4.1) 
      # default: 10; used by: ztp
      adapters_minutes: 10
      # Ready and Network stages: seconds between polls.
      # default: 60; used by: ztp
      poll_interval_seconds: 60

# How the toolkit's OS configuration run (Invoke-AzureLocalOsConfiguration.ps1) treats the machines after the OS is installed, whichever way...
# used by: os_configuration
os_configuration:
  # Wipe the leftover local storage (storage pools, virtual disks and the data on non-boot, non-system local disks) of every machine in the OS...
  # default: false; used by: os_configuration
  clear_storage: false
  # How a guarded network change is confirmed (since 5.4.4): the management address, gateway, DNS, VLAN, the remote-management firewall rules,...
  # used by: os_configuration
  network:
    # The window for the orchestrator's confirmation.
    # default: 10; used by: os_configuration
    confirm_minutes: 10
    # How long the node's own checks must stay green before it waits for the confirmation.
    # default: 60; used by: os_configuration
    stable_seconds: 60
  # How the OS configuration reaches the nodes and how their remote management (WinRM, RDP, ICMP) is secured.
  # used by: os_configuration
  remoting:
    # winrm (HTTP, 5985), winrm_https (5986, a certificate on the node) or arc (Azure Arc Run Command: the exception for sites with no route to t...
    # one of: winrm | winrm_https | arc; default: "winrm"; used by: os_configuration
    transport: "winrm"
    # How a node whose WinRM firewall rule blocks this host is opened once, without touching the node by hand. none: such a node fails with the d...
    # one of: none | arc | smb | auto; default: "none"; used by: os_configuration
    bootstrap_transport: "none"
    # The runner and jump server addresses, as the node sees them (after NAT), allowed to use WinRM, RDP and ICMP on the nodes, in addition to th...
    # used by: os_configuration
    allowed_source_cidrs: ["198.51.100.10/32"]
    # true: the nodes' firewall accepts WinRM, RDP and ICMP from any source (and TrustedHosts is '*' on the machine running the automation).
    # used by: os_configuration
    allow_any_source: false
    # The TrustedHosts policy on the machine running the automation. auto: the class decides. exact: only the nodes' addresses. wildcard: '*', la...
    # one of: auto | exact | wildcard; default: "auto"; used by: os_configuration
    trusted_hosts: "auto"
    # auto: the class decides (HTTP in lab and test; HTTPS in dev, production and dmz). true: WinRM over HTTPS (5986). false: HTTP only, which pr...
    # one of: auto | True | False; default: "auto"; used by: os_configuration
    use_https: "auto"
    # true: you confirm the network of the nodes has no route to production.
    # used by: os_configuration
    isolation_confirmed: false
    # The server certificate for the HTTPS listener: the 40-hex thumbprint of a certificate already in the node's LocalMachine\My store, or keyva...
    # used by: os_configuration
    certificate: ""

