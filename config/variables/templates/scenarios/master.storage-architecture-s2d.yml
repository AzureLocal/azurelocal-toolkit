# The on-premises networks.
networking:
  # The management network and the infrastructure IP pool.
  # required; used by: os_configuration
  management:
    # CIDR.
    # required; used by: ztp, os_configuration, deployment
    subnet: "192.0.2.0/24"
    # The one default gateway.
    # required; used by: ztp, os_configuration, deployment
    gateway: "192.0.2.1"
    # 0 means untagged.
    # used by: ztp, os_configuration
    vlan_id: 0
    # ARM dnsServers.
    # required; used by: ztp, os_configuration, deployment
    dns_servers: ["192.0.2.4", "192.0.2.5"]
    # Deprecated in 5.2: set each port's ip_assignment in nodes[].network_adapters.
    # one of: static | dhcp | preconfigured; default: "static"; used by: ztp, os_configuration, deployment
    ip_assignment: "static"
    # ARM useDhcp: the deployment takes the host and cluster addresses from DHCP instead of static addresses and the infrastructure_pool.
    # used by: os_configuration, deployment
    use_dhcp: false
    # Simplified provisioning: the address range of the site's network setting (Microsoft.Edge/configurations/networkConfigurations ipv4.addressR...
    # used by: ztp, os_configuration
    site_ip_range:
      # required; used by: ztp, os_configuration
      start: "192.0.2.10"
      # required; used by: ztp, os_configuration
      end: "192.0.2.10"
    # Simplified provisioning: how the maintenance environment gets the address it reaches Azure with, on the ports with role provisioning, befor...
    # one of: dhcp | static; default: "dhcp"; used by: ztp, os_configuration
    provisioning_network: "dhcp"
    # (since 5.3) 
    # one of: device | site; default: "device"; used by: ztp, os_configuration
    static_method: "device"
    # (since 5.3) 
    # used by: ztp, os_configuration
    provisioning_dhcp_range:
      # required; used by: ztp, os_configuration
      start: "192.0.2.100"
      # required; used by: ztp, os_configuration
      end: "192.0.2.199"
    # At least six contiguous addresses in the management subnet, outside the machines' addresses.
    # used by: os_configuration, deployment
    infrastructure_pool:
      # required; used by: os_configuration, deployment
      start: "192.0.2.20"
      # required; used by: os_configuration, deployment
      end: "192.0.2.29"
  # The out-of-band network of the BMCs.
  oob:
    # used by: os_configuration
    subnet: "198.51.100.0/24"
    gateway: "198.51.100.1"
    vlan_id: 0
  # Time sources, as host names or addresses.
  # used by: ztp, os_configuration, deployment
  ntp_servers: ["192.0.2.4", "192.0.2.5"]
  # Network ATC intents.
  # used by: os_configuration, deployment
  intents:
    # required; used by: os_configuration, deployment
    - name: "management"
      # required; used by: os_configuration, deployment
      traffic: ["management"]
      # Adapter names in the OS, the same on every machine.
      # required; used by: os_configuration, deployment
      adapters: ["Port1", "Port2"]
      # Network ATC overrides.
      # used by: os_configuration
      overrides:
        # used by: os_configuration
        qos:
          # used by: os_configuration, deployment
          cluster_priority: 0
          # used by: os_configuration, deployment
          smb_priority: 0
          # used by: os_configuration, deployment
          smb_bandwidth_percent: 1
        # used by: os_configuration
        adapter:
          # one of: 1514 | 4088 | 9014; used by: os_configuration, deployment
          jumbo_packet: 1514
          # used by: os_configuration, deployment
          network_direct: false
          # one of: iwarp | roce | roce_v2; used by: os_configuration, deployment
          network_direct_technology: "iwarp"
        # used by: os_configuration
        virtual_switch:
          # used by: os_configuration, deployment
          enable_iov: false
          # one of: dynamic | hyper_v_port; used by: os_configuration, deployment
          load_balancing_algorithm: "dynamic"
  # Storage networks (Storage Spaces Direct).
  # when scenario.storage_connectivity is switchless; used by: os_configuration, deployment
  storage:
    # Network ATC assigns the storage addresses.
    # used by: os_configuration, deployment
    auto_ip: true
    # Switchless only: one or two links between each pair of machines.
    # when scenario.storage_connectivity is switchless; one of: single | dual; used by: os_configuration
    switchless_links: "single"
    # Top-of-rack switches.
    # used by: os_configuration
    tor_switches: 2
    # dedicated: storage on its own ports. converged: storage shares ports with other traffic.
    # one of: dedicated | converged; used by: os_configuration
    layout: "converged"
    # used by: os_configuration
    networks:
      # For example StorageNetwork1.
      # required; used by: os_configuration, deployment
      - name: "StorageNetwork1"
        # Adapter name in the OS.
        # required; used by: os_configuration, deployment
        adapter: "Port3"
        # Network ATC defaults are 711 and 712.
        # required; used by: os_configuration, deployment
        vlan_id: 711
        # Needed when auto_ip is false.
        # used by: os_configuration, deployment
        subnet: "192.0.2.0/24"
  # Every VLAN in the design, by name.
  # used by: os_configuration
  vlans:
    # required; used by: os_configuration
    - name: "storage-1"
      # required; used by: os_configuration
      id: 711
      # used by: os_configuration
      subnet: "203.0.113.0/24"
      # Free text.
      # used by: os_configuration
      purpose: ""
  # Arc VM logical networks created after deployment.
  logical_networks:
    # required
    - name: "lnet-workloads"
      # What the network is for (since 5.6). management and oob mark a network the machines' remote management may be reached from: the remote mana...
      # one of: management | oob | automation | compute | storage | other; used by: os_configuration
      purpose: "compute"
      vlan_id: 2204
      # used by: os_configuration
      address_prefix: "203.0.113.0/24"
      gateway: "203.0.113.1"
      dns_servers: ["192.0.2.4", "192.0.2.5"]
      ip_pool:
        # required
        start: "203.0.113.100"
        # required
        end: "203.0.113.200"
  # Details of scenario.outbound_path.
  # when scenario.outbound_path is proxy or proxy_arc_gateway
  outbound:
    # when scenario.outbound_path is proxy or proxy_arc_gateway
    proxy:
      # required
      url: ""
      bypass: []
    # The Arc gateway resource, in the same subscription as the machines.
    # when scenario.outbound_path is arc_gateway or proxy_arc_gateway
    arc_gateway:
      # required; used by: os_configuration
      name: ""
      # used by: os_configuration
      resource_group: ""
    # when scenario.outbound_path is private_path
    private_path:
      # one of: expressroute | site_to_site_vpn
      transport: "expressroute"
      virtual_network: ""
      workload_subnet: ""
      firewall_subnet: ""
      firewall_private_ip: "192.0.2.10"
      firewall_port: 1
      arc_private_link_scope: false
      proxy_bypass: []

# Accounts and the identity provider (scenario.identity).
identity:
  # The deployment's local administrator on every machine.
  # required; used by: ztp, os_configuration, deployment
  local_admin:
    # required; used by: ztp, os_configuration, deployment, monitoring
    username: "azl-admin"
    # At least 14 characters with lowercase, uppercase, a digit and a special character.
    # required; used by: ztp, os_configuration, deployment
    password: "keyvault://kv-iic-mgmt-01/local-admin-password"
  # Local identity with Key Vault.
  # when scenario.identity is local_identity
  local_identity:
    # ARM dnsServerConfig: use_dns_server (UseDnsServer) or use_forwarder (UseForwarder).
    # required; one of: use_dns_server | use_forwarder; used by: deployment
    dns_server_config: "use_dns_server"
    # used by: deployment
    dns_zone: ""
    # used by: deployment
    dns_forwarders: []
  # Entra ID groups, role assignments and PIM.
  entra:
    groups:
      # required
      - name: "grp-iic-azl-operators"
        purpose: "Operate the instance"
        # Azure role names assigned to the group.
        roles: ["Azure Stack HCI Administrator"]
        # Scope of the role assignments.
        scope: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-iic-azl-01"
    # User principal names of emergency access accounts, excluded from Conditional Access.
    break_glass_accounts: ["breakglass01@improbability.cloud"]
  # when scenario.identity is active_directory
  active_directory:
    # ARM domainFqdn.
    # required; used by: os_configuration, deployment
    domain_fqdn: "improbability.cloud"
    # Up to 15 letters, digits and hyphens.
    # used by: os_configuration, deployment, monitoring
    netbios_name: "IIC"
    # Distinguished name of the dedicated OU.
    # required; used by: os_configuration, deployment
    ou_path: "OU=iic-azl-01,OU=AzureLocal,DC=improbability,DC=cloud"
    # The LCM deployment user, created in the OU by the AD preparation module.
    # required; used by: deployment, monitoring
    lcm_user:
      # Name only, no domain.
