provisioning:
  # Simplified machine provisioning from Azure, as azurelocal-ztp runs it. https://learn.microsoft.com/azure/azure-local/deploy/simplified-mach...
  # when scenario.os_install is simplified; used by: ztp
  simplified:
    # (since 5.4) 
    # used by: ztp, deployment
    deployment_name: ""

# Part 1 of the implementation steps: the pipeline platform, the project and its settings, the environments, the sign-in to Azure and the sel...
devops:
