# The on-premises networks.
networking:
  # The management network and the infrastructure IP pool.
  # required; used by: os_configuration
  management:
    # CIDR.
    # required; used by: ztp, os_configuration, deployment
    subnet: "192.0.2.0/24"
    # The one default gateway.
    # required; used by: ztp, os_configuration, deployment
    gateway: "192.0.2.1"
    # ARM dnsServers.
    # required; used by: ztp, os_configuration, deployment
    dns_servers: ["192.0.2.4", "192.0.2.5"]
    # Deprecated in 5.2: set each port's ip_assignment in nodes[].network_adapters.
    # one of: static | dhcp | preconfigured; default: "static"; used by: ztp, os_configuration, deployment
    ip_assignment: "static"
    # ARM useDhcp: the deployment takes the host and cluster addresses from DHCP instead of static addresses and the infrastructure_pool.
    # used by: os_configuration, deployment
    use_dhcp: false
    # At least six contiguous addresses in the management subnet, outside the machines' addresses.
    # used by: os_configuration, deployment
    infrastructure_pool:
      # required; used by: os_configuration, deployment
      start: "192.0.2.20"
      # required; used by: os_configuration, deployment
      end: "192.0.2.29"
  # Time sources, as host names or addresses.
  # used by: ztp, os_configuration, deployment
  ntp_servers: ["192.0.2.4", "192.0.2.5"]
  # Network ATC intents.
  # used by: os_configuration, deployment
  intents:
    # required; used by: os_configuration, deployment
    - name: "management"
      # required; used by: os_configuration, deployment
      traffic: ["management"]
      # Adapter names in the OS, the same on every machine.
      # required; used by: os_configuration, deployment
      adapters: ["Port1", "Port2"]
      # Network ATC overrides.
      # used by: os_configuration
      overrides:
        # used by: os_configuration
        qos:
          # used by: os_configuration, deployment
          cluster_priority: 0
          # used by: os_configuration, deployment
          smb_priority: 0
          # used by: os_configuration, deployment
          smb_bandwidth_percent: 1
        # used by: os_configuration
        adapter:
          # one of: 1514 | 4088 | 9014; used by: os_configuration, deployment
          jumbo_packet: 1514
          # used by: os_configuration, deployment
          network_direct: false
          # one of: iwarp | roce | roce_v2; used by: os_configuration, deployment
          network_direct_technology: "iwarp"
        # used by: os_configuration
        virtual_switch:
          # used by: os_configuration, deployment
          enable_iov: false
          # one of: dynamic | hyper_v_port; used by: os_configuration, deployment
          load_balancing_algorithm: "dynamic"
  # Storage networks (Storage Spaces Direct).
  # when scenario.storage_connectivity is switchless; used by: os_configuration, deployment
  storage:
    # Network ATC assigns the storage addresses.
    # used by: os_configuration, deployment
    auto_ip: true
    # used by: os_configuration
    networks:
      # For example StorageNetwork1.
      # required; used by: os_configuration, deployment
      - name: "StorageNetwork1"
        # Adapter name in the OS.
        # required; used by: os_configuration, deployment
        adapter: "Port3"
        # Network ATC defaults are 711 and 712.
        # required; used by: os_configuration, deployment
        vlan_id: 711
        # Needed when auto_ip is false.
        # used by: os_configuration, deployment
        subnet: "192.0.2.0/24"
  # Disaggregated (SAN) only: the cluster networks on standalone ports, fabric A and B.
  # when scenario.storage_architecture is san or hybrid; used by: os_configuration, deployment
  cluster_networks:
    # required; used by: os_configuration, deployment
    - name: ""
      # required; used by: os_configuration, deployment
      adapter: ""
      # required; used by: os_configuration, deployment
      vlan_id: 1
      # required; used by: os_configuration, deployment
      subnet: "192.0.2.0/24"

# Accounts and the identity provider (scenario.identity).
identity:
  # The deployment's local administrator on every machine.
  # required; used by: ztp, os_configuration, deployment
  local_admin:
    # required; used by: ztp, os_configuration, deployment, monitoring
    username: "azl-admin"
    # At least 14 characters with lowercase, uppercase, a digit and a special character.
    # required; used by: ztp, os_configuration, deployment
    password: "keyvault://kv-iic-mgmt-01/local-admin-password"
  # Local identity with Key Vault.
  # when scenario.identity is local_identity
  local_identity:
    # ARM dnsServerConfig: use_dns_server (UseDnsServer) or use_forwarder (UseForwarder).
    # required; one of: use_dns_server | use_forwarder; used by: deployment
    dns_server_config: "use_dns_server"
    # used by: deployment
    dns_zone: ""
    # used by: deployment
    dns_forwarders: []
  # when scenario.identity is active_directory
  active_directory:
    # ARM domainFqdn.
    # required; used by: os_configuration, deployment
    domain_fqdn: "improbability.cloud"
    # Up to 15 letters, digits and hyphens.
    # used by: os_configuration, deployment, monitoring
    netbios_name: "IIC"
    # Distinguished name of the dedicated OU.
    # required; used by: os_configuration, deployment
    ou_path: "OU=iic-azl-01,OU=AzureLocal,DC=improbability,DC=cloud"
    # The LCM deployment user, created in the OU by the AD preparation module.
    # required; used by: deployment, monitoring
    lcm_user:
      # Name only, no domain.
      # required; used by: os_configuration, deployment, monitoring
      username: "lcm-iic-azl-01"
      # At least 14 characters with lowercase, uppercase, a digit and a special character.
      # required; used by: os_configuration, deployment, monitoring
      password: "keyvault://kv-iic-mgmt-01/lcm-password"

# Volumes and the SAN.
# when scenario.storage_architecture is san or hybrid
storage:
  # ARM configurationMode: express (Express), infra_only (InfraOnly) or keep_storage (KeepStorage).
  # one of: express | infra_only | keep_storage; used by: deployment
  configuration_mode: "express"
  # The external SAN of a disaggregated (san) or hybrid deployment.
  # when scenario.storage_architecture is san or hybrid; used by: deployment
  san:
    # fibre_channel needs storage.san.fibre_channel; iscsi needs storage.san.iscsi.
    # required; one of: fibre_channel | iscsi; used by: os_configuration, deployment
    type: "fibre_channel"
    # (since 5.3) 
    # used by: deployment
    array:
      # The array's name, for example its hostname in the array manager.
      # required; used by: deployment
      name: "example"
      # required; used by: os_configuration, deployment
      vendor: "example"
      # required; used by: os_configuration, deployment
      model: "example"
      # The array's management address, when the SAN deployment drives it.
      # used by: deployment
      management_address: "192.0.2.10"
    # (since 5.3) 
    # used by: deployment
    fibre_channel:
      # The Fibre Channel fabrics, for example A and B.
      # used by: deployment
      fabrics:
        # For example A or B.
        # required; used by: deployment
        - name: "example"
          # The fabric's switch, for example a network_devices[].hostname.
          # used by: deployment
          switch: ""
          # The active zone set on this fabric.
          # used by: deployment
          zone_set: ""
      # The array's target ports (WWPNs) and the fabric each is cabled to.
      # used by: deployment
      target_wwpns:
        # A Fibre Channel World Wide Port Name: 16 hexadecimal digits, as 8 colon-separated pairs (50:00:09:72:08:12:34:56) or without colons.
        # required; used by: deployment
        - wwpn: ""
          # A name in fabrics.
          # required; used by: deployment
          fabric: "example"
    # (since 5.3) 
    # used by: deployment
    iscsi:
      # The array's iSCSI targets.
      # used by: deployment
      targets:
        # An iSCSI qualified name (iqn.yyyy-mm.reversed.domain[:identifier]), or an eui. or naa. name.
        # required; used by: deployment
        - iqn: ""
          # The target portals: an IPv4 address, optionally with a port (default 3260), for example 198.51.100.10 or 198.51.100.10:3260.
          # required; used by: deployment
          portals: []
          # The storage network this target serves, matching the iSCSI port role: A for iscsi:a, B for iscsi:b.
          # used by: deployment
          fabric: "example"
      # CHAP authentication of the sessions.
      # used by: deployment
      chap:
        # required; used by: deployment
        enabled: false
        # used by: deployment
        username: "example"
        # A Key Vault secret reference: keyvault://<vault>/<secret>.
        # used by: deployment
        secret: "keyvault://kv-example-01/secret"
    # LUN of the infrastructure volume (250 GB minimum).
    # used by: os_configuration, deployment
    infra_volume_lun_id: ""
    # LUN of the performance history volume (20 GB minimum).
    # used by: os_configuration, deployment
    performance_history_lun_id: ""
    # used by: deployment
    luns:
      # required; used by: deployment
      - name: ""
        # required; used by: deployment
        size_gib: 0
        # used by: deployment
        lun_id: ""

# Security settings of the deployment.
security:
  # ARM securityLevel: recommended (Recommended) or customized (Customized).
  # one of: recommended | customized; used by: deployment
  level: "recommended"
  # used by: deployment
  drift_control: true
  # used by: deployment
  credential_guard: true
  # used by: deployment
  smb_signing: true
  # used by: deployment
  smb_cluster_encryption: false
  # used by: deployment
  bitlocker_boot_volume: true
  # used by: deployment
  bitlocker_data_volumes: true
  # used by: deployment
  wdac: true
  telemetry:
    # used by: deployment
    streaming_data: true
    # used by: deployment
    episodic_data_upload: true
    # used by: deployment
    eu_location: false

# How the OS gets onto the machines (scenario.os_install), and the OS version.
