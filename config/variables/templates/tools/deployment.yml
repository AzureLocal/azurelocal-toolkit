# The on-premises networks.
networking:
  # The management network and the infrastructure IP pool.
  # required; used by: os_configuration
  management:
    # CIDR.
    # required; used by: ztp, os_configuration, deployment, trailwright, ansible, beacon
    subnet: "192.0.2.0/24"
    # The one default gateway.
    # required; used by: ztp, os_configuration, deployment, trailwright, ansible, beacon
    gateway: "192.0.2.1"
    # ARM dnsServers.
    # required; used by: ztp, os_configuration, deployment, trailwright, ansible, ranger, beacon
    dns_servers: ["192.0.2.4", "192.0.2.5"]
    # Deprecated in 5.2: set each port's ip_assignment in nodes[].network_adapters.
    # one of: static | dhcp | preconfigured; default: "static"; used by: ztp, os_configuration, deployment, trailwright
    ip_assignment: "static"
    # ARM useDhcp: the deployment takes the host and cluster addresses from DHCP instead of static addresses and the infrastructure_pool.
    # default: false; used by: os_configuration, deployment, trailwright, ztp
    use_dhcp: false
    # At least six contiguous addresses in the management subnet, outside the machines' addresses.
    # used by: os_configuration, deployment, beacon
    infrastructure_pool:
      # First address of the pool the Azure Local infrastructure services use (ARM startingIPAddress): inside the management subnet, outside every...
      # required; used by: os_configuration, deployment, trailwright, beacon
      start: "192.0.2.20"
      # Last address of the infrastructure pool (ARM endingIPAddress).
      # required; used by: os_configuration, deployment, trailwright, beacon
      end: "192.0.2.29"
  # Time sources, as host names or addresses.
  # used by: os_configuration, deployment, ansible, trailwright, beacon
  ntp_servers: ["192.0.2.4", "192.0.2.5"]
  # Network ATC intents.
  # used by: os_configuration, deployment
  intents:
    # Name of the Network ATC intent, for example management_compute or storage.
    # required; used by: os_configuration, deployment, trailwright, ranger, beacon, draftsman
    - name: "management"
      # Traffic types the intent carries: management, compute and storage (ARM trafficType).
      # required; used by: os_configuration, deployment, trailwright, ranger, beacon, draftsman
      traffic: ["management"]
      # Adapters of the intent, by the key nodes[].network_adapters[].name (the port's name in this file, the same on every machine; the file finds...
      # required; used by: os_configuration, deployment, trailwright, ranger, beacon
      adapters: ["Port1", "Port2"]
      # Network ATC overrides.
      # used by: os_configuration
      overrides:
        # Data Center Bridging (DCB) quality of service overrides for the storage traffic (ARM qosPolicyOverrides).
        # used by: os_configuration, deployment
        qos:
          # 802.1p priority value of the cluster heartbeat traffic, 0 to 7 (ARM priorityValue8021Action_Cluster).
          # default: 7; used by: os_configuration, deployment, trailwright
          cluster_priority: 7
          # 802.1p priority value of the SMB Direct (RDMA storage) traffic, 0 to 7 (ARM priorityValue8021Action_SMB).
          # default: 3; used by: os_configuration, deployment, trailwright
          smb_priority: 3
          # Share of the link reserved for SMB Direct storage traffic, 1 to 100 percent (ARM bandwidthPercentage_SMB).
          # default: 50; used by: os_configuration, deployment, trailwright
          smb_bandwidth_percent: 50
        # Physical adapter property overrides (ARM adapterPropertyOverrides: jumboPacket, networkDirect, networkDirectTechnology).
        # used by: os_configuration, deployment
        adapter:
          # Value of the adapter's JumboPacket property in bytes: 1514 (standard frame), 4088 or 9014 (jumbo).
          # one of: 1514 | 4088 | 9014; used by: os_configuration, deployment, trailwright, draftsman
          jumbo_packet: 1514
          # RDMA (Network Direct) on the adapters of this intent. true is sent to ARM as networkDirect 'Enabled', false as 'Disabled'.
          # used by: os_configuration, deployment, trailwright
          network_direct: false
          # RDMA technology of the adapters: iwarp, roce_v2 (RoCEv2) or roce (RoCE, version 1).
          # one of: iwarp | roce | roce_v2; default: "roce_v2"; used by: os_configuration, deployment, trailwright
          network_direct_technology: "roce_v2"
        # Virtual switch overrides of the intent's switch-embedded team (ARM virtualSwitchConfigurationOverrides).
        # used by: os_configuration, deployment
        virtual_switch:
          # SR-IOV on the intent's virtual switch (ARM enableIov).
          # used by: os_configuration, deployment, trailwright
          enable_iov: false
          # Load balancing of the switch-embedded team: dynamic or hyper_v_port (ARM loadBalancingAlgorithm 'Dynamic' or 'HyperVPort').
          # one of: dynamic | hyper_v_port; used by: os_configuration, deployment, trailwright
          load_balancing_algorithm: "dynamic"
  # Storage networks (Storage Spaces Direct).
  # when scenario.storage_connectivity is switchless; used by: os_configuration, deployment
  storage:
    # Network ATC assigns the storage addresses.
    # default: true; used by: os_configuration, deployment, trailwright
    auto_ip: true
    # The storage networks (SMB), one per storage adapter.
    # used by: os_configuration
    networks:
      # For example StorageNetwork1.
      # required; used by: os_configuration, deployment, trailwright
      - name: "StorageNetwork1"
        # The adapter of this storage network, by the key nodes[].network_adapters[].name (the same on every machine).
        # required; used by: os_configuration, deployment, trailwright
        adapter: "Port3"
        # Network ATC defaults are 711 and 712.
        # required; used by: os_configuration, deployment, trailwright, draftsman
        vlan_id: 711
        # Needed when auto_ip is false.
        # used by: os_configuration, deployment, trailwright
        subnet: "192.0.2.0/24"
  # (since 5.6.10) 
  # when scenario.storage_architecture is san; used by: deployment
  cluster_network_properties:
    # Share of the bandwidth reserved for SMB traffic (CSV and live migration), 1 to 97 percent.
    # default: 50; used by: deployment
    bandwidth_percentage_smb: 50
    # Value of the JumboPacket property of the cluster network adapters, in bytes: 1514 (standard frame), 4088 or 9014 (jumbo).
    # default: 9014; used by: deployment
    jumbo_packet: 9014
    # 802.1p priority of the cluster heartbeat traffic, 0 to 7.
    # default: 7; used by: deployment
    priority_cluster: 7
    # 802.1p priority of the SMB traffic, 0 to 7.
    # default: 3; used by: deployment
    priority_smb: 3
  # Disaggregated (SAN) only: the cluster networks on standalone ports, fabric A and B.
  # when scenario.storage_architecture is san or hybrid; used by: os_configuration, deployment
  cluster_networks:
    # Name of the cluster network on a standalone port (fabric A or B of a SAN design), for example clusterNetwork-A.
    # required; used by: os_configuration, deployment, trailwright
    - name: ""
      # The port of this cluster network, by the key nodes[].network_adapters[].name (the same on every machine).
      # required; used by: os_configuration, deployment, trailwright
      adapter: ""
      # VLAN of this cluster network, 0 to 4094. 0 means untagged.
      # required; used by: os_configuration, deployment, trailwright
      vlan_id: 1
      # Subnet of this cluster network in CIDR form.
      # required; used by: os_configuration, deployment, trailwright
      subnet: "192.0.2.0/24"
  # Arc VM logical networks created after deployment (task phase-06 task-08, New-LogicalNetwork.ps1: az stack-hci-vm network lnet create).
  # used by: os_configuration, deployment
  logical_networks:
    # Name of the Azure Local logical network resource.
    # required; used by: deployment, trailwright
    - name: "lnet-workloads"
      # false skips this logical network when the logical networks are created, without removing it from the file.
      # default: true; used by: deployment
      enabled: true
      # How machines on this logical network get addresses: Static (the ip_pool is used; address_prefix is needed) or Dynamic (DHCP).
      # one of: Static | Dynamic; default: "Static"; used by: deployment
      ip_allocation_method: "Static"
      # Name of the network security group to associate with the logical network.
      # used by: deployment
      nsg_name: "nsg-workloads"
      # Name of the external virtual switch on the cluster that this logical network is created on (az stack-hci-vm: --vm-switch-name; it cannot be...
      # used by: deployment
      vm_switch_name: "ConvergedSwitch(management_compute_storage)"
      # What the network is for (since 5.6). management and oob mark a network the machines' remote management may be reached from: the remote mana...
      # one of: management | oob | automation | compute | storage | other; used by: os_configuration, deployment, draftsman
      purpose: "compute"
      # VLAN ID of the logical network; 0 for untagged.
      # used by: deployment, trailwright, draftsman
      vlan_id: 2204
      # Address prefix of the logical network in CIDR form.
      # used by: os_configuration, deployment, trailwright
      address_prefix: "203.0.113.0/24"
      # Default gateway of the logical network, inside address_prefix.
      # used by: deployment, trailwright
      gateway: "203.0.113.1"
      # DNS servers handed to machines on this logical network (az stack-hci-vm: --dns-servers).
      # used by: deployment, trailwright
      dns_servers: ["192.0.2.4", "192.0.2.5"]
      # The one address range Azure Local hands to virtual machines on this logical network (first and last address, both inside address_prefix), s...
      # used by: deployment
      ip_pool:
        # First address of the pool that virtual machines on this logical network draw from.
        # required; used by: deployment, trailwright
        start: "203.0.113.100"
        # Last address of that pool.
        # required; used by: deployment, trailwright
        end: "203.0.113.200"
  # (since 5.6.11) 
  # used by: deployment
  network_security_groups:
    # Name of the network security group, 1 to 80 characters: letters, digits, underscore, period and hyphen; it starts with a letter or digit an...
    # required; used by: deployment
    - name: "nsg-workloads"
      # The security rules of the group.
      # required; used by: deployment
      rules:
        # Name of the rule, 1 to 80 characters, with the same characters as the group name.
        # required; used by: deployment
        - name: "allow-https-in"
          # Priority of the rule, 100 to 4096.
          # required; used by: deployment
          priority: 100
          # Whether the rule applies to incoming (Inbound) or outgoing (Outbound) traffic.
          # required; one of: Inbound | Outbound; used by: deployment
          direction: "Inbound"
          # Allow or Deny the traffic the rule matches.
          # required; one of: Allow | Deny; used by: deployment
          access: "Allow"
          # Protocol the rule matches: * (any, the default), Tcp, Udp or Icmp (az stack-hci-vm network nsg rule create --protocol).
          # one of: * | Tcp | Udp | Icmp; default: "*"; used by: deployment
          protocol: "*"
          # Source addresses the rule matches: * (any, the default), an IPv4 address or an IPv4 range in CIDR form, or a reference to a network of the...
          # used by: deployment
          source_address_prefixes: ["management", "192.0.2.0/24"]
          # Destination addresses the rule matches: * (any, the default), an IPv4 address or an IPv4 range in CIDR form, or a reference to a network of...
          # used by: deployment
          destination_address_prefixes: ["203.0.113.0/24", "storage"]
          # Source ports the rule matches: * (any, the default), a port or a range such as 1024-2048, each from 0 to 65535.
          # used by: deployment
          source_port_ranges: ["*", "1024-2048"]
          # Destination ports the rule matches: * (any), a port or a range such as 8000-8100, each from 0 to 65535.
          # required; used by: deployment
          destination_port_ranges: ["443", "8000-8100"]
          # Optional text for the rule, at most 140 characters.
          # used by: deployment
          description: "Allow HTTPS from the workload network"

# Accounts and the identity provider (scenario.identity).
identity:
  # The deployment's local administrator on every machine.
  # required; used by: os_configuration, deployment
  local_admin:
    # User name of the deployment local administrator on every machine (ARM localAdminUserName).
    # required; used by: os_configuration, deployment, monitoring, trailwright, s2d_cartographer
    username: "azl-admin"
    # Optional.
    # used by: deployment
    username_secret: "keyvault://kv-iic-mgmt-01/local-admin-username"
    # At least 14 characters with lowercase, uppercase, a digit and a special character.
    # required; used by: os_configuration, deployment, trailwright, ansible, s2d_cartographer
    password: "keyvault://kv-iic-mgmt-01/local-admin-password"
  # Local identity with Key Vault.
  # when scenario.identity is local_identity
  local_identity:
    # ARM dnsServerConfig: use_dns_server (UseDnsServer) or use_forwarder (UseForwarder).
    # required; one of: use_dns_server | use_forwarder; used by: deployment, trailwright
    dns_server_config: "use_dns_server"
    # DNS zone of the local identity instance, for example the zone the identity endpoints are published in.
    # used by: deployment, trailwright
    dns_zone: ""
    # DNS servers the identity instance forwards to.
    # used by: deployment, trailwright
    dns_forwarders: []
  # The Active Directory the instance joins and its accounts.
  # when scenario.identity is active_directory
  active_directory:
    # ARM domainFqdn.
    # required; used by: os_configuration, deployment, trailwright, ansible, ranger, beacon, s2d_cartographer, loadtools
    domain_fqdn: "improbability.cloud"
    # Up to 15 letters, digits and hyphens.
    # used by: os_configuration, deployment, monitoring, ansible, trailwright, beacon, s2d_cartographer
    netbios_name: "IIC"
    # Distinguished name of the dedicated OU.
    # required; used by: os_configuration, deployment, trailwright, ansible
    ou_path: "OU=iic-azl-01,OU=AzureLocal,DC=improbability,DC=cloud"
    # The LCM deployment user, created in the OU by the AD preparation module.
    # required; used by: deployment
    lcm_user:
      # Name only, no domain.
      # required; used by: os_configuration, deployment, trailwright, ansible, s2d_cartographer
      username: "lcm-iic-azl-01"
      # At least 14 characters with lowercase, uppercase, a digit and a special character.
      # required; used by: os_configuration, deployment, trailwright, ansible, s2d_cartographer
      password: "keyvault://kv-iic-mgmt-01/lcm-password"
    # Whether the instance uses group managed service accounts.
    # default: false; used by: deployment
    use_gmsa: false
    # Whether the DNS servers of the management network support secure dynamic updates (Microsoft DNS integrated with Active Directory). true: th...
    # used by: deployment
    dns_secure_dynamic_updates: false
    # (since 5.6.23) 
    # default: false; used by: deployment, ansible
    precreate_computer_objects: false
    # (since 5.6.28) 
    # default: false; used by: deployment
    create_parent_ous: false

# Storage of the instance: the deployment's storage mode, the volumes, and the SAN of a disaggregated or hybrid deployment (the san block app...
storage:
  # ARM configurationMode: express (Express), infra_only (InfraOnly) or keep_storage (KeepStorage).
  # one of: express | infra_only | keep_storage; default: "express"; used by: deployment, trailwright
  configuration_mode: "express"
  # (since 5.6.9) 
  # used by: deployment
  pool:
    # Name of the storage pool the volumes are created in.
    # used by: deployment
    name: "SU1_Pool"
    # Share of the pool, in percent, at which Azure Local raises the thin provisioning alert (Set-StoragePool -ThinProvisioningAlertThresholds).
    # used by: deployment
    thin_provisioning_alert_threshold_percent: 70
  # (since 5.6.9) 
  # used by: deployment
  csv:
    # Memory per machine, in MiB, for the CSV in-memory read cache (the cluster property BlockCacheSize).
    # used by: deployment
    read_cache_size_mib: 1024
  # The Storage Spaces Direct volumes to create after deployment, in addition to what the deployment itself creates (storage.configuration_mode...
  # used by: deployment
  volumes:
    # Name of the volume, for example vol-workloads-01.
    # required; used by: deployment, trailwright, ranger, loadtools
    - name: "vol-workloads-01"
      # Size of the volume in GiB (binary units, as Windows counts).
      # required; used by: deployment, trailwright, ranger
      size_gib: 4096
      # Resiliency of the volume. two_way, three_way and parity (dual parity, 4 or more machines) are the usual ones; four_way is for a rack aware...
      # one of: two_way | three_way | four_way | parity | nested_two_way | mirror_accelerated_parity | nested_mirror_accelerated_parity; used by: deployment, trailwright, ranger
      resiliency: "two_way"
      # (since 5.6.9) thin (space is taken from the pool as data is written) or fixed (all space is taken when the volume is created).
      # one of: thin | fixed; used by: deployment, trailwright
      provisioning_type: "thin"
      # (since 5.6.9) refs (the default; Microsoft recommends it for all volumes, and mirror-accelerated parity and ReFS deduplication need it) or...
      # one of: refs | ntfs; default: "refs"; used by: deployment
      file_system: "refs"
      # (since 5.6.9) 
      # default: 80; used by: deployment
      parity_percent: 80
      # (since 5.6.9) ssd or hdd: the capacity drives the volume goes on, when the machines have both kinds.
      # one of: ssd | hdd; used by: deployment
      media_type: "ssd"
      # (since 5.6.9) 
      # used by: deployment
      deduplication:
        # none (the default: the script does not touch deduplication), dedup, compress or dedup_and_compress (Enable-ReFSDedup -Type).
        # one of: none | dedup | compress | dedup_and_compress; default: "none"; used by: deployment
        type: "none"
        # When the deduplication job runs (Set-ReFSDedupSchedule).
        # used by: deployment
        schedule:
          # Time of day the job starts, as HH:mm in the time of the machines, for example 22:00.
          # used by: deployment
          start_time: "22:00"
          # The days the job runs: Sunday to Saturday, or EveryDay.
          # used by: deployment
          days: ["Friday", "Saturday"]
          # The longest one run may take, in hours.
          # used by: deployment
          duration_hours: 4
  # (since 5.6.9) 
  # used by: deployment
  paths:
    # Name of the storage path resource: 3 to 64 letters, digits or hyphens.
    # required; used by: deployment, loadtools
    - name: "sp-workloads-01"
      # The folder on a cluster shared volume, for example C:\ClusterStorage\vol-workloads-01\vms for a volume of storage.volumes, or the folder of...
      # required; used by: deployment, loadtools
      path: "C:\\ClusterStorage\\vol-workloads-01\\vms"
  # (since 5.6.11) 
  # used by: deployment
  vm_images:
    # Name of the VM image resource, 1 to 80 characters: letters, digits, hyphen, period and underscore; it starts and ends with a letter or digi...
    # required; used by: deployment
    - name: "img-ws2025-azure-edition"
      # Operating system of the image, Windows or Linux (az stack-hci-vm image create --os-type).
      # required; one of: Windows | Linux; used by: deployment
      os_type: "Windows"
      # Publisher of the Marketplace image, as Learn's table gives it (lowercase).
      # required; used by: deployment
      publisher: "microsoftwindowsserver"
      # Offer of the Marketplace image.
      # required; used by: deployment
      offer: "windowsserver"
      # SKU of the Marketplace image.
      # required; used by: deployment
      sku: "2025-datacenter-azure-edition"
      # Version of the Marketplace image, for example 26100.4652.250808, or latest (the default: Azure picks the newest version when the image is c...
      # default: "latest"; used by: deployment
      version: "latest"
      # Name of the storage path the image is kept on, one of storage.paths[].name; create it first (New-StoragePath.ps1).
      # used by: deployment
      storage_path: "sp-workloads-01"
  # The external SAN of a disaggregated (san) or hybrid deployment.
  # when scenario.storage_architecture is san or hybrid; used by: os_configuration, deployment
  san:
    # Whether the SAN is fibre_channel or iscsi.
    # required; one of: fibre_channel | iscsi; used by: os_configuration, deployment, trailwright
    type: "fibre_channel"
    # (since 5.3) 
    # used by: os_configuration, deployment
    array:
      # The array's name, for example its hostname in the array manager.
      # required
      name: "example"
      # Vendor of the storage array, for example Dell or Pure Storage.
      # required; used by: os_configuration, deployment
      vendor: "example"
      # Model of the storage array, for example PowerStore 1200T.
      # required; used by: os_configuration, deployment
      model: "example"
    # (since 5.3) 
    # used by: deployment
    fibre_channel:
      # The Fibre Channel fabrics, for example A and B.
      # used by: deployment
      fabrics:
        # For example A or B.
        # required; used by: deployment
        - name: "example"
      # The array's target ports (WWPNs) and the fabric each is cabled to.
      # used by: deployment
      target_wwpns:
        # A Fibre Channel World Wide Port Name: 16 hexadecimal digits, as 8 colon-separated pairs (50:00:09:72:08:12:34:56) or without colons.
        # required; used by: deployment
        - wwpn: ""
          # A name in fabrics.
          # required; used by: deployment
          fabric: "example"
    # (since 5.3) 
    # used by: os_configuration, deployment
    iscsi:
      # The array's iSCSI targets.
      # used by: os_configuration, deployment
      targets:
        # An iSCSI qualified name (iqn.yyyy-mm.reversed.domain[:identifier]), or an eui. or naa. name.
        # required; used by: os_configuration, deployment
        - iqn: ""
          # The target portals: an IPv4 address, optionally with a port (default 3260), for example 198.51.100.10 or 198.51.100.10:3260.
          # required; used by: os_configuration, deployment
          portals: []
          # The storage network this target serves, matching the iSCSI port role: A for iscsi:a, B for iscsi:b.
          # used by: os_configuration, deployment
          fabric: "example"
      # CHAP authentication of the sessions.
      # used by: os_configuration, deployment
      chap:
        # true when the iSCSI targets require CHAP.
        # required; default: false; used by: os_configuration, deployment
        enabled: false
        # CHAP user name for the iSCSI targets.
        # used by: deployment
        username: "example"
        # A secret reference, for example keyvault://<vault>/<secret> (a keyvault:// vault must be listed in key_vaults).
        # used by: deployment
        secret: "keyvault://kv-example-01/secret"
        # (since 5.6.10) true: the initiators also authenticate the targets (ARM chapType Mutual); false: one-way CHAP (OneWay).
        # default: false; used by: deployment
        mutual: false
      # (since 5.6.10) 
      # default: 1514; used by: deployment
      jumbo_packet: 9014
      # (since 5.6.10) 
      # used by: deployment
      networks:
        # The path: A for the ports with the role iscsi:a, B for iscsi:b.
        # required; one of: A | B; used by: deployment
        - fabric: "A"
          # VLAN of this iSCSI network, 0 to 4094. 0 means untagged (the switch port is an access port).
          # default: 0; used by: deployment
          vlan_id: 0
          # Subnet of this iSCSI network in CIDR form.
          # required; used by: deployment
          subnet: "198.51.100.0/24"
          # Only when the target portals of this path are in another subnet: the router address on this network.
          # used by: deployment
          next_hop: "198.51.100.1"
    # LUN of the infrastructure volume (250 GB minimum).
    # used by: os_configuration, deployment, trailwright
    infra_volume_lun_id: ""
    # LUN of the performance history volume (20 GB minimum).
    # used by: os_configuration, deployment, trailwright
    performance_history_lun_id: ""
    # The LUNs the array presents to the cluster for workload volumes, after the deployment.
    # used by: deployment
    luns:
      # Name of the LUN.
      # required; used by: deployment, trailwright
      - name: "iic-san-vol-01"
        # (since 5.6.16) 
        # used by: deployment
        unique_id: "60000000000000000000000000000001"
        # Size of the LUN in GiB (binary units, as Windows counts).
        # required; used by: deployment, trailwright
        size_gib: 1024
        # The logical unit number the array presents the LUN as, for example 2.
        # used by: deployment
        lun_id: "2"

# Security settings of the deployment.
security:
  # ARM securityLevel: recommended (Recommended) or customized (Customized).
  # one of: recommended | customized; default: "recommended"; used by: deployment, trailwright
  level: "recommended"
  # true turns drift control on: Azure Local resets the security settings to the baseline after drift.
  # default: true; used by: deployment, trailwright
  drift_control: true
  # true turns Credential Guard on in the security settings of the deployment.
  # default: true; used by: deployment, trailwright
  credential_guard: true
  # true turns SMB signing on in the security settings of the deployment.
  # default: true; used by: deployment, trailwright
  smb_signing: true
  # true encrypts SMB traffic between the cluster nodes (not the storage traffic).
  # default: false; used by: deployment, trailwright
  smb_cluster_encryption: false
  # true turns BitLocker on for the boot volume.
  # default: true; used by: deployment, trailwright
  bitlocker_boot_volume: true
  # true turns BitLocker on for the data volumes.
  # default: true; used by: deployment, trailwright
  bitlocker_data_volumes: true
  # true turns Windows Defender Application Control on.
  # default: true; used by: deployment, trailwright
  wdac: true
  # What the cluster sends to Microsoft as diagnostic data. streaming_data, episodic_data_upload and eu_location are deployment settings (the A...
  # used by: deployment
  telemetry:
    # true sends the streaming diagnostic data.
    # default: true; used by: deployment, trailwright
    streaming_data: true
    # true sends the episodic diagnostic data.
    # default: true; used by: deployment, trailwright
    episodic_data_upload: true
    # true keeps the diagnostic data in the EU data boundary.
    # default: false; used by: deployment, trailwright
    eu_location: false

# SDN enabled by Azure Arc (Network Controller as a Failover Cluster service; Azure Local 2506 or later, OS build 26100 or later).
sdn:
  # true to turn SDN enabled by Azure Arc on, which CANNOT BE UNDONE.
  # required; used by: deployment, trailwright, ranger
  enabled: false
  # OPTIONAL.
  # used by: deployment, trailwright, ranger
  prefix: "iic01"
  # How the A record <prefix>-NC of the Network Controller REST URL comes about. dynamic: Active Directory integrated dynamic DNS creates it wh...
  # one of: dynamic | static; used by: deployment, trailwright
  dns_records: "dynamic"
  # true when you accept that enabling SDN interrupts the network of running workloads for a short time and that a maintenance window is arrang...
  # default: false; used by: deployment
  acknowledge_maintenance_window: false
  # true when the static DNS record <prefix>-NC exists and points at the fifth address of networking.management.infrastructure_pool (Add-EceFea...
  # default: false; used by: deployment
  acknowledge_dns_record: false

# Day-2 choices: updates, backup, disaster recovery, notifications, licensing and monitoring.
operations:
  # (since 5.6.20) 
  # used by: deployment
  updates:
    # true: after the deployment, start the solution update (Start-SolutionUpdate) and return.
    # default: false; used by: deployment
    install_after_deployment: true
    # The solution version to install: latest (default; the highest solution update that is ready to install), or four numbers, for example 12.26...
    # default: "latest"; used by: deployment
    target_version: "latest"
  # Azure Monitor for the instance.
  monitoring:
    # true when Azure Monitor is part of the design.
    # required; used by: trailwright, ansible
    enabled: true
    # (since 5.6.31) 
    # default: false; used by: deployment
    action_group_enable_if_disabled: false

# How the OS gets onto the machines (scenario.os_install), and the OS version.
