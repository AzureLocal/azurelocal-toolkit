provisioning:
  # The solution version the machines run: latest, latest-preview, or a version such as 12.2611.1004.9.
  # required; used by: ztp, os_configuration, trailwright
  os_version: "12.2611.1004.9"
  # Simplified machine provisioning from Azure, as azurelocal-ztp runs it. https://learn.microsoft.com/azure/azure-local/deploy/simplified-mach...
  # when scenario.os_install is simplified; used by: ztp
  simplified:
    # Resource name of the Microsoft.Edge site.
    # required; used by: ztp, monitoring, trailwright, beacon
    site_name: "iic-site-01"
    # Subscription of the site and edge machines, when it isn't azure.subscription_id.
    # used by: ztp, deployment
    subscription_id: "00000000-0000-0000-0000-000000000000"
    # Resource group of the site and edge machines, when it isn't azure.resource_group.
    # used by: ztp, trailwright, deployment
    resource_group: ""
    # The provisioning (maintenance environment) ISO: latest (the default choice), a four-digit train (YYMM), a build (10.<train>.<n>.<n>), or a...
    # required; used by: ztp, trailwright
    maintenance_iso: "latest"
    # The local administrator that the provisioned OS gets (Learn: simplified machine provisioning, step 3, provision machines from Azure).
    # required; used by: ztp
    admin:
      # Name of the local administrator the OS install creates on each machine (Learn: step 3, provision machines from Azure).
      # required; used by: ztp, trailwright
      username: "administrator"
      # At least 12 characters with lowercase, uppercase, a digit and a special character.
      # required; used by: ztp, trailwright
      password: "keyvault://kv-iic-mgmt-01/provisioning-admin-password"
    # The SMB share the BMCs mount the images from.
    # required; used by: ztp
    media_share:
      # Name of the SMB share ZTP creates over the folder of the virtual USB images: letters, digits and hyphens.
      # required; used by: ztp, trailwright
      name: "ztp-virtual-usb"
    # (since 5.4) 
    # used by: ztp, deployment
    managed_resource_group_name: ""
    # (since 5.4) 
    # used by: ztp, deployment
    deployment_name: ""

# Part 1 of the implementation steps: the pipeline platform, the project and its settings, the environments, the sign-in to Azure and the sel...
# used by: cicd_infra
devops:
  # The CI/CD platform: github, gitlab or azure_devops.
  # required; one of: github | gitlab | azure_devops; used by: cicd_infra, ansible, terraform, trailwright
  platform: "github"
  # (since 5.5) 
  # used by: cicd_infra, terraform
  runners:
    # Name prefix of the VM or VMs, for example vm-contoso-runner-lnx.
    # required; used by: cicd_infra, terraform, ansible
    - name: "vm-iic-runner-lnx"
      # Operating system.
      # required; one of: linux | windows; used by: cicd_infra, terraform, ansible
