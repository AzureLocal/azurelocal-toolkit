      # default: true; used by: cicd_infra, terraform
      create_hub_side: true
      # (since 5.6.28) 
      # used by: cicd_infra, terraform
      spoke_name: "peer-vnet-iic-devops-01-to-hub"
      # (since 5.6.28) 
      # used by: cicd_infra, terraform
      hub_name: "peer-hub-to-vnet-iic-devops-01"
    # Lab networks the runners reach: management, storage, BMC.
    # used by: cicd_infra, terraform
    reachable_cidrs: ["192.0.2.0/24", "198.51.100.0/24"]
    # TCP ports allowed outbound to the lab networks.
    # default: ["22", "443", "445", "3389", "5985", "5986"]; used by: cicd_infra, terraform
    reachable_tcp_ports: ["22", "443", "445", "3389", "5985", "5986"]
    # The BMC networks.
    # used by: cicd_infra, terraform
    bmc_cidrs: ["198.51.100.0/24"]
    # Ranges that may reach SSH or RDP on the runners.
    # used by: cicd_infra, terraform
    admin_source_cidrs: []
    # (since 5.6.28) 
    # default: true; used by: cicd_infra, terraform
    allow_internet_https: true
    # (since 5.6.28) 
    # default: true; used by: cicd_infra, terraform
    allow_internet_http: true
    # (since 5.6.28) 
    # default: true; used by: cicd_infra, terraform
    allow_icmp: true
  # (since 5.5) 
  # used by: cicd_infra
  runner_access:
    # Resource groups where the runners are Contributor.
    # used by: cicd_infra, terraform
    resource_groups: ["rg-iic-azl-01"]
    # Role Based Access Control Administrator on those resource groups, which the Azure Local deployment and ZTP need.
    # default: true; used by: cicd_infra, terraform
    rbac_administrator: true
    # Limit the roles the runners may assign to these role definition GUIDs.
    # used by: cicd_infra, terraform
    rbac_delegable_role_ids: []
    # Azure Connected Machine Resource Administrator on those resource groups, so jobs can run Arc Run Command on the machines.
    # default: true; used by: cicd_infra, terraform
    arc_run_command: true
    # Vaults the runners read secrets from.
    # used by: cicd_infra, terraform
    key_vaults: ["kv-iic-mgmt-01"]
    # (since 5.6.28) 
    # used by: cicd_infra, terraform
    additional_role_assignments:
      # Short name of the assignment (unique in the list).
      # required; used by: cicd_infra, terraform
      - name: "monitoring"
        # Resource ID of the scope: a subscription, a resource group or a resource.
        # required; used by: cicd_infra, terraform
        scope: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-iic-mgmt-01"
        # Name of the role, for example Reader.
        # required; used by: cicd_infra, terraform
        role_definition_name: "Reader"
  # One runner (the form before devops.runners[]).
  # used by: cicd_infra
  runner:
    # Name of the runner.
    # required; used by: cicd_infra, trailwright
    name: ""
    # Kind of runner: vm, container_app or existing.
    # required; one of: vm | container_app | existing; used by: cicd_infra, trailwright
    type: "vm"
    # Subscription of the runner.
    # used by: cicd_infra
    subscription: ""
    # Resource group of the runner.
    # used by: cicd_infra
    resource_group: ""
    # Virtual network of the runner.
    # used by: cicd_infra
    network: ""
    # Subnet of the runner.
    # used by: cicd_infra
    subnet: ""
    # Private address of the runner.
    # used by: cicd_infra
    private_ip: "192.0.2.10"
    # VM size of the runner.
    # used by: cicd_infra
    size: ""
    # Runner tags or labels that jobs select.
    # used by: cicd_infra
    labels: []
    # A Key Vault secret reference: keyvault://<vault>/<secret>.
    # used by: cicd_infra
    registration_token: "keyvault://kv-example-01/registration-token"
  # Where the Terraform state is kept.
  # used by: cicd_infra
  state:
    # (since 5.5) 
    # used by: cicd_infra, terraform
    subscription_id: "00000000-0000-0000-0000-000000000000"
    # (since 5.5) 
    # default: "cicd-infra.tfstate"; used by: cicd_infra, terraform
    key: "cicd-infra.tfstate"
    # Storage account that holds the state.
    # used by: cicd_infra, terraform
    storage_account: "stiictfstate01"
    # Blob container that holds the state.
    # default: "tfstate"; used by: cicd_infra, terraform
    container: "tfstate"
    # Resource group of the state storage account.
    # used by: cicd_infra, terraform
    resource_group: "rg-iic-mgmt-01"
    # (since 5.6.28) 
    # default: "azure-local.tfstate"; used by: cicd_infra, terraform
    azure_local_key: "azure-local.tfstate"
