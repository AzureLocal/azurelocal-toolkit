      # Name of the Azure virtual network of the private path.
      # used by: trailwright
      virtual_network: ""
      # Name of the workload subnet of that virtual network.
      # used by: trailwright
      workload_subnet: ""
      # Name of the firewall subnet of that virtual network.
      # used by: trailwright
      firewall_subnet: ""
      # Private address of the Azure Firewall on that path.
      # used by: os_configuration, trailwright
      firewall_private_ip: "192.0.2.10"
      # TCP port of the Azure Firewall explicit proxy on that path (it proxies HTTP and HTTPS).
      # used by: os_configuration, trailwright
      firewall_port: 1
      # true when the machines reach Azure Arc through an Azure Arc Private Link Scope on that path.
      # used by: trailwright
      arc_private_link_scope: false
      # Host names and address ranges that bypass the proxy on this path.
