          enable_iov: false
          # Load balancing of the switch-embedded team: dynamic or hyper_v_port (ARM loadBalancingAlgorithm 'Dynamic' or 'HyperVPort').
          # one of: dynamic | hyper_v_port; used by: os_configuration, deployment, trailwright
          load_balancing_algorithm: "dynamic"
  # Storage networks (Storage Spaces Direct).
  # when scenario.storage_connectivity is switchless; used by: os_configuration, deployment
  storage:
    # Network ATC assigns the storage addresses.
    # default: true; used by: os_configuration, deployment, trailwright
    auto_ip: true
    # Switchless only: one or two links between each pair of machines.
    # when scenario.storage_connectivity is switchless; one of: single | dual; used by: trailwright
    switchless_links: "single"
    # Top-of-rack switches.
    # used by: trailwright
    tor_switches: 2
    # dedicated: storage on its own ports. converged: storage shares ports with other traffic.
    # one of: dedicated | converged; used by: os_configuration, trailwright
    layout: "converged"
    # The storage networks (SMB), one per storage adapter.
    # used by: os_configuration
    networks:
      # For example StorageNetwork1.
      # required; used by: os_configuration, deployment, trailwright
      - name: "StorageNetwork1"
        # The adapter of this storage network, by the key nodes[].network_adapters[].name (the same on every machine).
        # required; used by: os_configuration, deployment, trailwright
        adapter: "Port3"
        # Network ATC defaults are 711 and 712.
        # required; used by: os_configuration, deployment, trailwright, draftsman
        vlan_id: 711
        # Needed when auto_ip is false.
        # used by: os_configuration, deployment, trailwright
        subnet: "192.0.2.0/24"
  # Disaggregated (SAN) only: the cluster networks on standalone ports, fabric A and B.
  # when scenario.storage_architecture is san or hybrid; used by: os_configuration, deployment
  cluster_networks:
    # Name of the cluster network on a standalone port (fabric A or B of a SAN design), for example clusterNetwork-A.
    # required; used by: os_configuration, deployment, trailwright
    - name: ""
      # The port of this cluster network, by the key nodes[].network_adapters[].name (the same on every machine).
      # required; used by: os_configuration, deployment, trailwright
      adapter: ""
      # VLAN of this cluster network, 0 to 4094. 0 means untagged.
      # required; used by: os_configuration, deployment, trailwright
      vlan_id: 1
      # Subnet of this cluster network in CIDR form.
      # required; used by: os_configuration, deployment, trailwright
      subnet: "192.0.2.0/24"
  # Every VLAN in the design, by name.
  # used by: os_configuration
  vlans:
    # Name of the VLAN, for example storage-1.
    # required; used by: os_configuration, trailwright, ranger, draftsman
    - name: "storage-1"
      # The VLAN number, 1 to 4094.
      # required; used by: os_configuration, trailwright, ranger, draftsman
      id: 711
      # Subnet that runs in this VLAN, in CIDR form.
      # used by: os_configuration, trailwright
      subnet: "203.0.113.0/24"
  # Arc VM logical networks created after deployment (task phase-06 task-08, New-LogicalNetwork.ps1: az stack-hci-vm network lnet create).
  # used by: os_configuration, deployment
  logical_networks:
    # Name of the Azure Local logical network resource.
    # required; used by: deployment, trailwright
    - name: "lnet-workloads"
      # VLAN ID of the logical network; 0 for untagged.
      # used by: deployment, trailwright, draftsman
      vlan_id: 2204
      # Address prefix of the logical network in CIDR form.
      # used by: os_configuration, deployment, trailwright
      address_prefix: "203.0.113.0/24"
      # Default gateway of the logical network, inside address_prefix.
      # used by: deployment, trailwright
      gateway: "203.0.113.1"
      # DNS servers handed to machines on this logical network (az stack-hci-vm: --dns-servers).
      # used by: deployment, trailwright
      dns_servers: ["192.0.2.4", "192.0.2.5"]
      # The one address range Azure Local hands to virtual machines on this logical network (first and last address, both inside address_prefix), s...
      # used by: deployment
      ip_pool:
        # First address of the pool that virtual machines on this logical network draw from.
        # required; used by: deployment, trailwright
        start: "203.0.113.100"
        # Last address of that pool.
        # required; used by: deployment, trailwright
        end: "203.0.113.200"
  # Details of scenario.outbound_path.
  # when scenario.outbound_path is proxy or proxy_arc_gateway
  outbound:
    # Proxy server for the machines' outbound traffic, for scenario.outbound_path proxy or proxy_arc_gateway.
    # when scenario.outbound_path is proxy or proxy_arc_gateway
    proxy:
      # URL of the proxy server, for example http://proxy.example.test:3128.
      # required; used by: os_configuration, trailwright, ansible, ztp, beacon
      url: ""
      # Addresses and names that go direct, not through the proxy.
      # used by: os_configuration, ztp, trailwright, beacon
      bypass: []
    # The Arc gateway resource, in the same subscription as the machines.
    # when scenario.outbound_path is arc_gateway or proxy_arc_gateway
    arc_gateway:
      # Name of the Azure Arc gateway resource (Azure public cloud only; not supported with simplified machine provisioning in the preview).
      # required; used by: os_configuration, trailwright, ansible
      name: ""
    # Outbound path over a private connection (ExpressRoute or site-to-site VPN) when scenario.outbound_path is private_path.
    # when scenario.outbound_path is private_path
    private_path:
      # The private connection: expressroute or site_to_site_vpn.
      # one of: expressroute | site_to_site_vpn; used by: trailwright
      transport: "expressroute"
      # Name of the Azure virtual network of the private path.
      # used by: trailwright
      virtual_network: ""
      # Name of the workload subnet of that virtual network.
      # used by: trailwright
      workload_subnet: ""
      # Name of the firewall subnet of that virtual network.
      # used by: trailwright
      firewall_subnet: ""
      # Private address of the Azure Firewall on that path.
      # used by: os_configuration, trailwright, beacon
      firewall_private_ip: "192.0.2.10"
      # TCP port of the Azure Firewall explicit proxy on that path (it proxies HTTP and HTTPS).
      # used by: os_configuration, trailwright, beacon
      firewall_port: 1
      # true when the machines reach Azure Arc through an Azure Arc Private Link Scope on that path.
      # used by: trailwright
      arc_private_link_scope: false
      # Host names and address ranges that bypass the proxy on this path.
      # used by: os_configuration, trailwright, beacon
      proxy_bypass: []

# Accounts and the identity provider (scenario.identity).
identity:
  # The deployment's local administrator on every machine.
  # required; used by: os_configuration, deployment
  local_admin:
    # User name of the deployment local administrator on every machine (ARM localAdminUserName).
    # required; used by: os_configuration, deployment, monitoring, trailwright, s2d_cartographer
    username: "azl-admin"
    # At least 14 characters with lowercase, uppercase, a digit and a special character.
    # required; used by: os_configuration, deployment, trailwright, ansible, s2d_cartographer
    password: "keyvault://kv-iic-mgmt-01/local-admin-password"
  # Local identity with Key Vault.
  # when scenario.identity is local_identity
  local_identity:
    # ARM dnsServerConfig: use_dns_server (UseDnsServer) or use_forwarder (UseForwarder).
    # required; one of: use_dns_server | use_forwarder; used by: deployment, trailwright
    dns_server_config: "use_dns_server"
    # DNS zone of the local identity instance, for example the zone the identity endpoints are published in.
    # used by: deployment, trailwright
    dns_zone: ""
    # DNS servers the identity instance forwards to.
    # used by: deployment, trailwright
    dns_forwarders: []
  # Entra ID groups, role assignments and PIM.
  entra:
    # Entra ID groups the instance expects.
    groups:
      # Display name of the Entra ID group.
      # required; used by: trailwright
      - name: "grp-iic-azl-operators"
        # What the group is for, in words.
        # used by: trailwright
        purpose: "Operate the instance"
        # Scope of the role assignments.
        # used by: trailwright
        scope: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-iic-azl-01"
  # The Active Directory the instance joins and its accounts.
  # when scenario.identity is active_directory
  active_directory:
    # ARM domainFqdn.
    # required; used by: os_configuration, deployment, trailwright, ansible, ranger, beacon, s2d_cartographer, loadtools
    domain_fqdn: "improbability.cloud"
    # Up to 15 letters, digits and hyphens.
    # used by: os_configuration, deployment, monitoring, ansible, trailwright, beacon, s2d_cartographer
    netbios_name: "IIC"
    # Distinguished name of the dedicated OU.
    # required; used by: os_configuration, deployment, trailwright, ansible
    ou_path: "OU=iic-azl-01,OU=AzureLocal,DC=improbability,DC=cloud"
    # The LCM deployment user, created in the OU by the AD preparation module.
    # required; used by: deployment
    lcm_user:
      # Name only, no domain.
      # required; used by: os_configuration, deployment, trailwright, ansible, s2d_cartographer
      username: "lcm-iic-azl-01"
      # At least 14 characters with lowercase, uppercase, a digit and a special character.
      # required; used by: os_configuration, deployment, trailwright, ansible, s2d_cartographer
      password: "keyvault://kv-iic-mgmt-01/lcm-password"
    # Addresses of domain controllers, for pre-checks and for the domain join.
    # used by: os_configuration, trailwright, beacon
    domain_controllers: ["192.0.2.4", "192.0.2.5"]
    # Groups created in the OU for administration of the instance.
    # used by: ansible
    security_groups:
      # Name of the security group in Active Directory.
      # required; used by: os_configuration, trailwright
      - name: "sg-iic-azl-01-admins"
        # What the group is for, in words.
        # used by: os_configuration, trailwright
        purpose: "Administrators of the instance"

# Storage of the instance: the deployment's storage mode, the volumes, and the SAN of a disaggregated or hybrid deployment (the san block app...
storage:
  # ARM configurationMode: express (Express), infra_only (InfraOnly) or keep_storage (KeepStorage).
  # one of: express | infra_only | keep_storage; default: "express"; used by: deployment, trailwright
  configuration_mode: "express"
  # The Storage Spaces Direct volumes to create after deployment, in addition to what the deployment itself creates (storage.configuration_mode...
  # used by: deployment
  volumes:
    # Name of the volume, for example vol-workloads-01.
    # required; used by: deployment, trailwright, ranger, loadtools
    - name: "vol-workloads-01"
      # Size of the volume in GiB (binary units, as Windows counts).
      # required; used by: deployment, trailwright, ranger
      size_gib: 4096
      # Resiliency of the volume. two_way, three_way and parity (dual parity, 4 or more machines) are the usual ones; four_way is for a rack aware...
      # one of: two_way | three_way | four_way | parity | nested_two_way | mirror_accelerated_parity | nested_mirror_accelerated_parity; used by: deployment, trailwright, ranger
      resiliency: "two_way"
      # (since 5.6.9) thin (space is taken from the pool as data is written) or fixed (all space is taken when the volume is created).
      # one of: thin | fixed; used by: deployment, trailwright
      provisioning_type: "thin"
  # The external SAN of a disaggregated (san) or hybrid deployment.
  # when scenario.storage_architecture is san or hybrid; used by: os_configuration, deployment
  san:
    # Whether the SAN is fibre_channel or iscsi.
    # required; one of: fibre_channel | iscsi; used by: os_configuration, deployment, trailwright
    type: "fibre_channel"
    # LUN of the infrastructure volume (250 GB minimum).
    # used by: os_configuration, deployment, trailwright
    infra_volume_lun_id: ""
    # LUN of the performance history volume (20 GB minimum).
    # used by: os_configuration, deployment, trailwright
    performance_history_lun_id: ""
    # The LUNs the array presents to the cluster for workload volumes, after the deployment.
    # used by: deployment
    luns:
      # Name of the LUN.
      # required; used by: deployment, trailwright
      - name: "iic-san-vol-01"
        # Size of the LUN in GiB (binary units, as Windows counts).
        # required; used by: deployment, trailwright
        size_gib: 1024

# Security settings of the deployment.
security:
  # ARM securityLevel: recommended (Recommended) or customized (Customized).
  # one of: recommended | customized; default: "recommended"; used by: deployment, trailwright
  level: "recommended"
  # true turns drift control on: Azure Local resets the security settings to the baseline after drift.
  # default: true; used by: deployment, trailwright
  drift_control: true
  # true turns Credential Guard on in the security settings of the deployment.
  # default: true; used by: deployment, trailwright
  credential_guard: true
  # true turns SMB signing on in the security settings of the deployment.
  # default: true; used by: deployment, trailwright
  smb_signing: true
  # true encrypts SMB traffic between the cluster nodes (not the storage traffic).
  # default: false; used by: deployment, trailwright
  smb_cluster_encryption: false
  # true turns BitLocker on for the boot volume.
  # default: true; used by: deployment, trailwright
  bitlocker_boot_volume: true
  # true turns BitLocker on for the data volumes.
  # default: true; used by: deployment, trailwright
  bitlocker_data_volumes: true
  # true turns Windows Defender Application Control on.
  # default: true; used by: deployment, trailwright
  wdac: true
  # What the cluster sends to Microsoft as diagnostic data. streaming_data, episodic_data_upload and eu_location are deployment settings (the A...
  # used by: deployment
  telemetry:
    # true sends the streaming diagnostic data.
    # default: true; used by: deployment, trailwright
    streaming_data: true
    # true sends the episodic diagnostic data.
    # default: true; used by: deployment, trailwright
    episodic_data_upload: true
    # true keeps the diagnostic data in the EU data boundary.
    # default: false; used by: deployment, trailwright
    eu_location: false

# SDN enabled by Azure Arc (Network Controller as a Failover Cluster service; Azure Local 2506 or later, OS build 26100 or later).
sdn:
  # true to turn SDN enabled by Azure Arc on, which CANNOT BE UNDONE.
  # required; used by: deployment, trailwright, ranger
  enabled: false
  # OPTIONAL.
  # used by: deployment, trailwright, ranger
  prefix: "iic01"
  # How the A record <prefix>-NC of the Network Controller REST URL comes about. dynamic: Active Directory integrated dynamic DNS creates it wh...
  # one of: dynamic | static; used by: deployment, trailwright
  dns_records: "dynamic"

# Day-2 choices: updates, backup, disaster recovery, notifications, licensing and monitoring.
operations:
  # How updates are applied: portal or powershell.
  # one of: portal | powershell; used by: trailwright
  update_method: "portal"
  # Backup of the instance and its workloads.
  backup:
    # true when backup is part of the design.
    # required; used by: trailwright
    enabled: false
    # What is backed up: host, guest or both.
    # one of: host | guest | both; used by: trailwright
    approach: "host"
    # Name of the backup solution, for example Azure Backup.
    # used by: trailwright
    solution: ""
  # Disaster recovery of the workloads.
  disaster_recovery:
    # none, asr (Azure Site Recovery) or hyper_v_replica.
    # one of: none | asr | hyper_v_replica; used by: trailwright
    method: "none"
    # Name of the Recovery Services vault used for replication.
    # used by: trailwright
    recovery_vault: ""
    # Recovery time objective in minutes.
    # used by: trailwright
    target_rto_minutes: 0
    # Recovery point objective in minutes.
    # used by: trailwright
    target_rpo_minutes: 0
  # Who hears about alerts.
  notifications:
    # Addresses (team mailboxes) that receive the notifications of the operations tools.
    # used by: terraform, trailwright
    emails: ["noc@improbability.cloud"]
  # Licensing benefits the instance uses.
  licensing:
    # true to activate Azure Hybrid Benefit for Azure Local on the instance: it waives the Azure Local host service fee for an instance whose phy...
    # used by: trailwright
    azure_hybrid_benefit: true
  # Azure Monitor for the instance.
  monitoring:
    # true when Azure Monitor is part of the design.
    # required; used by: trailwright, ansible
    enabled: true
    # Name of the Log Analytics workspace.
    # used by: trailwright, terraform
    log_analytics_workspace: "log-iic-azl-01"
    # Resource group of the Log Analytics workspace.
    # used by: trailwright, terraform
    workspace_resource_group: "rg-iic-mgmt-01"
    # Name of the existing data collection rule that Insights for Azure Local uses.
    # used by: trailwright
    data_collection_rule: "AzureStackHCI-iic-azl-01"
    # Name of the data collection endpoint that Deploy-DataCollectionEndpoint.ps1 creates, in the region of the workspace.
    # used by: trailwright
    data_collection_endpoint: "dce-iic-azl-01"
    # Address that receives the alerts (a team mailbox).
    # used by: trailwright, terraform
    alert_email: ""

# How the OS gets onto the machines (scenario.os_install), and the OS version.
# when scenario.os_install is simplified
provisioning:
  # The solution version the machines run: latest, latest-preview, or a version such as 12.2611.1004.9.
  # required; used by: ztp, os_configuration, trailwright
  os_version: "12.2611.1004.9"
  # OS installed from an ISO.
  iso:
    # microsoft (the Azure portal download) or oem (the OEM's image).
    # one of: microsoft | oem; used by: trailwright
    image_source: "microsoft"
  # Simplified machine provisioning from Azure, as azurelocal-ztp runs it. https://learn.microsoft.com/azure/azure-local/deploy/simplified-mach...
  # when scenario.os_install is simplified; used by: ztp
  simplified:
    # Resource name of the Microsoft.Edge site.
    # required; used by: ztp, monitoring, trailwright, beacon
    site_name: "iic-site-01"
    # Resource group of the site and edge machines, when it isn't azure.resource_group.
    # used by: ztp, trailwright, deployment
    resource_group: ""
    # The provisioning (maintenance environment) ISO: latest (the default choice), a four-digit train (YYMM), a build (10.<train>.<n>.<n>), or a...
    # required; used by: ztp, trailwright
    maintenance_iso: "latest"
    # The local administrator that the provisioned OS gets (Learn: simplified machine provisioning, step 3, provision machines from Azure).
    # required; used by: ztp
    admin:
      # Name of the local administrator the OS install creates on each machine (Learn: step 3, provision machines from Azure).
      # required; used by: ztp, trailwright
      username: "administrator"
      # At least 12 characters with lowercase, uppercase, a digit and a special character.
      # required; used by: ztp, trailwright
      password: "keyvault://kv-iic-mgmt-01/provisioning-admin-password"
    # The SMB share the BMCs mount the images from.
    # required; used by: ztp
    media_share:
      # Name of the SMB share ZTP creates over the folder of the virtual USB images: letters, digits and hyphens.
      # required; used by: ztp, trailwright
      name: "ztp-virtual-usb"
      # The management host's address as the BMCs reach it.
      # used by: ztp, trailwright
      host: "198.51.100.5"
      # Instead of host: the local adapter whose IPv4 address the BMCs reach.
      # used by: ztp, trailwright
      host_adapter: ""
    # (since 5.4) 
    # used by: ztp
    ntp:
      # Automatic or Manual.
      # one of: Automatic | Manual; default: "Automatic"; used by: ztp, trailwright
      configuration: "Automatic"
      # The NTP server (address or name) when configuration is Manual.
      # used by: ztp, trailwright
      server: "example"

# Disconnected operations: the control plane appliance, its endpoints, identity and certificates.
# when scenario.connectivity is disconnected
disconnected:
  # management: this instance runs the control plane appliance. workload: it is managed by a management instance.
  # required; one of: management | workload; used by: trailwright
  role: "management"
  # Folder the control plane appliance files are kept in.
  # used by: trailwright
  base_path: ""
  # DNS suffix of the disconnected control plane.
  # used by: trailwright
  domain_suffix: ""
  # Address of the appliance's ingress (the endpoint operators and tools call).
  ingress:
    # IPv4 address of the ingress.
    # used by: trailwright
    ip_address: "192.0.2.10"
    # Default gateway of the ingress network.
    # used by: trailwright
    gateway: "192.0.2.10"
    # Prefix length of the ingress network, 8 to 30.
    # used by: trailwright
    prefix_length: 8
  # Address of the appliance's management endpoint.
  management:
    # IPv4 address of the management endpoint.
    # used by: trailwright
    ip_address: "192.0.2.10"
    # Prefix length of the management network, 8 to 30.
    # used by: trailwright
    prefix_length: 8
  # DNS server the control plane uses.
  # used by: trailwright
  dns_server: "192.0.2.10"
  # Time sources of the control plane, as host names or addresses.
  # used by: trailwright
  time_servers: []
  # The identity provider of the disconnected control plane (Active Directory Federation Services).
  identity:
    # URL of the identity authority (for example the AD FS endpoint).
    # used by: trailwright
    authority: ""
    # Application (client) id registered for the control plane in the identity provider.
    # used by: trailwright
    client_id: ""
    # User principal name of the first operator.
    # used by: trailwright
    root_operator_upn: ""
    # LDAP server that serves the directory.
    # used by: trailwright
    ldap_server: ""
    # true to use LDAP over TLS.
    # used by: trailwright
    ldaps: false
    # Identifier of the directory group that is synchronized.
    # used by: trailwright
    sync_group_identifier: ""
  # Name of the operator subscription.
  # used by: trailwright
  operator_subscription_name: ""
  # Resource group the appliance resources are placed in.
  # used by: trailwright
  resource_group: ""
  # true when an internal certificate authority issues the appliance certificates.
  # used by: trailwright
  internal_ca: false

# Switches, firewalls, console servers and other devices in the design.
network_devices:
  # Host name of the network device.
  # required; used by: trailwright
  - hostname: "sw01-iic"
    # Kind of device: switch, firewall, router, console_server, load_balancer or wireless_controller.
    # required; one of: switch | firewall | router | console_server | load_balancer | wireless_controller; used by: trailwright, draftsman
    type: "switch"
    # primary, secondary or standalone.
    # one of: primary | secondary | standalone; used by: trailwright
    role: "primary"
    # Vendor of the device.
    # used by: trailwright, draftsman
    vendor: "Dell"
    # Model of the device.
    # used by: trailwright, draftsman
    model: "S5248F-ON"

# Part 2 of the implementation steps: the Azure foundation the instance depends on.
landing_zone:
  # Subscriptions by role. azure.subscription_id is the one the instance uses.
  # used by: cicd_infra, terraform
  subscriptions:
    # Name of the subscription; the other landing_zone entries refer to it.
    # required; used by: cicd_infra, trailwright, terraform
    - name: "sub-iic-connectivity"
      # Subscription id (a GUID).
      # used by: cicd_infra, trailwright, terraform
      id: "00000000-0000-0000-0000-000000000000"
      # What the subscription is for.
      # required; one of: connectivity | identity | management | security | devops | workload | azure_local; used by: cicd_infra, trailwright, terraform
      role: "connectivity"
  # Resource groups of the landing zone.
  # used by: cicd_infra
  resource_groups:
    # Name of the resource group.
    # required; used by: cicd_infra, terraform, trailwright
    - name: "rg-iic-conn-01"
      # Name of a subscription in landing_zone.subscriptions.
      # used by: cicd_infra, trailwright
      subscription: "sub-iic-connectivity"
      # Azure region of the resource group.
      # used by: cicd_infra, trailwright
      location: "eastus"
      # What the resource group is for, in words.
      # used by: cicd_infra, trailwright
      purpose: "hub network"
  # Azure virtual networks.
  # used by: cicd_infra
  networks:
    # Name of the virtual network.
    # required; used by: cicd_infra, terraform, trailwright
    - name: "vnet-iic-hub-01"
      # Resource group of the network.
      # used by: cicd_infra, terraform, trailwright
      resource_group: "rg-iic-conn-01"
      # hub or spoke.
      # one of: hub | spoke; used by: cicd_infra, trailwright
      role: "hub"
      # Address ranges of the virtual network, in CIDR form.
      # required; used by: cicd_infra, terraform, trailwright
      address_space: ["10.20.0.0/22"]
  # Management VMs: domain controllers, jump box, Windows Admin Center, syslog.
  # used by: terraform, ansible
  virtual_machines:
    # Name of the virtual machine.
    # required; used by: terraform, ansible, trailwright
    - name: "vm-iic-dc-01"
      # What the machine is: domain_controller, jumpbox, windows_admin_center, syslog, management or other.
      # required; one of: domain_controller | jumpbox | windows_admin_center | syslog | management | other; used by: terraform, ansible, trailwright
      role: "domain_controller"
      # Private IPv4 address of the machine.
      # used by: terraform, ansible, trailwright
      private_ip: "10.20.4.10"
      # Azure VM size, for example Standard_D2s_v5.
      # used by: terraform, trailwright
      size: "Standard_D2s_v5"
  # The Log Analytics workspace of the landing zone.
  log_analytics:
    # Name of the workspace.
    # required; used by: trailwright
    name: "log-iic-azl-01"

# Part 1 of the implementation steps: the pipeline platform, the project and its settings, the environments, the sign-in to Azure and the sel...
# used by: cicd_infra
devops:
  # The CI/CD platform: github, gitlab or azure_devops.
  # required; one of: github | gitlab | azure_devops; used by: cicd_infra, ansible, terraform, trailwright
  platform: "github"
  # Organization, group or project collection.
  # used by: cicd_infra, ansible, terraform, trailwright
  organization: "improbability-cloud"
  # One runner (the form before devops.runners[]).
  # used by: cicd_infra
  runner:
    # Name of the runner.
    # required; used by: cicd_infra, trailwright
    name: ""
    # Kind of runner: vm, container_app or existing.
    # required; one of: vm | container_app | existing; used by: cicd_infra, trailwright
    type: "vm"
