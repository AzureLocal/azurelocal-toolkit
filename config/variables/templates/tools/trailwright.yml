    dns_forwarders: []
  # The Active Directory the instance joins and its accounts.
  # when scenario.identity is active_directory
  active_directory:
    # ARM domainFqdn.
    # required; used by: os_configuration, deployment, trailwright, ansible
    domain_fqdn: "improbability.cloud"
    # Distinguished name of the dedicated OU.
    # required; used by: os_configuration, deployment, trailwright, ansible
    ou_path: "OU=iic-azl-01,OU=AzureLocal,DC=improbability,DC=cloud"
    # The LCM deployment user, created in the OU by the AD preparation module.
    # required; used by: deployment
    lcm_user:
      # Name only, no domain.
      # required; used by: os_configuration, deployment, trailwright, ansible
      username: "lcm-iic-azl-01"
      # At least 14 characters with lowercase, uppercase, a digit and a special character.
      # required; used by: os_configuration, deployment, trailwright, ansible
      password: "keyvault://kv-iic-mgmt-01/lcm-password"

# Storage of the instance: the deployment's storage mode, the volumes, and the SAN of a disaggregated or hybrid deployment (the san block app...
storage:
  # ARM configurationMode: express (Express), infra_only (InfraOnly) or keep_storage (KeepStorage).
  # one of: express | infra_only | keep_storage; default: "express"; used by: deployment, trailwright
  configuration_mode: "express"
  # The Storage Spaces Direct volumes to create after deployment, in addition to what the deployment itself creates (storage.configuration_mode...
  # used by: deployment
  volumes:
    # Name of the volume, for example vol-workloads-01.
    # required; used by: deployment, trailwright, ranger
    - name: "vol-workloads-01"
      # Size of the volume in GiB (binary units, as Windows counts).
      # required; used by: deployment, trailwright, ranger
      size_gib: 4096
      # Resiliency of the volume. two_way, three_way and parity (dual parity, 4 or more machines) are the usual ones; four_way is for a rack aware...
      # one of: two_way | three_way | four_way | parity | nested_two_way | mirror_accelerated_parity | nested_mirror_accelerated_parity; used by: deployment, trailwright, ranger
      resiliency: "two_way"
  # The external SAN of a disaggregated (san) or hybrid deployment.
  # when scenario.storage_architecture is san or hybrid; used by: os_configuration, deployment
  san:
    # Whether the SAN is fibre_channel or iscsi.
    # required; one of: fibre_channel | iscsi; used by: os_configuration, deployment, trailwright
    type: "fibre_channel"
    # LUN of the infrastructure volume (250 GB minimum).
    # used by: os_configuration, deployment, trailwright
    infra_volume_lun_id: ""
    # LUN of the performance history volume (20 GB minimum).
    # used by: os_configuration, deployment, trailwright
    performance_history_lun_id: ""
    # The LUNs the array presents to the cluster for workload volumes, after the deployment.
    # used by: deployment
    luns:
      # Name of the LUN.
      # required; used by: deployment, trailwright
      - name: "iic-san-vol-01"
        # Size of the LUN in GiB (binary units, as Windows counts).
        # required; used by: deployment, trailwright
        size_gib: 1024

# Security settings of the deployment.
security:
  # ARM securityLevel: recommended (Recommended) or customized (Customized).
  # one of: recommended | customized; default: "recommended"; used by: deployment, trailwright
  level: "recommended"
  # true turns drift control on: Azure Local resets the security settings to the baseline after drift.
  # default: true; used by: deployment, trailwright
  drift_control: true
  # true turns Credential Guard on in the security settings of the deployment.
  # default: true; used by: deployment, trailwright
  credential_guard: true
  # true turns SMB signing on in the security settings of the deployment.
  # default: true; used by: deployment, trailwright
  smb_signing: true
  # true encrypts SMB traffic between the cluster nodes (not the storage traffic).
  # default: false; used by: deployment, trailwright
  smb_cluster_encryption: false
  # true turns BitLocker on for the boot volume.
  # default: true; used by: deployment, trailwright
  bitlocker_boot_volume: true
  # true turns BitLocker on for the data volumes.
  # default: true; used by: deployment, trailwright
  bitlocker_data_volumes: true
  # true turns Windows Defender Application Control on.
  # default: true; used by: deployment, trailwright
  wdac: true
  # What the cluster sends to Microsoft as telemetry.
  # used by: deployment
  telemetry:
    # true sends the streaming diagnostic data.
    # default: true; used by: deployment, trailwright
    streaming_data: true
    # true sends the episodic diagnostic data.
    # default: true; used by: deployment, trailwright
    episodic_data_upload: true
    # true keeps the diagnostic data in the EU data boundary.
    # default: false; used by: deployment, trailwright
    eu_location: false

# SDN enabled by Azure Arc (Network Controller as a Failover Cluster service; Azure Local 2506 or later, OS build 26100 or later).
sdn:
  # true to turn SDN enabled by Azure Arc on, which CANNOT BE UNDONE.
  # required; used by: deployment, trailwright, ranger
  enabled: false
  # The SDN prefix (Add-EceFeature -SDNPrefix).
  # used by: deployment, trailwright, ranger
  prefix: "iic01"
  # How the A record <prefix>-NC of the Network Controller REST URL comes about. dynamic: Active Directory integrated dynamic DNS creates it wh...
  # one of: dynamic | static; used by: deployment, trailwright
  dns_records: "dynamic"

# Day-2 choices: updates, backup, disaster recovery, notifications, licensing and monitoring.
operations:
  # How updates are applied: portal or powershell.
  # one of: portal | powershell; used by: trailwright
  update_method: "portal"
  # Backup of the instance and its workloads.
  backup:
    # true when backup is part of the design.
    # required; used by: trailwright
    enabled: false
    # What is backed up: host, guest or both.
    # one of: host | guest | both; used by: trailwright
    approach: "host"
    # Name of the backup solution, for example Azure Backup.
    # used by: trailwright
    solution: ""
  # Disaster recovery of the workloads.
  disaster_recovery:
    # none, asr (Azure Site Recovery) or hyper_v_replica.
    # one of: none | asr | hyper_v_replica; used by: trailwright
    method: "none"
  # Azure Monitor for the instance.
  monitoring:
    # true when Azure Monitor is part of the design.
    # required; used by: trailwright, ansible
    enabled: true
    # Name of the Log Analytics workspace.
    # used by: trailwright, terraform
    log_analytics_workspace: "log-iic-azl-01"
    # Resource group of the Log Analytics workspace.
    # used by: trailwright, terraform
    workspace_resource_group: "rg-iic-mgmt-01"
    # Name of the existing data collection rule that Insights for Azure Local uses.
    # used by: trailwright
    data_collection_rule: "AzureStackHCI-iic-azl-01"
    # Name of the data collection endpoint that Deploy-DataCollectionEndpoint.ps1 creates, in the region of the workspace.
    # used by: trailwright
    data_collection_endpoint: "dce-iic-azl-01"
    # Address that receives the alerts (a team mailbox).
    # used by: trailwright, terraform
    alert_email: ""

# How the OS gets onto the machines (scenario.os_install), and the OS version.
# when scenario.os_install is simplified
provisioning:
  # The solution version the machines run: latest, latest-preview, or a version such as 12.2610.1004.50.
  # required; used by: ztp, os_configuration, trailwright
  os_version: "12.2610.1004.50"
  # Simplified machine provisioning from Azure, as azurelocal-ztp runs it. https://learn.microsoft.com/azure/azure-local/deploy/simplified-mach...
  # when scenario.os_install is simplified; used by: ztp
  simplified:
    # Resource name of the Microsoft.Edge site.
    # required; used by: ztp, monitoring, trailwright
    site_name: "iic-site-01"
    # Resource group of the site and edge machines, when it isn't azure.resource_group.
    # used by: ztp, trailwright
    resource_group: ""
    # The provisioning (maintenance environment) ISO: latest, a train such as 2610, a build such as 10.2610.0.3063, or a Microsoft download URL.
    # required; used by: ztp, trailwright
    maintenance_iso: "latest"
    # The local administrator that the provisioned OS gets.
    # required; used by: ztp
    admin:
      # Name of the local administrator the OS install creates on each machine (Learn: step 3, provision machines from Azure).
      # required; used by: ztp, trailwright
      username: "administrator"
      # At least 12 characters with lowercase, uppercase, a digit and a special character.
      # required; used by: ztp, trailwright
      password: "keyvault://kv-iic-mgmt-01/provisioning-admin-password"
    # The SMB share the BMCs mount the images from.
    # required; used by: ztp
    media_share:
      # Name of the SMB share ZTP creates over the folder of the virtual USB images: letters, digits and hyphens.
      # required; used by: ztp, trailwright
      name: "ztp-virtual-usb"
      # The management host's address as the BMCs reach it.
      # used by: ztp, trailwright
      host: "198.51.100.5"
    # (since 5.4) 
    # used by: ztp
    ntp:
      # Automatic or Manual.
      # one of: Automatic | Manual; default: "Automatic"; used by: ztp, trailwright
      configuration: "Automatic"
      # The NTP server (address or name) when configuration is Manual.
      # used by: ztp, trailwright
      server: "example"

# Disconnected operations: the control plane appliance, its endpoints, identity and certificates.
# when scenario.connectivity is disconnected
disconnected:
  # management: this instance runs the control plane appliance. workload: it is managed by a management instance.
  # required; one of: management | workload; used by: trailwright
  role: "management"
  # Folder the control plane appliance files are kept in.
  # used by: trailwright
  base_path: ""
  # DNS suffix of the disconnected control plane.
  # used by: trailwright
  domain_suffix: ""
  # Address of the appliance's ingress (the endpoint operators and tools call).
  ingress:
    # IPv4 address of the ingress.
    # used by: trailwright
    ip_address: "192.0.2.10"
    # Default gateway of the ingress network.
    # used by: trailwright
    gateway: "192.0.2.10"
    # Prefix length of the ingress network, 8 to 30.
    # used by: trailwright
    prefix_length: 8
  # Address of the appliance's management endpoint.
  management:
    # IPv4 address of the management endpoint.
    # used by: trailwright
    ip_address: "192.0.2.10"
    # Prefix length of the management network, 8 to 30.
    # used by: trailwright
    prefix_length: 8
  # DNS server the control plane uses.
  # used by: trailwright
  dns_server: "192.0.2.10"
  # Time sources of the control plane, as host names or addresses.
  # used by: trailwright
  time_servers: []
  # The identity provider of the disconnected control plane (Active Directory Federation Services).
  identity:
    # URL of the identity authority (for example the AD FS endpoint).
    # used by: trailwright
    authority: ""
    # Application (client) id registered for the control plane in the identity provider.
    # used by: trailwright
    client_id: ""
    # User principal name of the first operator.
    # used by: trailwright
    root_operator_upn: ""
    # LDAP server that serves the directory.
    # used by: trailwright
    ldap_server: ""
    # true to use LDAP over TLS.
    # used by: trailwright
    ldaps: false
    # Identifier of the directory group that is synchronized.
    # used by: trailwright
    sync_group_identifier: ""
  # Name of the operator subscription.
  # used by: trailwright
  operator_subscription_name: ""
  # Resource group the appliance resources are placed in.
  # used by: trailwright
  resource_group: ""
  # true when an internal certificate authority issues the appliance certificates.
  # used by: trailwright
  internal_ca: false

# Part 2 of the implementation steps: the Azure foundation the instance depends on.
landing_zone:
  # Subscriptions by role. azure.subscription_id is the one the instance uses.
  # used by: cicd_infra
  subscriptions:
    # Name of the subscription; the other landing_zone entries refer to it.
    # required; used by: cicd_infra, trailwright
    - name: "sub-iic-connectivity"
      # Subscription id (a GUID).
      # used by: cicd_infra, trailwright, terraform
      id: "00000000-0000-0000-0000-000000000000"
      # What the subscription is for.
      # required; one of: connectivity | identity | management | security | devops | workload | azure_local; used by: cicd_infra, trailwright, terraform
      role: "connectivity"
