        # First address of the pool that virtual machines on this logical network draw from.
        # required; used by: deployment, trailwright
        start: "203.0.113.100"
        # Last address of that pool.
        # required; used by: deployment, trailwright
        end: "203.0.113.200"
  # Details of scenario.outbound_path.
  # when scenario.outbound_path is proxy or proxy_arc_gateway
  outbound:
    # Proxy server for the machines' outbound traffic, for scenario.outbound_path proxy or proxy_arc_gateway.
    # when scenario.outbound_path is proxy or proxy_arc_gateway
    proxy:
      # URL of the proxy server, for example http://proxy.example.test:3128.
      # required; used by: os_configuration, trailwright, ansible, ztp
      url: ""
    # The Arc gateway resource, in the same subscription as the machines.
    # when scenario.outbound_path is arc_gateway or proxy_arc_gateway
    arc_gateway:
      # Name of the Azure Arc gateway resource (Azure public cloud only; not supported with simplified machine provisioning in the preview).
      # required; used by: os_configuration, trailwright, ansible
      name: ""
    # Outbound path over a private connection (ExpressRoute or site-to-site VPN) when scenario.outbound_path is private_path.
    # when scenario.outbound_path is private_path
    private_path:
      # The private connection: expressroute or site_to_site_vpn.
      # one of: expressroute | site_to_site_vpn; used by: trailwright
