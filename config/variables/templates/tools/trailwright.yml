      # used by: deployment, trailwright
      gateway: "203.0.113.1"
      # DNS servers handed to machines on this logical network (az stack-hci-vm: --dns-servers).
      # used by: deployment, trailwright
      dns_servers: ["192.0.2.4", "192.0.2.5"]
