    # default: false; used by: os_configuration, deployment, trailwright
    use_dhcp: false
    # At least six contiguous addresses in the management subnet, outside the machines' addresses.
    # used by: os_configuration, deployment
    infrastructure_pool:
      # First address of the pool the Azure Local infrastructure services use (ARM startingIPAddress): inside the management subnet, outside every...
      # required; used by: os_configuration, deployment, trailwright
      start: "192.0.2.20"
      # Last address of the infrastructure pool (ARM endingIPAddress).
      # required; used by: os_configuration, deployment, trailwright
      end: "192.0.2.29"
  # Network ATC intents.
  # used by: os_configuration, deployment
  intents:
    # Name of the Network ATC intent, for example management_compute or storage.
    # required; used by: os_configuration, deployment, trailwright, ranger
    - name: "management"
      # Traffic types the intent carries: management, compute and storage (ARM trafficType).
      # required; used by: os_configuration, deployment, trailwright, ranger
      traffic: ["management"]
      # Adapters of the intent, by the key nodes[].network_adapters[].name (the port's name in this file, the same on every machine; the file finds...
      # required; used by: os_configuration, deployment, trailwright, ranger
      adapters: ["Port1", "Port2"]
      # Network ATC overrides.
      # used by: os_configuration
      overrides:
        # Data Center Bridging (DCB) quality of service overrides for the storage traffic (ARM qosPolicyOverrides).
        # used by: os_configuration, deployment
        qos:
          # 802.1p priority value of the cluster heartbeat traffic, 0 to 7 (ARM priorityValue8021Action_Cluster).
          # used by: os_configuration, deployment, trailwright
          cluster_priority: 0
          # 802.1p priority value of the SMB Direct (RDMA storage) traffic, 0 to 7 (ARM priorityValue8021Action_SMB).
          # used by: os_configuration, deployment, trailwright
          smb_priority: 0
          # Share of the link reserved for SMB Direct storage traffic, 1 to 100 percent (ARM bandwidthPercentage_SMB).
          # used by: os_configuration, deployment, trailwright
          smb_bandwidth_percent: 1
        # Physical adapter property overrides (ARM adapterPropertyOverrides: jumboPacket, networkDirect, networkDirectTechnology).
        # used by: os_configuration, deployment
