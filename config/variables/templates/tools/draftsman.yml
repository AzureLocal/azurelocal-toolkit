# The design choices.
scenario:
  # switched: storage traffic goes through top-of-rack switches. switchless: machines are cabled directly to each other for storage.
  # one of: switched | switchless; default: "switched"; used by: deployment, trailwright, draftsman
  storage_connectivity: "switched"
  # standard, or rack_aware (machines split across two local availability zones; every node needs a zone).
  # one of: standard | rack_aware; used by: deployment, trailwright, draftsman, surveyor
  topology: "standard"

# The machines, one entry each.
# used by: deployment, monitoring
