# Scenario: rack aware cluster (2+2), Active Directory, Storage Spaces Direct on switched storage, direct outbound,
# OS from simplified machine provisioning (azurelocal-ztp), deployed with the ARM template. Arc gateway isn't
# supported with simplified machine provisioning. Placeholder values only.
_metadata:
  schema_version: "5.1.0"

scenario:
  identity: active_directory
  storage_architecture: s2d
  storage_connectivity: switched
  topology: rack_aware
  connectivity: connected
  cloud: public
  outbound_path: direct
  os_install: simplified
  deploy_method: arm

site: { code: "IICR", name: "IIC Campus", time_zone: "Pacific Standard Time" }
environment: { name: "iic-campus-azl", type: prd }

azure:
  tenant_id: "00000000-0000-0000-0000-000000000000"
  location: "eastus"
  subscription_id: "00000000-0000-0000-0000-000000000000"
  resource_group: "rg-iic-campus-azl"

key_vaults:
  - { name: "kv-iic-campus-mgmt", subscription_id: "00000000-0000-0000-0000-000000000000", resource_group: "rg-iic-mgmt-01" }

cluster:
  name: "iic-campus"
  witness: { type: cloud, storage_account: "stiiccampuswit" } # rack aware needs a witness
  key_vault: { name: "kv-iic-campus-azl" }

# Two zones with the same number of machines. Simplified provisioning: serial number, BMC address and management MAC
# (the port the static address is set on). arc_machine_name defaults to the node name; set it at the first claim,
# because an Arc machine can't be renamed.
nodes:
  - { name: "iic-cmp-n01", arc_machine_name: "iic-cmp-n01", zone: "RoomA", serial_number: "SERIAL01", management: { ip_address: "192.0.2.11", mac_address: "00:00:5E:00:53:11" }, bmc: { ip_address: "198.51.100.11" } }
  - { name: "iic-cmp-n02", arc_machine_name: "iic-cmp-n02", zone: "RoomA", serial_number: "SERIAL02", management: { ip_address: "192.0.2.12", mac_address: "00:00:5E:00:53:12" }, bmc: { ip_address: "198.51.100.12" } }
  - { name: "iic-cmp-n03", arc_machine_name: "iic-cmp-n03", zone: "RoomB", serial_number: "SERIAL03", management: { ip_address: "192.0.2.13", mac_address: "00:00:5E:00:53:13" }, bmc: { ip_address: "198.51.100.13" } }
  - { name: "iic-cmp-n04", arc_machine_name: "iic-cmp-n04", zone: "RoomB", serial_number: "SERIAL04", management: { ip_address: "192.0.2.14", mac_address: "00:00:5E:00:53:14" }, bmc: { ip_address: "198.51.100.14" } }

hardware:
  vendor: "Lenovo"
  model: "MX650 V3"
  bmc: { username: "keyvault://kv-iic-campus-mgmt/bmc-username", password: "keyvault://kv-iic-campus-mgmt/bmc-password" }
  sbe: { bundle_path: 'D:\sbe\lenovo' }
  drives: { capacity: { media: nvme, count: 8, size_tb: 7.68 } }

networking:
  management:
    subnet: "192.0.2.0/24"
    gateway: "192.0.2.1"
    dns_servers: ["192.0.2.4", "192.0.2.5"]
    ip_assignment: static # simplified provisioning sets each ip_address on the port with mac_address
    infrastructure_pool: { start: "192.0.2.20", end: "192.0.2.29" }
  ntp_servers: ["192.0.2.4"]
  intents:
    - { name: "mgmt_compute", traffic: [management, compute], adapters: ["NIC1", "NIC2"] }
    - { name: "storage", traffic: [storage], adapters: ["SMB1", "SMB2"] } # dedicated storage network between racks
  storage:
    auto_ip: true
    layout: dedicated
    networks:
      - { name: "StorageNetwork1", adapter: "SMB1", vlan_id: 711 }
      - { name: "StorageNetwork2", adapter: "SMB2", vlan_id: 712 }

identity:
  local_admin: { username: "azl-admin", password: "keyvault://kv-iic-campus-mgmt/local-admin-password" }
  active_directory:
    domain_fqdn: "improbability.cloud"
    ou_path: "OU=iic-campus,OU=AzureLocal,DC=improbability,DC=cloud"
    lcm_user: { username: "lcm-iic-campus", password: "keyvault://kv-iic-campus-mgmt/lcm-password" }

storage:
  volumes:
    - { name: "vol-roomA", size_gib: 2048, resiliency: four_way }
    - { name: "vol-roomB", size_gib: 2048, resiliency: four_way }

provisioning:
  os_version: "12.2610.1004.50"
  simplified:
    site_name: "iic-campus-site"
    maintenance_iso: "2610"
    admin: { username: "administrator", password: "keyvault://kv-iic-campus-mgmt/provisioning-admin-password" }
    media_share: { name: "ztp-virtual-usb", host_adapter: "Management" }
