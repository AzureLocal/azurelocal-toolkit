# Scenario: a single machine, Active Directory, Storage Spaces Direct, no witness, OS from an ISO, deployed from the
# Azure portal. Schema 5.2 ports: the management address comes from a DHCP reservation for the first port's MAC (the
# management virtual adapter takes that MAC). Placeholder values only.
_metadata:
  schema_version: "5.2.0"

scenario:
  identity: active_directory
  storage_architecture: s2d
  storage_connectivity: switched # a single machine has no storage network
  topology: standard
  connectivity: connected
  cloud: public
  outbound_path: direct
  os_install: iso
  deploy_method: portal

site: { code: "IICE", name: "IIC Edge 07" }
environment: { name: "iic-edge-07", type: prd }

azure:
  tenant_id: "00000000-0000-0000-0000-000000000000"
  location: "centralus"
  subscription_id: "00000000-0000-0000-0000-000000000000"
  resource_group: "rg-iic-edge-07"

key_vaults:
  - { name: "kv-iic-edge-mgmt", subscription_id: "00000000-0000-0000-0000-000000000000", resource_group: "rg-iic-mgmt-01" }

cluster:
  name: "iic-edge-07"
  witness: { type: none }
  key_vault: { name: "kv-iic-edge-07" }

nodes:
  - name: "iic-edge-07-n01"
    network_adapters:
      # Converged: management and compute on both ports. The reservation is for NIC1, the first adapter of the intent.
      - { name: "NIC1", mac_address: "00:00:5E:00:53:11", speed_gbps: 25, roles: [management, compute], ip_assignment: dhcp_reservation, ip_address: "192.0.2.11" }
      - { name: "NIC2", mac_address: "00:00:5E:00:53:12", speed_gbps: 25, roles: [management, compute], ip_assignment: none }
      - { name: "NIC3", mac_address: "00:00:5E:00:53:13", speed_gbps: 1, roles: [unused], ip_assignment: none }

hardware: { vendor: "DataON", model: "AZS-6224" }

networking:
  management:
    subnet: "192.0.2.0/24"
    gateway: "192.0.2.1"
    dns_servers: ["192.0.2.4"]
    infrastructure_pool: { start: "192.0.2.20", end: "192.0.2.25" } # exclude it from the DHCP scope
  intents:
    - { name: "converged", traffic: [management, compute], adapters: ["NIC1", "NIC2"] }

identity:
  local_admin: { username: "azl-admin", password: "keyvault://kv-iic-edge-mgmt/local-admin-password" }
  active_directory:
    domain_fqdn: "improbability.cloud"
    ou_path: "OU=iic-edge-07,OU=AzureLocal,DC=improbability,DC=cloud"
    lcm_user: { username: "lcm-iic-edge-07", password: "keyvault://kv-iic-edge-mgmt/lcm-password" }

provisioning:
  os_version: "12.2610.1004.50"
