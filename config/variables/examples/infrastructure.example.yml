# =============================================================================
# infrastructure.yml: the one environment file for an Azure Local instance
# =============================================================================
# Every Azure Local tool reads this file: azurelocal-toolkit, azurelocal-ztp,
# Trailwright (writes it), Beacon, Sonar and Ranger.
#
# Schema:    config/variables/schema/infrastructure.schema.json (generated from the master registry), schema_version 5.x
# Variables: config/variables/docs/VARIABLES.md: every key, whether it is required, its default,
#            an example, where to get the value, which tool reads it, the keyvault:// secrets
#            the file expects, and the folders it names
# Validate:  ./tools/Test-AzlInfrastructure.ps1 -Path ./infrastructure.yml
# Reference: config/variables/docs/infrastructure-file.md, every key and which tool reads it
#
# This example: Active Directory, Storage Spaces Direct on switched storage,
# two machines, connected with direct outbound, the OS from simplified machine
# provisioning (azurelocal-ztp), deployed with the ARM template.
# Other scenarios are in examples/. This file describes each machine's management
# port with nodes[].management (schema 5.0); from 5.2, nodes[].network_adapters lists
# every port with its MAC, roles and address instead: see examples/lom-management-ztp.yml.
# Schema 5.3 adds: BIOS phases (hardware.bios is the final state, bios_during_provisioning
# the temporary values for the OS install), networking.management.static_method and
# provisioning_dhcp_range, nodes[].maintenance_address, provisioning.simplified.
# maintenance_password, and the SAN details (storage.san.array, fibre_channel or iscsi,
# nodes[].san). The SAN is shown in comments below; examples/disaggregated-*.yml are complete.
# Schema 5.4 puts every azurelocal-ztp setting in this file: the BIOS actions ZTP derives from the
# inventory (nodes[].san.hbas[].slot, a network port with slot Embedded; provisioning.simplified.
# isolate_san_adapters and enable_embedded_nics), the Azure site choices, timeouts, retries, the USB
# image, the maintenance environment, and hardware.bmc.rfs_write_attribute and verify_certificate.
# Every one has the default shown, which is what ZTP did before the key existed.
# Schema 5.4.1 adds provisioning.simplified.timeouts.adapters_minutes; 5.4.2 adds hardware.sbe.delivery and node_pull_url (how the SBE package reaches the nodes; no storage account).
# Schema 5.4.3 adds os_configuration.clear_storage: whether the OS configuration run wipes leftover local disks.
# Schema 5.5 puts the CI/CD infrastructure in devops (tasks 01 to 06 of automation / 01-cicd-infra): the
# project, its settings, the environments, the Azure sign-in, and the self-hosted runners (a Linux pool
# and a Windows ztp runner) with their network and roles.
# Schema 5.5 adds identity.active_directory.domain_join_account (optional override of the LCM user), join_options and local_admin_members: with scenario.identity active_directory the OS configuration run joins each machine to the domain and ou_path.
# Schema 5.6 adds scenario.environment_class and os_configuration.remoting: the remote management security profile (WinRM, RDP and
# ICMP scope on the nodes, HTTP or HTTPS, TrustedHosts on the machine running the automation, the one-time Arc bootstrap), and a purpose
# marker on networking.logical_networks[] and cluster_networks[].
#
# Rules:
#   - Keys are snake_case. Sections reject unknown keys; use extensions.
#   - Secrets are never values. Use keyvault://<vault>/<secret> and list the
#     vault in key_vaults.
#   - Values here are placeholders (the IIC example customer and documentation
#     address ranges). Replace every one.
# =============================================================================

_metadata:
  schema_version: "5.6.0"
  file_version: "1.0.0"
  last_updated: "2026-11-06"
  generated_by: ""

# -----------------------------------------------------------------------------
# The design choices. Every other section is read in the light of these.
# -----------------------------------------------------------------------------
scenario:
  identity: active_directory # active_directory | local_identity
  storage_architecture: s2d # s2d | san | hybrid
  storage_connectivity: switched # switched | switchless
  topology: standard # standard | rack_aware
  connectivity: connected # connected | disconnected
  cloud: public # public | government
  outbound_path: direct # direct | proxy | arc_gateway | proxy_arc_gateway | private_path
  os_install: simplified # iso | simplified
  deploy_method: arm # portal | arm
  # Schema 5.6. lab | test | dev | production | dmz. Picks the remote management security profile. Missing means production.
  # lab and test are relaxed with the wildcard (TrustedHosts '*', sources Any, HTTP 5985 allowed) and the run prints a warning; never use them in production.
  environment_class: production

site:
  code: "IIC"
  name: "IIC Dallas"
  location: "Dallas, TX"
  datacenter: "dal-01"
  customer: "Infinite Improbability Corp"
  owner: "platform-team@improbability.cloud"
  time_zone: "Central Standard Time"

environment:
  name: "iic-azl-01"
  type: lab # lab | demo | poc | dev | test | stg | prd
  owner: "platform-team@improbability.cloud"
  description: "Example two-machine Azure Local instance."

tags:
  Owner: "platform-team@improbability.cloud"
  Project: "azure-local"
  Environment: "dev"
  CostCenter: "iic-it"
  ManagedBy: "azurelocal-toolkit"

# -----------------------------------------------------------------------------
# Azure targets: the Arc machines, the cluster, and the provisioning site.
# -----------------------------------------------------------------------------
azure:
  tenant_id: "00000000-0000-0000-0000-000000000000"
  location: "eastus" # simplified provisioning: eastus only in the preview
  subscription_id: "00000000-0000-0000-0000-000000000000"
  resource_group: "rg-iic-azl-01"
  # Optional. Tools look it up when they can read the directory; pipelines should set it.
  hci_resource_provider_object_id: "00000000-0000-0000-0000-000000000000"
  custom_location: "cl-iic-azl-01"
  automation_identity:
    type: managed_identity # managed_identity | service_principal
    name: "id-iic-cicd-01"
    object_id: "00000000-0000-0000-0000-000000000000" # the principal the Terraform identity module assigns roles to
    subscription_id: "00000000-0000-0000-0000-000000000000"
    resource_group: "rg-iic-devops-01"

# Every vault that a keyvault:// reference below names.
key_vaults:
  - name: "kv-iic-mgmt-01"
    subscription_id: "00000000-0000-0000-0000-000000000000"
    resource_group: "rg-iic-mgmt-01"
    purpose: "management"

# -----------------------------------------------------------------------------
# The Azure Local instance.
# -----------------------------------------------------------------------------
cluster:
  name: "iic-azl-01" # up to 15 characters
  naming_prefix: "iicazl01"
  deployment_mode: validate # validate | deploy
  witness:
    type: cloud # cloud | file_share | none
    storage_account: "stiicazl01wit"
  key_vault:
    name: "kv-iic-azl-01"
    create_new: true
    soft_delete_retention_days: 30
  diagnostics:
    storage_account: "stiicazl01diag"
    logs_retention_days: 30
    storage_account_type: "Standard_LRS"

# -----------------------------------------------------------------------------
# The machines. Simplified provisioning needs serial_number, bmc.ip_address
# and management.mac_address (the management port) on every machine.
# arc_machine_name is the Arc machine name; it defaults to name, and an Arc
# machine can't be renamed later.
# -----------------------------------------------------------------------------
nodes:
  - name: "iic-azl-n01"
    arc_machine_name: "iic-azl-n01" # optional; default: name
    management:
      ip_address: "192.0.2.11"
      mac_address: "00:00:5E:00:53:11" # the management port
      adapter_name: "Port1" # optional; the MAC is enough
    serial_number: "SERIAL01"
    # maintenance_address: "192.0.2.101" # optional; the maintenance environment's address when you know it.
    #                                    # Without it, the Device stage scans provisioning_dhcp_range by MAC.
    bmc:
      ip_address: "198.51.100.11"
      type: idrac
    rack: "R01"
    rack_position: "24"
  - name: "iic-azl-n02"
    arc_machine_name: "iic-azl-n02"
    management:
      ip_address: "192.0.2.12"
      mac_address: "00:00:5E:00:53:12"
      adapter_name: "Port1"
    serial_number: "SERIAL02"
    bmc:
      ip_address: "198.51.100.12"
      type: idrac
    rack: "R01"
    rack_position: "26"

hardware:
  vendor: "Dell"
  model: "AX-760"
  cpu_cores: 64
  memory_gib: 1024
  gpu:
    enabled: false
  # BMC login for every machine unless a node sets its own.
  bmc:
    username: "keyvault://kv-iic-mgmt-01/bmc-username"
    password: "keyvault://kv-iic-mgmt-01/bmc-password"
    rfs_write_attribute: true # default: true for Dell (iDRAC Remote File Share), false for other vendors
    verify_certificate: false # default false: BMCs ship a self-signed certificate
  # OPTIONAL (schema 5.6.14). Where Get-HardwareInventory.ps1 writes the hardware inventory it reads from the BMCs (any maker, read only).
  # Every key has the default shown. Uncomment the block and set _metadata.schema_version to 5.6.14 to change one.
  # The file holds serial numbers and MAC addresses: keep the folder out of git.
  # inventory:
  #   output_directory: "hardware-inventory"
  #   file_name_prefix: "hardware-inventory"
  #   format: "json"       # json or yaml
  #   timeout_seconds: 60  # how long to wait for one answer of a BMC (5 to 600)
  # OPTIONAL. Solution Builder Extension (SBE): delete the whole sbe block to deploy without one (the OS keeps the OEM drivers
  # already installed, and nothing is delivered to C:\SBE). Keep it only if your hardware partner supplies an SBE for your solution
  # version. When the block is there it is complete: publisher, family and version (family and version may be empty if bundle_path
  # names the package: they are read from it), and bundle_path or delivery. Nothing adds this block or a delivery setting for you.
  sbe:
    publisher: "Dell"
    family: ""
    version: ""
    # Folder on the management host with the OEM's SBE files, as downloaded.
    bundle_path: 'D:\sbe\dell'
    # Schema 5.4.2. OPT-IN: how the package reaches each node's C:\SBE during OS configuration (Azure Arc Run Command can't carry a file,
    # and there is no storage account route). Without a value nothing is copied. One of:
    #   skip        (default) the toolkit does not deliver it; the Sbe step says 'not delivered'; no other step is affected.
    #   winrm_copy  the toolkit copies it over WinRM (TCP 5985) from the host it runs on: that host must reach the nodes'
    #               management subnet (the operator host if it can, or a runner). Needs the nodes' local administrator as -Credential.
    #   node_pull   each node downloads it from node_pull_url, which you serve (read-only, no credential in the address) from a
    #               host the nodes can reach; the SHA-256 is checked on the node.
    delivery: node_pull
    node_pull_url: 'https://sbe.iic.example/sbe/dell' # or a UNC folder, \\files.iic.example\sbe\dell
    allow_unvalidated: false # test only
  # BIOS: from 5.4 azurelocal-ztp derives the SAN-adapter slots (nodes[].san.hbas[].slot) and the embedded NICs
  # (a port with slot Embedded) itself, per vendor; the raw maps are explicit overrides that win over the derived values.
  bios: # optional; the FINAL state, set by azurelocal-ztp at its Boot stage. Vendor attribute names (Dell here).
    EmbNic1Nic2: "Enabled"
    # Slot2: "Enabled" # a Fibre Channel HBA: on in the end (see bios_during_provisioning below)
  # bios_during_provisioning: # optional; TEMPORARY values for the OS install only. They win over bios.
  #   Slot2: "Disabled"       # the HBA's SAN LUN would be offered as the install disk. In its Restore stage, after
  #                           # the install, ZTP sets each key back to its bios value (or the original it saved),
  #                           # restarts the node and waits for Arc. A key here should also be in bios.
  #                           # Dell also has BootDriverDisabled: visible to the OS, never a boot device.
  network_cards:
    - label: "Onboard"
      ports:
        - { name: "Port1", speed_gbps: 25, rdma: none, role: "intent:management" }
        - { name: "Port2", speed_gbps: 25, rdma: none, role: "intent:management" }
    - label: "Slot 3"
      ports:
        - { name: "Port3", speed_gbps: 25, rdma: roce_v2, role: "intent:compute_storage" }
        - { name: "Port4", speed_gbps: 25, rdma: roce_v2, role: "intent:compute_storage" }
  drives:
    capacity: { media: nvme, count: 8, size_tb: 3.84 }

# -----------------------------------------------------------------------------
# On-premises networks.
# -----------------------------------------------------------------------------
networking:
  management:
    subnet: "192.0.2.0/24"
    gateway: "192.0.2.1"
    vlan_id: 0 # 0 means untagged; can't change after deployment
    dns_servers: ["192.0.2.4", "192.0.2.5"] # can't change after deployment
    # How each machine's management port gets nodes[].management.ip_address
    # before deployment: static (set on the port with mac_address), dhcp
    # (reserve each address for its MAC) or preconfigured (left as it is).
    ip_assignment: static
    # With static addresses and simplified provisioning, who sets them:
    #   device (default): ZTP's Device stage sets each address on the port with the MAC, through the
    #                     maintenance environment's Configurator service, before the claim. The Arc site is Automatic.
    #   site:             the site is Manual with site_ip_range and Microsoft's OS install assigns the address.
    #                     It ignores the MAC and uses the first ready port (seen on Dell AX-760).
    static_method: device
    # The DHCP range on the provisioning network, inside the subnet. The Device stage scans it (TCP 20001) to find
    # each maintenance environment by MAC when nodes[].maintenance_address isn't set.
    provisioning_dhcp_range: { start: "192.0.2.100", end: "192.0.2.199" }
    use_dhcp: false # ARM useDhcp for the deployment; not ip_assignment
    provisioning_network: dhcp # simplified provisioning: how the maintenance environment reaches Azure
    infrastructure_pool: # at least six contiguous addresses
      start: "192.0.2.20"
      end: "192.0.2.29"
  oob:
    subnet: "198.51.100.0/24"
    gateway: "198.51.100.1"
  ntp_servers: ["192.0.2.4", "192.0.2.5"]
  intents:
    - name: "management"
      traffic: [management]
      adapters: ["Port1", "Port2"]
    - name: "compute_storage"
      traffic: [compute, storage]
      adapters: ["Port3", "Port4"]
  storage:
    auto_ip: true
    tor_switches: 2
    layout: converged
    networks:
      - { name: "StorageNetwork1", adapter: "Port3", vlan_id: 711 }
      - { name: "StorageNetwork2", adapter: "Port4", vlan_id: 712 }
  vlans:
    - { name: "storage-1", id: 711 }
    - { name: "storage-2", id: 712 }
    - { name: "workloads", id: 2204, subnet: "203.0.113.0/24" }
  logical_networks:
    - name: "lnet-workloads"
      purpose: compute # management | oob | automation | compute | storage | other (5.6); management and oob make the subnet a remote management source in dev and production
      vlan_id: 2204
      address_prefix: "203.0.113.0/24"
      gateway: "203.0.113.1"
      dns_servers: ["192.0.2.4", "192.0.2.5"]
      ip_pool: { start: "203.0.113.100", end: "203.0.113.200" }

# -----------------------------------------------------------------------------
# Accounts and the identity provider.
# -----------------------------------------------------------------------------
identity:
  local_admin: # not Administrator: the deployment renames it
    username: "azl-admin"
    password: "keyvault://kv-iic-mgmt-01/local-admin-password"
  active_directory:
    domain_fqdn: "improbability.cloud"
    netbios_name: "IIC"
    ou_path: "OU=iic-azl-01,OU=AzureLocal,DC=improbability,DC=cloud"
    lcm_user:
      username: "lcm-iic-azl-01" # up to 20 characters, no domain
      password: "keyvault://kv-iic-mgmt-01/lcm-password"
    # Schema 5.5: the OS configuration joins each machine to the domain and ou_path with the LCM user above (Microsoft's AD preparation gives it the
    # right to create and delete computer objects in the dedicated OU). To use another account, set domain_join_account (same rights on ou_path):
    # domain_join_account: { username: "svc-azl-join", password: "keyvault://kv-iic-mgmt-01/domain-join-password" }
    join_options: # optional
      allow_ou_move: false # true: BEFORE the deployment, move a machine that is in this domain but in another OU into ou_path. Never after (not supported).
    # Added to the local Administrators group of every machine after the join. Default: the security group below that administers the instance, and the LCM user.
    # local_admin_members: ["sg-iic-azl-01-admins", "lcm-iic-azl-01"]
    domain_controllers: ["192.0.2.4", "192.0.2.5"]
    precreate_computer_objects: false # true: Set-ADConfiguration.ps1 creates the computer objects of the machines and the cluster in ou_path before the deployment
    security_groups:
      - { name: "sg-iic-azl-01-admins", purpose: "Administrators of the instance", local_groups: ["Administrators"] }
  entra:
    groups:
      - { name: "grp-iic-azl-operators", purpose: "Operate the instance", roles: ["Azure Stack HCI Administrator"], scope: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-iic-azl-01" }

storage:
  configuration_mode: express # express | infra_only | keep_storage
  volumes:
    - { name: "vol-workloads-01", size_gib: 4096, resiliency: two_way }
  # A SAN (storage_architecture san or hybrid) needs storage.san and networking.cluster_networks:
  # san:
  #   type: fibre_channel # fibre_channel | iscsi
  #   array: { name: "san-iic-01", vendor: "Dell", model: "PowerStore 1200T", management_address: "198.51.100.40" }
  #   fibre_channel: # required for fibre_channel
  #     fabrics: [{ name: "A", switch: "fc-sw-a", zone_set: "azl-a" }, { name: "B", switch: "fc-sw-b", zone_set: "azl-b" }]
  #     target_wwpns: [{ wwpn: "50:00:00:00:00:00:01:01", fabric: "A" }, { wwpn: "50:00:00:00:00:00:01:02", fabric: "B" }]
  #   iscsi: # required for iscsi: targets (IQN, portals, fabric) and optional CHAP; each node has san.initiator_iqn
  #     targets: [{ iqn: "iqn.2026-11.cloud.improbability:san-iic-01.a", portals: ["198.51.100.4:3260"], fabric: "A" }]
  #     chap: { enabled: true, username: "azl-chap", secret: "keyvault://kv-iic-mgmt-01/iscsi-chap-secret" }
  # and on every node (the iSCSI ports' addresses are network_adapters with role iscsi:a / iscsi:b):
  #   san: { hbas: [{ slot: "Slot 2", type: fibre_channel, bios_attribute: "Slot2", model: "Emulex LPe35002", ports: [{ wwpn: "10:00:00:00:00:00:00:11", fabric: "A" }] }] }
  #   san: { initiator_iqn: "iqn.1991-05.com.microsoft:iic-azl-n01.improbability.cloud" }

security:
  level: recommended # recommended | customized
  drift_control: true
  credential_guard: true
  smb_signing: true
  smb_cluster_encryption: false
  bitlocker_boot_volume: true
  bitlocker_data_volumes: true
  wdac: true
  telemetry:
    streaming_data: true
    episodic_data_upload: true
    eu_location: false

sdn:
  enabled: false
  # SDN enabled by Azure Arc (schema 5.6.15). Setting enabled to true CANNOT BE UNDONE and interrupts running workloads for a short time.
  # Enable-ArcSdn.ps1 then runs Add-EceFeature -Name NC. Needs: prefix (8 characters or fewer), dns_records (dynamic or static),
  # and the two answers below. Run it with -WhatIf first.
  # prefix: "iic01"
  # dns_records: dynamic # dynamic | static
  # acknowledge_maintenance_window: false # true when a maintenance window is arranged
  # acknowledge_dns_record: false # static DNS only: true when iic01-NC exists and points at the fifth address of the infrastructure pool

operations:
  update_method: portal
  monitoring:
    enabled: true
    log_analytics_workspace: "log-iic-azl-01"
    workspace_resource_group: "rg-iic-mgmt-01"
    retention_days: 30
    data_collection_endpoint: "dce-iic-azl-01"
    data_collection_rule: "AzureStackHCI-iic-azl-01"
    action_group: "ag-iic-azl-01"
  notifications:
    emails: ["noc@improbability.cloud"]
  backup:
    enabled: false
  disaster_recovery:
    method: none
  licensing:
    azure_hybrid_benefit: true
    windows_server_subscription: false

# -----------------------------------------------------------------------------
# How the OS gets onto the machines, and which OS.
# -----------------------------------------------------------------------------
provisioning:
  os_version: "12.2610.1004.50" # pin a version
  simplified: # azurelocal-ztp
    site_name: "iic-site-01"
    maintenance_iso: "latest" # latest | a train (2610) | a build (10.2610.0.3063) | a Microsoft URL
    admin: # the OS's local administrator after provisioning
      username: "administrator"
      password: "keyvault://kv-iic-mgmt-01/provisioning-admin-password"
    # maintenance_password: "keyvault://kv-iic-mgmt-01/maintenance-password" # optional; the maintenance environment's
    #                       # local user password. Default: the out-of-box password that Microsoft Learn documents.
    media_share:
      name: "ztp-virtual-usb"
      host: "198.51.100.5" # or host_adapter: <adapter name>
      account_name: "svc-ztp-media" # default; the local account the BMCs sign in with
      keep: false # default; true keeps the share, rule and account after the vouchers are collected
    media_path: 'D:\Data\azl-ztp\iic-azl-01\media' # downloads, images, vouchers, state; outside any git repository
    evidence_path: 'D:\Data\azl-ztp\iic-azl-01\evidence' # event log, BIOS change log, run logs
    # Schema 5.4. BIOS actions derived from the inventory: with no nodes[].san.hbas there is nothing to isolate.
    # isolate_san_adapters: false  # default: true when a node lists san.hbas
    enable_embedded_nics: true # default true; acts when a management or provisioning port has slot Embedded
    # The defaults of azurelocal-ztp, written out. Change one only when a stage needs it.
    retry_provision_os: true
    skip_azure_check: false
    include_preview: false
    # max_train: "2610"
    usb_image: { size_gb: 4, name_prefix: "ztp-usb-" }
    maintenance_environment: { port: 20001, username: "edgeuser" }
    timeouts: { bootstrap_minutes: 120, bootstrap_voucher_minutes: 90, bootstrap_stall_minutes: 20, voucher_wait_minutes: 120, device_minutes: 30, ready_minutes: 180, network_minutes: 60, adapters_minutes: 10, restore_settle_minutes: 5, bios_minutes: 30, poll_interval_seconds: 60 }
    # The Microsoft.Edge site and its configuration:
    create_resource_group: true # false: stop when azure.resource_group does not exist
    configuration_name: "default"
    # managed_resource_group_name: "" # empty: the service chooses
    apply_site_settings: true
    use_key_vault_configuration: true
    assign_provisioning_roles: true
    assign_hci_rp_role: true
    network_kind: LAN
    ntp: { configuration: Automatic } # or { configuration: Manual, server: "192.0.2.30", alternate_server: "192.0.2.31" }
    site_mode: Auto # Auto | Create | Reuse
    # deployment_name: "ztp-iic-site-01" # default: ztp-<site_name>

network_devices:
  - hostname: "sw01-iic"
    type: switch
    role: primary
    vendor: "Dell"
    model: "S5248F-ON"
    management: { ip_address: "198.51.100.6", protocol: ssh }
    credentials:
      username: "admin"
      password: "keyvault://kv-iic-mgmt-01/switch-admin-password"
  - hostname: "sw02-iic"
    type: switch
    role: secondary
    vendor: "Dell"
    model: "S5248F-ON"
    management: { ip_address: "198.51.100.7", protocol: ssh }
    credentials:
      username: "admin"
      password: "keyvault://kv-iic-mgmt-01/switch-admin-password"

# -----------------------------------------------------------------------------
# Part 2 of the implementation steps: the Azure foundation. Leave out when it
# exists and is managed elsewhere.
# -----------------------------------------------------------------------------
landing_zone:
  management_groups:
    # role (5.6.17) names the group of the fixed hierarchy the Terraform landing zone module builds: it is read by New-IacVariableFiles.ps1 only.
    - { name: "mg-iic", display_name: "IIC", role: root }
    - { name: "mg-iic-platform", display_name: "IIC Platform", parent: "mg-iic", role: platform }
    - { name: "mg-iic-identity", parent: "mg-iic-platform", role: identity }
    - { name: "mg-iic-connectivity", parent: "mg-iic-platform", role: connectivity }
    - { name: "mg-iic-management", parent: "mg-iic-platform", role: management }
    - { name: "mg-iic-security", parent: "mg-iic-platform", role: security }
    - { name: "mg-iic-landing-zones", display_name: "IIC Landing Zones", parent: "mg-iic", role: landing_zones }
  subscriptions:
    - { name: "sub-iic-connectivity", id: "00000000-0000-0000-0000-000000000000", role: connectivity, management_group: "mg-iic-platform" }
    - { name: "sub-iic-identity", id: "00000000-0000-0000-0000-000000000000", role: identity, management_group: "mg-iic-platform" }
    - { name: "sub-iic-management", id: "00000000-0000-0000-0000-000000000000", role: management, management_group: "mg-iic-platform" }
    - { name: "sub-iic-devops", id: "00000000-0000-0000-0000-000000000000", role: devops, management_group: "mg-iic-platform" }
    - { name: "sub-iic-azure-local", id: "00000000-0000-0000-0000-000000000000", role: azure_local, management_group: "mg-iic" }
  resource_groups:
    - { name: "rg-iic-conn-01", subscription: "sub-iic-connectivity", location: "eastus", purpose: "hub network" }
    - { name: "rg-iic-mgmt-01", subscription: "sub-iic-management", location: "eastus", purpose: "management" }
    - { name: "rg-iic-runners-01", subscription: "sub-iic-devops", location: "eastus", purpose: "CI/CD runners" }
    - { name: "rg-iic-azl-01", subscription: "sub-iic-azure-local", location: "eastus", purpose: "Azure Local instance" }
  networks:
    - name: "vnet-iic-hub-01"
      subscription: "sub-iic-connectivity"
      resource_group: "rg-iic-conn-01"
      location: "eastus"
      role: hub
      allow_gateway_transit: true # the spokes that peer with this network may use its VPN gateway (peering option, default false)
      address_space: ["10.20.0.0/22"]
      subnets:
        - { name: "GatewaySubnet", prefix: "10.20.0.0/27" }
        - { name: "AzureBastionSubnet", prefix: "10.20.0.64/26" }
        - { name: "snet-iic-hub-mgmt-01", prefix: "10.20.0.128/26" }
    - name: "vnet-iic-mgmt-01"
      subscription: "sub-iic-management"
      resource_group: "rg-iic-mgmt-01"
      location: "eastus"
      role: spoke
      address_space: ["10.20.4.0/24"]
      dns_servers: ["192.0.2.4", "192.0.2.5"]
      subnets:
        - { name: "snet-iic-mgmt-01", prefix: "10.20.4.0/26" }
      peer_with: ["vnet-iic-hub-01"]
      allow_forwarded_traffic: true # peering option, default true
      use_remote_gateways: true # use the VPN gateway of the hub (the hub sets allow_gateway_transit; default false)
  connectivity:
    vpn_gateway:
      name: "vpng-iic-hub-01"
      resource_group: "rg-iic-conn-01"
      network: "vnet-iic-hub-01"
      sku: "VpnGw1AZ"
      bgp_asn: 65515
      site_to_site:
        - connection_name: "cn-iic-dal-01"
          local_gateway_name: "lgw-iic-dal-01"
          peer_public_ip: "203.0.113.1"
          peer_address_prefixes: ["192.0.2.0/24", "198.51.100.0/24"]
          shared_key: "keyvault://kv-iic-mgmt-01/vpn-shared-key"
    bastion: { name: "bas-iic-hub-01", resource_group: "rg-iic-conn-01", sku: "Standard" }
  virtual_machines:
    - name: "vm-iic-dc-01"
      hostname: "iic-dc01"
      role: domain_controller
      deploy_target: azure
      subscription: "sub-iic-management"
      resource_group: "rg-iic-mgmt-01"
      network: "vnet-iic-hub-01"
      subnet: "snet-iic-hub-mgmt-01"
      private_ip: "10.20.0.134"
      size: "Standard_D2s_v5"
      os: "windows_server_2025"
      admin_username: "iic-vmadmin"
      admin_password: "keyvault://kv-iic-mgmt-01/vm-admin-password"
  log_analytics: { name: "log-iic-azl-01" }
  storage_accounts:
    - { name: "stiicazl01wit", resource_group: "rg-iic-azl-01", sku: "Standard_LRS", purpose: "cloud witness" }

# Part 1 of the implementation steps (tasks 01 to 06 of automation / 01-cicd-infra): the pipeline platform, the
# project, its settings, the environments, the sign-in to Azure and the self-hosted runners. Schema 5.5.
devops:
  platform: github # github | gitlab | azure_devops
  url: "https://github.com"
  organization: "improbability-cloud"
  project: "iic-azure-local"
  subscription: "sub-iic-devops" # holds the runners; a landing_zone subscription
  resource_group: "rg-iic-runners-01"
  create_resource_group: false
  api_token: "keyvault://kv-iic-mgmt-01/devops-admin-token" # or GH_TOKEN, GITLAB_TOKEN, AZURE_DEVOPS_EXT_PAT in the environment

  # Task 02.
  repository:
    name: "iic-azurelocal"
    template: "AzureLocal/azurelocal-template" # GitHub: owner/repo; GitLab: project ID or path; Azure DevOps: clone URL
    visibility: private
    default_branch: main

  # Task 03.
  settings:
    required_approvals: 2
    reviewers: "improbability-cloud/platform-team"
    squash_only: true
    secret_scanning: true
    resolve_conversations: true
    required_status_checks: []

  # Task 04. ztp-reinstall is the approval in front of the ZTP Boot stage, which reinstalls the machines.
  environments:
    - { name: "azr-prod-us", approval_required: true, approvers: ["platform-lead"], deployment_branch: main }
    - { name: "azr-dev-us", approval_required: false }
    - { name: "ztp-reinstall", approval_required: true, approvers: ["platform-lead"], deployment_branch: main }

  # Tasks 01 and 05. The app registration is azure.automation_identity.name.
  authentication:
    method: oidc # oidc | client_secret
    roles: ["Contributor", "User Access Administrator"]
    grant_graph_role_management: false
    register_encryption_at_host: true

  # Task 06. One Linux general pool and at most one Windows ztp runner.
  runners:
    - name: "vm-iic-runner-lnx"
      os_type: linux
      purpose: general
      count: 1
      size: "Standard_D2s_v5"
      registration_secret: "keyvault://kv-iic-mgmt-01/github-runner-token"
      subnet: { name: "snet-iic-runner-lnx-01", prefix: "10.20.10.0/26" }
      private_ips: ["10.20.10.4"]
    - name: "vm-iic-runner-ztp"
      os_type: windows
      purpose: ztp
      size: "Standard_D4s_v5"
      registration_secret: "keyvault://kv-iic-mgmt-01/github-runner-token"
      pool: "azurelocal-ztp" # GitHub runner group, or the Azure Pipelines pool
      subnet: { name: "snet-iic-runner-ztp-01", prefix: "10.20.10.64/26" }
      private_ips: ["10.20.10.68"]
      data_disk_gb: 512
  runner_network:
    vnet_name: "vnet-iic-devops-01"
    address_space: ["10.20.10.0/24"]
    hub_peering: { enabled: true, hub_network: "vnet-iic-hub-01", use_remote_gateways: true, create_hub_side: true }
    reachable_cidrs: ["192.0.2.0/24", "198.51.100.0/24"] # the lab: management and storage
    bmc_cidrs: ["198.51.100.0/24"] # the ztp runner accepts inbound TCP 445 from these only
    admin_source_cidrs: []
  runner_access:
    resource_groups: ["rg-iic-azl-01"] # default: azure.resource_group
    rbac_administrator: true
    arc_run_command: true
    key_vaults: ["kv-iic-mgmt-01"] # default: every vault in key_vaults

  state: { storage_account: "stiictfstate01", container: "tfstate", resource_group: "rg-iic-mgmt-01", key: "cicd-infra.tfstate" }

# Anything this schema doesn't define, under its own key. Tools ignore keys they don't own.
# Schema 5.4.3. The OS configuration run (Invoke-AzureLocalOsConfiguration.ps1). Optional.
os_configuration:
  # true: Apply mode also wipes the leftover storage pools, virtual disks and data on the machines' local non-boot,
  # non-system disks (SAN, USB, boot and system disks are never touched). Plan mode lists the disks and wipes nothing.
  clear_storage: false
  # Schema 5.6. The remote management security profile (docs/os-configuration-and-arm-deployment.md, config/remoting-profiles.json).
  # Everything here is optional; the class above decides what is not set.
  remoting:
    transport: winrm # winrm | winrm_https | arc (how the run reaches the nodes)
    bootstrap_transport: none # none | arc | smb | auto (one-time bootstrap that opens WinRM on a node whose firewall blocks this host; production and dmz also need the pipeline approval)
    # The runner and jump server addresses as the nodes see them (after NAT), in addition to the management and out-of-band networks.
    allowed_source_cidrs: ["198.51.100.10/32"]
    trusted_hosts: auto # auto | exact | wildcard (wildcard: lab and test only)
    use_https: auto # auto | true | false (production and dmz need HTTPS)
    # allow_any_source: false # true is honoured in lab and test only (and implied there unless you set false)
    # isolation_confirmed: false # a statement for lab and test only; not allowed in dev, production or dmz
    # certificate: "keyvault://kv-iic-mgmt-01/node-remoting-cert" # a 40-hex thumbprint, or a Key Vault secret holding a base64 PFX; empty: a self-signed pre-join certificate per node

extensions: {}

# Schema 5.6 (optional): how the ARM Validate and Deploy run (Invoke-AzureLocalArmDeployment.ps1) waits, asks and recovers.
# Every key has the default shown. Uncomment the section and set _metadata.schema_version to 5.6.0 to change one.
# deployment:
#   validate_timeout_minutes: 90
#   deploy_timeout_minutes: 360
#   poll_seconds: 15
#   poll_max_seconds: 120
#   approval: stop                # stop | prompt | none (ValidateAndDeploy; pipelines use an environment approval instead)
#   resume: false                 # true: a failed Deploy is resubmitted
#   require_os_configuration_report: false
#   skip_preconditions: []
#   acknowledge_known_issues: []  # for example [arc-device-id-name]
