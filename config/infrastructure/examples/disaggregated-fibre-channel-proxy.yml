# Scenario: disaggregated (external SAN over Fibre Channel), Active Directory, four machines, outbound through a proxy,
# OS installed from an ISO, deployed with the ARM template. Placeholder values only.
_metadata:
  schema_version: "5.1.0"

scenario:
  identity: active_directory
  storage_architecture: san
  storage_connectivity: switched
  topology: standard
  connectivity: connected
  cloud: public
  outbound_path: proxy
  os_install: iso
  deploy_method: arm

site: { code: "IICD", name: "IIC Datacenter 02" }
environment: { name: "iic-dc02-azl", type: prd }

azure:
  tenant_id: "00000000-0000-0000-0000-000000000000"
  location: "eastus2"
  subscription_id: "00000000-0000-0000-0000-000000000000"
  resource_group: "rg-iic-dc02-azl"

key_vaults:
  - { name: "kv-iic-dc02-mgmt", subscription_id: "00000000-0000-0000-0000-000000000000", resource_group: "rg-iic-mgmt-01" }

cluster:
  name: "iic-dc02-azl"
  deployment_mode: validate
  witness: { type: cloud, storage_account: "stiicdc02wit" }
  key_vault: { name: "kv-iic-dc02-azl", create_new: true }

nodes:
  - { name: "iic-dc02-n01", management: { ip_address: "192.0.2.11" }, rack: "R01" }
  - { name: "iic-dc02-n02", management: { ip_address: "192.0.2.12" }, rack: "R01" }
  - { name: "iic-dc02-n03", management: { ip_address: "192.0.2.13" }, rack: "R02" }
  - { name: "iic-dc02-n04", management: { ip_address: "192.0.2.14" }, rack: "R02" }

hardware: { vendor: "Dell", model: "PowerEdge R760" }

networking:
  management:
    subnet: "192.0.2.0/24"
    gateway: "192.0.2.1"
    dns_servers: ["192.0.2.4", "192.0.2.5"]
    infrastructure_pool: { start: "192.0.2.30", end: "192.0.2.49" }
  ntp_servers: ["192.0.2.4"]
  # Storage runs over Fibre Channel, so there is no storage intent.
  intents:
    - { name: "mgmt_compute", traffic: [management, compute], adapters: ["NIC1", "NIC2"] }
  # Cluster networks on standalone ports, fabric A and B.
  cluster_networks:
    - { name: "clusterNetwork-A", adapter: "NIC3", vlan_id: 1711, subnet: "198.51.100.0/26" }
    - { name: "clusterNetwork-B", adapter: "NIC4", vlan_id: 1712, subnet: "198.51.100.64/26" }
  outbound:
    proxy:
      url: "http://proxy.improbability.cloud:8080"
      bypass: ["localhost", "127.0.0.1", "*.improbability.cloud", "192.0.2.*"]

identity:
  local_admin: { username: "azl-admin", password: "keyvault://kv-iic-dc02-mgmt/local-admin-password" }
  active_directory:
    domain_fqdn: "improbability.cloud"
    ou_path: "OU=iic-dc02-azl,OU=AzureLocal,DC=improbability,DC=cloud"
    lcm_user: { username: "lcm-iic-dc02", password: "keyvault://kv-iic-dc02-mgmt/lcm-password" }

storage:
  configuration_mode: infra_only
  san:
    type: fibre_channel
    infra_volume_lun_id: "0"
    performance_history_lun_id: "1"
    luns:
      - { name: "lun-workloads-01", size_gib: 8192, lun_id: "2" }

provisioning:
  os_version: "12.2610.1004.50"
  iso: { image_source: oem }
