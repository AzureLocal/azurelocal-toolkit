# Scenario: disaggregated (external SAN over Fibre Channel), Active Directory, four machines, outbound through a proxy,
# OS installed from an ISO, deployed with the ARM template. Placeholder values only.
#
# Schema 5.3 records the whole SAN (storage.san and nodes[].san), which the SAN deployment (zoning and LUN masking) reads:
#   storage.san.array                 the array: name, vendor, model and its management address
#   storage.san.fibre_channel         the fabrics (A and B, with their switch and active zone set) and the array's target WWPNs,
#                                     each cabled to a fabric
#   nodes[].san.hbas                  each machine's HBAs: slot, model, and every port's WWPN and fabric
# Every WWPN names a fabric defined under fabrics, and no WWPN appears twice. A WWPN is 16 hex digits, written as colon-
# separated pairs or without colons.
_metadata:
  schema_version: "5.4.0"

scenario:
  identity: active_directory
  storage_architecture: san
  storage_connectivity: switched
  topology: standard
  connectivity: connected
  cloud: public
  outbound_path: proxy
  os_install: iso
  deploy_method: arm

site: { code: "IICD", name: "IIC Datacenter 02" }
environment: { name: "iic-dc02-azl", type: prd }

azure:
  tenant_id: "00000000-0000-0000-0000-000000000000"
  location: "eastus2"
  subscription_id: "00000000-0000-0000-0000-000000000000"
  resource_group: "rg-iic-dc02-azl"

key_vaults:
  - { name: "kv-iic-dc02-mgmt", subscription_id: "00000000-0000-0000-0000-000000000000", resource_group: "rg-iic-mgmt-01" }

cluster:
  name: "iic-dc02-azl"
  deployment_mode: validate
  witness: { type: cloud, storage_account: "stiicdc02wit" }
  key_vault: { name: "kv-iic-dc02-azl", create_new: true }

nodes:
  - name: "iic-dc02-n01"
    management: { ip_address: "192.0.2.11" }
    rack: "R01"
    san:
      hbas:
        - slot: "Slot 2" # a PCIe slot label; with simplified provisioning azurelocal-ztp turns the slot off for the OS install
          model: "Emulex LPe35002 32Gb"
          ports:
            - { wwpn: "10:00:00:00:00:00:00:11", fabric: "A" }
            - { wwpn: "10:00:00:00:00:00:00:12", fabric: "B" }
  - name: "iic-dc02-n02"
    management: { ip_address: "192.0.2.12" }
    rack: "R01"
    san:
      hbas:
        - slot: "Slot 2" # a PCIe slot label; with simplified provisioning azurelocal-ztp turns the slot off for the OS install
          model: "Emulex LPe35002 32Gb"
          ports:
            - { wwpn: "10:00:00:00:00:00:00:21", fabric: "A" }
            - { wwpn: "10:00:00:00:00:00:00:22", fabric: "B" }
  - name: "iic-dc02-n03"
    management: { ip_address: "192.0.2.13" }
    rack: "R02"
    san:
      hbas:
        - slot: "Slot 2" # a PCIe slot label; with simplified provisioning azurelocal-ztp turns the slot off for the OS install
          model: "Emulex LPe35002 32Gb"
          ports:
            - { wwpn: "10:00:00:00:00:00:00:31", fabric: "A" }
            - { wwpn: "10:00:00:00:00:00:00:32", fabric: "B" }
  - name: "iic-dc02-n04"
    management: { ip_address: "192.0.2.14" }
    rack: "R02"
    san:
      hbas:
        - slot: "Slot 2" # a PCIe slot label; with simplified provisioning azurelocal-ztp turns the slot off for the OS install
          model: "Emulex LPe35002 32Gb"
          ports:
            - { wwpn: "10:00:00:00:00:00:00:41", fabric: "A" }
            - { wwpn: "10:00:00:00:00:00:00:42", fabric: "B" }

hardware: { vendor: "Dell", model: "PowerEdge R760" }

networking:
  management:
    subnet: "192.0.2.0/24"
    gateway: "192.0.2.1"
    dns_servers: ["192.0.2.4", "192.0.2.5"]
    infrastructure_pool: { start: "192.0.2.30", end: "192.0.2.49" }
  ntp_servers: ["192.0.2.4"]
  # Storage runs over Fibre Channel, so there is no storage intent.
  intents:
    - { name: "mgmt_compute", traffic: [management, compute], adapters: ["NIC1", "NIC2"] }
  # Cluster networks on standalone ports, fabric A and B.
  cluster_networks:
    - { name: "clusterNetwork-A", adapter: "NIC3", vlan_id: 1711, subnet: "198.51.100.0/26" }
    - { name: "clusterNetwork-B", adapter: "NIC4", vlan_id: 1712, subnet: "198.51.100.64/26" }
  outbound:
    proxy:
      url: "http://proxy.improbability.cloud:8080"
      bypass: ["localhost", "127.0.0.1", "*.improbability.cloud", "192.0.2.*"]

identity:
  local_admin: { username: "azl-admin", password: "keyvault://kv-iic-dc02-mgmt/local-admin-password" }
  active_directory:
    domain_fqdn: "improbability.cloud"
    ou_path: "OU=iic-dc02-azl,OU=AzureLocal,DC=improbability,DC=cloud"
    lcm_user: { username: "lcm-iic-dc02", password: "keyvault://kv-iic-dc02-mgmt/lcm-password" }

storage:
  configuration_mode: infra_only
  san:
    type: fibre_channel
    array:
      name: "san-iic-dc02-01"
      vendor: "Dell"
      model: "PowerStore 1200T"
      management_address: "198.51.100.40"
    fibre_channel:
      fabrics:
        - { name: "A", switch: "fc-sw-a-iic-dc02", zone_set: "azl-iic-dc02-a" }
        - { name: "B", switch: "fc-sw-b-iic-dc02", zone_set: "azl-iic-dc02-b" }
      target_wwpns: # the array's front-end ports, two per controller, one on each fabric
        - { wwpn: "50:00:00:00:00:00:01:01", fabric: "A" }
        - { wwpn: "50:00:00:00:00:00:01:02", fabric: "B" }
        - { wwpn: "50:00:00:00:00:00:02:01", fabric: "A" }
        - { wwpn: "50:00:00:00:00:00:02:02", fabric: "B" }
    infra_volume_lun_id: "0"
    performance_history_lun_id: "1"
    luns:
      - { name: "lun-workloads-01", size_gib: 8192, lun_id: "2" }

provisioning:
  os_version: "12.2610.1004.50"
  iso: { image_source: oem }
